<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>Train</title>

<style>
  /* ====================================================================
     TRAIN — an instrument, not a card feed. One physics idea (momentum),
     one signal color used sparingly (mint — shared across the whole
     dashboard, kept for system coherence), a five-step elevation scale
     instead of flat panels, and numerals treated like an engraved dial.
     System fonts only — no external files, this renders in a sealed
     sandboxed iframe with no network. Every "expensive" cue here is
     built from restraint and craft, not borrowed assets.
     ================================================================= */
  :root {
    /* elevation — true-black base, five graphite steps up */
    --e0:#030304; --e1:#0a0a0d; --e2:#101013; --e3:#17171b; --e4:#1f1f24;
    --hair:rgba(255,255,255,.05); --hair-strong:rgba(255,255,255,.12);
    /* heatmap ramp — NOT elevation steps, despite the naming resemblance.
       e1–e4 encode depth/layering and are too close together (five
       near-blacks) to also read as a continuous quantity scale; this is
       a separate four-step ramp built to encode volume intensity in the
       training-load grid, nothing else. See docs/plans/heatmap.md. */
    --hm1:#2a2a31; --hm2:#3d3d47; --hm3:#55555f; --hm4:#71717d;
    /* signal — scarce by design. gold flags a PR, fail flags a miss */
    --signal:#6EE7B7; --signal-ink:#04140d;
    --gold:#f5a623; --fail:#ef6f6a;
    --text:#f2f2f0; --muted:#86868f; --muted-2:#5c5c63;
    /* type — sans for UI, serif upright (never default-italic) for
       structural headings, mono for every numeral / data readout */
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;
    /* spacing ladder — 4/8/12/16/24/32/48/64/96 */
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px; --sp8:64px; --sp9:96px;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    /* motion — one momentum family. out = ui settling; spring = tactile
       taps; cinematic = anything that takes over the screen */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-momentum:cubic-bezier(.2,.85,.25,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --d1:110ms; --d2:190ms; --d3:320ms; --d4:520ms; --d5:760ms;
    /* ---- aliases that were referenced but never defined ----------------
       All four predate the deletion: the August :root did not define them
       either. --mint is the chart gradient's stop-color, so those
       gradients have been computing to black on a near-black ground. */
    --mint:var(--signal);
    --bg:var(--e2);
    --muted-strong:color-mix(in srgb, var(--text) 62%, var(--muted));
    --vt-mono:var(--mono);
    /* --danger: the lightened --fail the August port carried as a raw
       hex in .pbtn.danger and .menuPop button.danger. Same value, named. */
    --danger:#f4a09c;
    /* A pale mint, the far stop of the gradient on a live deload row.
       Recovered with its exact August value rather than approximated. */
    --signal-bright:#d7fbe9;
    /* ---- type ----------------------------------------------------------
       Eight roles, named for what they are rather than how big they are.
       There were nineteen sizes between 8px and 27px, which is nineteen
       decisions nobody made; and the floor is 11px, because 8px text on a
       dimmed screen at arm's length in a gym is decoration, not
       information.

       Weight and line-height here are DEFAULTS. A rule that declares its
       own keeps it — .finishBtn is body and declares 700, and forcing the
       role's 400 onto the primary action would be the ramp overruling a
       deliberate choice. Seventeen such rules exist and are listed in the
       commit. */
    --fs-micro:11px; --lh-micro:14px; --fw-micro:600; --ls-micro:.04em;
    --fs-label:12px; --lh-label:16px; --fw-label:600;
    --fs-caption:13px; --lh-caption:18px; --fw-caption:500;
    --fs-body:15px; --lh-body:22px; --fw-body:400;
    --fs-subhead:17px; --lh-subhead:23px; --fw-subhead:600;
    --fs-title:20px; --lh-title:26px; --fw-title:700;
    --fs-display:22px; --lh-display:27px; --fw-display:800; --ls-display:-.02em;
    --fs-hero:27px; --lh-hero:31px; --fw-hero:800; --ls-hero:-.02em;
    /* ---- the one step above hero ----------------------------------------
       .daytitle is the only rule that may use --fs-giant. It predates the
       ramp — 731e891 shipped it at 39px, an outlier even by the pre-ramp
       stylesheet's own ad hoc range (the 8px-27px documented above), so
       the 27px hero ceiling was measured from a sheet that had already
       lost .daytitle, not a considered cap on it. Extending the ramp for
       one deliberate exception is honest; quietly shrinking the number to
       fit inside it would not be. A second consumer means this stopped
       being an exception and started being an undocumented second ramp —
       don't add one without renaming this comment. */
    --fs-giant:39px; --lh-giant:.96; --fw-giant:800; --ls-giant:-.03em;
    /* ---- glyphs ---------------------------------------------------------
       NOT part of the ramp, and deliberately below its floor. These are
       icons that happen to be characters, sized to the box that holds
       them rather than to a reading scale — the moon in a switch thumb is
       a graphic, and sizing a graphic by a text scale is a category
       error. The 8px one lives in a 14x14 thumb; 11px does not fit it.

       The test for exemption is narrow: the glyph sits inside a box with
       an explicit pixel size. .noteEmo is an emoji too and has no such
       box, so it stays on the ramp. */
    --glyph-base:11px;   /* .bouncyDot, in a 20x20 thumb */
    --glyph-mini:8px;    /* .deloadRow .bouncyDot, in a 14x14 thumb */
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  ::selection { background:var(--signal); color:var(--signal-ink); }
  html { background:var(--e0); }
  body { margin:0; min-height:100dvh; padding:0 0 calc(56px + env(safe-area-inset-bottom)); background:var(--e0); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  button { font-family:inherit; cursor:pointer; }
  button:disabled { cursor:default; }
  .num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--signal); outline-offset:2px; border-radius:6px; }

  /* ── the original Vitality backdrop — mountains / glass atmosphere /
        particles, fully self-contained (no external file). Kept as-is
        per request while the rest of the tile moved to the new system. */
  #vt-backdrop { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; background:var(--e0); }
  #vt-backdrop .wb-atmosphere { position:absolute; inset:0; pointer-events:none; background:
    radial-gradient(60% 50% at 50% 40%, rgba(110,231,183,.18) 0%, rgba(110,231,183,.06) 32%, rgba(110,231,183,0) 66%),
    radial-gradient(34% 26% at 50% 44%, rgba(255,226,181,.08) 0%, rgba(255,226,181,0) 72%),
    radial-gradient(130% 90% at 50% 120%, rgba(14,38,30,.85) 0%, rgba(0,0,0,1) 72%); }
  #vt-backdrop .wb-mountains { position:absolute; left:0; right:0; bottom:0; height:42vh; min-height:240px; pointer-events:none; }
  #vt-backdrop .wb-mountains svg { width:100%; height:100%; display:block; }
  #vt-backdrop .wb-mist { position:absolute; left:0; right:0; bottom:30vh; height:24vh; pointer-events:none; background:linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(110,231,183,.06) 40%, rgba(0,0,0,0) 100%); filter:blur(8px); }
  #vt-backdrop .wb-particles { position:absolute; inset:0; pointer-events:none; }
  #vt-backdrop .wb-particles span { position:absolute; width:1.5px; height:1.5px; background:rgba(233,239,233,.55); border-radius:50%; box-shadow:0 0 4px rgba(167,243,208,.35); animation:vtDrift linear infinite; }
  @keyframes vtDrift { 0%{transform:translate3d(0,0,0);opacity:0;} 8%{opacity:.7;} 92%{opacity:.5;} 100%{transform:translate3d(var(--dx,12px),var(--dy,-100vh),0);opacity:0;} }
  @media (prefers-reduced-motion:reduce) { #vt-backdrop .wb-particles span { animation:none; } }


  /* ── GROUND-UP REBUILD — every component's design (CSS) below this
        point has been deleted, not disabled. The HTML markup and all
        JS logic (state, calculations, event wiring) are untouched, so
        the tile still runs correctly — it just renders unstyled while
        we design each component fresh, one at a time. ============= */

  /* ==== TOP STICKER — greeting + a note bar that flips through short,
     real, day-dependent callouts (rest day, streak, a nudge, a PR),
     color-coded by what kind of note it is. First rebuilt piece. ==== */
  .topSticker { padding:calc(16px + env(safe-area-inset-top)) var(--sp5) 0; }
  .stickerGreet { font-family:var(--sans); font-weight:800; font-size:var(--fs-display); letter-spacing:-0.02em; color:var(--text); margin-bottom:11px; line-height:var(--lh-display);}
  .noteBar { display:flex; align-items:stretch; gap:0; background:var(--e2); border:1px solid var(--hair); border-radius:var(--r-lg); padding:10px 2px; box-shadow:0 14px 30px -20px rgba(0,0,0,.7); }
  .noteSlot { flex:1; min-width:0; height:16px; position:relative; overflow:hidden; perspective:220px; }
  .noteDiv { width:1px; flex:none; background:var(--hair-strong); margin:1px 0; }
  .noteCard { position:absolute; inset:0 7px; display:flex; align-items:center; gap:4px; font-family:var(--sans); font-size:var(--fs-micro); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); transform-origin:50% 0%; transform:translateY(0) rotateX(0deg); opacity:1; transition:transform .48s var(--ease-momentum), opacity .38s var(--ease-momentum); line-height:var(--lh-micro); letter-spacing:var(--ls-micro);}
  .noteCard.entering { transform:translateY(65%) rotateX(75deg); opacity:0; }
  .noteCard.leaving { transform:translateY(-65%) rotateX(-75deg); opacity:0; }
  .noteDot { flex:none; width:4px; height:4px; border-radius:50%; background:currentColor; }
  .noteEmo { flex:none; font-size:var(--fs-micro); line-height:1; font-weight:var(--fw-micro); letter-spacing:var(--ls-micro);}
  .noteTxt { min-width:0; overflow:hidden; text-overflow:ellipsis; color:currentColor; }
  .note-mint { color:var(--signal); }
  .note-gold { color:var(--gold); }
  .note-fail { color:var(--fail); }
  .note-plain { color:var(--muted); }

  /* why a weight is being suggested — quiet by default, because it is an
     explanation and not a call to action. Only a layoff or a deload earns
     colour, since those are the two the lifter would otherwise misread as
     the app losing their progress. */
  .pillWhy { margin:5px 0 0 34px; font-size:var(--fs-micro); line-height:1.35; font-family:var(--sans); color:var(--muted-strong); letter-spacing:.005em; font-weight:var(--fw-micro);}
  /* Every basis reads the same. The words already carry the difference —
     colour-coding five of them spends two accents on explanatory text,
     which is the colour-carries-meaning trap. */

  /* readiness — stated as fact before the session, not offered as a choice */
  .readinessNote { margin:var(--sp3) var(--sp5) 0; padding:10px var(--sp4);
    border-radius:var(--r-md); background:var(--e2); border:1px solid var(--hair);
    font-size:var(--fs-label); font-weight:600; line-height:1.4; color:var(--muted); }
  /* Fail means a missed set. A readiness verdict is not one. All three
     take the same treatment; the rail distinguishes them, not the hue. */
  .readinessNote.verdict-rest_advised { color:var(--muted-strong); border-left:3px solid var(--text); }
  .weeklyReview { margin:var(--sp3) var(--sp5) 0; padding:12px var(--sp4);
    border-radius:var(--r-md); background:var(--e1); border:1px solid var(--hair); }
  .weeklyReview .wrHead { font-size:var(--fs-micro); font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted-2); margin-bottom:6px; line-height:var(--lh-micro);}
  .weeklyReview .wrLine { font-size:var(--fs-label); font-weight:600; line-height:1.45; color:var(--text); }
  .weeklyReview .wrLine.mu { color:var(--muted); font-weight:500; }

  /* progress charts — minimal, reusing the existing bar and plot surfaces */
  /* A sparkline is small by definition. aspect-ratio:16/9 at card width
     made it a panel over a hundred pixels tall inside a card whose number
     is the point. The padding leaves room for the last dot, which sits on
     the right edge and was half outside its own box. */
  .sChart { position:relative; width:100%; height:38px; max-height:38px; margin-top:10px; padding-right:5px; }
  .sPoint { position:absolute; width:5px; height:5px; margin:-2px 0 0 -2px; opacity:.55; padding:0;
    border-radius:50%; border:none; background:var(--signal); }
  .sPoint:active { transform:scale(1.5); }
  .mbFill.ok, .mbFill.band-in { background:var(--signal); }
  .mbFill.band-over, .mbFill.band-under { background:var(--gold); }
  .readinessNote.verdict-reduced_volume, .readinessNote.verdict-reduced_intensity { color:var(--muted-strong); border-left:3px solid var(--hair-strong); }

  /* warm-up toggle — deliberately quiet. It is a correction, not an action,
     and it should never compete with "Hit it". */
  .pillWarm { flex:none; width:22px; height:22px; border-radius:7px;
    border:1px solid var(--hair-strong); background:transparent; color:var(--muted-2);
    font-family:var(--mono); font-size:var(--fs-micro); font-weight:700; line-height:1;
    transition:background var(--d1) var(--ease-out), color var(--d1) var(--ease-out); letter-spacing:var(--ls-micro);}
  .pillWarm.on { background:var(--e4); color:var(--text); }
  /* Recedes FURTHER than done, and by surface rather than by opacity.
     Opacity blends toward whatever is behind — which worked while a done
     row was a bright fill, and stopped working the moment done became a
     recessed surface on a card of nearly the same value. An explicit
     step down cannot drift with its background. Its rail is not the
     completion mark either: a warm-up is not working volume. */
  .pill.warmup { background:var(--e0); border-left-color:var(--hair-strong); }
  .pill.warmup .pillValue, .pill.warmup .pillInput, .pill.warmup .pillStatus, .pill.warmup .pillIdx { color:var(--muted-2); }
  /* a weight or rep record: a dot, not a takeover */
  .pillPrDot { display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--gold); margin-right:5px; vertical-align:middle; }
  /* the near-miss cue, before the set */
  .pillNear { font-size:var(--fs-micro); font-weight:600; color:var(--muted-strong); margin-right:8px;
    white-space:nowrap; line-height:var(--lh-micro); letter-spacing:var(--ls-micro);}

  /* ==== REST BAR — an instrument face, not a toast. It sits inside the
     lift card while the clock runs: a ring that drains, a mono readout,
     and two coarse nudges either side. Overtime flips the whole bar to
     gold rather than only the number, because at a glance across a bench
     the colour is the only thing that actually reads. ============== */
  .restbar { display:flex; align-items:center; gap:var(--sp3); margin-top:var(--sp3);
    padding:10px var(--sp3); border-radius:var(--r-md);
    background:var(--e2); border:1px solid var(--hair);
    box-shadow:0 10px 24px -18px rgba(0,0,0,.8);
    animation:restIn var(--d3) var(--ease-out) both; }
  @keyframes restIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .restbar .restMid { flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
  .restbar .restRing { width:34px; height:34px; flex:none; transform:rotate(-90deg); }
  .restbar .restRingTrack { fill:none; stroke:var(--hair-strong); stroke-width:3; }
  .restbar .restRingFill { fill:none; stroke:var(--signal); stroke-width:3; stroke-linecap:round;
    transition:stroke-dashoffset var(--d1) linear, stroke var(--d2) var(--ease-out); }
  .restbar .restTime { font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:var(--fs-subhead); font-weight:600; letter-spacing:-.01em; color:var(--muted); min-width:52px; line-height:var(--lh-subhead);}
  .restbar .restLabel { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:var(--fs-micro); font-weight:600; color:var(--muted); letter-spacing:.01em; line-height:var(--lh-micro);}
  .restbar .restStep { flex:none; padding:7px 9px; border-radius:var(--r-sm);
    border:1px solid var(--hair-strong); background:transparent; color:var(--muted);
    font-family:var(--mono); font-size:var(--fs-micro); font-weight:600;
    transition:background var(--d1) var(--ease-out), color var(--d1) var(--ease-out); line-height:var(--lh-micro); letter-spacing:var(--ls-micro);}
  .restbar .restStep:active { background:var(--e4); color:var(--text); transform:scale(.94); }
  .restbar .restX { flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--hair); background:transparent; color:var(--muted-2);
    font-size:var(--fs-body); line-height:1; font-weight:var(--fw-body);}
  .restbar .restX:active { color:var(--text); }
  /* overtime — the rest is over and the number is now counting up */
  /* Running past your rest is not an alert. The ring completes, the time
     brightens from muted to text, the + appears. No colour. */
  .restbar.over { border-color:var(--hair-strong); }
  .restbar.over .restRingFill { stroke:var(--hair-strong); }
  .restbar.over .restTime { color:var(--text); }
  .restbar.over .restLabel { color:var(--muted); }
  @media (prefers-reduced-motion:reduce) { .restbar { animation:none; } }

  /* ====================================================================
     RECOVERED — the nine primitives, lifted verbatim from 731e891, the
     last commit before `auto: update from Claude Code` (191c04a) deleted
     1,252 lines of this stylesheet on 2026-08-11.

     Nothing here is new. Every rule below is byte-for-byte the rule that
     shipped in August; they were ported from 21st.dev then, and the
     deletion took them. Recovery only — no restyling, no invention, and
     nothing outside the nine class lists.

     Appended rather than interleaved so the diff is readable and so the
     rules re-added since the loss (rest bar, note cards, weekly review,
     readiness verdicts) keep their place in the cascade. There are no
     selector collisions between the two sets; that is asserted in
     tests/tools/recovered-primitives.test.ts.
     ================================================================= */

  /* 1 · popup shell — 11 rules */
  .eyebrow { font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em; font-size:var(--fs-micro); font-weight:600; color:var(--muted); line-height:var(--lh-micro);}
  .scrim { position:fixed; inset:0; z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:max(20px, env(safe-area-inset-top)) 14px 40px; overflow-y:auto; background:rgba(0,0,0,.5); backdrop-filter:blur(0px); opacity:0; animation:scrimIn var(--d3) var(--ease-momentum) forwards; }
  .pop { width:100%; max-width:520px; margin:auto; background:var(--e2); border:1px solid var(--hair-strong); border-radius:var(--r-lg); padding:24px 22px 26px; position:relative; box-shadow:0 40px 100px rgba(0,0,0,.65); opacity:0; transform:translateY(10px) scale(.97); animation:popIn var(--d4) var(--ease-momentum) forwards; }
  .pop::before { content:''; position:absolute; left:16px; right:16px; top:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); }
  .popHead { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .popTitle { font-family:var(--sans); font-weight:800; font-size:var(--fs-hero); line-height:1.05; letter-spacing:-0.025em; margin-top:6px; }
  .popX { background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; flex:none; transition:color var(--d2), transform var(--d1) var(--spring); }
  .popX svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  .popX:hover { color:var(--text); }
  .popX:active { transform:scale(.85); }
  .popBtns { display:flex; gap:10px; margin-top:24px; }

  /* 2 · button — 35 rules */
  .wcAddBtn { background:var(--signal); color:var(--signal-ink); border:none; border-radius:10px; padding:0 15px; font-weight:700; cursor:pointer; transition:transform var(--d1) var(--spring); }
  .wcAddBtn:active { transform:scale(.94); }
  .actionPill { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; font-size:var(--fs-label); font-weight:500; color:var(--muted-2); background:var(--e3); border:1px solid var(--hair); border-radius:var(--r-pill); cursor:pointer; white-space:nowrap; transition:color var(--d2) var(--ease-out), border-color var(--d2) var(--ease-out), background var(--d2) var(--ease-out), transform var(--d1) var(--spring); line-height:var(--lh-label);}
  .actionPill:hover { color:var(--signal); border-color:rgba(110,231,183,.35); }
  .actionPill:active { transform:scale(.95); }
  .actionPill svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .actionPill .pl { font-family:var(--sans); letter-spacing:.01em; font-size:var(--fs-label); line-height:var(--lh-label); font-weight:var(--fw-label);}
  .finishBtn { width:100%; border:2px solid color-mix(in srgb, var(--signal) 60%, black); border-bottom-width:6px; transform-origin:bottom; border-radius:var(--r-md); padding:14px 16px 12px; font-family:var(--sans); font-size:var(--fs-body); font-weight:700; cursor:pointer; background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 46%), var(--signal); color:var(--signal-ink); transition:transform var(--d1) var(--spring), box-shadow var(--d2) var(--ease-out), opacity var(--d2), background var(--d2), border-bottom-width var(--d1) var(--spring); line-height:var(--lh-body);}
  .finishBtn:hover:not(:disabled) { transform:translateY(-1px); }
  .finishBtn:active:not(:disabled) { transform:scaleY(.96) translateY(2px); border-bottom-width:2px; }
  .finishBtn:disabled { opacity:.35; cursor:default; box-shadow:none; }
  .finishBtn.locked { background:rgba(110,231,183,.1); color:var(--signal); border:1px solid rgba(110,231,183,.4); box-shadow:none; }
  .freshbtn { display:block; margin:14px auto 0; background:none; border:2px solid transparent; border-bottom-width:3px; transform-origin:bottom; color:var(--muted); font-family:var(--sans); font-size:var(--fs-label); font-weight:500; cursor:pointer; padding:7px 12px 5px; border-radius:9px; transition:color var(--d2), border-color var(--d2), transform var(--d1) var(--spring), border-bottom-width var(--d1) var(--spring); line-height:var(--lh-label);}
  .freshbtn:hover { color:var(--text); }
  .freshbtn.arm { color:var(--fail); font-weight:600; border-color:color-mix(in srgb, var(--fail) 45%, transparent); }
  .freshbtn:active { transform:scaleY(.93) translateY(1px); border-bottom-width:1px; }
  .photoX { background:none; border:none; color:var(--muted); font-size:var(--fs-subhead); cursor:pointer; padding:2px 6px; line-height:1; transition:color var(--d2), transform var(--d1) var(--spring); font-weight:var(--fw-subhead);}
  .photoX:hover { color:var(--fail); }
  .photoX:active { transform:scale(.82); }
  .goalRow .photoX { position:absolute; right:0; top:8px; }
  .pbtn { flex:1; border:2px solid transparent; border-bottom-width:4px; transform-origin:bottom; border-radius:var(--r-md); padding:12px 14px 10px; font-family:var(--sans); font-size:var(--fs-body); font-weight:700; cursor:pointer; transition:transform var(--d1) var(--spring), border-bottom-width var(--d1) var(--spring); line-height:var(--lh-body);}
  .pbtn:active { transform:scaleY(.94) translateY(1px); border-bottom-width:2px; }
  .pbtn.save { background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 46%), var(--signal); border-color:color-mix(in srgb, var(--signal) 60%, black); color:var(--signal-ink); }
  .pbtn.save:hover:not(:disabled) { }
  .pbtn.ghost { background:var(--e1); border-color:var(--hair-strong); color:var(--muted); }
  .pbtn.ghost:hover { color:var(--text); border-color:var(--muted); }
  .pbtn.danger { background:rgba(239,111,106,.1); border-color:color-mix(in srgb, var(--fail) 55%, black); color:var(--danger); }

  .menuPop button.danger { color:var(--danger); }

  /* the two the feedback rules animate */
  @keyframes btnSpin { to { transform:rotate(360deg); } }
  @keyframes btnCheck { 0%{transform:rotate(-45deg) scale(0); opacity:0;} 55%{opacity:1;} 100%{transform:rotate(-45deg) scale(1); opacity:1;} }
  .cvSend { flex:none; width:36px; height:36px; border-radius:50%; border:2px solid color-mix(in srgb, var(--signal) 60%, black); border-bottom-width:4px; transform-origin:bottom; background:var(--signal); color:var(--signal-ink); display:grid; place-items:center; cursor:pointer; transition:transform var(--d1) var(--spring), opacity var(--d2), border-bottom-width var(--d1) var(--spring); }
  .cvSend:hover:not(:disabled) { transform:translateY(-1px); }
  .cvSend:active:not(:disabled) { transform:scaleY(.9) translateY(1px); border-bottom-width:2px; }
  .cvSend:disabled { opacity:.4; cursor:default; }
  .cvSend svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* 3 · input — 21 rules */
  .wcIn { flex:1; background:var(--e2); border:1px solid var(--hair); border-radius:10px; color:var(--text); font:inherit; font-size:var(--fs-caption); padding:9px 11px; transition:border-color var(--d2); line-height:var(--lh-caption); font-weight:var(--fw-caption);}
  .wcIn:focus { outline:none; border-color:var(--signal); }
  .pillInput { background:transparent; border:none; outline:none; color:inherit; font:inherit; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; -moz-appearance:textfield; appearance:textfield; min-width:2.4ch; width:4.2ch; padding:0 1px; border-bottom:1px solid transparent; transition:border-color var(--d2), color var(--d2); }
  .pillInput.r { width:2.6ch; }
  .pillInput::-webkit-outer-spin-button, .pillInput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .pill:hover .pillInput { border-bottom-color:rgba(110,231,183,.25); }
  .pillInput:focus { color:var(--signal); border-bottom-color:var(--signal); }
  .pillInput.w.bump { color:var(--signal); }
  .pillInput.small { font-size:.85em; }
  .pill.done .pillValue, .pill.done .pillInput { color:var(--muted-strong); }
  .field { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--hair); }
  .field:last-of-type { border-bottom:none; }
  .field .lbl { color:var(--muted-2); font-size:var(--fs-body); font-weight:500; display:flex; align-items:center; gap:10px; line-height:var(--lh-body);}
  .field .lbl svg { width:18px; height:18px; fill:none; stroke:var(--muted); stroke-width:1.5; }
  .wInput { font-family:var(--mono); font-weight:600; font-size:var(--fs-title); width:90px; text-align:right; background:none; border:none; color:inherit; border-bottom:1px solid transparent; -moz-appearance:textfield; appearance:textfield; line-height:var(--lh-title);}
  .wInput:focus { outline:none; border-bottom-color:var(--signal); color:var(--signal); }
  .wInput::-webkit-outer-spin-button, .wInput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .wUnit { color:var(--muted); font-size:var(--fs-body); margin-left:6px; line-height:var(--lh-body); font-weight:var(--fw-body);}
  .cvInputRow { display:flex; align-items:center; gap:10px; margin:10px 16px calc(16px + env(safe-area-inset-bottom)); flex:none; background:var(--e3); border:1px solid var(--hair-strong); border-radius:999px; padding:6px 6px 6px 16px; transition:border-color var(--d2) var(--ease-out); }
  .cvInputRow:focus-within { border-color:var(--signal); }
  .cvInputRow input { flex:1; background:none; border:none; outline:none; color:var(--text); font:inherit; font-size:var(--fs-body); padding:8px 0; line-height:var(--lh-body); font-weight:var(--fw-body);}

  /* 4 · switch — 16 rules */
  .bouncyRow { display:flex; align-items:center; gap:8px; align-self:center; margin-bottom:3px; }
  .bouncyLabel { font-size:var(--fs-label); font-weight:500; color:var(--muted); transition:color var(--d2) var(--ease-out); line-height:var(--lh-label);}
  .bouncyLabel.on { color:var(--text); }
  .bouncyToggle { background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .bouncyTrack { display:flex; align-items:center; width:46px; height:26px; border-radius:999px; padding:3px; background:var(--e2); border:1px solid var(--hair-strong); box-sizing:border-box; transition:background var(--d3) var(--ease-out), border-color var(--d3) var(--ease-out); }
  #moonbtn.on .bouncyTrack { background:var(--signal); border-color:color-mix(in srgb, var(--signal) 55%, black); }
  .bouncyThumb { width:20px; height:20px; border-radius:50%; background:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; transform:translateX(0) scale(1); transition:transform .5s cubic-bezier(.68,-.55,.265,1.55); }
  #moonbtn.on .bouncyThumb { transform:translateX(20px) scale(1); }
  #moonbtn:active:not(.on) .bouncyThumb { transform:translateX(0) scale(.82); transition-duration:.15s; }
  #moonbtn.on:active .bouncyThumb { transform:translateX(20px) scale(.82); transition-duration:.15s; }
  .bouncyDot { font-size:var(--glyph-base); line-height:1; }
  .bouncyTrack.mini { width:32px; height:18px; padding:2px; }
  .bouncyTrack.mini .bouncyThumb { width:14px; height:14px; }
  .deloadRow.on .bouncyTrack { background:var(--signal); border-color:color-mix(in srgb, var(--signal) 55%, black); }
  .deloadRow.on .bouncyThumb { transform:translateX(14px); }
  .deloadRow .bouncyDot { font-size:var(--glyph-mini); line-height:1; }

  /* 5 · stepper — 6 rules */
  .stepper { display:flex; align-items:center; gap:14px; }
  .step { width:36px; height:36px; border-radius:10px; border:1px solid var(--hair-strong); background:var(--e1); color:var(--text); font-size:var(--fs-title); line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform var(--d1) var(--spring), border-color var(--d2); font-weight:var(--fw-title);}
  .step:hover { border-color:var(--signal); }
  .step:active { transform:scale(.9); }
  .step.minus { color:var(--muted); }
  .stepVal { min-width:58px; text-align:center; font-family:var(--mono); font-size:var(--fs-title); font-variant-numeric:tabular-nums; font-weight:600; line-height:var(--lh-title);}

  /* 6 · selectable row — 8 rules */
  .delta-cap .mu { color:var(--muted); }
  .swapItem { display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--hair); border-radius:13px; background:var(--e1); cursor:pointer; text-align:left; transition:border-color var(--d2) var(--ease-out), transform var(--d2) var(--ease-out); width:100%; color:inherit; }
  .swapItem:hover { border-color:rgba(110,231,183,.35); transform:translateY(-1px); }
  .swapItem .nm { font-family:var(--sans); font-weight:600; font-size:var(--fs-body); line-height:var(--lh-body);}
  .swapItem .mu { font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:3px; line-height:var(--lh-micro); font-weight:var(--fw-micro);}

  /* 7 · chip — 9 rules */
  .chip { flex:none; padding:8px 16px 6px; border-radius:999px; border:2px solid var(--hair); border-bottom-width:3px; transform-origin:bottom; background:var(--e2); color:var(--muted-2); font:inherit; font-size:var(--fs-caption); font-weight:600; cursor:pointer; white-space:nowrap; transition:border-color var(--d2) var(--ease-out), background var(--d2) var(--ease-out), color var(--d2) var(--ease-out), transform var(--d1) var(--spring), border-bottom-width var(--d1) var(--spring); line-height:var(--lh-caption);}
  .chip:hover { border-color:var(--hair-strong); color:var(--text); }
  .chip:active { transform:scaleY(.92) translateY(1px); border-bottom-width:1px; }
  .chip.on { border-color:color-mix(in srgb, var(--signal) 55%, black); background:var(--signal); color:var(--signal-ink); }
  .range { position:relative; display:flex; gap:3px; justify-content:center; background:var(--e1); border:1px solid var(--hair); border-radius:12px; padding:4px; margin:20px auto 0; width:fit-content; }
  .rangeInd { position:absolute; top:4px; bottom:4px; left:0; width:0; background:var(--signal); border-radius:9px; z-index:1; }
  .range button { position:relative; z-index:2; background:none; border:none; color:var(--muted); font-family:var(--sans); font-size:var(--fs-caption); font-weight:600; padding:8px 14px; border-radius:9px; cursor:pointer; transform-origin:bottom; transition:color var(--d2), transform var(--d1) var(--spring); line-height:var(--lh-caption);}
  .range button.on { color:var(--signal-ink); }
  .range button:active { transform:scaleY(.9); }

  /* 8 · card — 21 rules */
  .miniCard { background:var(--e2); border-radius:var(--r-md); padding:13px 12px; }
  /* Reference, not action. These sit on the session sheet, the same
     surface as the set rows — three signal figures in the header pull
     the eye up and away from the row being acted on, which undoes the
     recession below. The `gold` variant is gone with them: it said
     exactly this and now duplicates the base. */
  .miniCard b { display:block; font-family:var(--sans); font-weight:800; font-size:var(--fs-title); letter-spacing:-.02em; color:var(--text); line-height:var(--lh-title);}
  .miniCard span { display:block; font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:4px; line-height:var(--lh-micro); font-weight:var(--fw-micro);}
  .ex { position:relative; background:var(--e2); border:1px solid transparent; border-radius:var(--r-md); padding:18px 16px 20px; transition:background var(--d2) var(--ease-out); }
  .ex::after { content:''; position:absolute; inset:0; border-radius:var(--r-md); background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(110,231,183,.08), transparent 65%); opacity:0; transition:opacity var(--d3) var(--ease-out); pointer-events:none; }
  .ex:hover::after { opacity:1; }
  .ex > * { position:relative; z-index:1; }
  .ex.drag-ghost { opacity:.4; }
  .ex.celebrate::before { content:""; position:absolute; inset:-1px; border-radius:var(--r-md); pointer-events:none; z-index:0; animation:exGlow 1.6s var(--ease-out) forwards; }
  .ex.celebrate::after { opacity:1; border:1.5px solid rgba(245,166,35,.6); animation:exRing 1.6s var(--ease-out) forwards; }
  .ex.collapsed .exMeta, .ex.collapsed .exActions, .ex.collapsed .pills, .ex.collapsed .exNote, .ex.collapsed .restSlot { display:none; }
  .ex.collapsed .collapsedNote { display:flex; }
  .photoCard { position:absolute; left:50%; top:50%; width:88px; height:124px; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--hair-strong); background:var(--e3); box-shadow:0 14px 30px -14px rgba(0,0,0,.65); cursor:pointer; }
  .photoCard::after { content:''; position:absolute; inset:0; background:radial-gradient(140px circle at var(--mx,50%) var(--my,50%), rgba(110,231,183,.16), transparent 65%); opacity:0; transition:opacity var(--d3) var(--ease-out); pointer-events:none; }
  .photoCard:hover::after { opacity:1; }
  .ovCard { position:relative; overflow:hidden; border:1px solid var(--hair); background:var(--e2); border-radius:var(--r-md); padding:16px 12px; text-align:center; transition:border-color var(--d2) var(--ease-out), transform var(--d3) var(--spring), box-shadow var(--d3) var(--ease-out); }
  .ovCard::after { content:''; position:absolute; inset:0; background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(110,231,183,.1), transparent 65%); opacity:0; transition:opacity var(--d3) var(--ease-out); pointer-events:none; }
  .ovCard:hover::after { opacity:1; }
  .ovCard:hover { border-color:var(--hair-strong); transform:translateY(-3px) scale(1.02); box-shadow:0 16px 30px -18px rgba(0,0,0,.6); }
  .chart-card { margin-top:18px; border:1px solid var(--hair); border-radius:var(--r-lg); padding:18px 16px 14px; background:var(--e1); }
  /* Full-bleed only when it holds the heatmap — see the .hmHead/.hmBody
     comment below for the measured widths and why. Cancels .sheet's own
     20px side padding (the card's border/background now reach .sheet's
     inner edge instead of sitting inset from it) and shrinks the card's
     OWN side padding from 16px to 8px, so the grid gets real width
     without the card's frame disappearing — it's still a bordered card,
     just a wider one, the way a calendar grid wants to be. */
  .chart-card:has(.hmBody) { margin-left:-20px; margin-right:-20px; padding-left:8px; padding-right:8px; }

  /* 9 · sheet — 2 rules */
  .sheet { position:relative; width:100%; background:var(--e1); border:1px solid var(--hair); border-radius:var(--r-lg); padding:22px 20px 24px; margin-bottom:var(--sp4); opacity:0; transform:translateY(10px); animation:panelRise var(--d4) var(--ease-momentum) forwards; }
  .sheet::before { content:''; position:absolute; left:18px; right:18px; top:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent); }

  /* keyframes the rules above reference — inert unless named */
  @keyframes exGlow { 0%{box-shadow:0 0 0 0 rgba(245,166,35,0);} 22%{box-shadow:0 0 52px -6px rgba(245,166,35,.5);} 100%{box-shadow:0 0 0 0 rgba(245,166,35,0);} }
  @keyframes exRing { 0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;} }
  @keyframes panelRise { to { opacity:1; transform:none; } }
  @keyframes popIn { to { opacity:1; transform:none; } }
  @keyframes scrimIn { to { opacity:1; backdrop-filter:blur(6px); } }

  /* Reduced motion, trimmed to the nine. The August block also covered
     .menuPop, .pill.shimmer, .prFill.pulse, .restbar.over and
     .skeleton-shimmer; those are outside this recovery and are left
     alone. .restbar already has its own guard above. */
  @media (prefers-reduced-motion:reduce) {
    .sheet, .pop, .scrim { animation-duration:.01ms !important; }
    .ex::after, .ovCard::after, .photoCard::after { transition:none !important; }
  }

  /* ---- set row, recovered in full -----------------------------------
     The nine class lists covered the set row's BUTTONS but not the row
     itself: .pill had twenty rules in August and three here, so the most
     tapped surface in the app had no layout to hang a touch target on.
     Recovered beyond the stated list: .pill, .pills, .pillValue,
     .pillUnit, .pillTimes, .pillPerHand, .drops, .dropRow, .dropArrow,
     .dropX — 45 rules in total, all byte-for-byte from 731e891. */
  .pills { display:flex; flex-direction:column; gap:8px; width:100%; margin-top:16px; }
  .pill { display:flex; align-items:center; gap:11px; padding:4px 14px 4px 16px; border-radius:12px; border:1px solid var(--hair); border-left:2px solid var(--hair-strong); background:var(--e3); position:relative; overflow:hidden; transition:background var(--d3) var(--ease-out), border-color var(--d3) var(--ease-out), box-shadow var(--d3) var(--ease-out); }
  .pill.tappable { cursor:pointer; }
  .pill.tappable:hover { background:var(--e4); }
  .pillIdx { font-family:var(--mono); font-size:var(--fs-micro); color:var(--muted); width:14px; flex:none; line-height:var(--lh-micro); font-weight:var(--fw-micro); letter-spacing:var(--ls-micro);}
  .pillValue { font-family:var(--mono); font-size:var(--fs-subhead); letter-spacing:-0.01em; font-weight:600; display:inline-flex; align-items:baseline; line-height:var(--lh-subhead);}
  .pillTimes { color:var(--muted); margin:0 6px; font-weight:400; }
  .pillUnit { color:var(--muted); font-family:var(--sans); font-size:.62em; margin-left:3px; letter-spacing:.02em; font-variant-numeric:normal; text-transform:uppercase; }
  .pillPerHand { margin-left:1px; font-size:.85em; opacity:.7; }
  .pillSpacer { flex:1; }
  .pillActions { display:inline-flex; align-items:center; gap:10px; }
  .pillHit { background:var(--signal); color:var(--signal-ink); border:2px solid color-mix(in srgb, var(--signal) 60%, black); border-bottom-width:4px; transform-origin:bottom; font-family:var(--sans); font-weight:700; font-size:var(--fs-label); border-radius:var(--r-pill); padding:6px 13px 5px; cursor:pointer; white-space:nowrap; transition:transform var(--d1) var(--spring), box-shadow var(--d2), border-bottom-width var(--d1) var(--spring); line-height:var(--lh-label);}
  .pillHit:hover { }
  .pillHit:active { transform:scaleY(.92) translateY(1px); border-bottom-width:2px; }
  .pillMiss { background:none; border:none; font-family:var(--sans); font-size:var(--fs-label); font-weight:500; color:var(--muted); cursor:pointer; padding:6px; transition:color var(--d2); line-height:var(--lh-label);}
  .pillMiss:hover { color:var(--fail); }
  .pillStatus { font-family:var(--mono); font-size:var(--fs-label); cursor:default; color:var(--muted); line-height:var(--lh-label); font-weight:var(--fw-label);}
  /* A drop set attaches to a completed one, so this button renders only
     where classifySet says 'done'. It could never appear on an unlogged
     row, which made the signal base and its tinted hover dead styling —
     overridden on every row that could ever show them. Stated once here
     instead of twice. */
  .pillDrop { background:none; border:1px solid var(--hair-strong); font-family:var(--sans); font-size:var(--fs-label); font-weight:500; color:var(--muted); cursor:pointer; padding:5px 9px; border-radius:var(--r-pill); white-space:nowrap; transition:border-color var(--d2), background var(--d2); line-height:var(--lh-label);}
  .pillDrop:hover { background:var(--e3); border-color:var(--hair-strong); }
  .pillWrap { display:flex; flex-direction:column; gap:6px; }
  .drops:empty { display:none; }
  .dropRow { display:flex; align-items:center; gap:9px; padding:9px 14px 9px 28px; margin-left:8px; border-left:2px solid var(--hair-strong); font-size:var(--fs-caption); line-height:var(--lh-caption); font-weight:var(--fw-caption);}
  .dropArrow { color:var(--muted); font-size:var(--fs-label); line-height:var(--lh-label); font-weight:var(--fw-label);}
  .dropX { background:none; border:none; color:var(--muted); font-size:var(--fs-body); cursor:pointer; padding:2px 4px; margin-left:auto; transition:color var(--d2), transform var(--d1) var(--spring); line-height:var(--lh-body); font-weight:var(--fw-body);}
  .dropX:hover { color:var(--fail); }
  .dropX:active { transform:scale(.82); }
  .pillReset { background:none; border:none; cursor:pointer; padding:6px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); opacity:.7; transition:opacity var(--d2), background var(--d2), transform var(--d1) var(--spring); }
  .pillReset svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .pillReset:hover { opacity:1; background:var(--e4); }
  .pillReset:active { transform:scale(.85); }
  /* DONE RECEDES. It was a solid signal fill, and individually that
     looked good — but across twenty-five sets it became a wall of green
     in which the next unlogged row, the thing you act on, was the
     quietest element on screen. A completed set is reference, not
     action: a recessed surface, with the signal spent on a left rail
     that marks completion rather than on the whole row. */
  .pill.done { background:var(--e1); border-color:var(--hair); border-left-color:var(--signal); border-left-width:3px; }
  .pill.done .pillIdx { color:var(--muted-2); }
  .pill.done .pillUnit, .pill.done .pillTimes { color:var(--muted-2); }
  .pill.done .pillStatus { color:var(--muted); }
  /* A RECORD IS THE LOUDEST THING IN THE APP, and it is rare. On a
     recessed row it finally has somewhere to land: the rail turns gold
     and the star gets a real size instead of being a glyph squeezed
     between other glyphs. :has() rather than a new class, so the markup
     is untouched. The weight/rep dot stays quiet — that distinction is
     the whole point of having two marks. */
  .pill.done:has(.pillPr) { border-left-color:var(--gold); }
  .pill.done .pillPr { color:var(--gold); font-size:var(--fs-subhead); line-height:1; margin-right:2px; }
  .pill.done .pillStatus .sub { color:var(--muted-2); }
  .pill.done .pillReset { color:var(--muted-2); }
  .pill.done .pillReset:hover { background:var(--e3); }
  .pill.done .pillHit { display:none; }
  .pill.failed { background:rgba(239,111,106,.06); border-color:rgba(239,111,106,.25); border-left-color:var(--fail); }
  .pill.failed .pillIdx, .pill.failed .pillStatus { color:var(--fail); }
  .pill.failed .pillValue { text-decoration:line-through; color:var(--muted-2); }
  /* The full-green flash survives, as the reward and only as the reward.
     The class is added when a set is logged and removed 820ms later, so
     it never accumulates — which is exactly why it works. The row
     transitions back to its recessed state on its own. */
  .pill.shimmer { animation:pillSnap .32s var(--spring); background:var(--signal); border-color:color-mix(in srgb, var(--signal) 60%, black); border-left-color:color-mix(in srgb, var(--signal) 60%, black); }
  .pill.shimmer .pillValue, .pill.shimmer .pillInput, .pill.shimmer .pillStatus, .pill.shimmer .pillIdx { color:var(--signal-ink); }
  .pill.shimmer::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform:translateX(-120%); animation:pillShimmer .8s var(--ease-out); }

  /* keyframes the set row references */
  @keyframes pillShimmer { to { transform:translateX(120%); } }
  @keyframes pillSnap { 0%{transform:scale(1);} 40%{transform:scale(1.014);} 100%{transform:scale(1);} }

  /* ---- button feedback, scoped ---------------------------------------
     setBtnState() is live in the tile and rendered nothing, because the
     rules that draw the spinner and the check were global attribute
     selectors and did not come back with the button primitive. Scoped to
     `button` here rather than left loose on [data-state], and the three
     white fallbacks replaced with var(--text). */
  button[data-state] { position:relative; }
  button[data-state="loading"], button[data-state="success"] { color:transparent !important; pointer-events:none; }
  button[data-state] svg { opacity:0; }
  button[data-state]::after { content:''; position:absolute; left:50%; top:50%; }
  button[data-state="loading"]::after { width:16px; height:16px; margin:-8px 0 0 -8px; border:2px solid rgba(255,255,255,.25); border-top-color:var(--state-ink, var(--text)); border-radius:50%; animation:btnSpin .65s linear infinite; }
  button[data-state="success"]::after { width:13px; height:7px; margin:-5px 0 0 -6px; border-left:2.5px solid var(--state-ink, var(--text)); border-bottom:2.5px solid var(--state-ink, var(--text)); transform:rotate(-45deg) scale(0); opacity:0; animation:btnCheck .45s var(--spring) forwards; }

  /* ---- touch targets -------------------------------------------------
     Three controls were under a one-handed minimum. The painted box stays
     where it was wherever the visual matters; the HIT AREA is what grows,
     via a pseudo-element, so nothing below reflows.

     The arithmetic, because "44" has to actually be reachable:
       .popX      26 -> 44x44 real. It paints no background, so a bigger
                  box is visually identical. It sits alone in .popHead
                  with nothing to overlap.
       .actionPill  ~30 tall -> 44 tall hit area, ::before inset -7px 0.
                  Vertical only: .exActions has gap:7px horizontally, so
                  widening would make neighbouring pills overlap. Above
                  and below are .exMeta and .restSlot, neither
                  interactive, so a vertical overrun is unambiguous.
       .pillWarm  22x22 -> painted 30x30, hit area 44x44. The row is
                  46px tall (.pill padding 12+12 on 22px content), so 44
                  fits inside it and cannot reach the row above or below.
                  .pillActions gap goes 10 -> 14 so that 30 + 14 = 44:
                  adjacent hit areas tile exactly, edge to edge, with no
                  overlap. W / A / RPE / L-R are the four that live here.
     .pill sets overflow:hidden, so every expansion above is contained by
     the row on purpose rather than by luck. */
  .popX { min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .actionPill { position:relative; }
  .actionPill::before { content:''; position:absolute; inset:-7px 0; }
  .pillActions { gap:14px; }
  /* Every control in the row, one rule. The group is a flex row with a
     14px gap, so extending each child 7px on each side consumes exactly
     half the gap either way: adjacent hit areas meet edge to edge and
     never overlap. A tap between Hit it and Miss resolves to a logged set
     or a recorded failure, which is the worst ambiguity in the product,
     so this one is arithmetic rather than judgement.

     The height is fixed at 44 and centred, independent of each button's
     painted height — .pillHit paints 30, .pillMiss 27, .pillDrop 25.8 and
     .pillReset 31.2, and all four get the same target. .pillWarm keeps
     its 30x30 painted box and reaches 44x44 the same way. */
  .pillActions > button { position:relative; }
  .pillActions > button::before {
    content:''; position:absolute; left:-7px; right:-7px;
    top:50%; height:44px; transform:translateY(-50%);
  }
  .pillWarm { position:relative; width:30px; height:30px; }

  /* ---- states --------------------------------------------------------
     The switch had no hover at all. Disabled is added only where the tile
     can actually produce it: buttons already had treatments, and the
     coach input is disabled while a reply is in flight. .pillInput and
     .step are NEVER disabled by the tile — grep says so — and a rule for
     them would be decoration nothing can make fire. */
  .bouncyToggle:hover .bouncyTrack { border-color:var(--hair-strong); }
  .bouncyToggle:hover .bouncyThumb { transform:scale(1.06); }
  #moonbtn.on:hover .bouncyThumb { transform:translateX(20px) scale(1.06); }
  .cvInputRow input:disabled { opacity:.5; cursor:not-allowed; }
  .cvInputRow:has(input:disabled) { opacity:.7; }

  /* ---- the rest to 44 ------------------------------------------------
     Painted boxes unchanged; the hit area is padded out around them. Each
     expansion is sized against the gap it sits in, so nothing overlaps a
     neighbouring target:
       .step      stepper gap 14 -> 7 each side; 38+14 = 52 wide, 44 tall
       .chip      chipRow gap 8  -> 4 each side; 33.6 -> 44 tall
       .pbtn      43.4 -> 44, a block button with nothing beside it
       .freshbtn  31 -> 44 tall, full-width row
       .cvSend    40x36 -> 44x44, alone in .cvInputRow
       .pillReset / .pillDrop are inside .pillActions and already covered
       .bouncyToggle wraps a 46x26 track with no padding of its own
       .wcCheck / .wcX had no rules at all, in August or now */
  .step, .chip, .range button, .freshbtn, .cvSend, .bouncyToggle, .wcCheck, .wcX { position:relative; }
  .step::before   { content:''; position:absolute; left:-7px; right:-7px; top:50%; height:44px; transform:translateY(-50%); }
  .chip::before,
  .range button::before { content:''; position:absolute; left:-4px; right:-4px; top:50%; height:44px; transform:translateY(-50%); }
  .freshbtn::before { content:''; position:absolute; inset:-7px 0; }
  .cvSend { min-width:44px; min-height:44px; }
  .bouncyToggle::before { content:''; position:absolute; left:0; right:0; top:50%; height:44px; transform:translateY(-50%); }
  .pbtn { min-height:44px; }
  .wcAddBtn { min-height:44px; }

  /* ---- warm-up / cool-down checklist ---------------------------------
     RECOVERED, correcting a mistake. These were reported as "never
     styled, in August or now" and rewritten from scratch. August had all
     of them — .wcCheck at 21x21, .wcX at 16px, plus .wcItem, .wcTxt and
     the scribble that strikes a ticked item through. They were simply
     absent from every class list so far, so they were never extracted,
     and a measurement that could not find them in the contact sheet was
     read as confirmation. Invented rules replaced with the real ones. */
  .wcCheck { flex:none; width:21px; height:21px; border-radius:6px; border:1px solid var(--hair-strong); background:var(--e2); color:var(--signal); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform var(--d1) var(--spring), background var(--d2), border-color var(--d2); }
  .wcCheck:hover { transform:scale(1.08); border-color:var(--muted); }
  .wcCheck:active { transform:scale(.86); }
  .wcCheck.on { background:var(--signal); border-color:var(--signal); color:var(--signal-ink); }
  .wcX { flex:none; background:none; border:none; color:var(--muted); font-size:var(--fs-subhead); cursor:pointer; padding:2px 4px; transition:color var(--d2); line-height:var(--lh-subhead); font-weight:var(--fw-subhead); }
  .wcX:hover { color:var(--fail); }
  .wcSection { margin-top:16px; }
  .wcSection:empty { display:none; }
  .wcHead { width:100%; display:flex; align-items:center; gap:8px; background:var(--e2); border:1px solid var(--hair); border-radius:12px; padding:11px 14px; cursor:pointer; color:var(--muted-2); font:inherit; transition:border-color var(--d2), background var(--d2); }
  .wcHead:hover { border-color:var(--hair-strong); }
  .wcCaret { color:var(--signal); font-size:var(--fs-micro); width:10px; line-height:var(--lh-micro); font-weight:var(--fw-micro); letter-spacing:var(--ls-micro); }
  .wcTitle { font-size:var(--fs-label); font-weight:600; letter-spacing:.04em; color:var(--muted); line-height:var(--lh-label); }
  .wcCount { margin-left:auto; font-family:var(--mono); font-size:var(--fs-micro); color:var(--muted-2); line-height:var(--lh-micro); font-weight:var(--fw-micro); letter-spacing:var(--ls-micro); }
  .wcBody { display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--d4) var(--ease-momentum); }
  .wcBody.open { grid-template-rows:1fr; }
  .wcBodyInner { overflow:hidden; min-height:0; padding:14px 4px 2px; opacity:0; transition:opacity var(--d3) var(--ease-out); }
  .wcBody.open .wcBodyInner { opacity:1; transition-delay:.1s; }
  .wcItem { display:flex; align-items:center; gap:10px; padding:8px 2px; }
  .wcCheck:active { transform:scale(.86); }
  .wcCheckMark { width:12px; height:12px; flex:none; }
  .wcTxt { position:relative; flex:1; font-size:var(--fs-caption); color:var(--text); line-height:var(--lh-caption); font-weight:var(--fw-caption); }
  .wcTxt.done { color:var(--muted); }
  .wcScribble { position:absolute; left:-3px; right:-3px; top:52%; transform:translateY(-55%); height:12px; width:calc(100% + 6px); overflow:visible; pointer-events:none; }
  .wcScribblePath { stroke:var(--muted); }
  .wcAdd { display:flex; gap:8px; margin-top:8px; }

  /* 44 on both controls. The checklist is ticked mid-session; .wcItem
     has a 10px gap, so 5px each side keeps neighbouring targets from
     overlapping, and the height is pinned rather than added so the
     21x21 box and the 16px glyph both reach the same target. */
  .wcCheck, .wcX { position:relative; }
  .wcCheck::before, .wcX::before {
    content:''; position:absolute; left:-5px; right:-5px;
    top:50%; height:44px; transform:translateY(-50%);
  }

  /* ---- the field you tap to correct a prefill --------------------------
     It was 19.2px, which is worse than any button in the row, and it is
     edited on roughly two sets in five. A ::before cannot pad a void
     element, so it takes a real height: the input fills the row's inner
     box at 44.

     The row does not get taller for it. .pill's vertical padding drops
     from 12 to 4 and the height moves into the field, so the row goes
     from about 55 to 52 — slightly SHORTER than before, with a target
     more than twice the size. Every other control in the row is pinned at
     44 and centred, so all of them now fill the same inner box.

     Scoped to .pill, so drop rows keep their own smaller fields. Those
     are a secondary surface and are not sized here. */
  .pill .pillInput { height:44px; }

  /* ---- pass 1: elements that were rendering wrong ---------------------
     Sixty rules, recovered from 731e891. Every one of these classes was
     outside all the lists so far, so nothing had been extracted for them
     and they rendered as raw text or as white system controls on a dark
     ground: card meta running together as one string, the name welded to
     its info affordance, cue pills, muscle bands with no bar at all, the
     grip / eye / pin / overflow row, the whole card menu, the goal pill,
     the search field, and the celebration. */
  .menuPop button.deloadRow { justify-content:space-between; }
  .menuRowLabel { flex:1; }
  .exHead { display:flex; align-items:center; gap:9px; }
  .grip { flex:none; width:20px; height:26px; display:grid; place-items:center; color:rgba(255,255,255,.2); cursor:grab; touch-action:none; background:none; border:none; padding:0; }
  .grip:hover { color:var(--muted); }
  .grip.dragging { cursor:grabbing; }
  .grip svg { width:14px; height:14px; fill:currentColor; }
  .exEye { flex:none; display:inline-flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:var(--muted); width:26px; height:26px; transition:color var(--d2); }
  .exEye:hover { color:var(--signal); }
  .exEye svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; }
  .exName { font-family:var(--sans); font-weight:700; font-size:var(--fs-subhead); line-height:1.2; letter-spacing:-0.015em; color:var(--text); flex:1; min-width:0; border:none; background:none; text-align:left; cursor:pointer; padding:0; display:inline-flex; align-items:baseline; gap:7px; word-break:break-word; }
  .exName:hover .nameTxt { text-decoration:underline; text-decoration-color:rgba(110,231,183,.5); text-underline-offset:3px; }
  .exInfo { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; font-family:var(--sans); font-size:var(--fs-micro); font-weight:800; color:var(--signal); background:rgba(110,231,183,.06); border:1px solid rgba(110,231,183,.25); border-radius:50%; line-height:1; align-self:center; flex:none; letter-spacing:var(--ls-micro); }
  .pinBtn { flex:none; background:none; border:none; cursor:pointer; color:rgba(255,255,255,.2); font-size:var(--fs-subhead); line-height:1; padding:4px; transition:color var(--d2), transform var(--d1) var(--spring); font-weight:var(--fw-subhead); }
  .pinBtn:hover { color:var(--muted); }
  .pinBtn:active { transform:scale(.85); }
  .pinBtn.on { color:var(--gold); }
  .menuBtn { flex:none; background:none; border:none; cursor:pointer; color:var(--muted); padding:5px 6px; border-radius:8px; transition:color var(--d2), background var(--d2), transform var(--d1) var(--spring); }
  .menuBtn:hover { color:var(--text); background:var(--e3); }
  .menuBtn:active { transform:scale(.88); }
  .menuBtn svg { width:18px; height:18px; fill:currentColor; }
  .exMeta { font-family:var(--mono); font-size:var(--fs-micro); font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding-left:29px; margin-top:11px; line-height:var(--lh-micro); }
  .metaSep { opacity:.4; }
  .exNote { padding-left:29px; margin-top:9px; font-size:var(--fs-caption); color:var(--muted-2); display:flex; gap:7px; align-items:baseline; line-height:var(--lh-caption); font-weight:var(--fw-caption); }
  .exNote .ndot { color:var(--signal); }
  .deloadTag { color:var(--muted-2); border:1px solid var(--hair-strong); border-radius:4px; padding:1px 6px; font-size:var(--fs-micro); letter-spacing:.1em; line-height:var(--lh-micro); font-weight:var(--fw-micro); }
  .groupTag { color:var(--signal); border:1px solid rgba(110,231,183,.3); border-radius:4px; padding:1px 6px; font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; line-height:var(--lh-micro); font-weight:var(--fw-micro); }
  .goalPill { width:100%; text-align:left; background:var(--e2); border:1px solid var(--hair); color:var(--text); border-radius:var(--r-md); padding:15px 16px; font-family:var(--sans); font-size:var(--fs-body); font-weight:500; cursor:pointer; transition:border-color var(--d2), background var(--d2); line-height:var(--lh-body); }
  .goalPill:hover { border-color:rgba(110,231,183,.35); background:rgba(110,231,183,.03); }
  .goalPill.empty { color:var(--muted); font-weight:400; }
  .muscleBars { display:flex; flex-direction:column; gap:11px; padding:4px 2px; }
  .mbRow { display:flex; align-items:center; gap:10px; }
  .mbLbl { width:88px; flex:none; font-size:var(--fs-label); color:var(--muted-2); text-transform:capitalize; line-height:var(--lh-label); font-weight:var(--fw-label); }
  .mbTrack { flex:1; height:9px; border-radius:999px; background:rgba(255,255,255,.05); overflow:hidden; }
  .mbFill { height:100%; background:linear-gradient(90deg, var(--signal), var(--signal-bright)); border-radius:999px; transition:width var(--d5) var(--ease-out); }
  .mbVal { width:56px; flex:none; text-align:right; font-family:var(--mono); font-size:var(--fs-micro); color:var(--muted); line-height:var(--lh-micro); font-weight:var(--fw-micro); letter-spacing:var(--ls-micro); }
  .formMuscles { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px; font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; line-height:var(--lh-micro); font-weight:var(--fw-micro); }
  .formMuscles .primary { color:var(--signal); }
  .formMuscles .secondary { color:var(--muted-2); }
  .formCues { display:flex; gap:9px; flex-wrap:wrap; margin-top:20px; }
  .cuePill { border:1px solid var(--hair-strong); border-radius:999px; padding:8px 15px; color:var(--muted-2); font-size:var(--fs-caption); line-height:var(--lh-caption); font-weight:var(--fw-caption); }
  .searchRow { display:flex; align-items:center; gap:10px; border:1px solid var(--hair-strong); border-radius:12px; padding:11px 13px; background:var(--e1); }
  .searchRow svg { width:16px; height:16px; fill:none; stroke:var(--muted); stroke-width:1.6; flex:none; }
  .searchRow input { flex:1; background:none; border:none; outline:none; color:var(--text); font:inherit; font-size:var(--fs-body); line-height:var(--lh-body); font-weight:var(--fw-body); }
  .menuPop { position:absolute; z-index:70; min-width:184px; background:var(--e3); border:1px solid var(--hair-strong); border-radius:13px; padding:6px; box-shadow:0 18px 50px rgba(0,0,0,.6); transform-origin:top right; opacity:0; filter:blur(10px); transform:translateY(-5px) scale(.95); animation:menuDrop .5s var(--spring) forwards; }
  .menuPop button { display:flex; align-items:center; gap:11px; width:100%; background:none; border:none; color:var(--text); font:inherit; font-size:var(--fs-body); padding:11px 12px; border-radius:9px; cursor:pointer; text-align:left; transition:background var(--d2), transform var(--d1) var(--spring); animation:menuItemIn .4s var(--ease-out) backwards; line-height:var(--lh-body); font-weight:var(--fw-body); }
  .menuPop button:hover { background:var(--e4); }
  .menuPop button:active { transform:scale(.96); }
  .menuPop button svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .menuPop .sep { height:1px; background:var(--hair); margin:4px 2px; }
  .celebrate { position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.8); opacity:0; pointer-events:none; transition:opacity var(--d3); padding:24px; }
  .celebrate.on { opacity:1; pointer-events:auto; }
  .celebrate .burst { text-align:center; max-width:360px; transform:scale(.7); transition:transform var(--d4) var(--spring); }
  .celebrate.on .burst { transform:scale(1); }
  .celebrate .bstar { width:70px; height:70px; margin:0 auto; }
  .celebrate .bstar svg { width:100%; height:100%; fill:var(--gold); filter:drop-shadow(0 0 22px rgba(245,166,35,.5)); }
  .celebrate .ch1 { font-family:var(--sans); font-weight:800; font-size:var(--fs-hero); letter-spacing:-0.015em; margin-top:16px; color:var(--gold); line-height:var(--lh-hero); }
  .celebrate .ch2 { font-size:var(--fs-body); font-weight:500; margin-top:10px; line-height:1.55; }
  .celebrate .ch2 .goal { color:var(--gold); font-weight:700; }
  .celebrate .tap { color:var(--muted); font-size:var(--fs-label); margin-top:20px; line-height:var(--lh-label); font-weight:var(--fw-label); }

  /* .coachFab was one of the 13 selectors the stylesheet restoration
     deliberately deferred (see docs/plans/coach-overlay.md) — but its
     markup stayed live, unstyled, in normal flow. With no CSS at all,
     it rendered position:static at its canvas's backing-store size
     (makeConstellation's resize() sets canvas.width/height from a
     devicePixelRatio-scaled backing store with no CSS width/height to
     constrain it back down), widening the page's own content box past
     the viewport. This is a minimal, position/size-only fix to stop
     that — NOT the full visual treatment coach-overlay.md specs out,
     which is still open and still deferred. */
  .coachFab { position:fixed; right:calc(16px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom)); width:56px; height:56px; padding:0; border:1px solid var(--hair-strong); border-radius:var(--r-pill); background:var(--e3); box-shadow:0 14px 30px -14px rgba(0,0,0,.6); z-index:50; cursor:pointer; }
  #coachFabCanvas { display:block; width:56px; height:56px; }

  /* keyframes the card menu animates */
  @keyframes menuDrop { to { opacity:1; filter:blur(0px); transform:translateY(0) scale(1); } }
  @keyframes menuItemIn { from { opacity:0; filter:blur(8px); transform:translateX(8px) scale(.96); } }

  /* ---- pass 1: the rest ------------------------------------------------
     Nothing here had an August version to recover; these classes were all
     added after the deletion. */

  /* The most recent point is the one being read; the rest are context. */
  .sPoint:last-of-type { width:7px; height:7px; margin:-3px 0 0 -3px; opacity:1; }

  /* The tick was painted whether or not the item was ticked, so every
     checklist row read as done and the header's count disagreed with what
     was on screen. The count was right. */
  .wcCheck .wcCheckMark { opacity:0; transform:scale(.7); transition:opacity var(--d1) var(--ease-out), transform var(--d1) var(--spring); }
  .wcCheck.on .wcCheckMark { opacity:1; transform:scale(1); }

  /* The strike ran the full width of the row because .wcTxt is flex:1 and
     the scribble is 100% of it. The text shrinks to its own width now and
     the remove button is pushed over by a margin instead. */
  .wcTxt { flex:0 1 auto; margin-right:auto; }
  .wcX { margin-left:0; }

  /* A logged set's fields are fixed, and looked exactly like editable
     ones. Not colour alone: the value dims AND the field loses its
     interactive affordances. */
  .pillInput:disabled { opacity:.55; cursor:default; -webkit-text-fill-color:currentColor; }
  .pill.done .pillInput:disabled, .pill.failed .pillInput:disabled { opacity:.7; }

  /* A disabled Save kept the signal fill and still read as the thing to
     press. Disabled loses the fill entirely: border only, muted text. */
  .pbtn:disabled, .pbtn.save:disabled {
    background:none; border-color:var(--hair-strong); color:var(--muted-2);
    box-shadow:none; opacity:1; cursor:default;
  }

  /* The switch has to survive greyscale, so position does the work and
     colour only reinforces it: the track changes weight as well as hue,
     and the thumb moves the full width of it. */
  .bouncyTrack { border:1px solid var(--hair); }
  #moonbtn.on .bouncyTrack, .deloadRow.on .bouncyTrack { border-width:2px; }
  #moonbtn .bouncyThumb, .deloadRow .bouncyThumb { box-shadow:0 2px 6px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.18); }

  /* ====================================================================
     RECOVERED — the frame, lifted from 731e891 with three documented
     deviations from the byte-for-byte rule the nine primitives above
     followed.

     .shell's padding is var(--sp5), not the original var(--sp4) — sp5 is
     the documented page gutter and sp4 is card padding; the August rule
     used sp4 because the token ladder hadn't been named yet.

     .wordmark, .railDate and .railStatLbl shipped at 10px, 10.5px and
     9.5px. All three are below the type ramp's documented 11px floor, so
     they round up to var(--fs-micro) instead of porting the raw number.

     .railStatVal.lit's text-shadow glow is dropped entirely, matching
     the box-shadow glow removed everywhere else in this file — see
     tests/tools/hierarchy.test.ts, "the glow is gone".

     .daytitle keeps its original 39px, formalised as --fs-giant at
     :root instead of shrunk to fit inside --fs-hero. See the comment on
     that token for why.

     position:sticky on .rail was verified against the actual host
     nesting before this section was written, not assumed: the tile is
     an iframe pinned to a bounded, overflow:hidden stage inside a fixed
     full-screen overlay (app/app/DashboardGrid.tsx, .openFrame /
     .openStage in components/veeTiles.css), so the tile's own document
     owns its scroll and sticky resolves inside it.

     tests/tools/recovered-primitives.test.ts, "the frame came back"
     onward, holds all four deviations to account.
     ================================================================= */
  .shell { width:100%; max-width:600px; margin:0 auto; padding:0 var(--sp5); }

  .trainBar { display:flex; align-items:center; justify-content:space-between; }
  .wordmark { font-family:var(--mono); font-size:var(--fs-micro); font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
  .wordmark .wmDot { color:var(--hair-strong); margin:0 1px; }
  .wordmark #sessionNum { color:var(--text); }

  .rail { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:var(--sp4); padding:calc(10px + env(safe-area-inset-top)) var(--sp5) 10px; background:linear-gradient(180deg, rgba(3,3,4,.92) 60%, rgba(3,3,4,0)); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .railDate { font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .railDivider { width:1px; height:14px; background:var(--hair-strong); flex:none; }
  .railStat { display:flex; align-items:baseline; gap:5px; flex:none; }
  .railStatVal { font-family:var(--mono); font-size:var(--fs-caption); font-weight:600; color:var(--text); letter-spacing:-0.01em; }
  .railStatVal.lit { color:var(--signal); }
  .railStatLbl { font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); }
  .railSpacer { flex:1; }

  .daydots { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:7px; margin-top:16px; min-height:8px; }
  .daydots .dd { width:6px; height:6px; border-radius:2px; border:1.5px solid var(--e4); transition:background var(--d2), border-color var(--d2); }
  .daydots .dd.done { background:var(--signal); border-color:var(--signal); }
  .daydots .dd.pr { background:var(--gold); border-color:var(--gold); }
  .daydots .dd.miss { border-color:var(--fail); }

  .daytitle { font-family:var(--sans); font-weight:var(--fw-giant); font-size:var(--fs-giant); line-height:var(--lh-giant); letter-spacing:var(--ls-giant); }

  @media (max-width:480px) {
    .rail { padding-left:var(--sp4); padding-right:var(--sp4); }
    .daytitle { font-size:var(--fs-hero); }
  }

  /* ====================================================================

     kind of deviation as the frame: sub-floor and near-miss sizes round
     to the nearest ramp token (.fanLabel, .fanCard .c, .photoDate,
     .photoNote, .photoNote.muted), and every size that already equalled

     Nothing here is a new colour decision.

  .fanWrap { position:relative; width:100%; height:192px; }

  .fanArrow { width:32px; height:32px; flex:none; border-radius:50%; border:2px solid var(--hair-strong); border-bottom-width:4px; transform-origin:bottom; background:var(--e2); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:color var(--d2) var(--ease-out), border-color var(--d2) var(--ease-out), transform var(--d1) var(--spring), border-bottom-width var(--d1) var(--spring); }
  .fanDots { display:flex; align-items:center; gap:5px; }

  .fanLabel.low { fill:var(--muted-2); }
  .fanCard { position:absolute; z-index:4; pointer-events:none; width:114px; background:var(--e3); border:1px solid var(--hair-strong); border-radius:var(--r-sm); padding:7px 10px; box-shadow:0 14px 30px -14px rgba(0,0,0,.6); opacity:0; }

  .photoImg { width:100%; height:100%; object-fit:cover; display:block; background:var(--e3); }

  .photoNote { padding:6px 10px 0; font-size:var(--fs-caption); color:var(--text); line-height:1.55; max-width:340px; margin:0 auto; }
