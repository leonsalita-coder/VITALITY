  for(let v=lo;v<=hi;v+=step){ svgs+='<line class="grid" x1="'+PADL+'" y1="'+Y(v)+'" x2="'+gridEndX+'" y2="'+Y(v)+'"/><text class="axis-label" x="'+(PADL-10)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'; }
  const pts=list.map(s=>X(s.date)+','+Y(s.kg));

  list.forEach((s,i)=> svgs+='<circle class="dot" style="--i:'+i+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="4.5"/>');
  svgs+='<text class="xlab" x="'+PADL+'" y="'+(VB_H-6)+'" text-anchor="start">'+fmtDate(list[0].date)+'</text><text class="xlab" x="'+(HIST_W-PADR)+'" y="'+(VB_H-6)+'" text-anchor="end">today</text>';
  if(fan){
    const anchorX=X(list[list.length-1].date), anchorY=Y(list[list.length-1].kg), fanEndX=VB_W-FAN_LABEL_W;
    svgs+='<g class="fanGroup">';
    fan.bands.forEach(b=>{
      const ty=Y(b.val), cx=anchorX+(fanEndX-anchorX)*0.5, cy=anchorY+(ty-anchorY)*0.2;
      const d='M'+anchorX+','+anchorY+' Q'+cx+','+cy+' '+fanEndX+','+ty;
      svgs+='<path class="fanHit" d="'+d+'" data-val="'+b.val+'" data-label="'+b.label+'" data-cls="'+b.key+'"/>';
      svgs+='<path class="fan '+b.key+'" d="'+d+'"/>';
    });
    /* labels can crowd when the trend is shallow — decouple label Y from dot Y
       and declutter top-to-bottom, since bands are already high→low sorted */
    const MIN_GAP=10;
    const labelYs=fan.bands.map(b=>Y(b.val));
    for(let i=1;i<labelYs.length;i++){ if(labelYs[i]-labelYs[i-1]<MIN_GAP) labelYs[i]=labelYs[i-1]+MIN_GAP; }
    const maxLabelY=VB_H-PADB-2;
    if(labelYs[labelYs.length-1]>maxLabelY){ const over=labelYs[labelYs.length-1]-maxLabelY; for(let i=0;i<labelYs.length;i++) labelYs[i]-=over; }
    fan.bands.forEach((b,i)=>{
      const ty=Y(b.val);
      svgs+='<circle class="fanDot '+b.key+'" cx="'+fanEndX+'" cy="'+ty+'" r="3.4" data-val="'+b.val+'" data-label="'+b.label+'" data-cls="'+b.key+'"/>';
      svgs+='<text class="fanLabel '+b.key+'" x="'+(fanEndX+7)+'" y="'+(labelYs[i]+3)+'">'+Math.round(b.val)+'</text>';
    });
    svgs+='<text class="xlab" x="'+fanEndX+'" y="'+(VB_H-6)+'" text-anchor="end">≈'+fan.horizon+'d</text></g>';
  }
  svgs+='</svg>';
  plot.innerHTML=svgs+(fan?'<div class="fanCard" id="fanCard"><div class="v" id="fanCardV"></div><div class="c" id="fanCardC"></div></div>':'');
  if(fan){
    const card=plot.querySelector('#fanCard'), cv=plot.querySelector('#fanCardV'), cc=plot.querySelector('#fanCardC');
    plot.querySelectorAll('[data-cls]').forEach(t=>{
      const show=()=>{
        cv.textContent=t.dataset.val+' '+STATE.unit;
        cv.style.color=t.dataset.cls==='high'?'var(--gold)':t.dataset.cls==='low'?'var(--muted-2)':'var(--signal)';
        cc.textContent=t.dataset.label+' · in ~'+fan.horizon+'d';
        const rect=plot.getBoundingClientRect();
        const px=(parseFloat(t.getAttribute('cx')||(VB_W-FAN_LABEL_W))/VB_W)*rect.width;
        const py=(parseFloat(t.getAttribute('cy')||Y(+t.dataset.val))/VB_H)*rect.height;
        card.style.left=Math.max(4,px-124)+'px';

const CAL_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CAL_WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let calPage=null; // {year, q} — the quarter currently on screen
function calQuarterOf(d){ return { year:d.getFullYear(), q:Math.floor(d.getMonth()/3) }; }
function calAddQuarters(p, delta){ let q=p.q+delta, year=p.year; while(q<0){ q+=4; year--; } while(q>3){ q-=4; year++; } return {year,q}; }
function calKey(p){ return p.year*4+p.q; }
function calBounds(){
  const latest=calQuarterOf(new Date());
  const dates=STATE.finishedDates||[];
  let earliest=latest;
  if(dates.length){ const [y,m]=dates.slice().sort()[0].split('-').map(Number); earliest=calQuarterOf(new Date(y,m-1,1)); }
  return {earliest, latest};
}
function calCanGo(delta){ const {earliest,latest}=calBounds(); const t=calAddQuarters(calPage,delta); return calKey(t)>=calKey(earliest) && calKey(t)<=calKey(latest); }
/* one quarter's week-columns, Sunday-aligned, padded outside the quarter's
   own date range so the grid always starts/ends on a full week. */
function calQuarterCells(page, volByDate){
  const first=new Date(page.year, page.q*3, 1);
  const last=new Date(page.year, page.q*3+3, 0);
  const start=new Date(first); start.setDate(start.getDate()-start.getDay());
  const end=new Date(last); end.setDate(end.getDate()+(6-end.getDay()));
  const weeks=[]; const monthMarks=[]; let lastMonth=-1; let w=0;
  const cursor=new Date(start);
  while(cursor<=end){
    const col=[];
    for(let d=0; d<7; d++){
      const key=ymd(cursor);
      const inRange = cursor>=first && cursor<=last;
      if(inRange && cursor.getMonth()!==lastMonth){ lastMonth=cursor.getMonth(); monthMarks[w]=CAL_MONTHS[lastMonth]; }
      col.push({key, inRange, vol:volByDate[key]||0, date:new Date(cursor)});
      cursor.setDate(cursor.getDate()+1);
    }
    weeks.push(col); w++;
  }
  return {weeks, monthMarks, first, last};
}
/* weekly-summed, then cumulative — the quarter's own "growth of volume"
   curve, drawn from the same weeks sitting in the grid next to it. */
function calQuarterStats(page, volByDate){
  const {weeks}=calQuarterCells(page, volByDate);
  const weekSums=weeks.map(col=> col.reduce((a,c)=> a+(c.inRange?c.vol:0), 0));
  let acc=0; const curve=weekSums.map(v=>{ acc+=v; return acc; });
  return { total:acc, curve };
}
function calSparkPath(curve, W, H){
  const lo=Math.min(0,...curve), hi=Math.max(1,...curve), span=(hi-lo)||1;
  const px=i=> 3+(i/Math.max(1,curve.length-1))*(W-6);
  const py=v=> 4+(1-(v-lo)/span)*(H-8);
  return curve.map((v,i)=>(i===0?'M':'L')+px(i).toFixed(1)+','+py(v).toFixed(1)).join(' ');
}
/* ---- THE HEATMAP — docs/plans/heatmap.md, first slice ---------------
   Grid shell only: 7-column portrait grid, weeks running down, coloured
   by session volume. No marks, no layers, no interaction, no zoom — all
   of that is later slices per the spec. Reuses aggregateVolumeByDate()
   (already used by the .cal family above) — no new engine surface. */
const HM_MIN_TRAINED_DAYS=5;
/* 53 weeks trailing, fixed — not data extent. The first version used the
   athlete's own earliest trained date as the start, which meant a fresh
   or lightly-used account rendered as a single, non-scrolling week: a
   heatmap that only becomes a heatmap once enough history accumulates,
   which defeats the point of a heatmap. 53 was never a new number here
   — it's decision 1's own reasoning restated: the landscape rejection
   compared a 53-column year against 42px portrait cells, so the
   intended SCOPE was always about a year; only the orientation changed.
   At 42px cells + 4px gaps (46px pitch), 53 rows is ~2438px — roughly
   4.8 screens of scroll at the .hmBody 60vh cap on a typical phone
   viewport — long enough to read as a real, pattern-revealing year
   rather than a memorized week, without rendering multiple years of
   empty cells for a fresh account. Every cell in the window is real —
   a quiet year is drawn honestly (all rest/no-data cells), not hidden;
   "silence is a state" applies to the WHOLE grid the same way it
   applies to one cell. */
const HM_WINDOW_WEEKS=53;
/* Bucketing: quartiles of the athlete's OWN trained-day volumes, over
   ALL-TIME history — not the visible range, and not a fixed absolute
   threshold. All-time (not per-window) so a cell's colour doesn't shift
   as more weeks scroll into view, matching §1's own complaint about the
   old calendar's per-quarter reset. Per-athlete (not a fixed kg cutoff)
   because absolute volume means nothing across athletes of different
   strength levels — the same "wrong model" problem §1 names for raw
   tonnage, just resurfacing at the threshold level instead of the fill
   level if left fixed. Below HM_MIN_TRAINED_DAYS distinct trained days,
   quartiles are not yet meaningful — everything logged gets ONE flat
   tone (l2) rather than differentiating: a beginner's first three
   sessions should not spread across "faint" and "darkest" purely because
   there were only three numbers to rank, which is what naive quantiling
   over a tiny sample would do. */
function heatmapVolumeLevels(){
  const volByDate=aggregateVolumeByDate();
  const map={}; volByDate.forEach(d=>{ map[d.date]=d.kg; });
  const trained=volByDate.map(d=>d.kg).filter(v=>v>0).sort((a,b)=>a-b);
  if(trained.length<HM_MIN_TRAINED_DAYS) return { map, thresholds:null };
  const q=p=> trained[Math.min(trained.length-1, Math.floor(p*trained.length))];
  return { map, thresholds:{ p25:q(0.25), p50:q(0.5), p75:q(0.75) } };
}
function heatmapLevelFor(vol, thresholds){
  if(!(vol>0)) return 0; // rest / no data — drawn, not dimmed
  if(!thresholds) return 2; // not enough trained days yet to bucket meaningfully
  if(vol<=thresholds.p25) return 1;
  if(vol<=thresholds.p50) return 2;
  if(vol<=thresholds.p75) return 3;
  return 4;
}
/* A planned day with nothing logged — genuinely derivable, not invented.
   STATE.routineDays (lib/train/routine.ts's RoutineAssignment) maps a
   weekday (0=Sunday) to a routine id; absent means a free day, per that
   file's own doc comment. A day is "missed" only when its weekday HAS an
   assignment and nothing was logged — an unassigned weekday is a free
   day, exactly like today's rest treatment, never struck. Today itself
   is excluded: the day isn't over, so "missed" isn't a true statement
   about it yet. */
function heatmapMissedDates(map, dates){
  const routineDays=STATE.routineDays||{};
  const planned=new Set();
  dates.forEach(key=>{
    if(key===today) return;
    if(map[key]) return; // something was logged — not missed, whatever it was
    const [y,m,d]=key.split('-').map(Number);
    const weekday=new Date(y,m-1,d).getDay();
    if(routineDays[weekday]) planned.add(key);
  });
  return planned;
}
/* Every date carrying a record, driven from the SAME classifyPR the live
   session's PR badge already uses (train.html:7272's prFor) — not a
   second record definition. Walked historically: for each exercise, each
   logged entry, each of that entry's OWN sets is offered to classifyPR
   against the history UP TO AND INCLUDING that date (classifyPR excludes
   the date itself internally via excludeDate, the same way a live
   candidate excludes today) — so "was this a record AS OF that day"
   reuses the exact comparison a live entry gets, just evaluated at a
   historical `now` instead of the real one. */
function heatmapPrDates(){
  const prDays=new Set();
  Object.keys(STATE.history||{}).forEach(id=>{
    const full=(STATE.history[id]||[]).filter(x=>!x.off).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(!full.length) return;
    const exLike={id};
    const e1rmValid=e1rmValidFor(exLike);
    const kind=kindFor(exLike);
    const assistedFlag=flagFor(exLike,'assisted');
    full.forEach((entry,i)=>{
      if(prDays.has(entry.date)) return; // already marked from another exercise this same day
      const historyUpToHere=full.slice(0,i+1);
      const [y,m,d]=entry.date.split('-').map(Number);
      const now=new Date(y,m-1,d,12).getTime();
      (entry.sets||[]).some(set=>{
        const candidate={
          kind: set.kind||kind, weight:set.w, reps:set.r, seconds:set.s, metres:set.m,
          assisted: set.assisted||assistedFlag, warmup:set.warmup, fail:set.fail, e1rmValid,
        };
        const result=TrainEngine.classifyPR(historyUpToHere, candidate, now);
        if(result.kind!==null){ prDays.add(entry.date); return true; }
        return false;
      });
    });
  });
  return prDays;
}
function renderHeatmap(){
  const plot=$('#statsPlot'), cap=$('#statsCap');
  plot.style.aspectRatio='auto';
  cap.textContent='';
  const {map, thresholds}=heatmapVolumeLevels();
  const [ty,tm,td]=today.split('-').map(Number);
  const end=new Date(ty,tm-1,td); // today, local midnight — the window's own hard edge
  const weekStart=new Date(end); weekStart.setDate(weekStart.getDate()-weekStart.getDay());
  const start=new Date(weekStart); start.setDate(start.getDate()-7*(HM_WINDOW_WEEKS-1));
  /* Stops AT today, not at the end of today's week. A CSS grid with
     fewer than 7 items in its last row simply leaves the remaining
     tracks empty — no placeholder cells needed for a short last row —
     so the loop can end at `end` directly rather than padding forward
     and having to mark the padding as non-interactive after the fact. */
  const keys=[]; const cursor=new Date(start);
  while(cursor<=end){ keys.push(ymd(cursor)); cursor.setDate(cursor.getDate()+1); }
  const missedDates=heatmapMissedDates(map, keys);
  const prDates=heatmapPrDates();
  const cells=keys.map(key=>({
    key, level: heatmapLevelFor(map[key]||0, thresholds),
    isToday: key===today, missed: missedDates.has(key), record: prDates.has(key),
  }));
  const head=CAL_WD.map(w=>'<div class="hmWd">'+w+'</div>').join('');
  const body=cells.map(c=>
    '<div class="hmCell'+(c.level?' l'+c.level:'')+(c.isToday?' today':'')+(c.missed?' missed':'')+'" data-vol="'+(map[c.key]||0)+'">'
    + '<button class="hmHit" data-date="'+c.key+'" aria-label="'+fmtDate(c.key)+(c.record?', record':'')+'"></button>'
    + (c.record?'<span class="hmRecord" data-vol="'+(map[c.key]||0)+'"></span>':'')
    + '</div>'
  ).join('');
  const legend='<div class="hmLegend">Less'
    + '<span class="hmCell hmLegendSwatch"></span><span class="hmCell l1 hmLegendSwatch"></span>'
    + '<span class="hmCell l2 hmLegendSwatch"></span><span class="hmCell l3 hmLegendSwatch"></span>'
    + '<span class="hmCell l4 hmLegendSwatch"></span>More'
    + '<span class="hmLegendGap"></span><span class="hmCell missed hmLegendSwatch"></span>Missed'
    + '<span class="hmLegendGap"></span><span class="hmCell l2 hmLegendSwatch"><span class="hmRecord" data-vol="1"></span></span>Record</div>';
  plot.innerHTML='<div class="hmHead">'+head+'</div><div class="hmBody">'+body+'</div>'+legend;
}
function drawSessionsCal(){
  const plot=$('#statsPlot'), cap=$('#statsCap');
  plot.style.aspectRatio='auto';
  if(!calPage) calPage=calBounds().latest;
  plot.innerHTML =
      '<div class="calShell">'
        + '<button class="fanArrow calArrow" data-dir="left" aria-label="Previous quarter">'+FAN_CHEV_L+'</button>'
        + '<div class="calBody"><div class="calHead" id="calTitle"></div>'
          + '<div class="calGridRow">'
            + '<div class="calDayLbls"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>'
            + '<div class="calMain"><div class="calMonths" id="calMonths"></div><div class="cal" id="calCells"></div></div>'
            + '<div class="calTotal" id="calTotal"></div>'
          + '</div>'
        + '</div>'
        + '<button class="fanArrow calArrow" data-dir="right" aria-label="Next quarter">'+FAN_CHEV_R+'</button>'
      + '</div>'
      + '<div class="calLegend">Less<i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>More</div>'
      + '<div class="wdBars" id="calWdBars"></div>';
  plot.querySelectorAll('.calArrow').forEach(b=> b.onclick=()=>{
    const delta=b.dataset.dir==='right'?1:-1;
    if(!calCanGo(delta)) return;
    calPage=calAddQuarters(calPage, delta);
    renderCalQuarter();
  });
  renderCalQuarter();
  cap.textContent='';
  const streak=currentStreak();
  $('#statsRow').innerHTML='<div class="stat"><div class="k">Week streak</div><div class="v'+(streak>0?' gold':'')+'">'+streak+'</div></div><div class="stat"><div class="k">Total sessions</div><div class="v">'+(STATE.finishedDates||[]).length+'</div></div><div class="stat"><div class="k">Lifts tracked</div><div class="v">'+Object.keys(STATE.exerciseNames||{}).length+'</div></div>';
}
function renderCalQuarter(){
  const plot=$('#statsPlot'); if(!plot || plot.querySelector('#calTitle')===null) return;
  const volByDate={}; aggregateVolumeByDate().forEach(s=>{ volByDate[s.date]=s.kg; });
  const set=new Set(STATE.finishedDates||[]);
  const {weeks, monthMarks, first, last}=calQuarterCells(calPage, volByDate);
  const maxVol=Math.max(1,...weeks.flat().filter(c=>c.inRange).map(c=>c.vol));
  const level=v=> v<=0?0:Math.min(4,Math.ceil(v/maxVol*4));

  $('#calTitle').innerHTML='<span class="calTitle">Q'+(calPage.q+1)+' '+calPage.year+' <b>· '+CAL_MONTHS[calPage.q*3]+'–'+CAL_MONTHS[calPage.q*3+2]+'</b></span>';
  $('#calMonths').style.gridTemplateColumns='repeat('+weeks.length+',13px)';
  $('#calMonths').innerHTML=weeks.map((_,w)=>'<span>'+(monthMarks[w]||'')+'</span>').join('');

  const calCells=$('#calCells');
  calCells.style.gridTemplateColumns='repeat('+weeks.length+',13px)';
  calCells.innerHTML=weeks.flat().map((c,i)=>{
    const w=Math.floor(i/7), d=i%7;
    const delay=(w*22+d*8);
    if(!c.inRange) return '<span class="cd pad"></span>';
    const label = c.vol? Math.round(c.vol)+' '+STATE.unit : (set.has(c.key)?'trained':'rest');
    return '<span class="cd l'+level(c.vol)+'" data-date="'+c.key+'" data-label="'+label+'" style="animation-delay:'+delay+'ms"></span>';
  }).join('');

  const calGrid=calCells;
  const titleEl=$('#calTitle');
  const baseTitle=titleEl.innerHTML;
  calCells.onpointerover=ev=>{
    const cell=ev.target.closest('.cd:not(.pad)'); if(!cell) return;
    calGrid.classList.add('hot');
    calGrid.querySelectorAll('.hotcell').forEach(x=>x.classList.remove('hotcell'));
    cell.classList.add('hotcell');
    titleEl.innerHTML='<span class="calTitle">'+fmtDate(cell.dataset.date)+' <span class="hv">· '+cell.dataset.label+'</span></span>';
  };
  calCells.onpointerleave=()=>{ calGrid.classList.remove('hot'); titleEl.innerHTML=baseTitle; };

  // quarter-total — a little growth-of-volume graph, hover to unfold, same shape on every page
  const {total, curve}=calQuarterStats(calPage, volByDate);
  const ctEl=$('#calTotal');
  /* .ctNum was unconditionally signal-coloured (.calTotal .ctNum in CSS)
     — the same shape as the eleven other zero-value sites, found by the
     computed-colour guard rather than the earlier source-shape lint,
     since this one's colour came from a bare CSS rule too. */
  ctEl.innerHTML='<div class="ctNum'+(total>0?' mint':'')+'">'+(total>=1000?(total/1000).toFixed(1)+'k':Math.round(total))+'</div><div class="ctLbl">'+STATE.unit+'</div>'
    + '<div class="calPop" id="calPop"><div class="cpCap">growth this quarter</div><svg width="112" height="38"><path d="'+calSparkPath(curve,112,38)+'" fill="none" stroke="var(--signal)" stroke-width="1.4"/></svg></div>';
  const pop=$('#calPop');
  ctEl.onpointerenter=()=>{ ctEl.classList.add('hot'); if(pop) pop.classList.add('on'); };
  ctEl.onpointerleave=()=>{ ctEl.classList.remove('hot'); if(pop) pop.classList.remove('on'); };

  // weekday distribution, scoped to this quarter only
  const inQuarterDates=[...set].filter(k=>{ const [y,m,d]=k.split('-').map(Number); const dt=new Date(y,m-1,d); return dt>=first && dt<=last; });
  const counts=[0,0,0,0,0,0,0];
  inQuarterDates.forEach(k=>{ const [y,m,d]=k.split('-').map(Number); counts[new Date(y,m-1,d).getDay()]++; });
  const maxC=Math.max(...counts,1);
  $('#calWdBars').innerHTML=counts.map((c,i)=>'<div class="wdBar"><div class="wdTrack"><div class="wdFill" data-h="'+Math.max(3,Math.round(c/maxC*100))+'" style="height:0%"></div></div><span class="wdLbl">'+CAL_WD[i]+'</span></div>').join('');
  growBars($('#calWdBars'));

  document.querySelectorAll('.calArrow').forEach(b=>{
    const delta=b.dataset.dir==='right'?1:-1;
    b.classList.toggle('dis', !calCanGo(delta));
  });
}

/* ---- reveal: the lower sheets (goal / photos / stats) fade up as they
   scroll into view. The tile's own iframe IS the real scrolling viewport
   here (the host sizes it to a fixed box, .openStage{overflow:hidden} +
   .openFrame{position:absolute;inset:0} — the dashboard never auto-grows
   it to content), so IntersectionObserver's default root is exactly right.
   Each fires once and stays revealed — re-hiding on scroll-back-up reads
   as flicker, not polish. */
function wireReveal(){
  const els=[...document.querySelectorAll('.reveal')];
  if(!els.length) return;
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced || !('IntersectionObserver' in window)){ els.forEach(el=>el.classList.add('in')); return; }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold:0.1, rootMargin:'0px 0px -30px 0px' });
  els.forEach(el=>io.observe(el));
}

/* ---- cursor-reactive card light: one delegated listener per container,
   so it survives re-renders without needing to be rewired each time ---- */
function wireCardGlow(container, selector){
  if(!container) return;
  container.addEventListener('pointermove', ev=>{
    const card = ev.target.closest(selector);
    if(!card || !container.contains(card)) return;
    const r=card.getBoundingClientRect();
    card.style.setProperty('--mx', ((ev.clientX-r.left)/r.width*100)+'%');
    card.style.setProperty('--my', ((ev.clientY-r.top)/r.height*100)+'%');
  });
}

/* ====================================================================
   CONSTELLATION — a small living node-graph, rendered on <canvas>. This
   is the one visual idea behind both the ambient backdrop and the AI:
   a handful of points connected by light, breathing at rest, routing a
   traveling pulse when "thinking." No external assets — hand-rolled,
   ~80 lines, runs in the sealed sandboxed tile with no network. ------ */
function makeConstellation(canvas, opts){
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0, h=0;
  function resize(){
    /* dpr is read HERE, on every call, not hoisted to makeConstellation's
       own init — a value captured once at closure-creation time would
       stay stale forever after, since this only re-runs on a window
       resize event (no ResizeObserver watches the element's own box).
       Capped at 3, not read uncapped: iOS Safari enforces a canvas
       memory ceiling and drops an over-budget canvas to blank rather
       than degrading it.

       The backing store (canvas.width/height) and the CSS box are two
       separate sizes. Reading getBoundingClientRect() BEFORE this ever
       ran gives the element's true CSS size; setting canvas.width/height
       right after changes the canvas's OWN intrinsic size too, and on
       any element with no CSS width/height rule, that intrinsic size IS
       the CSS size — so a canvas can silently balloon to its own
       DPR-scaled backing store the moment this runs. Pinning
       canvas.style.width/height here makes the CSS box independent of
       the backing store, always, whether or not a stylesheet happens to
       constrain this canvas. */
    const dpr=Math.min(window.devicePixelRatio||1, 3);
    const r=canvas.getBoundingClientRect(); w=Math.max(1,r.width); h=Math.max(1,r.height);
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const N = opts.count || 6;
  /* each node has a fixed "home" angle+radius (fraction of the canvas) —
     spread (0→1) scales that radius, so opening the coach visibly moves
     nodes from a tight cluster out to their resting positions, rather
     than hoping slow random drift gets there. A small orbiting jitter on
     top keeps it from looking mechanical once settled. */
  const nodes = Array.from({length:N},()=>({
    x:w/2, y:h/2, angle:Math.random()*Math.PI*2, radiusFrac:0.42+Math.random()*0.58,
    jx:0, jy:0, jvx:(Math.random()-0.5)*0.5, jvy:(Math.random()-0.5)*0.5,
    r: 1.5+Math.random()*1.3, phase: Math.random()*Math.PI*2
  }));
  let mode='idle', pulse=null, raf=null;
  let spread = opts.startCollapsed ? 0 : 1;
  function schedulePulse(){
    if(pulse || nodes.length<2) return;
    const from=Math.floor(Math.random()*nodes.length); let to=Math.floor(Math.random()*nodes.length);
    if(to===from) to=(to+1)%nodes.length;
    pulse={from,to,t:0};
  }
  function frame(t){
    ctx.clearRect(0,0,w,h);
    const cx=w/2, cy=h/2;
    if(spread<1) spread=Math.min(1, spread+0.028);
    const maxX=w*0.42, maxY=h*0.38;
    const jitterMax = mode==='thinking' ? 20 : 12;
    nodes.forEach(n=>{
      n.jx+=n.jvx; n.jy+=n.jvy;
      if(Math.abs(n.jx)>jitterMax) n.jvx*=-1;
      if(Math.abs(n.jy)>jitterMax) n.jvy*=-1;
      const tx=cx+Math.cos(n.angle)*maxX*n.radiusFrac*spread+n.jx;
      const ty=cy+Math.sin(n.angle)*maxY*n.radiusFrac*spread+n.jy;
      n.x+=(tx-n.x)*0.08; n.y+=(ty-n.y)*0.08;
    });
    const maxD=Math.max(maxX,maxY)*1.15;
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<maxD){ ctx.strokeStyle='rgba(110,231,183,'+((1-d/maxD)*0.5)+')'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    if(mode==='thinking' && !pulse) schedulePulse();
    if(pulse){
      pulse.t+=0.03;
      if(pulse.t>=1) pulse=null;
      else {
        const a=nodes[pulse.from], b=nodes[pulse.to];
        const px=a.x+(b.x-a.x)*pulse.t, py=a.y+(b.y-a.y)*pulse.t;
        ctx.shadowColor='rgba(110,231,183,.95)'; ctx.shadowBlur=9;
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,2.1,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    nodes.forEach(n=>{
      const breathe=1+Math.sin(t*0.0016+n.phase)*(mode==='thinking'?0.5:0.22);
      ctx.fillStyle='rgba(110,231,183,'+(mode==='thinking'?0.32:0.18)+')';
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*breathe*3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#eafff4';
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*breathe,0,Math.PI*2); ctx.fill();
    });
    raf=requestAnimationFrame(frame);
  }
  if(!reduced || opts.force){ raf=requestAnimationFrame(frame); }
  else { frame(0); }
  const onResize=()=>resize();
  window.addEventListener('resize', onResize);
  return {
    setMode:(m)=>{ mode=m; },
    burst:()=>{ schedulePulse(); },
    destroy:()=>{ if(raf) cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); }
  };
}

/* ---- inlined backdrop particles (self-contained) ------------------ */
function spawnParticles(root){
  if(!root) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const N = window.innerWidth<640?10:18;
  for(let i=0;i<N;i++){ const s=document.createElement('span'); const dur=18+Math.random()*22, size=1+Math.random()*1.2;
    s.style.left=(Math.random()*100)+'%'; s.style.top=(60+Math.random()*40)+'vh'; s.style.width=s.style.height=size+'px';
    s.style.animationDuration=dur+'s'; s.style.animationDelay=(-Math.random()*dur)+'s';
    s.style.setProperty('--dx',(Math.random()*30-15)+'px'); s.style.setProperty('--dy',(-(60+Math.random()*50))+'vh'); root.appendChild(s); }
}

/* ---- boot: load state from the dashboard bridge, THEN render -------
   window.Vitality is injected by the dashboard — we never define it. load()
   returns [] when empty, or the saved STATE object; render only after it
   resolves. Old (pre-rewrite) saves used a `days` shape — those are
   structurally incompatible with the single-session model, so they start
   fresh rather than risk a broken migration. */
(async()=>{
  let d=null, hostStatus='ok';
  try{ d = await window.Vitality.load(); }catch(e){ d=null; hostStatus='failed'; }
  const recovery=restoreIfEmpty(d && typeof d==='object' && !Array.isArray(d) ? d : null);
  if(recovery.restored){
    d=recovery.state;
    RESTORED_FROM=recovery.restored;
    console.warn('[train] local state was empty — restored '+recovery.restored.sets+' sets from '+recovery.restored.date);
  }
  const usable = d && typeof d==='object' && !Array.isArray(d) && d.session && !d.days;
  STATE = usable ? d : buildState();
  STATE.customLib = STATE.customLib || {};
  STATE.finishedDates = STATE.finishedDates || [];
  STATE.templates = STATE.templates || [];
  STATE.history = STATE.history || {};
  migrateHistorySessionIds();
  STATE.deloadStates = STATE.deloadStates || {};
  STATE.deloadExclusions = STATE.deloadExclusions || [];
  STATE.aliases = STATE.aliases || {};
  STATE.painFlagged = STATE.painFlagged || [];
  STATE.weeklyTarget = STATE.weeklyTarget || TrainEngine.DEFAULT_WEEKLY_TARGET;
  migrateDeloadOverrides();
  STATE.exerciseNames = STATE.exerciseNames || {};
  STATE.shortTermGoal = STATE.shortTermGoal || '';
  STATE.photos = STATE.photos || [];
  STATE.sessionDurations = STATE.sessionDurations || [];
  STATE.liftGoals = STATE.liftGoals || [];
  STATE.restAdvisedDates = STATE.restAdvisedDates || [];
  STATE.routines = STATE.routines || [];
  STATE.routineDays = STATE.routineDays || {};
  STATE.snapshots = STATE.snapshots || [];
  STATE.bodyweight = STATE.bodyweight || [];
  STATE.startingWeights = STATE.startingWeights || {};
  STATE.equipment = STATE.equipment || [];
  STATE.otherTraining = STATE.otherTraining || [];
  STATE.predictions = STATE.predictions || {};
  STORAGE = TrainEngine.storageReport(hostStatus, localLayer()?'ok':'unavailable', STATE.snapshots.length);
  console.info('[train] storage — '+STORAGE.detail);
  if(!STATE.snapshots.length) snapshotNow('first boot');
  /* Readiness is allowed to fail; nothing above it is. Reporting the
     failure rather than swallowing it is the whole point of the recovery
     work, and a bare catch here hid a ReferenceError for two commits. */
  try{ await computeReadiness(); }
  catch(err){ READINESS=null; console.warn('[train] readiness unavailable: '+(err&&err.message)); }
  applyRoutine(curSession());
  /* Asked once. A user with history has already answered by doing. */
  if(TrainEngine.onboardingNeeded(STATE) && !Object.keys(STATE.history||{}).length){
    setTimeout(()=>openOnboarding(), 400);
  }
  render(); wireFresh();
  /* ROLLOVER. `today` is read once at boot, so a new day IS a new boot.
     Publishing only when the day has moved keeps this off every page
     load while still closing out the day that ended — a consumer
     otherwise holds yesterday's payload with no way to learn it is
     stale. An absent marker means nothing was ever published, which is
     also a day worth publishing. */
  if(STATE.lastPublishedDate !== today){
    publishMetrics(today, 'rollover');
    STATE.lastPublishedDate = today;
    saveState();
  }
  renderGoalBubble(); renderPhotos(); wirePhotoUpload(); renderOverviewCards(); renderStatsPicker(); drawStatsSection();
  const exportBtn=$('#exportCsvBtn'); if(exportBtn) exportBtn.onclick=exportCSV;
  const fab=$('#coachFab'); if(fab) fab.onclick=()=> openCoach();
  const settingsBtn=$('#settingsBtn'); if(settingsBtn) settingsBtn.onclick=openSettings;
  wireCardGlow($('#exwrap'), '.ex');
  wireCardGlow($('#overviewCards'), '.ovCard');
  wireCardGlow($('#photoGallery'), '.photoCard');
  spawnParticles(document.querySelector('#vt-backdrop .wb-particles'));
  initFabConstellation();
})();
</script>
