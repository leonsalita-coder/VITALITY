  /* ====================================================================
     RECOVERED — the calendar, lifted from 731e891 with rounding on
     three sizes (.calTitle, .ctNum, .calLegend) and one resolved
     question about a fourth.

     .calTotal .ctLbl used to read two lines — "LB" / "THIS QTR" — which
     only fit inside the fixed 42px box at the original 7px, below the
     ramp's readable floor. At --fs-micro (11px) "THIS QTR" ran roughly
     48-57px wide by character-count arithmetic against a ~40px box: a
     real overflow, not a close call. The fix was the copy, not the box
     or the size: "this qtr" was already redundant with .calTitle
     directly above it (which names the quarter on screen), so it was
     dropped rather than kept and shrunk. "LB" alone at --fs-micro fits
     with room to spare — confirmed against the tile's real font stack
     and the exact 42px box, not estimated. .calTotal's 42px/109px are
     untouched.
     ================================================================= */
  @keyframes calIn { from{ opacity:0; transform:scale(.5); } to{ opacity:1; transform:scale(1); } }
  .calShell { display:flex; align-items:center; gap:8px; }
  .calArrow.dis { opacity:.3; pointer-events:none; }
  .calBody { flex:1; min-width:0; }
  .calHead { text-align:center; margin-bottom:10px; min-height:14px; }
  .calTitle { font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.04em; color:var(--muted); }
  .calTitle .hv { color:var(--signal); font-weight:700; }
  .calGridRow { display:flex; align-items:flex-start; justify-content:center; gap:7px; }
  .calDayLbls { display:grid; grid-template-rows:repeat(7,13px); gap:3px; margin-top:17px; flex:none; }
  .calMain { flex:none; }
  .calMonths { display:grid; gap:3px; margin-bottom:4px; height:12px; }
  .cal { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,13px); gap:3px; }
  .cal .cd { width:13px; height:13px; border-radius:50%; background:var(--e2); border:1px solid var(--hair); cursor:default; animation:calIn .3s var(--ease-out) backwards; transition:opacity var(--d2) var(--ease-out), transform var(--d1) var(--spring); }
  .cal .cd.pad { background:transparent; border-color:transparent; animation:none; }
  .cal .cd.l1 { background:color-mix(in srgb, var(--signal) 26%, var(--e2)); border-color:transparent; }
  .cal .cd.l2 { background:color-mix(in srgb, var(--signal) 50%, var(--e2)); border-color:transparent; }
  .cal .cd.l3 { background:color-mix(in srgb, var(--signal) 74%, var(--e2)); border-color:transparent; }
  .cal .cd.l4 { background:var(--signal); border-color:var(--signal); }
  .cal.hot .cd:not(.hotcell) { opacity:.32; }
  .cal.hot .cd.hotcell { opacity:1; transform:scale(1.2); }
  .calTotal { position:relative; flex:none; width:42px; height:109px; border-radius:8px; background:var(--e2); border:1px solid var(--hair-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; margin-top:17px; transition:border-color var(--d2) var(--ease-out), background var(--d2) var(--ease-out); }
  .calTotal.hot { border-color:color-mix(in srgb, var(--signal) 55%, black); background:rgba(110,231,183,.08); }
  .calTotal .ctNum { font-family:var(--mono); font-weight:700; font-size:var(--fs-caption); color:var(--text); }
  .calTotal .ctNum.mint { color:var(--signal); }
  .calTotal .ctLbl { font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-align:center; line-height:1.3; }
  .calPop { position:absolute; right:calc(100% + 8px); top:50%; transform:translateY(-50%) scale(.94); z-index:5; width:132px; background:var(--e3); border:1px solid var(--hair-strong); border-radius:var(--r-sm); padding:9px 10px 8px; opacity:0; pointer-events:none; transition:opacity var(--d2) var(--ease-out), transform var(--d2) var(--ease-out); box-shadow:0 14px 30px -14px rgba(0,0,0,.6); }
  .calPop.on { opacity:1; transform:translateY(-50%) scale(1); }
  .calPop .cpCap { font-family:var(--mono); font-size:var(--fs-micro); color:var(--muted); margin-bottom:6px; }
  .calLegend { display:flex; align-items:center; justify-content:center; gap:4px; margin-top:12px; font-family:var(--mono); font-size:var(--fs-micro); color:var(--muted); }
  @media (prefers-reduced-motion:reduce){ .cal .cd { animation:none; } }

  /* ====================================================================
     THE HEATMAP — docs/plans/heatmap.md, first slice: the grid shell,
     volume only. Portrait, 7 columns (days of week), weeks running down,
     vertical scroll — replaces the quarter-bound .cal above once it has
     parity (marks, layers, interaction); until then the two sit side by
     side, reachable as separate chips. Ramp is --hm1–--hm4 (NOT the
     elevation ramp — see the token comment in :root), neutral by
     design: --signal is spent exactly once, on today, never on the
     intensity fill. Rest/no-data is drawn (hairline outline, no fill),
     never dimmed — "silence is a state," the same rule the 28-day gate
     and empty-layer cases use elsewhere in the spec. No cascade
     animation on load, no per-cell hover chrome yet — marks and
     interaction are later slices. A fixed 53-week trailing window, not
     data-extent — see renderHeatmap()'s own comment for why.
     ==================================================================== */
  /* Column tracks are minmax(24px,42px), not a flat 42px — a container
     narrower than 7*42px+6*4px gap (318px) must still not overflow, and
     42px is the target with 24px the decided hard floor ("do not build
     a size below 24px"), never a fixed number that assumes more room
     than a given container actually has.

     The container itself was widened, not just the cell size shrunk:
     .chart-card:has(.hmBody) above breaks the heatmap's card out of
     .sheet's 20px side padding specifically, because the real
     constraint nothing previously encoded is PITCH (cell + gap) >= HIT
     BOX SIZE — with a fixed 44px .hmHit and this 4px gap that means
     cells >= 40px, needing >= 304px of content width, and the original
     ~269px #statsPlot (before this container fix — .shell/.sheet/
     .chart-card padding all stacked against it) could never clear that,
     whatever the cell size. A 42px cell with a plain 42px pitch there
     wasn't a slightly-small tap target, it was neighbouring .hmHit
     buttons OVERLAPPING by several px — a hit test at the edge of one
     cell silently resolved to the NEXT day (or the same weekday a week
     later, vertically), a wrong-day bug measured live and worse than
     the undersized-target bug it replaced. See
     tests/tools/browser-geometry.test.ts's "(d) no two hit boxes
     overlap" for the invariant that now guards this directly, instead
     of a bare >=44x44 size check that reads as passing right up to the
     moment boxes start overlapping.

     Real, measured result on the widened container: #statsPlot reaches
     325px, cells resolve to the full 42px target (the grid's own cap,
     not a compromise), pitch is 46px — a clear 2px gap between every
     adjacent .hmHit on both axes, not just clearing the >=44 floor.
     The 2px inline padding here is a small fixed edge inset, not a
     floor-case overhang reservation: at a 42px cell the tap target
     only overhangs its own cell by (44-42)/2 = 1px, so this is comfortable
     room, not the tight worst-case math the previous, narrower
     container needed. */
  .hmHead { display:grid; grid-template-columns:repeat(7,minmax(24px,42px)); gap:4px; justify-content:center; padding:0 2px; margin-bottom:8px; }
  .hmWd { font-family:var(--mono); font-size:var(--fs-micro); font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); text-align:center; line-height:var(--lh-micro); }
  .hmBody { display:grid; grid-template-columns:repeat(7,minmax(24px,42px)); gap:4px; justify-content:center; max-height:60vh; padding:0 2px; overflow-x:hidden; overflow-y:auto; }
  /* .hmCell is the GRID ITEM — sized by its column track (24-42px, see
     above), untouched by the tap-target requirement below. It carries
     the VISUAL fill/border only; it is not itself the interactive
     element. No explicit width/height: the default stretch alignment
     fills the track's inline size, and aspect-ratio:1 derives height
     from that so the cell stays square at whatever size the track
     actually resolves to. */
  .hmCell { position:relative; border:1px solid var(--hair); border-radius:var(--r-sm); background:none; aspect-ratio:1; }
  .hmCell.l1 { background:var(--hm1); border-color:transparent; }
  .hmCell.l2 { background:var(--hm2); border-color:transparent; }
  .hmCell.l3 { background:var(--hm3); border-color:transparent; }
  .hmCell.l4 { background:var(--hm4); border-color:transparent; }
  .hmCell.today { box-shadow:0 0 0 2px var(--signal); }
  /* Missed: a planned weekday (lib/train/routine.ts's RoutineAssignment)
     with nothing logged. The difference from an ordinary rest cell is
     SHAPE, not hue — the fill and hairline are UNCHANGED (decision 4's
     "silence is a state" still applies to the cell itself; this is an
     overlay on top of it, not a recolouring of it) — a thin diagonal
     line, drawn as a gradient rather than a border so its width is exact
     (1.5px, not a rounded border-width) and independent of the cell's
     own border. --fail converts to a mid-grey (~149 on the 0-255 scale)
     against the cell's near-black fallback (~3) — real, high-contrast
     separation confirmed by computing standard luminance for both, not
     assumed from the hue alone. */
  .hmCell.missed::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(-45deg, transparent calc(50% - .75px), var(--fail) calc(50% - .75px) calc(50% + .75px), transparent calc(50% + .75px)); }
  /* Record: a day containing a PR, driven from classifyPR (see
     heatmapPrDates()) — never a second record definition. Sits ON the
     fill, not replacing it, so the volume level still reads underneath;
     pointer-events:none so it never steals a tap from .hmHit beneath it. */
  .hmRecord { position:absolute; top:2px; right:2px; width:7px; height:7px; border-radius:50%; background:var(--gold); pointer-events:none; }
  /* .hmHit is the real <button>, a fixed 44×44 centred on its parent —
     NOT inset:-1px, which was measured live (varying the border 0/1/3px
     and watching the hit box come back 44/42/38) to resolve against
     .hmCell's PADDING box, not its border box: the 1px hairline border
     ate exactly the padding meant to overhang the cell, and the result
     varied by cell state (a filled day loses its border, so it measured
     44; a rest day keeps its hairline, so it measured 42). left/top 50%
     + a fixed size + a centring transform doesn't derive from the
     parent's box model at all, so it can't drift with border state.
     Taken out of grid flow (position:absolute) so it extends into the
     4px gap without moving any other cell or changing the grid's own
     42px+4px rhythm. */
  .hmHit { position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); padding:0; margin:0; border:none; background:none; cursor:default; }
  .hmLegend { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px; margin-top:12px; font-family:var(--mono); font-size:var(--fs-micro); font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); line-height:var(--lh-micro); }
  /* Swatches reuse .hmCell's own l1–l4/missing/.hmRecord rules verbatim
     (same classes, same selectors) rather than restating any of their
     colours here — this size-only override cannot drift out of sync
     with the real cells because it never states a colour of its own. */
  .hmLegendSwatch { position:relative; width:11px; height:11px; flex:none; border-radius:3px; }
  .hmLegendGap { width:4px; flex:none; }

  /* ====================================================================
     RECOVERED — the remaining 59, lifted from 731e891 in six groups
     (overview/weekday stats, the hero progress ring, the trend-chart
     SVG primitives, the step-by-step form flow, the add-lift button's
     label/ring, and a miscellaneous set with no shared theme). Two
     classes from the original 61 are NOT here — .odo and .odoDigit have
     no markup anywhere in this tile (the digit-reel effect they styled
     was replaced by countTo()'s plain text interpolation) — see
     docs/train-missing-stylesheet.md, "Removed, not recovered".

     Same deviations as the last two rounds: sub-floor and near-miss
     sizes round to the nearest ramp token, and every size is tokenised
     even where the raw number already equalled a token's value. Four
     genuine ties (two candidates equally close) were broken by
     judgement, not arithmetic, and are called out at the rule:
     .formGist/.formStep .t/.restPanel p/.restPanel .undo/.noteEdit
     input (16px and 14px, tied between --fs-body and its neighbour)
     went to --fs-body as flowing sentence text, matching how .photoNote
     was already decided; .addLiftLabel (14px, tied between --fs-caption
     and --fs-body) went to --fs-caption, the closer-reading half of the
     tie for a compact button label.

     .wdFill's box-shadow:0 0 8px rgba(110,231,183,.25) is a
     signal-coloured glow and is dropped, per the same rule that removed
     it everywhere else — tests/tools/hierarchy.test.ts, "the glow is
     gone", covers it now that this rule exists for it to check.

     --signal ends up carrying colour in many places across this batch —
     .ovNum.mint, .wdFill's fill, .prFill, .line, .dot (unqualified),
     .xlab.best, .heroSub b, .formStep .n, .addLiftRing, .restPanel
     .undo, .noteEdit's focus/button states, .miniSpinner, .miniCheck,
     .insightBox's tinted background, .skeleton-shimmer's highlight
     stop, and the trend chart's area fill (var(--mint), the --signal
     alias, set in the markup that builds this chart). This is reported,
     not fixed — see the commit message and PR notes for the full list
     and the composition call this batch defers.

     tests/tools/recovered-primitives.test.ts, "the rest of the tile
     came back", holds this account.
     ================================================================= */
  .ovGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; align-items:start; }
  .ovNum { position:relative; z-index:1; font-family:var(--mono); font-size:var(--fs-display); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
  .ovNum.gold { color:var(--gold); }
  .ovNum.mint { color:var(--signal); }
  .ovLbl { position:relative; z-index:1; font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:8px; }
  .ovDesc { position:relative; z-index:1; font-size:var(--fs-micro); color:var(--muted-2); margin-top:5px; line-height:1.4; }
  .ovDesc b { color:var(--text); font-weight:600; }
  .ovChart { position:relative; z-index:1; display:flex; align-items:flex-end; justify-content:center; gap:2.5px; height:26px; margin-top:12px; }
  .ovBar { width:100%; max-width:8px; height:0%; border-radius:2px 2px 0 0; background:rgba(110,231,183,.35); transition:height var(--d5) var(--ease-out); }
  .ovBar.now { background:var(--gold); }
  .ovCap { position:relative; z-index:1; font-family:var(--mono); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2); margin-top:6px; }
  .wdBars { display:flex; gap:8px; margin-top:18px; align-items:flex-end; height:72px; }
  .wdBar { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; }
  .wdTrack { flex:1; width:100%; display:flex; align-items:flex-end; }

/* ---- the athlete's goal (written here by the mentor, same as weights.ts) - */
const ATHLETE_GOAL = 'Become a peak athlete in taekwondo and soccer';
/** Long-term goal + whatever short-term goal is currently set, combined for
 *  every AI call — so a short-term focus actually shapes advice instead of
 *  being cosmetic. */
function fullGoalContext(){
  const g=(STATE.shortTermGoal||'').trim();
  return g ? ATHLETE_GOAL+'. Right now, short-term focus: '+g : ATHLETE_GOAL;
}

/* A pre-state-machine store carried { kg, date } overrides. Those were real
   prescriptions the lifter was already following, so they are converted
   rather than dropped. priorWeight is reconstructed by inverting the cut
   deloadPlan applies, so the migrated record reproduces exactly the weight
   that was already being shown. Runs once; the old key is then removed. */
function migrateDeloadOverrides(){
  const old = STATE.deloadOverrides;
  if(!old || typeof old!=='object') return;
  Object.keys(old).forEach(id=>{
    if(STATE.deloadStates[id]) return;
    const ov=old[id];
    if(!ov || typeof ov.kg!=='number') return;
    STATE.deloadStates[id]={
      state:'deloading', kind:'intensity',
      priorWeight: Math.round((ov.kg/0.9)*100)/100,
      since: ov.date||today, sessions:0, confidence:'measured',
    };
  });
  delete STATE.deloadOverrides;
  saveState();
}
/* A row written before session ids existed has no way to tell a second
   same-day session apart from the first — which is exactly the bug this
   whole feature closes. True by construction, every such row gets its
   own date as the BASE of its session id — prefixed `legacy:`, not the
   bare date, because curSession() below can ALSO fall back to its own
   bare date, and two different unrelated things defaulting to the same
   string is the same collision this field exists to prevent, just moved
   one level up. Groups every such row with every OTHER legacy row on
   that date exactly as history already behaved, without also being
   mistakable for a live session that happens to share the date. Run
   once here rather than trusted to every comparison site — a snapshot
   restored after an eviction, or a JSON backup restored mid-session,
   both land in STATE.history through a DIFFERENT path than an ordinary
   boot, and either one skipping this would silently reopen the
   collision on whatever it brought back. */
function migrateHistorySessionIds(){
  const history = STATE.history;
  if(!history || typeof history!=='object') return;
  for(const id of Object.keys(history)){
    const rows = history[id];
    if(!Array.isArray(rows)) continue;
    for(const row of rows){
      if(row && typeof row==='object' && !row.sessionId && typeof row.date==='string'){
        row.sessionId = 'legacy:'+row.date;
      }
    }
  }
}

/* ---- build / load state ---------------------------------------------
   ONE session, keyed by today's real date — rolls over to a fresh, empty
   session automatically at midnight. Per-exercise history lives globally
   (STATE.history, keyed by exercise id) so it survives being removed from
   a session or regenerated on a different day. Nothing is ever pre-filled;
   content only arrives via generate, typing a name for the AI, or a saved
   template. */
function buildState(){
  return {
    unit:'lb', submitted:false,
    session:{ date:today, off:false, warmup:[], cooldown:[], ex:[], id:newSessionId() },
    history:{}, customLib:{}, aliases:{}, bodyweight:[], startingWeights:{}, equipment:[], routines:[], routineDays:{}, finishedDates:[], templates:[], deloadStates:{}, deloadExclusions:[], painFlagged:[], weeklyTarget:4, otherTraining:[], predictions:{},
    exerciseNames:{}, shortTermGoal:'', photos:[], sessionDurations:[], liftGoals:[]
  };
}
function seedChecklist(list){ return (list||[]).map(text=>({text, done:false})); }
/* Frequency, not consecutive days. A consecutive-day streak and the rest-day
   toggle were at war: taking a correctly programmed rest day broke the
   number, which teaches people to fake-log to protect it. Weeks meeting a
   session target are indifferent to which days the sessions land on. */
/* What they said they intend to train, never a constant. Someone who
   chooses twice a week is succeeding at twice a week. */
function weeklyTarget(){ return TrainEngine.streakTarget(STATE.weeklyTarget); }
function currentStreak(){ return TrainEngine.currentWeekStreak(allTrainingDates(), weeklyTarget(), Date.now()); }
function streakText(){ return TrainEngine.streakLabel(currentStreak(), weeklyTarget()); }
/* ---- AI-classified exercises (typed by name, or from the coach) -----
   Cached in STATE.customLib so a name is only ever sent to the model
   once — it's a real paid call on the user's own key. */
/* Ids come from the engine, so the tile has no second implementation of
   what counts as a distinct lift. */
function takenIds(){
  const taken=new Set(Object.keys(STATE.customLib||{}));
  Object.keys(STATE.exerciseNames||{}).forEach(id=>taken.add(id));
  curSession().ex.forEach(x=>taken.add(x.id));
  return taken;
}
function slugify(name){ return TrainEngine.slugFromName(name, takenIds()); }
function slugifyAvoiding(name, usedSet){
  const taken=takenIds(); (usedSet||new Set()).forEach(id=>taken.add(id));
  return TrainEngine.slugFromName(name, taken);
}
/* ---- global per-exercise history, independent of any one session --- */
function histFor(e){ STATE.history=STATE.history||{}; return STATE.history[e.id]||(STATE.history[e.id]=[]); }
function lastKgFromHistory(id){
  const h=(STATE.history&&STATE.history[id])||[]; const real=h.filter(s=>!s.off);
  return real.length? real[real.length-1].kg : null;
}
/* STATE is filled by the async boot below once the dashboard bridge resolves. */
let STATE = null;
/* Fire-and-forget persistence through the dashboard bridge (no device storage). */
function saveState(){ if(window.Vitality && typeof window.Vitality.save==='function') window.Vitality.save(STATE); }
/* ---- publishing what this tile knows ------------------------------- *
 * The dashboard's premise is that the tiles read each other. Train has
 * been reading Vitals and publishing nothing, so the cross-read only ran
 * one way. This is the other half: typed daily metrics with provenance,
 * for any tile to read and format for its own surface.
 *
 * ON FINISH, ON ROLLOVER, AFTER A BACKDATED EDIT — never on render. A
 * render is not an event in the athlete's life, and publishing from one
 * would write a payload every time a chart repainted.
 *
 * The payload carries no exercise names, no per-set detail, no notes and
 * no pain flags. Another tile needs to know the session was hard, not
 * what was in it, and a field withheld can be added later while a field
 * published is one somebody may already depend on. */
function metricsContextFor(dateKey){
  const durations = STATE.sessionDurations || [];
  const rec = durations.find(d => d && d.date === dateKey) || null;
  /* A duration only counts as measured where the session clock actually
     ran. An imported row carries atEstimated and never claims one. */
  const observed = !!(rec && typeof rec.minutes === 'number'
    && (dateKey !== today || (curSession() && curSession().startedAt)));
  const deloadLifts = Object.keys(STATE.deloadStates || {})
    .filter(id => { const d = STATE.deloadStates[id]; return !!d && d.state === 'deloading'; }).length;
  const r = (dateKey === today) ? readiness() : null;
  let pr = null;
  if (dateKey === today && curSession()) {
    for (const e of curSession().ex || []) {
      for (let i = 0; i < (e.log || []).length; i++) {
        const k = e.log[i] ? prFor(e, i).kind : null;
        if (k === 'e1rm') { pr = 'e1rm'; break; }
        if (k && !pr) pr = k;
      }
      if (pr === 'e1rm') break;
    }
  }
  /* Today's work lives on the session until it is committed to history,
     so a payload built from history alone would describe the day as
     untrained right up to the moment it stopped being today. Merged
     here, never written back — this is a read of the day, not an edit
     of it. */
  let history = STATE.history || {};
  if(dateKey === today && curSession()){
    history = Object.assign({}, history);
    /* Same collision this whole change is about: an earlier session
       locked in today must not be erased by merging in the live,
       still-open one just because both fall on the same date. Only the
       CURRENT session's own not-yet-committed row is what gets replaced
       here — anything from a session that already finished stays. */
    const liveId = curSession().id;
    for(const e of curSession().ex || []){
      if(!(e.log || []).some(Boolean)) continue;
      const rest = (history[e.id] || []).filter(x => x && (x.date !== today || x.sessionId !== liveId));
      history[e.id] = rest.concat([todayEntry(e)]);
    }
  }
  return {
    date: dateKey,
    history: history,
    index: TrainEngine.indexFrom(STATE.customLib || {}),
    finishedDates: STATE.finishedDates || [],
    bodyweight: STATE.bodyweight || [],
    otherTraining: STATE.otherTraining || [],
    deloadLifts: deloadLifts,
    readiness: (r && r.verdict) ? r.verdict : null,
    sessionSeconds: rec ? rec.minutes * 60 : null,
    sessionTimingObserved: observed,
    streakTarget: weeklyTarget(),
    pr: pr,
    now: Date.now(),
  };
}
function publishMetrics(dateKey, why){
  if(!window.Vitality || typeof window.Vitality.publish!=='function') return;
  if(!STATE) return;
  try{
    const metrics = TrainEngine.publishedMetrics(metricsContextFor(dateKey || today));
    window.Vitality.publish(metrics);
    console.log('[train] published ' + metrics.length + ' metrics for ' + (dateKey||today) + ' — ' + why);
  }catch(err){
    /* Publishing is never allowed to take the session down with it. */
    console.warn('[train] publish failed — ' + ((err && err.message) || 'unknown'));
  }
}

/* ---- helpers on state -------------------------------------------- */
/* Plate math config, editable in Settings. */
/**
 * Today's readiness, computed once on boot and held for the day.
 *
 * Read BEFORE the session rather than after it — the point is to prevent
 * the bad session, not to explain it afterwards. Holding it for the day
 * also stops the verdict flickering as sets are logged, which would make it
 * look like guesswork.
 */
let READINESS = null;
let RESTORED_FROM = null;
function weeklyHardSets(offsetWeeks){
  const start=new Date(); start.setDate(start.getDate()-(7*(offsetWeeks+1)-1));
  const end=new Date(); end.setDate(end.getDate()-7*offsetWeeks);
  const from=ymd(start), to=ymd(end);
  let n=0;
  Object.keys(STATE.history||{}).forEach(id=>{
    (STATE.history[id]||[]).forEach(entry=>{
      if(entry.off || entry.date<from || entry.date>to) return;
      n += TrainEngine.workingSets(entry).length;
    });
  });
  return n;
}
/** The usual week, from the three before this one. Null without enough. */
function baselineHardSets(){
  const weeks=[1,2,3].map(weeklyHardSets).filter(n=>n>0);
  if(weeks.length<2) return null;
  return weeks.reduce((a,b)=>a+b,0)/weeks.length;
}
function anyDeloadActive(){
  return Object.values(STATE.deloadStates||{}).some(d=>d && (d.state==='deloading' || d.state==='reapproach'));
}
/* Training that isn't lifting, normalised on READ. Nothing rewrites the
   stored rows: an entry saved before a field existed reads back with that
   field's safe default, and an entry nothing can place at all is dropped
   here rather than reaching a calculation. */
function otherEntries(){
  return (STATE.otherTraining||[])
    .map(e=>TrainEngine.normalizeOtherEntry(e))
    .filter(Boolean);
}
/* The estimate, summarised. It reaches readiness THROUGH the readiness
   context and nowhere else — there is no path from here to a lift. */
function otherLoadNow(){ return TrainEngine.recentOtherLoad(otherEntries(), today); }
/* Days the athlete trained, counting the runs. A frequency streak asks
   "did you train this week", and a run is training. */
function allTrainingDates(){
  return TrainEngine.trainingDates(STATE.finishedDates||[], otherEntries());
}

async function computeReadiness(){
  const rec = noteRecovery(await readRecovery());
  const base = baselineHardSets();
  READINESS = TrainEngine.assessReadiness({
    recovery: rec.status==='connected' ? rec.avg : null,
    recentHardSets: base==null ? null : weeklyHardSets(0),
    baselineHardSets: base,
    activeDeload: anyDeloadActive(),
    restAdvisedDates: STATE.restAdvisedDates || [],
    today,
    otherLoad: otherLoadNow(),
  });
  if(READINESS.verdict==='rest_advised'){
    STATE.restAdvisedDates = STATE.restAdvisedDates || [];
    if(STATE.restAdvisedDates.indexOf(today)<0){ STATE.restAdvisedDates.push(today); saveState(); }
  }
  return READINESS;
}
function readiness(){ return READINESS || { verdict:'normal', setsFactor:1, weightFactor:1, reason:null }; }
/**
 * Pre-fills today's session from the routine assigned to this weekday.
 *
 * Runs only on a session with NOTHING logged: a pre-fill that overwrites
 * work is worse than no pre-fill. Everything it adds is an ordinary
 * exercise the athlete can edit or remove.
 */
function applyRoutine(session){
  const routines = STATE.routines || [];
  if(!routines.length) return;                      // nothing set: unchanged
  if(TrainEngine.hasLoggedWork(session)) return;    // never clobber work
  const routine = TrainEngine.routineForDate(routines, STATE.routineDays || {}, session.date);
  if(!routine) return;
  const plan = TrainEngine.prefillPlan(routine, session.ex.map(x=>x.id));
  if(!plan.length) return;
  plan.forEach(item=>{
    const def = TrainEngine.catalogExercise(item.exerciseId);
    const name = (STATE.exerciseNames||{})[item.exerciseId] || (def && def.name) || item.exerciseId;
    if(def) installExerciseDef(def.id, def.name, {
      kind:def.defaultSetKind, perSide:def.unilateral, assisted:false,
      repRange:item.repRange||null, equipment:def.equipment, primary:def.primary,
    });
    if(item.repRange) setExerciseField({id:item.exerciseId}, 'repRange', item.repRange);
    session.ex.push(sessionExerciseFrom({
      id:item.exerciseId, name,
      kind:(def && def.defaultSetKind) || kindFor({id:item.exerciseId}),
      sets:item.sets, reps:item.reps,
      weight:lastKgFromHistory(item.exerciseId)||0,
      rest:item.rest, perSide:!!(def && def.unilateral),
    }));
  });
  saveState();
}
/* ── durability ──────────────────────────────────────────────────────
   Tile data already leaves the iframe: window.Vitality.save posts to the
   host, which writes to the host app's storage and mirrors to Supabase
   when sync is on. The exposure is that WITHOUT SYNC THERE IS ONE COPY, on
   an origin Safari still evicts after about a week away.

   So: rolling snapshots inside the saved payload, an independent in-frame
   copy where the sandbox allows one, and a restore that never silently
   starts fresh on top of someone with history. */
let STORAGE = { host:'unavailable', local:'unavailable', snapshots:0, detail:'not probed' };
const LOCAL_KEY = 'vitality.train.snapshots';

/* An opaque-origin sandbox may deny localStorage outright. Probed, never
   assumed — a layer believed to be working and silently absent is worse
   than one known to be missing. */
function localLayer(){
  try{
    if(!window.localStorage) return null;
    window.localStorage.setItem(LOCAL_KEY+'.probe','1');
    window.localStorage.removeItem(LOCAL_KEY+'.probe');
    return window.localStorage;
  }catch(err){ return null; }
}
function readLocalSnapshots(){
  const store=localLayer(); if(!store) return [];
  try{ const raw=store.getItem(LOCAL_KEY); return raw? JSON.parse(raw) : []; }
  catch(err){ return []; }
}
function writeLocalSnapshots(list){
  const store=localLayer(); if(!store) return 'unavailable';
  try{ store.setItem(LOCAL_KEY, JSON.stringify(list)); return 'ok'; }
  catch(err){ return 'failed'; }   // quota, most likely
}
/**
 * Takes a snapshot and writes it to every layer that will accept one.
 *
 * Called on session finish and before anything destructive — a merge, an
 * import, a kind change. Those are the moments a bad outcome is
 * unrecoverable rather than merely annoying.
 */
function snapshotNow(reason){
  try{
    const snap=TrainEngine.makeSnapshot(stateForBackup(), Date.now());
    STATE.snapshots=TrainEngine.pushSnapshot(STATE.snapshots||[], snap);
    const localStatus=writeLocalSnapshots(STATE.snapshots);
    saveState();
    STORAGE=TrainEngine.storageReport(STORAGE.host, localStatus, (STATE.snapshots||[]).length);
    console.info('[train] snapshot ('+reason+') — '+STORAGE.detail);
  }catch(err){ console.warn('[train] snapshot failed: '+(err&&err.message)); }
}
/* The state minus its own snapshots, so copies never nest. */
function stateForBackup(){
  const copy=Object.assign({}, STATE);
  delete copy.snapshots;
  return copy;
}
/**
 * Restores after an eviction.
 *
 * Only when live state looks LOST rather than never created, and only from
 * a snapshot carrying actual work. Starting fresh on top of someone with
 * history is the failure this whole file exists to prevent.
 */
function restoreIfEmpty(loaded){
  const candidates=[...(loaded && loaded.snapshots ? loaded.snapshots : []), ...readLocalSnapshots()];
  if(!TrainEngine.stateLooksEmpty(loaded)) return { state:loaded, restored:null };
  const best=TrainEngine.chooseRestore(candidates);
  if(!best) return { state:loaded, restored:null };
  const merged=Object.assign({}, best.state, { snapshots:candidates.slice(0,5) });
  return { state:merged, restored:best };
}
/* ── bodyweight ──────────────────────────────────────────────────────
   Tracked, not set: a pull-up at 160 lb and the same pull-up at 185 lb are
   different sets, and one stored number would rewrite years of history
   every time someone's weight changed. */
function bodyweightOn(date){
  return TrainEngine.bodyweightAt(STATE.bodyweight||[], date||today);
}
/** How much of the athlete a lift moves, from the catalog where authored. */
function bodyweightFactorFor(e){
  const info=(STATE.customLib||{})[e.id];
  if(info && typeof info.bodyweightFactor==='number') return info.bodyweightFactor;
  const def=TrainEngine.catalogExercise(e.id);
  return def && typeof def.bodyweightFactor==='number' ? def.bodyweightFactor : null;
}

function volumeOptsFor(e, date){

}
function plateConfig(){

}
/* Where today's session stands, in the engine's vocabulary. */
function currentSessionState(){
  return TrainEngine.sessionState(STATE.session || { date:today }, {

/**
 * Training mode and edit mode.
 *
 * Mid-session a lift card carried eight controls beyond the set rows —
 * swap, history, tune, pin, collapse, info, overflow and drag — for
 * somebody sweaty, breathing hard, holding the phone one-handed, forty
 * seconds into a rest timer. Seven of those are things you do while
 * PLANNING a session, and one is a thing you do while DOING one.
 *
 * So the card renders for what you are actually doing. Training mode is
 * the default and holds log, the rest timer and swap; edit mode holds
 * everything, and reaching it is one deliberate tap.
 *
 * This is about which controls RENDER, not how they look — no styling is
 * involved, and it stands however the stylesheet is resolved later.
 *
 * The mode lives on the SESSION, not on STATE. A new day builds a fresh
 * session object below, so tomorrow opens in training mode without
 * anything having to remember to reset it — the alternative, a global
 * flag, would leave you editing a session you meant to train.
 */
function sessionMode(){ return curSession().mode === 'edit' ? 'edit' : 'training'; }
function editing(){ return sessionMode() === 'edit'; }
function setSessionMode(mode){
  curSession().mode = mode === 'edit' ? 'edit' : 'training';
  saveState(); render();
}

/* A session id distinguishes two sessions on the SAME calendar day —
   morning and evening — which the date string alone cannot. Minted at
   two moments only: a brand-new day (nothing to collide with, so any id
   is fine), and the explicit unlock-to-resume transition in
   renderFinish, which is the one place a second session on today
   genuinely begins. Everywhere else reads it, never mints it: an
   in-progress session that predates this feature has no id yet, and
   defaulting THAT to a fresh random value — rather than to today's date
   — would orphan whatever it had already logged under the old code,
   turning an ordinary continued session into a false two-a-day. */
function newSessionId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function curSession(){
  if(!STATE.session || STATE.session.date!==today){
    /* The day rolled over. If work was logged and finish was never pressed,
       that session is ABANDONED — real work that was not finished — and its
       history rows are flagged so progression will not bump off them. The
       rows themselves are kept; the sets happened. */
    const prev = STATE.session;
    if(prev && !prev.off && !STATE.submitted && TrainEngine.loggedSetCount(prev) > 0){
      markAbandoned(prev.date);
    }
    STATE.submitted = false;
    Object.keys(restTimers).forEach(stopRest);
    STATE.session = { date:today, off:false, warmup:[], cooldown:[], ex:[], id:newSessionId() };
  }
  /* Migration: a session already in progress when this shipped has no id
     yet. Default it to `legacy:`+today's date — matching the SAME
     prefix an unstamped HISTORY row gets (readableEntries, sets.ts) and
     migrateHistorySessionIds' own fallback above — so a session
     continued across a reload keeps replacing its own already-migrated
     rows in place exactly as it always did, rather than being read as
     colliding with itself. Bare `today` was tried first and rejected:
     it is indistinguishable from a real, unrelated legacy row that
     happens to share today's date, which is the exact collision this
     whole feature exists to close, just reopened one level up. */
  if(!STATE.session.id) STATE.session.id = 'legacy:'+today;
  return STATE.session;
}
function sortedEx(session){ return session.ex.map((e,i)=>({e,i})).sort((a,b)=> (b.e.pinned-a.e.pinned)).map(o=>o.e); }
function prescription(e){

     stacks with a deload — the engine returns a neutral verdict whenever
     one is live, so exactly one adjustment is ever in play. */
  const r = readiness();
  const base = e.deload ? r1(e.kg*0.9) : e.kg;
  return { kg: r1(base * r.weightFactor), reps:e.reps, sets:e.sets, rest:e.rest };
}
function classifySet(e, idx){ const s=e.log[idx]; if(!s) return 'empty'; if(s.fail) return 'failed'; return 'done'; }
/* A logged set is working unless it is a miss or a flagged warm-up.

function logIsWorking(s){ return !!s && !s.fail && s.warmup!==true; }
function logWorking(e){ return e.log.filter(logIsWorking); }
/* Today's session as a history entry, so engine readers see one shape. */
function todayEntry(e){
  return { date:today, kg:e.kg, sessionId:curSession().id, sets:e.log.filter(Boolean).map(s=>({
    w:s.kg, r:s.reps, s:s.s, m:s.m, kind:s.kind, perSide:s.perSide, assisted:s.assisted,
    fail:s.fail, warmup:s.warmup,

/* Estimated 1RM is the canonical record — it ranks 245×3 above 225×5 the
   way a lifter already reads their own training, and it does not fire
   every session the way "heaviest weight" does. classifyPR returns 'e1rm'
   for the celebration and 'weight'/'reps' for a quiet dot. */
function prFor(e, idx){
  const s=e.log[idx];

}
function isPR(e, idx){ return prFor(e, idx).kind !== null; }
function isBigPR(e, idx){ return prFor(e, idx).kind === 'e1rm'; }

function exHasPR(e){ return e.log.some((s,i)=>isBigPR(e,i)); }

let NOTE_POOL = [{ emoji:'✦', text:'Ready when you are', type:'mint' }];
const NOTE_SLOT_STATE = [-1,-1,-1];

function computeNotes(){
  const notes = [];
  const session = curSession();
  if (session.off) {
    notes.push({ emoji:'🌙', text:'Rest day', type:'mint' });
  } else {
    const totals = sessionTotals(session);
    if (totals.total>0 && totals.logged===0) notes.push({ emoji:'⚠️', text:'Push hard today', type:'fail' });
    else if (totals.total>0 && totals.logged<totals.total) notes.push({ emoji:'💪', text:(totals.total-totals.logged)+' to go', type:'mint' });
    else if (totals.total>0 && totals.logged===totals.total) notes.push({ emoji:'✅', text:'Crushed it', type:'gold' });
  }
  const streak = currentStreak();
  if (streak>=2) notes.push({ emoji:'🔥', text:streak+'wk streak', type:'gold' });
  const hasPR = (curSession().ex||[]).some(exHasPR);
  if (hasPR) notes.push({ emoji:'🏆', text:'New PR', type:'gold' });
  if (!notes.length) notes.push({ emoji:'✦', text:"Let's go", type:'mint' });
  return notes;
}

/* ---- odometer: numbers count instead of snapping — a cheap, robust
   version of a digit-reel (interpolated text, tabular-nums keeps it
   from jittering in width). Skips the animation on first paint. ----- */
function countTo(el, value){
  const prev=el.dataset.val!=null ? Number(el.dataset.val) : null;
  el.dataset.val=String(value);
  el.classList.add('num');
  if(prev===null || prev===value || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)){ el.textContent=String(value); return; }
  const start=performance.now(), dur=520;
  function tick(t){
    const p=Math.min(1,(t-start)/dur); const eased=1-Math.pow(1-p,3);
    el.textContent=String(Math.round(prev+(value-prev)*eased));
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---- warm-up / cooldown checklists --------------------------------- */
const openSections={};
const WC_CHECK_D='M2.5 6L4.5 8L9.5 3';
const WC_SCRIBBLE_D='M 10 16.91 s 79.8 -11.36 98.1 -11.34 c 22.2 0.02 -47.82 14.25 -33.39 22.02 c 12.61 6.77 124.18 -27.98 133.31 -17.28 c 7.52 8.38 -26.8 20.02 4.61 22.05 c 24.55 1.93 113.37 -20.36 113.37 -20.36';
let wcLastToggle=null; // {key,idx} — the one item allowed to animate on this render pass
function renderChecklist(sel, list, key, title){
  const el=$(sel); if(!list){ el.innerHTML=''; return; }
  const doneCount=list.filter(i=>i.done).length; const open=!!openSections[key];
  // the body is ALWAYS in the DOM (open or closed) so the accordion has a real
  // before/after state to animate between — a conditionally-rendered block
  // has nothing to transition from and just snaps.
  el.innerHTML = '<button class="wcHead" data-act="wcToggle"><span class="wcCaret">'+(open?'▾':'▸')+'</span><span class="wcTitle">'+title+'</span><span class="wcCount">'+doneCount+'/'+list.length+'</span></button>'
    + '<div class="wcBody'+(open?' open':'')+'"><div class="wcBodyInner">'
      + list.map((it,i)=>'<div class="wcItem"><button class="wcCheck '+(it.done?'on':'')+'" data-i="'+i+'" data-act="wcCheck" aria-pressed="'+(it.done?'true':'false')+'"><svg class="wcCheckMark" viewBox="0 0 12 12" fill="none"><path d="'+WC_CHECK_D+'" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
        + '<span class="wcTxt'+(it.done?' done':'')+'"><svg class="wcScribble" viewBox="0 0 340 32" preserveAspectRatio="none"><path class="wcScribblePath" d="'+WC_SCRIBBLE_D+'" fill="none" stroke-width="2" stroke-linecap="round"/></svg>'+escapeHtml(it.text)+'</span>'
        + '<button class="wcX" data-i="'+i+'" data-act="wcRm">×</button></div>').join('')
      + '<div class="wcAdd"><input class="wcIn" placeholder="Add item"/><button class="wcAddBtn" data-act="wcAdd">+</button></div>'
    + '</div></div>';
  // toggling open/closed animates an EXISTING node in place (class swap, no
  // rebuild) — a full renderBody() here would recreate wcBody already in its
  // target state, defeating the transition entirely.
  el.querySelector('[data-act="wcToggle"]').onclick=()=>{
    openSections[key]=!open;
    const body=el.querySelector('.wcBody'), caret=el.querySelector('.wcCaret');
    if(body) body.classList.toggle('open', openSections[key]);
    if(caret) caret.textContent = openSections[key] ? '▾' : '▸';
  };
  el.querySelectorAll('[data-act="wcCheck"]').forEach(b=> b.onclick=()=>{
    const i=+b.dataset.i;
    list[i].done=!list[i].done;
    wcLastToggle={key, idx:i};
    saveState(); renderBody();
  });
  el.querySelectorAll('[data-act="wcRm"]').forEach(b=> b.onclick=()=>{ list.splice(+b.dataset.i,1); saveState(); renderBody(); });
  const inp=el.querySelector('.wcIn');
  const addIt=()=>{ const v=inp.value.trim(); if(!v) return; list.push({text:v,done:false}); saveState(); renderBody(); };
  el.querySelector('.wcAddBtn').onclick=addIt;
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); addIt(); } });
  // draw the checkmark + scribble in — only for the item that was just
  // clicked; every other row (including a fresh mount, add, or remove)
  // snaps straight to its correct state with no transition.
  const reduced=prefersReducedMotion();
  el.querySelectorAll('.wcItem').forEach((row,i)=>{
    const done=list[i].done;
    const justToggled=!reduced && wcLastToggle && wcLastToggle.key===key && wcLastToggle.idx===i;
    [
      { p:row.querySelector('.wcCheckMark path'), dur:'.4s' },
      { p:row.querySelector('.wcScribblePath'), dur:'.7s' },
    ].forEach(({p,dur})=>{
      if(!p) return;
      const len=p.getTotalLength();
      p.style.strokeDasharray=len;
      if(justToggled){
        p.style.transition='none';
        p.style.strokeDashoffset= done? len : 0;
        void p.offsetWidth;
        // double rAF: single-rAF FLIPs can get coalesced into the same
        // frame as the reflow above, so the "start" state never actually
        // paints and the transition silently no-ops straight to the end
        // value — confirmed by sampling strokeDashoffset per frame.
        requestAnimationFrame(()=>{
          p.style.transition='stroke-dashoffset '+dur+' var(--ease-out)';
          requestAnimationFrame(()=>{ p.style.strokeDashoffset= done?0:len; });
        });
      } else {
        p.style.transition='none';
        p.style.strokeDashoffset= done?0:len;
      }
    });
  });
  if(wcLastToggle && wcLastToggle.key===key) wcLastToggle=null;
}

/* Average RPE across the working sets logged today, or null when the

function deloadExplain(dl){

/* ---- recovery cross-reference: Vitals is a whitelisted cross-tile read
   (window.Vitality.read), same recovery formula Vitals itself uses
   (whoopRecovery wins; else 0.6·feel + 0.4·sleep-scaled). Averaged over
   the last week so one bad night doesn't skew it. */
function vitalsRecoverySignal(v){
  if(!v || typeof v!=='object') return null;
  const dates=Object.keys(v).sort().slice(-7);
  if(!dates.length) return null;
  const scores=dates.map(k=>{
    const d=v[k]||{};
    if(typeof d.whoopRecovery==='number') return Math.max(1,Math.min(99,Math.round(d.whoopRecovery)));
    const parts=[], w=[];
    if(typeof d.feel==='number'){ parts.push(Math.max(0,Math.min(100,d.feel))); w.push(0.6); }
    if(typeof d.sleepHours==='number'){ parts.push(Math.max(0,Math.min(1,d.sleepHours/8))*100); w.push(0.4); }
    if(!parts.length) return null;
    const tw=w.reduce((a,b)=>a+b,0);
    return Math.round(parts.reduce((a,p,i)=>a+p*w[i],0)/tw);
  }).filter(n=>n!=null);
  if(!scores.length) return null;
  return { avg:Math.round(scores.reduce((a,b)=>a+b,0)/scores.length), days:scores.length };
}
/* ---- reading recovery, with the three outcomes kept apart -----------
   Collapsing them all into null is how a BROKEN read hides behind the same
   conservative default a genuinely absent one deserves: the deload stays
   'inferred' forever, takes the gentle 95% cut forever, and nothing ever
   says why. Only a connected read that returned usable data may produce a
   measured decision. */
const RECOVERY_STATUS = {
  NONE:  'no_connection',      // no bridge, or the read threw
  EMPTY: 'connected_no_data',  // read succeeded, nothing usable in it
  OK:    'connected',          // read succeeded with a usable average
};
async function readRecovery(){
  let vitals;
  try{
    if(!window.Vitality || typeof window.Vitality.read!=='function'){
      return { status:RECOVERY_STATUS.NONE, avg:null, days:0, detail:'no bridge' };
    }
    vitals = await window.Vitality.read('vitals');
  }catch(err){
    return { status:RECOVERY_STATUS.NONE, avg:null, days:0, detail:(err&&err.message)||'read failed' };
  }
  const rec = vitalsRecoverySignal(vitals);
  if(!rec) return { status:RECOVERY_STATUS.EMPTY, avg:null, days:0, detail:'no usable recovery in the last 7 days' };
  return { status:RECOVERY_STATUS.OK, avg:rec.avg, days:rec.days, detail:null };
}
/* Diagnosable rather than silent: a measured deload that never fires is
   indistinguishable from one that cannot fire, unless something says which. */
function noteRecovery(rec){
  const msg = '[train] recovery ' + rec.status
    + (rec.detail ? ' (' + rec.detail + ')' : '')
    + (rec.avg != null ? ' — avg ' + rec.avg + '/100 over ' + rec.days + 'd' : '');
  if(rec.status === RECOVERY_STATUS.OK) console.info(msg); else console.warn(msg);
  STATE.recoveryStatus = { status:rec.status, avg:rec.avg, days:rec.days, detail:rec.detail, at:Date.now() };
  return rec;
}

  return TrainEngine.stalenessFor({
    history: STATE.history||{},
    customLib: STATE.customLib||{},
    equipment: equipmentAvailable().equipment||[],
    now: Date.now(),
  });
}

async function buildInsightContext(session){
  const lines=[];
  STALE_SAID=false;
  lines.push('Streak: '+currentStreak()+' consecutive week(s) hitting '+weeklyTarget()+'+ sessions. Rest days do not break this.');
  const t=sessionTotals(session);
  lines.push('Today: '+t.logged+'/'+t.total+' sets logged across '+session.ex.length+' exercise(s).');
  const plateaus=[];
  session.ex.forEach(e=>{
    const h=histFor(e).filter(s=>!s.off);
    const misses=e.log.filter(s=>s&&s.fail).length;
    const pr=exHasPR(e)?' (PR today)':'';
    const plateau=plateauFor(e);
    const stale=staleNoteFor();
    if(stale && !STALE_SAID){ STALE_SAID=true; lines.push('STALE: '+stale.text); }
    const gap=TrainEngine.asymmetryFor(histFor(e));
    if(gap) lines.push('SIDES ('+e.name+'): '+gap.text);
    if(plateau){
      plateaus.push({ e, plateau });
      /* What this stall actually calls for. Rest compression ends in
         "wait longer" where every other cause ends in "do less", and the
         coach must not be left to guess which. */
      lines.push('PLATEAU ('+e.name+'): '+TrainEngine.plateauAdvice(plateau));
    }
    if(h.length>=2){
      const delta=r1(h[h.length-1].kg-h[0].kg);
      lines.push('- '+e.name+': '+h.length+' sessions on record, '+(delta>=0?'+':'')+delta+' '+STATE.unit+' over that span, '+misses+' missed set(s) today'+pr+(plateau?' — PLATEAU: weight and reps flat for the last '+plateau.sessions+' sessions at '+plateau.weight+' '+STATE.unit+'.':'.'));
    } else {
      lines.push('- '+e.name+': first time logging this, '+misses+' missed set(s) today'+pr+'.');
    }
  });
  /* The deterministic reads: frequency gaps, weekly set counts, push:pull
     and quad:hamstring balance, and week-over-week ramps. Every one is
     gated on enough data to mean something and says nothing otherwise, so
     an empty list here is the normal case rather than a failure. */
  const findings = TrainEngine.analyse(
    STATE.history || {},
    TrainEngine.indexFrom(STATE.customLib || {}),
    Date.now(),
    analysisOptsFor(),
  );
  findings.forEach(f=> lines.push('PATTERN: '+f.text+(f.estimated?' (muscle split is estimated)':'')));
  TrainEngine.otherTrainingLines(otherLoadNow()).forEach(l=> lines.push(l));
  const acc = accuracyNow();
  if(acc.rate != null && acc.total >= 5){
    lines.push('MY OWN ACCURACY: correct on ' + Math.round(acc.rate*100) + '% of '
      + acc.total + ' suggestions' + (acc.whenWrong ? '; when wrong, ' + acc.whenWrong : '') + '.');
  }
  const damp = TrainEngine.progressionDamping(acc);
  if(damp) lines.push('SELF-CORRECTION: ' + damp.reason);
  TrainEngine.describeParameters(fittedParams()).forEach(l=>
    lines.push('FITTED TO YOU: ' + l));
  /* The whole-body reading, which is where self-reported other training
     is allowed to count. Per-muscle load stays lifting-only. */
  const systemic = TrainEngine.systemicLoadNote({
    history: STATE.history||{},
    index: TrainEngine.indexFrom(STATE.customLib||{}),
    otherTraining: otherEntries(),
    now: Date.now(),
  });
  if(systemic) lines.push('LOAD: ' + systemic);
  /* What the log can and cannot tell apart about volume — never what it
     found. The equivalence verdict is deliberately unsurfaceable (see
     SURFACEABLE in shadow.ts); this says only how precise the record is
     and what would make the question answerable, which is true, useful,
     and nothing anybody cuts training over. Off today; the flag is in
     shadow.ts and turning it on is safe. */
  const resolution = TrainEngine.doseResolutionNote({
    history: STATE.history||{},
    index: TrainEngine.indexFrom(STATE.customLib||{}),
    now: Date.now(),
  });
  if(resolution) lines.push('RESOLUTION: ' + resolution);

  const rec = noteRecovery(await readRecovery());
  /* Only a connected read with data feeds the deload diagnosis. The other
     two both mean "we do not know", and the engine treats an unknown
     recovery as a reason to be gentler, not a reason to guess. */
  const recoveryAvg = rec.status===RECOVERY_STATUS.OK ? rec.avg : null;
  if(rec.status===RECOVERY_STATUS.OK){
    lines.push('Recovery (Vitals, '+rec.days+'-day avg): '+rec.avg+'/100.');
  } else {
    lines.push('Recovery: unavailable ('+rec.status+') — deload decisions fall back to RPE and the shape of the plateau.');
  }
  return { lines, plateaus, recoveryAvg };
}
/* ---- fully automatic deload: no button, no confirmation. When a lift is
   BOTH plateaued and recovery is genuinely low, this is fatigue, not a
   programming problem — so the system drops that lift's suggested weight
   ~12% right now, the same way the progression suggestion already
   auto-adjusts without asking. The note then REPORTS the action (never
   silent), and it's a one-time nudge: the very next real session on that
   lift clears the override and normal progression resumes from there. */
/* Advancing the state machine, once per finished session. The engine owns
   every decision here: which lifts are stalled, what kind of deload each
   needs, and — through limitDeloads — which of them actually drop today.
   A session where four lifts came down reads as failure however defensible
   each one was, so at most two move. */
function advanceDeloads(session, recoveryAvg){
  STATE.deloadStates = STATE.deloadStates || {};
  const ctx = e => ({
    history: histFor(e).filter(x=>!x.off),
    today,
    recovery: recoveryAvg,
    rpe: sessionRpe(e),
    excluded: STATE.deloadExclusions||[],
    sessionLogged: true,
  });

  /* Lifts not already mid-deload compete for the two available slots. */
  const candidates=[];
  session.ex.forEach(e=>{
    const cur=STATE.deloadStates[e.id]||null;
    if(cur && cur.state!=='normal') return;
    const p=plateauFor(e);
    if(p && p.weight>0) candidates.push({ id:e.id, weight:p.weight, plateauLength:p.sessions });
  });
  const allowed=new Set(TrainEngine.limitDeloads(candidates));

  const applied=[];
  session.ex.forEach(e=>{
    const cur=STATE.deloadStates[e.id]||null;
    const mid = cur && cur.state!=='normal';
    if(!mid && !allowed.has(e.id)) return;
    const next=TrainEngine.nextDeloadState(cur, ctx(e));
    STATE.deloadStates[e.id]=next;
    if(cur && cur.state!==next.state && next.state==='deloading'){
      const plan=TrainEngine.deloadPlan(next, trainingAge());
      if(plan.weight!=null) applied.push({ name:e.name, from:next.priorWeight, to:plan.weight, kind:next.kind });
    }
  });
  return applied;
}
/** Records set today, plateaus found, and lifts logged for the first time. */
function sessionSignalInputs(session){
  const records=[], plateaus=[], firsts=[];
  session.ex.forEach(e=>{
    e.log.forEach((s,i)=>{
      if(!s) return;
      const pr=prFor(e,i);
      if(pr.kind){
        const value = pr.kind==='time' ? s.s : pr.kind==='distance' ? s.m
                    : pr.kind==='reps' ? s.reps : (pr.e1rm!=null ? pr.e1rm : s.kg);
        if(value!=null) records.push({ name:e.name, kind:pr.kind, value, unit:pr.unit?(' '+pr.unit):'' });
      }
    });
    const p=plateauFor(e);
    if(p) plateaus.push({ name:e.name, sessions:p.sessions, weight:p.weight });
    const rows=histFor(e).filter(x=>!x.off);
    if(rows.length===1 && rows[0].date===today) firsts.push(e.name);
  });
  return { records, plateaus, firsts };
}
/**
 * One observation per finished session, and ONLY when the maths found
 * something.
 *
 * The gate is briefFor returning null: no signal, no API call, no note. A
 * note that speaks every time will often say something generic, and a
 * reader who gets three of those stops reading the fourth — including the
 * one that mattered.
 */
async function fetchInsight(session){
  try{
    const ctx=await buildInsightContext(session);
    const applied=advanceDeloads(session, ctx.recoveryAvg);
    const inputs=sessionSignalInputs(session);
    const brief=TrainEngine.briefFor({
      history: STATE.history||{},
      index: TrainEngine.indexFrom(STATE.customLib||{}),
      now: Date.now(),
      today,
      records: inputs.records,
      deloadsApplied: applied.map(a=>({ name:a.name, from:a.from, to:a.to, kind:a.kind })),
      plateaus: inputs.plateaus,
      streak: currentStreak(),
      ...athleteContext(),
      firsts: inputs.firsts,
    }, fullGoalContext());

    if(!brief){
      /* Nothing worth saying. Silence is the feature. */
      session.insight={ date:today, text:null };
      render();
      return;
    }
    /* The deterministic sentence is the answer; the model only rephrases
       it. If no model answers, the fact stands on its own. */
    let text=brief.fact;
    try{
      const note=await window.Vitality.getInsight({ goal:fullGoalContext(), digest:brief.prompt });
      if(typeof note==='string' && note.trim()) text=note.trim();
    }catch(err){ /* keep the fact */ }
    session.insight={ date:today, text, signal:brief.signal.kind };
  }catch(err){ session.insight={ date:today, text:null }; }
  render();
}
/** The rolling week, as data — displayable, loggable, pushable later. */
/* Memoized per day. The review is pure and its inputs only change when
   history does, so recomputing analyse() on every render is waste that
   grows with the size of the record. */
let REVIEW_CACHE = null;
function invalidateReview(){ REVIEW_CACHE = null; }
function buildWeeklyReview(){
  const stamp = today + ':' + Object.keys(STATE.history||{}).length + ':' + (STATE.finishedDates||[]).length;
  if(REVIEW_CACHE && REVIEW_CACHE.stamp === stamp) return REVIEW_CACHE.review;
  const review = weeklyReviewUncached();
  REVIEW_CACHE = { stamp, review };
  return review;
}
function weeklyReviewUncached(){
  return TrainEngine.weeklyReview({
    history: STATE.history||{},
    customLib: STATE.customLib||{},
    exerciseNames: STATE.exerciseNames||{},
    /* The same dates the streak counts, against the same target. A
       review that said "0 of 2 sessions" in a week the streak called met
       would be two answers to one question. */
    finishedDates: allTrainingDates(),
    ...athleteContext(),
    now: Date.now(),
  });
}
/**
 * What else was different, in the week that was different.
 *
 * Memoised per day alongside the review, because it walks the same
 * history and the answer cannot change until a session does.
 */
let CHANGE_CACHE = null;
function invalidateChange(){ CHANGE_CACHE = null; }
function weeklyChangeFor(){
  const stamp = today + ':' + Object.keys(STATE.history||{}).length
    + ':' + (STATE.finishedDates||[]).length;
  if(CHANGE_CACHE && CHANGE_CACHE.stamp === stamp) return CHANGE_CACHE.finding;
  const finding = TrainEngine.weeklyChange(changeContext());
  CHANGE_CACHE = { stamp, finding };
  return finding;
}
/* Every input the analysis is allowed to look at, built in one place so
   a metric cannot be silently absent — an absent metric reads as "no
   data" and is simply never reported, which is correct but invisible. */
function changeContext(){
  const deloadDates = [];
  Object.keys(STATE.deloadStates||{}).forEach(id=>{
    const d = STATE.deloadStates[id];
    if(d && (d.state === 'deloading' || d.state === 'reapproach') && d.since) deloadDates.push(d.since);
  });
  return {
    history: STATE.history||{},
    index: TrainEngine.indexFrom(STATE.customLib||{}),
    finishedDates: STATE.finishedDates||[],
    bodyweight: STATE.bodyweight||[],
    otherTraining: otherEntries(),
    vitals: STATE.vitalsDaily||[],
    deloadDates,
    layoffDates: [],
    imported: !!STATE.imported,
    now: Date.now(),
  };
}

/*
 * Shadow findings: computed every finished session, shown to nobody.
 *
 * Minimum effective dose and transfer between lifts are the two things
 * this engine can say that somebody would most likely ACT on — cutting a
 * third of their volume, or dropping a lift. Their gates are resampled
 * from the athlete's own history rather than picked, but no gate has
 * ever been watched against real logs, so both ship silent and write
 * their verdicts down instead.
 *
 * TrainEngine.surface is the only path from a verdict to a sentence, and
 * nothing in this file calls it. Turning one on is a flag in shadow.ts,
 * and then a call site here — two deliberate acts, not one accident.
 */
function shadowLog(){
  const log = STATE.shadowLog;
  return (log && Array.isArray(log.entries)) ? log : TrainEngine.emptyLog();
}
function recordShadowFindings(){
  try{
    const log = shadowLog();
    const ctx = changeContext();
    TrainEngine.recordDose(log, ctx);
    TrainEngine.recordTransfer(log, ctx);
    STATE.shadowLog = log;
  }catch(e){
    /* A finding nobody sees must never be able to break a session. */
  }
}
/* The review command, in the console rather than the board: prints what
   the silent findings would have said, when, and on what evidence.

   It prints readiness too, because "nothing fired" and "nothing could
   have fired" look identical from the outside, and for the first year of
   any real history the second is the true one. A review that could not
   tell them apart would answer the wrong question. */
window.__shadowReview = function(feature){
  console.log(TrainEngine.reviewLines(shadowLog(), feature ? { feature: feature } : {}).join('\n'));
  if(feature && feature !== 'transfer_between_lifts') return;
  const rows = TrainEngine.transferReadiness(changeContext());
  const waiting = rows.filter(function(r){ return !r.ready; });
  console.log('');
  console.log('Pairs still gathering history: ' + waiting.length + ' of ' + rows.length);
  waiting.slice(0, 5).forEach(function(r){
    console.log('  ' + r.pair + ': ' + r.overlapWeeks + ' of ' + r.needed + ' shared weeks');
  });
};

/* Speaks on the days you do not train, and only when it has something. */
function renderWeeklyReview(){
  const el=$('#weeklyReview'); if(!el) return;
  const r=buildWeeklyReview();
  if(!TrainEngine.reviewWorthSending(r)){ el.style.display='none'; el.textContent=''; return; }
  el.style.display='';
  const bands=r.hardSetsByMuscle.filter(m=>m.band!=='in').slice(0,2)
    .map(m=>m.muscle.replace(/_/g,' ')+' '+m.sets+' sets ('+m.band+' band)');
  el.innerHTML='<div class="wrHead">This week</div>'
    + '<div class="wrLine">'+escapeHtml(r.headline)+'</div>'
    + (bands.length ? '<div class="wrLine mu">'+escapeHtml(bands.join(' · '))+'</div>' : '')
    + (r.quiet.length ? '<div class="wrLine mu">Quiet: '+escapeHtml(r.quiet.slice(0,3).join(', ').replace(/_/g,' '))+'</div>' : '')
    + (r.findings.length ? '<div class="wrLine mu">'+escapeHtml(r.findings[0].text)+'</div>' : '')
    + changeLineHtml()
    + (r.estimated ? '<div class="wrLine mu">Muscle splits are estimated for some lifts.</div>' : '');
}
/* One line, or none. A week with nothing that cleared the gates says
   nothing — padding is how a weekly read becomes wallpaper. */
function changeLineHtml(){
  const c = weeklyChangeFor();
  if(!c) return '';
  return '<div class="wrLine mu">' + escapeHtml(c.text)
    + (c.estimated ? ' (estimated inputs)' : '') + '</div>';
}

function renderInsight(session){

  if(!el){ el=document.createElement('div'); el.id='insightBox'; el.className='insightBox'; $('#finishBtn').parentElement.insertAdjacentElement('afterend', el); }

function renderStreak(){

function renderCard(e, session){
  const rx=prescription(e);
  const card=document.createElement('div'); card.className='ex'+(e.collapsed?' collapsed':''); card.dataset.id=e.id;
  const tier = TIER_LABEL[e.tier]||('tier '+e.tier);
  const range = repRangeFor(e);
  const metaBits = [tier, rx.sets+' × '+(range ? range[0]+'-'+range[1] : rx.reps)];
  if(e.lastKg!=null) metaBits.push('last '+e.lastKg+' '+STATE.unit);
  /* What the state machine is doing to this lift, in its own words. The
     engine already produced the sentence; the card does not compose one. */
  const dl = STATE.deloadStates && STATE.deloadStates[e.id];
  /* An incomplete record renders NOTHING, not a partial tag. A stored
     row from an older engine may lack the weight the sentence names, and
     half a sentence about somebody's training is worth less than none. */
  const dlTag = dl && dl.state && dl.state!=='normal' && TrainEngine.deloadDescribable(dl)
    ? '<span class="deloadTag" title="'+escapeHtml(deloadExplain(dl))+'">'+dl.state+'</span>'
    : (e.deload?'<span class="deloadTag">deload</span>':'');
  const meta = metaBits.map(b=>'<span>'+b+'</span>').join('<span class="metaSep">·</span>') + dlTag + (e.group?'<span class="groupTag">superset '+e.group+'</span>':'');
  /* Everything below is a render decision, never a data one: the same
     exercise, the same log, fewer things competing for a thumb. */
  const edit = editing();
  card.innerHTML =
    '<div class="exHead">'
    + (edit ? '<button class="grip" aria-label="Drag to reorder" title="Drag to reorder">'+gripIcon()+'</button>' : '')
    + (edit ? '<button class="exEye" data-act="eye" aria-label="'+(e.collapsed?'Show':'Hide')+'">'+svg(e.collapsed?IC.eyeOff:IC.eyeOpen,' fill="none" stroke="currentColor"')+'</button>' : '')
    /* The name still reads the same; in training mode it is simply not a
       button, because opening form notes is not a thing you do between
       sets. */
    + (edit
        ? '<button class="exName" data-act="form"><span class="nameTxt">'+e.name+'</span><span class="exInfo" data-act="form" aria-label="Form notes">i</span></button>'
        : '<div class="exName"><span class="nameTxt">'+e.name+'</span></div>')
    + (edit ? '<button class="pinBtn '+(e.pinned?'on':'')+'" data-act="pin" aria-label="Pin to top" title="Pin to top">'+(e.pinned?'★':'☆')+'</button>' : '')
    + (edit ? '<button class="menuBtn" data-act="menu" aria-label="More">'+dotsIcon()+'</button>' : '')
    + '</div>'
    + '<div class="exMeta">'+meta+'</div>'
    + (e.note?'<div class="exNote"><span class="ndot">•</span><span>'+escapeHtml(e.note)+'</span></div>':'')
    + '<div class="collapsedNote">'+exDoneCount(e)+' of '+e.log.length+' sets logged · tap the eye to expand</div>'
    + '<div class="exActions">'
    /* Swap survives training mode because the bench being taken is a
       thing that happens while you are standing at the bench. */
    +   '<button class="actionPill" data-act="swap">'+svg(IC.swap,' fill="none" stroke="currentColor"')+'<span class="pl">Swap</span></button>'
    +   (edit ? '<button class="actionPill" data-act="history">'+svg(IC.history,' fill="none" stroke="currentColor"')+'<span class="pl">History</span></button>' : '')
    +   (edit && TrainEngine.sameAsLastTime(histFor(e).filter(x=>!x.off), { excludeDate: today })
          ? '<button class="actionPill" data-act="repeat">'+svg(IC.history,' fill="none" stroke="currentColor"')+'<span class="pl">Repeat</span></button>'
          : '')
    +   (edit ? '<button class="actionPill" data-act="tune">'+svg(IC.tune,' fill="none" stroke="currentColor"')+'<span class="pl">Tune</span></button>' : '')
    +   (edit ? '<button class="actionPill" data-act="whatif">'+svg(IC.history,' fill="none" stroke="currentColor"')+'<span class="pl">What if</span></button>' : '')
    /* Edit mode, like everything else that is not log / rest / swap.
       Generating a ramp reads like a training action, but training mode
       is a promise about what renders between sets and widening it here
       would be the first crack in it. Shown only where there is actually
       a ramp to generate. */
    +   (edit && (TrainEngine.warmupRamp({ workingLb: rx.kg, kind: kindFor(e), plates: plateConfig() }).length || hasWarmupRamp(e))
          ? '<button class="actionPill" data-act="ramp">'+svg(IC.tune,' fill="none" stroke="currentColor"')+'<span class="pl">'+(hasWarmupRamp(e)?'Clear ramp':'Warm-up')+'</span></button>'
          : '')
    + '</div>'
    + '<div class="restSlot"></div>'
    + '<div class="pills"></div>';
  // header actions

  // pills

     training mode disarms it by not rendering the grip. An `if(edit)`
     here would be a second guard saying the same thing, and a guard

  wireDrag(card, e, session);
  return card;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPillGroup(e, rx, idx){
  const s=e.log[idx];
  const frag=document.createElement('div'); frag.className='pillWrap';
  frag.appendChild(renderPill(e, rx, idx));
  /* One reason per lift, under the first unlogged set — every empty set in
     an exercise prefills the same suggestion, so repeating the sentence
     three times would be noise, not explanation. */
  if(!s && idx===e.log.findIndex(x=>!x)){
    const sug=suggestionFor(e, rx);
    if(sug && sug.reason){
      const why=document.createElement('div');
      why.className='pillWhy why-'+sug.basis;
      why.textContent=sug.reason;
      frag.appendChild(why);
    }
    /* What you actually did last time, beside what you are about to do.
       On the next unlogged set only — repeating it down the card would
       be noise — and absent entirely with no history, so nothing renders
       rather than an empty row. */
    const lastText=lastSessionText(e);
    if(lastText){
      const last=document.createElement('div');
      last.className='pillWhy pillLast';
      last.textContent=lastText;
      frag.appendChild(last);
    }
  }
  if(s && !s.fail){
    const drops=document.createElement('div'); drops.className='drops';
    (s.drops||[]).forEach((dr,di)=> drops.appendChild(renderDropRow(e, idx, di)));
    frag.appendChild(drops);
  }
  return frag;
}
/* ---- progression suggestion ----------------------------------------
   The engine decides BOTH the number and the sentence. The tile renders
   `reason` verbatim and never composes progression copy — the wording is
   covered by tests in lib/train/progression.ts, not by DOM code here.
   `now` is passed in because lib/train never reads the clock. */
/**
 * What the tile hands the engine for progression.
 *
 * Built as its own named value rather than inline at the call site, so the
 * boundary can be inspected and asserted directly. Every wiring gap this
 * project has hit was a field that was undefined here while the tile knew
 * perfectly well what it should be, and an inline object literal gives a
 * test nothing to hold on to.
 */
/* ── what the coach is allowed to build from ─────────────────────────
   Every one of these comes from the athlete's own record. The model is
   handed the list and the limits; it does not get to widen either. */
function knownExercises(){
  const lib=STATE.customLib||{}, names=STATE.exerciseNames||{};
  return Object.keys(names).map(id=>{
    const info=lib[id]||{};
    const hist=(STATE.history&&STATE.history[id])||[];
    const last=hist.filter(x=>!x.off).slice(-1)[0];
    return {
      id, name:names[id]||id,
      equipment:String(info.equipment||'').toLowerCase(),
      muscles:TrainEngine.muscleSplitFrom(info).primary.map(c=>c.muscle),
      kind: TrainEngine.SET_KINDS.indexOf(info.kind)>=0 ? info.kind : 'reps_weight',
      sessions: hist.filter(x=>!x.off).length,
      sets: last ? (last.sets||[]).length || 3 : 3,
      reps: 8,
      weight: last ? (TrainEngine.topWorkingWeight(last)||0) : 0,
      rest: 90,
      perSide: info.perSide===true,
      assisted: info.assisted===true,
      repRange: info.repRange||null,
    };
  });
}
/* Equipment on record IS the equipment list — asking for a barbell session
   in a hotel room is the common failure, and the honest signal for what is
   in the room is what the athlete has actually been training with. */
/* Stated kit beats what history implies, and what is in the room TODAY
   beats both — travel and a different gym are the real failure, and an
   inferred list is wrong in exactly that case. */
function equipmentAvailable(){
  return TrainEngine.availableEquipment({
    todayOverride: (STATE.equipmentToday && STATE.equipmentToday.date===today)
      ? STATE.equipmentToday.list : null,
