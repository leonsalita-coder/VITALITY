       The four numbers have already produced values.kg and values.reps
       from the weaker side. */
    if(setK==='reps_weight' && values.sides){
      if(values.reps===0){ doLog(e, idx, values, true); return; }
      doLog(e, idx, values, false);
      return;
    }
    if(setK==='reps_weight' || setK==='reps_only'){
      const reps=Math.round(readNum(row.querySelector('.r')));
      if(!Number.isFinite(reps)||reps<0) return;
      values.reps=reps;
      if(setK==='reps_weight'){
        const kg=readNum(row.querySelector('.w'));
        if(!Number.isFinite(kg)||kg<0) return;
        values.kg=kg;
      }
      /* zero reps is a miss in the kinds that count reps; a plank held for
         zero seconds is just an empty entry, not a failed attempt */
      if(reps===0){ doLog(e, idx, values, true); return; }
    }
    doLog(e, idx, values, false);
  };
  const stop=ev=>ev.stopPropagation();
  row.querySelectorAll('.pillInput').forEach(inp=>{ inp.addEventListener('click',stop); inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); commit(); inp.blur(); } }); });
  if(!logged) row.addEventListener('click', commit);
  const hit=row.querySelector('.pillHit'); if(hit) hit.addEventListener('click',ev=>{ stop(ev); commit(); });
  const miss=row.querySelector('.pillMiss'); if(miss) miss.addEventListener('click',ev=>{
    stop(ev);
    const kg=readNum(row.querySelector('.w'));
    doLog(e, idx, { kind:setK, kg:Number.isFinite(kg)?kg:(e.lastKg!=null?e.lastKg:rx.kg), reps:0 }, true);
  });
  const reset=row.querySelector('.pillReset'); if(reset) reset.addEventListener('click',ev=>{ stop(ev); e.log[idx]=null; stopRest(e.id); render(); });
  const dropBtn=row.querySelector('.pillDrop'); if(dropBtn) dropBtn.addEventListener('click',ev=>{ stop(ev); addDrop(e, idx); });
  const rpeBtn=row.querySelector('[data-act="rpe"]');
  if(rpeBtn) rpeBtn.addEventListener('click',ev=>{ stop(ev); openRpe(e, idx); });
  /* Per-limb entry, armed per row. Optional forever: an unarmed row logs
     one number meaning "both sides, the same", exactly as it always has. */
  const sidesBtn=row.querySelector('[data-act="sides"]');
  if(sidesBtn) sidesBtn.addEventListener('click',ev=>{
    stop(ev);
    const key=e.id+':'+idx;
    sidesArmed[key]=!sidesArmed[key];
    render();
  });
  const amrapBtn=row.querySelector('[data-act="amrap"]');
  if(amrapBtn) amrapBtn.addEventListener('click',ev=>{
    stop(ev);
    if(e.log[idx]) e.log[idx].amrap = !e.log[idx].amrap;
    else { amrapArmed[e.id+':'+idx] = !amrapArmed[e.id+':'+idx]; }
    rollupToday(e); render();
  });
  const warmBtn=row.querySelector('[data-act="warmup"]');
  if(warmBtn) warmBtn.addEventListener('click',ev=>{
    stop(ev);
    if(e.log[idx]) e.log[idx].warmup = !e.log[idx].warmup;
    else {
      /* a plank row has no weight or rep input to read */
      const w=row.querySelector('.w'), r=row.querySelector('.r');
      const sec=row.querySelector('.sec'), met=row.querySelector('.met');
      e.log[idx]={ kind:setK, warmup:true };
      if(w) e.log[idx].kg=parseFloat(w.value)||0;
      if(r) e.log[idx].reps=Math.round(parseFloat(r.value))||0;
      if(sec) e.log[idx].s=Math.round(parseFloat(sec.value))||0;
      if(met) e.log[idx].m=parseFloat(met.value)||0;
    }
    rollupToday(e); render();
  });
  return row;
}
/* One tap per value, plus an explicit way out. Nothing here is required —
   an unset RPE leaves every consumer on its pre-RPE behaviour. */
function openRpe(e, idx){
  const s=e.log[idx]; if(!s) return;
  const values=[6,6.5,7,7.5,8,8.5,9,9.5,10];
  openPop(popHead('How hard was that?','RPE — optional')
    + '<p class="formGist">10 is nothing left. 7 is about three reps in reserve. Skip it if you would rather not guess.</p>'
    + '<div class="swapList">'+values.map(v=>'<button class="swapItem" data-v="'+v+'"><span class="nm">RPE '+v+'</span><span class="mu">'+(v>=9.5?'all out':v>=9?'1 left':v>=8?'2 left':v>=7?'3 left':'4+ left')+'</span></button>').join('')+'</div>'
    + '<button class="pbtn ghost" id="rpeClear" style="width:100%;margin-top:10px">'+(typeof s.rpe==='number'?'Clear':'Skip')+'</button>',
    scrim=>{
      scrim.querySelectorAll('.swapItem[data-v]').forEach(b=> b.onclick=()=>{ s.rpe=parseFloat(b.dataset.v); rollupToday(e); closePop(); render(); });
      scrim.querySelector('#rpeClear').onclick=()=>{ delete s.rpe; rollupToday(e); closePop(); render(); };
    });
}
/**
 * Put a warm-up ramp on this lift.
 *
 * The rows are PREPENDED to the log as unlogged sets carrying warmup:true
 * from creation, so they are excluded from volume, records and
 * progression whether or not the lifter ever presses W. Nothing is
 * logged here — each row still has to be tapped like any other, and the
 * whole ramp can be cleared in one action.
 */
function addWarmupRamp(e){
  const rx = prescription(e);
  const ramp = TrainEngine.warmupRamp({
    workingLb: rx.kg,
    kind: kindFor(e),
    plates: plateConfig(),
  });
  if(!ramp.length) return 0;
  if(hasWarmupRamp(e)) return 0;
  /* The ramp is a PRESCRIPTION, not a log. It adds empty rows at the
     front and the weights they prefill with — writing filled rows into
     the log instead would make every ramp set read as already done, which
     is auto-logging by another name. Each row still has to be tapped. */
  e.ramp = ramp.map(s=>({ kg:s.kg, reps:s.reps }));
  e.log = new Array(ramp.length).fill(null).concat(e.log);
  saveState(); render();
  return ramp.length;
}
/* Clears the generated rows, keeping any the lifter actually logged —
   a set that happened is theirs, whoever suggested it. */
function clearWarmupRamp(e){
  const n=(e.ramp||[]).length; if(!n) return;
  const kept=[];
  for(let i=0;i<n;i++) if(e.log[i]) kept.push(e.log[i]);
  e.log = kept.concat(e.log.slice(n));
  /* Anything kept stays a warm-up row but is no longer part of a ramp,
     so the offsets below cannot drift onto a working set. */
  delete e.ramp;
  saveState(); render();
}
function hasWarmupRamp(e){ return !!(e.ramp && e.ramp.length); }
/* The ramp row at this index, or null for a working set. */
function rampAt(e, idx){
  return (e.ramp && idx < e.ramp.length) ? e.ramp[idx] : null;
}

function addDrop(e, idx){
  const s=e.log[idx]; if(!s) return; s.drops=s.drops||[];
  const lastKg = s.drops.length? s.drops[s.drops.length-1].kg : s.kg;
  s.drops.push({ kg:r1(lastKg*0.8), reps:s.reps }); saveState(); render();
}
function renderDropRow(e, idx, di){
  const s=e.log[idx]; const dr=s.drops[di];
  const row=document.createElement('div'); row.className='dropRow';
  row.innerHTML = '<span class="dropArrow">↳</span><input class="pillInput w small" type="number" inputmode="decimal" value="'+dr.kg+'" aria-label="Drop weight"/><span class="pillUnit">'+STATE.unit+'</span><span class="pillTimes">×</span><input class="pillInput r small" type="number" inputmode="numeric" value="'+dr.reps+'" aria-label="Drop reps"/><button class="dropX" aria-label="Remove drop">×</button>';
  const wIn=row.querySelector('.w'), rIn=row.querySelector('.r');
  const commit=()=>{ const kg=parseFloat(wIn.value); const reps=Math.round(parseFloat(rIn.value)); if(Number.isFinite(kg)&&kg>=0) dr.kg=kg; if(Number.isFinite(reps)&&reps>=0) dr.reps=reps; saveState(); };
  wIn.addEventListener('change',commit); rIn.addEventListener('change',commit);
  row.querySelector('.dropX').addEventListener('click',()=>{ s.drops.splice(di,1); saveState(); render(); });
  return row;
}
function IC_reset(){ return '<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor"><path d="M3.5 6.5 A6 6 0 1 0 6 3.2"/><polyline points="2.4 2.4 3.7 6.6 8 5.2"/></svg>'; }

/* Rows armed as AMRAP but not yet logged. Session-scoped and deliberately
   not persisted: an armed-but-unlogged flag is an intention, not a record,
   and reloading into "you said this set was to failure" about a set that
   never happened would be the app remembering something that did not. */
const amrapArmed = {};
/* Rows armed for per-limb entry. Session-scoped and not persisted, like
   the AMRAP arming: an intention about a set that has not happened is
   not a record of anything. */
const sidesArmed = {};

function doLog(e, idx, values, fail){
  const _sess=curSession(); if(!_sess.startedAt) _sess.startedAt=Date.now();
  const wasComplete = exComplete(e);
  const entry={};
  ['kind','kg','reps','s','m','perSide','assisted','amrap','warmup','sides'].forEach(k=>{ if(values[k]!==undefined) entry[k]=values[k]; });
  /* When this set happened. Observed, not inferred — which is what lets
     the timing reads trust it. Capture is cheap now and impossible
     later: a year of history logged without it cannot be recovered. */
  entry.at=Date.now();
  if(fail){ entry.reps=0; entry.fail=true; }
  e.log[idx]=entry;
  rollupToday(e);
  render();
  // re-find the live card + pill for the shimmer / celebration
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(!fail && card){ const pills=card.querySelectorAll('.pill'); const rowEl=pills[idx]; if(rowEl){ rowEl.classList.add('shimmer'); setTimeout(()=>rowEl.classList.remove('shimmer'),820); } }
  // progressive-overload celebration: a logged set that beats your prior best, completing the lift
  /* Only an estimated-1RM record earns the takeover. Weight and rep PRs
     get the quiet dot on the row — they fire too often early on for a
     celebration to keep meaning anything. */
  if(isBigPR(e, idx) && !wasComplete && exComplete(e) && card){
    card.classList.add('celebrate'); setTimeout(()=>card.classList.remove('celebrate'),1650);
    celebrate(e, entry.kg, entry.reps);
  }
  if(logIsWorking(e.log[idx]) && (!e.group || isLastInGroup(e, curSession()))) startRest(e);
}
/* ---- supersets / circuits: exercises sharing e.group rest together - */
function isLastInGroup(e, session){
  if(!e.group) return true;
  const mem=session.ex.filter(x=>x.group===e.group);
  return mem.length ? mem[mem.length-1].id===e.id : true;
}
function nextGroupLetter(session){
  const used=new Set(session.ex.map(x=>x.group).filter(Boolean));
  for(const l of 'ABCDEFGH') if(!used.has(l)) return l;
  return 'X';
}
function linkWithNext(e, session){
  const idx=session.ex.findIndex(x=>x.id===e.id); const next=session.ex[idx+1]; if(!next) return;
  const gid=e.group||next.group||nextGroupLetter(session);
  e.group=gid; next.group=gid; render();
}
function ungroup(e){ delete e.group; render(); }
/* Flags every history row for a date as abandoned. Never removes them. */
function markAbandoned(date){
  Object.keys(STATE.history||{}).forEach(id=>{
    (STATE.history[id]||[]).forEach(entry=>{ if(entry.date===date) entry.abandoned=true; });
  });
  saveState();
}
/**
 * Recomputes everything cached from history.
 *
 * Backdating or editing a past session invalidates finishedDates and each
 * lift's carried-over weight, and a stale aggregate is worse than none —
 * it looks authoritative. Anything derived is derived again from the rows.
 */
function rederiveFromHistory(){
  invalidateReview();
  invalidateChange();
  invalidateFitted();
  invalidateChange();
  invalidateChange();
  const finished = new Set(STATE.finishedDates||[]);
  Object.keys(STATE.history||{}).forEach(id=>{
    const rows=(STATE.history[id]||[]).filter(x=>!x.off);
    rows.sort((a,b)=>a.date.localeCompare(b.date));
    STATE.history[id]=rows;
    const last=rows[rows.length-1];
    const ex=curSession().ex.find(x=>x.id===id);
    if(ex && last){ const w=TrainEngine.topWorkingWeight(last); if(w>0) ex.lastKg=w; }
  });
  STATE.finishedDates=[...finished].sort();
  saveState();
}
/* One tap to repeat the last session — the fastest path for anyone not
   chasing progression today. */
function repeatLastSession(e){
  const target=TrainEngine.sameAsLastTime(histFor(e).filter(x=>!x.off), { excludeDate: today });
  if(!target || !target.length) return;
  while(e.log.length < target.length) e.log.push(null);
  target.forEach((t,i)=>{
    e.log[i]={ kind:t.kind||kindFor(e) };
    if(t.weight!=null) e.log[i].kg=t.weight;
    if(t.reps!=null) e.log[i].reps=t.reps;
    if(t.seconds!=null) e.log[i].s=t.seconds;
    if(t.metres!=null) e.log[i].m=t.metres;
    if(t.perSide) e.log[i].perSide=true;
    if(t.assisted) e.log[i].assisted=true;
  });
  e.sets=e.log.length;
  rollupToday(e); render();
}
/**
 * The ONE write path from a session exercise into history, for any date.
 *
 * Backdating reuses this rather than adding a second writer: the same field
 * mapping, the same working-set rules, the same top-weight derivation. A
 * parallel path for past days is how the two drift and disagree.
 */
function rollupFor(e, date){
  const done = e.log.filter(s=>s&&!s.fail);
  /* A backdated edit (date !== today) is a whole-day rewrite by design —
     the popup replaces everything logged for that day, and it has no
     "current session" to distinguish. Only for TODAY does a second row
     on the same date mean a second, distinct session rather than an
     edit of the one already open: the sessionId check applies there and
     nowhere else, so history edited from the calendar keeps behaving
     exactly as it always did. */
  const isToday = date===today;
  const sid = isToday ? curSession().id : null;
  let h = histFor(e).filter(x=>x.date!==date || (isToday && x.sessionId!==sid));
  if(done.length){
    /* Per-set weight and the warm-up flag are written from here on, so
       volume and e1RM can tell a ramp-up from the work. Older rows have
       neither and are read with the entry weight and warmup:false. */
    /* Every field the kind uses travels into history, including the kind
       itself — that is what lets an old row stay readable after the lift's
       kind is changed, instead of being reinterpreted in a new unit. */
    const sets=e.log.filter(s=>s).map(s=>{
      const row={ fail:s.fail||undefined, warmup:s.warmup||undefined };
      if(s.kind && s.kind!=='reps_weight') row.kind=s.kind;
      if(s.kg!=null) row.w=s.kg;
      if(s.reps!=null) row.r=s.reps;
      if(s.s!=null) row.s=s.s;
      if(s.m!=null) row.m=s.m;
      if(s.perSide) row.perSide=true;
      if(s.assisted) row.assisted=true;
      if(s.amrap) row.amrap=true;
      if(s.sides) row.sides=s.sides;
      if(s.at!=null) row.at=s.at;
      /* Only ever set by the importer and by migrations. A row that
         carries it is refused by every timing read. */
      if(s.atEstimated) row.atEstimated=true;
      if(s.rpe!=null) row.rpe=s.rpe;
      return row;
    });
    const working=logWorking(e);
    /* The entry's weight is the WORKING weight. Falling back to any
       logged row lets a session that is so far only warm-ups record a
       warm-up as the session weight — and then the suggestion for the
       working sets reads it back and prescribes the heaviest warm-up.
       A ramp made that routine; it was wrong before that too. With
       nothing but warm-ups down, the prescribed weight is the honest
       answer: it is what the lifter is about to work at. */
    const notWarm=done.filter(s=>!s.warmup);
    const pool=working.length?working:notWarm;
    const top=pool.length?pool.reduce((a,b)=>((b.kg||0)>(a.kg||0)?b:a)):null;
    /* The superset this lift was in, recorded with the session. Rest is
       only comparable between sessions of the same shape, and without
       this a switch away from supersets reads as rushing the rest. */
    const row={date, kg: top ? top.kg : prescription(e).kg, sets, sessionId: isToday ? sid : date};
    if(e.group) row.group=e.group;
    h.push(row);
    h.sort((a,b)=>a.date.localeCompare(b.date));
    /* Only a session for TODAY may move the carried-over weight. Editing
       last month must not rewrite what the next session starts from. */
    if(top && top.kg!=null && date===today) e.lastKg=top.kg;
  }
  STATE.history[e.id]=h;
  STATE.exerciseNames=STATE.exerciseNames||{}; STATE.exerciseNames[e.id]=e.name;
  invalidateReview();
}
function rollupToday(e){ return rollupFor(e, today); }

/* ---- header actions router --------------------------------------- */
function handleAct(act, e, session, btn){
  if(act==='eye'){ e.collapsed=!e.collapsed; render(); }
  else if(act==='pin'){ e.pinned=!e.pinned; render(); }
  else if(act==='form'){ openForm(e); }
  else if(act==='history'){ openHistory(e); }
  else if(act==='swap'){ openSwap(e); }
  else if(act==='repeat'){ repeatLastSession(e); }
  else if(act==='tune'){ openTune(e); }
  else if(act==='ramp'){ hasWarmupRamp(e) ? clearWarmupRamp(e) : addWarmupRamp(e); }
  else if(act==='whatif'){ openSimulate(e); }
  else if(act==='menu'){ openMenu(e, session, btn); }
}

/* ====================================================================
   REST TIMER
   ================================================================= */
const restTimers={};
const REST_RING_C = Math.round(2*Math.PI*15*1000)/1000;
let restTicker=null;
let restAudio=null;

/* ── WHAT THIS ENVIRONMENT CANNOT DO ──────────────────────────────────
   A tile is a sandboxed srcDoc iframe on an opaque origin with no
   network. That rules out, permanently and by design:

     • Notification API — needs a permission prompt on a real origin;
       an opaque-origin frame can never be granted it.
     • Wake Lock API — gated by Permissions Policy, unavailable here, so
       the screen will sleep mid-rest and there is nothing to do about it.
     • Live Activity / Dynamic Island / Android ongoing notification —
       no web API exists for any of them at all.
     • Guaranteed execution while backgrounded — a hidden tab has its
       timers throttled to >=1s and a locked phone suspends them
       entirely. Audio is suspended with it.

   So the timer is CORRECT when you come back (time is derived from a
   timestamp, never accumulated) but it cannot reliably make a sound at
   the exact instant zero passes while the phone is face-down and locked.
   That is a native-app capability, and it is deliberately not faked
   here. See docs/train-platform-limits.md.
   ──────────────────────────────────────────────────────────────────── */

function startRest(e){
  stopRest(e.id);
  const rx=prescription(e);
  /* per-exercise rest, which the data already carries */
  const total=Math.max(1, rx.rest);
  restTimers[e.id]={ startedAt:Date.now(), total, adjust:0, chimed:false };
  ensureRestAudio();
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(card) mountRestBar(card, e);
  startRestTicker();
}
/* Derived on every read, never decremented. A countdown that subtracts one
   per tick comes back wrong by exactly however long the phone was asleep —
   which is most of the rest period. */
function restRemaining(t){
  return t.total + t.adjust - Math.round((Date.now()-t.startedAt)/1000);
}
function stopRest(id){
  delete restTimers[id];
  if(!Object.keys(restTimers).length) stopRestTicker();
}
function startRestTicker(){ if(!restTicker) restTicker=setInterval(sweepRest, 250); }
function stopRestTicker(){ if(restTicker){ clearInterval(restTicker); restTicker=null; } }
/* One ticker drives every running bar. Its only job is repainting — the
   numbers come from the clock, so a throttled or skipped tick costs
   smoothness and never accuracy. */
function sweepRest(){
  Object.keys(restTimers).forEach(id=>{
    const t=restTimers[id];
    const remaining=restRemaining(t);
    if(!t.chimed && remaining<=0){
      t.chimed=true;
      /* Only chime if zero passed just now — a brief glance away should
         not eat it, but returning to a tab that elapsed ten minutes ago and
         beeping then is worse than silence. */
      if(remaining>-5) restChime();
    }
    updateRest(id);
  });
}
/* Returning to the tab is the one moment we know the clock jumped, so
   recompute and repaint immediately rather than waiting for a tick. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') sweepRest();
});

/* The AudioContext has to be created inside a user gesture. Logging a set
   is that gesture, and it is the only one that reliably precedes a rest. */
function ensureRestAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!restAudio) restAudio=new AC();
    if(restAudio.state==='suspended') restAudio.resume();
  }catch(err){ restAudio=null; }
}
function restChime(){
  try{
    if(restAudio && restAudio.state==='running'){
      const t0=restAudio.currentTime;
      [0, 0.18].forEach((offset,i)=>{
        const osc=restAudio.createOscillator(), gain=restAudio.createGain();
        osc.type='sine'; osc.frequency.value = i ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, t0+offset);
        gain.gain.exponentialRampToValueAtTime(0.22, t0+offset+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+offset+0.16);
        osc.connect(gain); gain.connect(restAudio.destination);
        osc.start(t0+offset); osc.stop(t0+offset+0.2);
      });
    }
  }catch(err){ /* audio blocked — the vibration below is the fallback */ }
  /* the phone is usually face-down on a bench; vibration is unavailable in
     a sandboxed frame on some browsers, hence the guard */
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(err){}
}
/* Overtime counts UP rather than stopping: how long you actually rested is
   information, and a timer frozen at 0:00 throws it away. */
function restLabelFor(remaining){
  return remaining<=0 ? '+'+mmss(Math.abs(remaining)) : mmss(remaining);
}
function paintRest(bar, t){
  const remaining=restRemaining(t);
  const over=remaining<=0;
  bar.classList.toggle('over',over);
  bar.querySelector('.restTime').textContent = restLabelFor(remaining);
  const ring=bar.querySelector('.restRingFill');
  if(ring){ const pct=Math.max(0,Math.min(1, remaining/(t.total+t.adjust||1))); ring.style.strokeDashoffset=String(REST_RING_C*(1-pct)); }
}
function mountRestBar(card, e){ const slot=card.querySelector('.restSlot'); const t=restTimers[e.id]; if(!t||!slot){ if(slot)slot.innerHTML=''; return; }
  const remaining=restRemaining(t);
  const over=remaining<=0;
  slot.innerHTML='<div class="restbar'+(over?' over':'')+'"><button class="restStep" data-d="-15">−15</button><div class="restMid"><svg class="restRing" viewBox="0 0 36 36" aria-hidden="true"><circle class="restRingTrack" cx="18" cy="18" r="15"/><circle class="restRingFill" cx="18" cy="18" r="15" style="stroke-dasharray:'+REST_RING_C+'"/></svg><div class="restTime">'+restLabelFor(remaining)+'</div><div class="restLabel">'+(e.group?('Superset '+e.group):e.name)+'</div></div><button class="restStep" data-d="15">+15</button><button class="restX" aria-label="Dismiss">×</button></div>';
  paintRest(slot.querySelector('.restbar'), t);
  const nudge=d=>{
    t.adjust+=d;
    /* pushing the finish back past now re-arms the chime */
    if(restRemaining(t)>0) t.chimed=false;
    updateRest(e.id);
  };
  slot.querySelector('[data-d="-15"]').onclick=()=>nudge(-15);
  slot.querySelector('[data-d="15"]').onclick=()=>nudge(15);
  slot.querySelector('.restX').onclick=()=>{ stopRest(e.id); slot.innerHTML=''; };
}

/* ====================================================================
   DRAG TO REORDER
   ================================================================= */
function wireDrag(card, e, session){
  const grip=card.querySelector('.grip'); if(!grip) return;
  grip.addEventListener('pointerdown', ev=>{
    if(e.pinned){ return; } // pinned lifts hold the top
    ev.preventDefault(); grip.classList.add('dragging'); card.classList.add('drag-ghost');
    const wrap=$('#exwrap'); const cards=[...wrap.querySelectorAll('.ex')];
    const move=mev=>{ const y=mev.clientY; let target=null; cards.forEach(c=>{ if(c===card) return; const r=c.getBoundingClientRect(); if(y>r.top && y<r.bottom) target=c; }); if(target){ const r=target.getBoundingClientRect(); const after = y > r.top + r.height/2; wrap.insertBefore(card, after?target.nextSibling:target); } };
    const up=()=>{ grip.classList.remove('dragging'); card.classList.remove('drag-ghost'); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      // commit new order to the session array (respecting pins at top)
      const ids=[...wrap.querySelectorAll('.ex')].map(c=>c.dataset.id);
      session.ex.sort((a,b)=> ids.indexOf(a.id)-ids.indexOf(b.id));
      render(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}

/**
 * Shorten today's session to fit the time actually available.
 *
 * Builds the proposal, shows it, and applies NOTHING until accepted —
 * the engine returns a plan precisely so this screen can show the answer
 * before doing it.
 */
function trimContextFor(minutes){
  const session = curSession();
  const review = buildWeeklyReview();
  /* The reads that decide what is worth keeping already exist: the
     weekly band from the review, and the muscles nothing has trained
     lately from the same findings. */
  const underBand = (review.hardSetsByMuscle || [])
    .filter(m => m.band === 'under').map(m => m.muscle);
  const stale = (review.quiet || []).slice();
  return {
    exercises: (session.ex || []).map(e => ({
      id: e.id, name: e.name, tier: e.tier, sets: e.log.length, rest: e.rest,
      log: e.log, muscles: musclesOf(e.id),
    })),
    minutes: minutes,
    history: STATE.history || {},
    deloadStates: STATE.deloadStates || {},
    underBandMuscles: underBand,
    staleMuscles: stale,
    now: Date.now(),
  };
}
/* Primary muscles this lift trains, from the stored definition. */
function musclesOf(id){
  const split = TrainEngine.muscleSplitFrom((STATE.customLib||{})[id]);
  return split.primary.map(c => c.muscle);
}
/* Applies an accepted proposal. Logged sets are untouched: a reduced
   lift keeps its logged rows and loses only empty ones from the end. */
function applyTrim(plan){
  const session = curSession();
  const drop = new Set(plan.drop.map(d => d.id));
  const sets = {}; plan.reduce.forEach(r => { sets[r.id] = r.sets; });
  session.ex = (session.ex || []).filter(e => !drop.has(e.id));
  session.ex.forEach(e => {
    const target = sets[e.id];
    if (target == null || target >= e.log.length) return;
    const logged = e.log.filter(Boolean).length;
    const keep = Math.max(target, logged);
    /* Trim from the END, and only empty rows — a logged set is a thing
       that happened and no proposal may remove it. */
    while (e.log.length > keep && !e.log[e.log.length - 1]) e.log.pop();
  });
  clearSuggestions(); saveState(); render();
}

function openImport(){

    + '<div class="settingsRow"><span class="bouncyLabel">Strong exported in</span><button class="pbtn ghost" id="impUnit" style="padding:6px 12px">lb</button></div>'
    + '<div id="impStatus" style="margin-top:10px;font-size:var(--fs-caption);min-height:18px"></div>',
    scrim=>{
      let unit='lb';
      const unitBtn=scrim.querySelector('#impUnit');
      unitBtn.onclick=()=>{ unit = unit==='lb' ? 'kg' : 'lb'; unitBtn.textContent=unit; };
      const status=scrim.querySelector('#impStatus');

function runImport(text, unit, status){
  snapshotNow('before import');
  const existing={};
  Object.keys(STATE.history||{}).forEach(id=>{ existing[id]=(STATE.history[id]||[]).map(e=>({date:e.date})); });
  const out=TrainEngine.importCsv(text, {
    userExercises: STATE.exerciseNames||{},
    aliases: STATE.aliases||{},
    strongUnit: unit,
    existing,
  });
  const r=out.report;
  if(r.source==='unknown'){
    status.style.color='var(--fail)';
    status.textContent="That doesn't look like a Hevy or Strong export.";
    return;
  }
  out.entries.forEach(entry=>{
    const def=TrainEngine.catalogExercise(entry.exerciseId);
    if(def) installExerciseDef(def.id, def.name, {
      kind:def.defaultSetKind, perSide:def.unilateral, assisted:false,
      repRange:null, equipment:def.equipment, primary:def.primary,
    });
    else if(!(STATE.exerciseNames||{})[entry.exerciseId]){
      installExerciseDef(entry.exerciseId, entry.displayName, { kind:'reps_weight', equipment:'', primary:[] });
    }
    STATE.history=STATE.history||{};
    const rows=(STATE.history[entry.exerciseId]||[]).filter(x=>x.date!==entry.date);
    /* Imported rows carry atEstimated so the timing reads skip them: no
       timestamp was observed and none is claimed. */
    rows.push({ date:entry.date, kg:entry.kg, imported:r.source,
                sets:entry.sets.map(st=>Object.assign({}, st, { atEstimated:true })) });
    rows.sort((a,b)=>a.date.localeCompare(b.date));
    STATE.history[entry.exerciseId]=rows;
    if((STATE.finishedDates||[]).indexOf(entry.date)<0){ STATE.finishedDates=STATE.finishedDates||[]; STATE.finishedDates.push(entry.date); }
  });
  migrateHistorySessionIds();
  rederiveFromHistory();
  /* Every day the import touched, oldest first — a backdated edit changes
     what was true on those days, and a consumer holding the old payload
     has no way to learn otherwise. */
  for(const d of [...new Set((r.entries||[]).map(x=>x.date))].sort()) publishMetrics(d, 'backdated edit');
  status.style.color='var(--signal)';
  status.innerHTML='Imported <b>'+r.sets+'</b> sets across <b>'+r.sessions+'</b> sessions and <b>'+r.lifts+'</b> lifts'
    + (r.from?', '+fmtDate(r.from)+' to '+fmtDate(r.to):'') + '.'
    + (r.duplicates?'<br/>Skipped '+r.duplicates+' already on record.':'')
    + (r.unresolved.length?'<br/>Not recognised: '+r.unresolved.slice(0,5).map(u=>escapeHtml(u.name)+' ('+u.rows+')').join(', ')+'. Add those by name and re-import.':'');
  render();
}

function editPastSession(id, date){
  const existing=(STATE.history[id]||[]).find(x=>x.date===date);
  const kind=kindFor({id});
  /* A temporary session exercise, seeded from whatever that day already
     holds, so editing and creating are the same operation. */
  const draft={
    id, name:STATE.exerciseNames[id]||id, kind,
    log:(existing? (existing.sets||[]) : []).map(row=>({
      kind:row.kind||kind, kg:row.w, reps:row.r, s:row.s, m:row.m,
      warmup:row.warmup, fail:row.fail, rpe:row.rpe,
      perSide:row.perSide, assisted:row.assisted,
    })),
  };
  const rowsHtml=()=> draft.log.map((row,i)=>
    '<div class="wcItem"><span class="wcTxt">'+(i+1)+'.</span>'
    + (kind==='time' ? '<input class="pillInput bdS" data-i="'+i+'" type="number" value="'+(row.s||0)+'" aria-label="Seconds" /><span class="pillUnit">s</span>'
      : kind==='distance' ? '<input class="pillInput bdM" data-i="'+i+'" type="number" value="'+(row.m||0)+'" aria-label="Metres" /><span class="pillUnit">m</span>'
      : kind==='reps_only' ? '<input class="pillInput bdR" data-i="'+i+'" type="number" value="'+(row.reps||0)+'" aria-label="Reps" /><span class="pillUnit">reps</span>'
      : '<input class="pillInput bdW" data-i="'+i+'" type="number" value="'+(row.kg||0)+'" aria-label="Weight" /><span class="pillUnit">'+STATE.unit+'</span><span class="pillTimes">×</span><input class="pillInput bdR" data-i="'+i+'" type="number" value="'+(row.reps||0)+'" aria-label="Reps" />')
    + '<button class="wcX" data-rm="'+i+'">×</button></div>').join('');

  const render2=scrim=>{
    scrim.querySelector('#bdRows').innerHTML=rowsHtml() || '<p class="emptyHist">No sets on this day yet.</p>';
    scrim.querySelectorAll('[data-rm]').forEach(b=> b.onclick=()=>{ draft.log.splice(+b.dataset.rm,1); render2(scrim); });
    const read=(sel,i)=>{ const el=scrim.querySelector(sel+'[data-i="'+i+'"]'); return el?parseFloat(el.value):NaN; };
    scrim.querySelectorAll('.pillInput').forEach(el=> el.onchange=()=>{
      draft.log.forEach((row,i)=>{
        if(kind==='time') row.s=read('.bdS',i)||0;
        else if(kind==='distance') row.m=read('.bdM',i)||0;
        else if(kind==='reps_only') row.reps=Math.round(read('.bdR',i))||0;
        else { row.kg=read('.bdW',i)||0; row.reps=Math.round(read('.bdR',i))||0; }
      });
    });
  };
  openPop(popHead(fmtDate(date), draft.name)
    + '<div id="bdRows"></div>'
    + '<button class="pbtn ghost" id="bdAdd" style="width:100%;margin-top:10px">Add a set</button>'
    + '<div class="popBtns"><button class="pbtn ghost" id="bdCancel">Cancel</button><button class="pbtn save" id="bdSave">Save</button></div>',
    scrim=>{
      render2(scrim);
      scrim.querySelector('#bdAdd').onclick=()=>{
        const last=draft.log[draft.log.length-1];
        draft.log.push(last? {...last} : { kind, kg:0, reps:kind==='reps_weight'?5:undefined, s:kind==='time'?30:undefined, m:kind==='distance'?20:undefined });
        render2(scrim);
      };
      scrim.querySelector('#bdCancel').onclick=closePop;
      scrim.querySelector('#bdSave').onclick=()=>{
        /* Same write path as a live session, then the same invalidation —
           a backdated edit can change a plateau verdict, so nothing cached
           may survive it. */
        rollupFor(draft, date);
        rederiveFromHistory();
        closePop(); render();
        renderStatsPicker && renderStatsPicker(); drawStatsSection && drawStatsSection();
      };
    });
}

/* ---- segmented control — one shared pill slides under the active
   segment instead of each button flashing its own background. The
   buttons still get fully rebuilt on every call (same as everything
   else in this file), so the indicator uses a FLIP: read its OLD
   screen position from the outgoing DOM before wiping it, then restart
   the fresh one there and transition to its natural spot. Double rAF —
   a single rAF here gets coalesced with the reflow and the browser just
   skips straight to the end state (same bug as the checklist scribble). */
function renderRangeControl(rangeEl, activeKey, onSelect){
  if(!rangeEl) return;
  const reduced=prefersReducedMotion();
  const prevInd=rangeEl.querySelector('.rangeInd');
  const prevRect = prevInd ? prevInd.getBoundingClientRect() : null;
  const containerRectBefore = prevInd ? rangeEl.getBoundingClientRect() : null;
  rangeEl.innerHTML='<div class="rangeInd"></div>'+Object.keys(RANGES).map(k=>'<button class="'+(k===activeKey?'on':'')+'" data-r="'+k+'">'+k+'</button>').join('');
  const ind=rangeEl.querySelector('.rangeInd');
  rangeEl.querySelectorAll('button').forEach(b=> b.onclick=()=> onSelect(b.dataset.r));
  const activeBtn=rangeEl.querySelector('button.on');
  if(!activeBtn || !ind) return;
  const place=()=>{
    const r=activeBtn.getBoundingClientRect(), cr=rangeEl.getBoundingClientRect();
    ind.style.width=r.width+'px';
    ind.style.transform='translateX('+(r.left-cr.left)+'px)';
  };

    ind.style.transform='translateX('+(prevRect.left-containerRectBefore.left)+'px)';
    void ind.offsetWidth;

      ind.style.transition='transform .32s var(--spring), width .32s var(--spring)';

function drawHistory(e, active, setActive){
  const rangeEl=$('#hrange');
  renderRangeControl(rangeEl, active, r=>{ setActive(r); drawHistory(e, r, setActive); });
  const all=histFor(e).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const list=all.filter(s=>daysAgo(s.date)<=RANGES[active]);

  drawStats(e);

}
function topReps(s){ const d=(s.sets||[]).filter(x=>!x.fail).map(x=>x.r); return d.length?Math.max(...d):0; }
function setCount(s){ return (s.sets||[]).length; }
function drawChart(e, list, active){
  const plot=$('#hplot'), cap=$('#hcap');
  if(!list.length){ plot.innerHTML='<svg viewBox="0 0 600 240" preserveAspectRatio="none"><text class="xlab" x="300" y="120" text-anchor="middle">log your first session to start the chart</text></svg>'; cap.textContent=''; return; }
  const VB_W=600,VB_H=240,PADL=46,PADR=20,PADT=22,PADB=36;
  const real=list.filter(s=>!s.off), off=list.filter(s=>s.off);
  const ws=list.map(s=>s.kg);
  let lo=Math.max(0,Math.floor(Math.min(...ws)/5)*5-5), hi=Math.ceil(Math.max(...ws)/5)*5+5;
  if(hi-lo<10) hi=lo+10; if((hi-lo)%10!==0) hi+=5;
  const oldestAgo=Math.max(...list.map(s=>daysAgo(s.date)));
  const domain= active==='ALL'? Math.max(oldestAgo,1):Math.max(RANGES[active],1);
  const X=k=>{ const f=Math.min(1,Math.max(0,1-daysAgo(k)/domain)); return PADL+f*(VB_W-PADL-PADR); };
  const Y=kg=>(VB_H-PADB)-(kg-lo)/(hi-lo)*(VB_H-PADB-PADT);
  const step=(hi-lo)<=30?5:10;
  const best = real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b) : null;
  let svgs='<svg viewBox="0 0 '+VB_W+' '+VB_H+'" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mint);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--mint);stop-opacity:0"/></linearGradient></defs>';
  for(let kg=lo;kg<=hi;kg+=step){ svgs+='<line class="grid" x1="'+PADL+'" y1="'+Y(kg)+'" x2="'+(VB_W-PADR)+'" y2="'+Y(kg)+'"/><text class="axis-label" x="'+(PADL-10)+'" y="'+(Y(kg)+4)+'" text-anchor="end">'+kg+'</text>'; }
  if(real.length){ const pts=real.map(s=>X(s.date)+','+Y(s.kg)); const last=real[real.length-1], first=real[0];
    if(real.length>1){ svgs+='<path class="area" d="M'+X(first.date)+','+(VB_H-PADB)+' L'+pts.join(' L')+' L'+X(last.date)+','+(VB_H-PADB)+' Z"/><polyline class="line" points="'+pts.join(' ')+'"/>'; } }
  let dotI=0;
  off.forEach(s=>{ svgs+='<circle class="dot off" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  real.forEach(s=>{ svgs+='<circle class="dot'+(best&&s.date===best.date?' best':'')+'" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  svgs+='<text class="xlab" x="'+PADL+'" y="'+(VB_H-6)+'" text-anchor="start">'+fmtDate(list[0].date)+'</text><text class="xlab" x="'+(VB_W-PADR)+'" y="'+(VB_H-6)+'" text-anchor="end">today</text></svg>';
  plot.innerHTML=svgs;
  if(real.length>=2){ const d=r1(real[real.length-1].kg-real[0].kg); cap.innerHTML=(d>=0?'+':'')+d+' '+STATE.unit+' <span class="mu">· '+(active==='ALL'?'all time':'in '+active)+'</span>'; }
  else cap.textContent= real.length?'one session here':'';
}
function drawStats(e){
  const real=histFor(e).filter(s=>!s.off);
  const best=real.length?Math.max(...real.map(s=>s.kg)):0;
  const w30=real.filter(s=>daysAgo(s.date)<=30); const d30=w30.length>=2?r1(w30[w30.length-1].kg-w30[0].kg):0;
  const hstats=$('#hstats');
  /* Colour gated on the same value it colours: exactly zero is not a gain
     (d30>0, not >=0) and a "best" is only a real one when there is a
     session to have taken it from (real.length, the same guard already
     used above to compute `best` itself). */
  hstats.innerHTML='<div class="stat"><div class="k">Sessions</div><div class="v">'+real.length+'</div></div><div class="stat"><div class="k">Last 30 days</div><div class="v'+(d30>0?' up':'')+'">'+(d30>0?'+':'')+d30+' '+STATE.unit+'</div></div><div class="stat"><div class="k">Best</div><div class="v'+(real.length?' gold':'')+'">'+best+' '+STATE.unit+'</div></div>';
  animateCounts(hstats);
}
function drawTable(e, all){
  const body=$('#hbody');
  if(!all.length){ body.innerHTML='<tr><td colspan="5"><div class="emptyHist">No sessions yet. Log a set and it lands here.</div></td></tr>'; return; }
  const real=all.filter(s=>!s.off);
  const best= real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b):null;
  body.innerHTML=all.slice().reverse().slice(0,10).map(s=>{
    const prevReal=real.filter(x=>x.date<s.date); const prev=prevReal.length?prevReal[prevReal.length-1]:null;
    const d=prev?r1(s.kg-prev.kg):null; const isBest=best&&s.date===best.date && !s.off;
    const prog = s.off? '<td class="prog first">rest</td>' : (d==null?'<td class="prog first">first</td>':'<td class="prog">'+(d>=0?'+':'')+d+'</td>');
    const w = isBest? '<td><span class="best-w">'+svg('<path d="M12 3.5l2.5 5.1 5.6.8-4 3.9 1 5.6L12 16.9 6.9 18.9l1-5.6-4-3.9 5.6-.8z"/>')+'<span class="num">'+s.kg+'</span> <span class="u">'+STATE.unit+'</span></span></td>' : '<td><span class="num">'+s.kg+'</span> <span class="u">'+STATE.unit+'</span></td>';
    return '<tr><td>'+fmtDate(s.date)+'</td><td>'+setCount(s)+'</td><td>'+topReps(s)+'</td>'+w+prog+'</tr>';
  }).join('');
}

/* ---- generate: a real conversation with the coach ------------------ */
/* ====================================================================
   THE COACH ORB — the FAB doesn't open a modal, it morphs into one. A
   hand-rolled FLIP: the overlay's panel is laid out at its real full-size
   position by CSS, we read that rect, then paint an inline transform that
   makes it START at the FAB's rect (translate+scale down to a circle),
   then clear the transform on the next frame so it animates there. Closing
   reverses the exact same transform. No modal snap, no library. ------- */
let coachOpen=false, coachBusy=false;
let fabConstellation=null, headerConstellation=null;
function initFabConstellation(){
  const canvas=$('#coachFabCanvas'); if(!canvas) return;
  fabConstellation = makeConstellation(canvas, { count:5 });
}
function fabToMorphTransform(morph){
  const fab=$('#coachFab'), fr=fab.getBoundingClientRect(), tr=morph.getBoundingClientRect();
  const sx=fr.width/tr.width, sy=fr.height/tr.height;
  const dx=(fr.left+fr.width/2)-(tr.left+tr.width/2);
  const dy=(fr.top+fr.height/2)-(tr.top+tr.height/2);
  return 'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';
}
function prefersReducedMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function openCoach(){
  if(coachOpen) return; coachOpen=true;
  const session=curSession();
  const messages=[]; // {role:'user'|'ai', text}
  const fab=$('#coachFab'); fab.style.visibility='hidden';
  const root=$('#coachRoot');
  root.innerHTML = '<div class="coachOverlay" id="coachOverlay"><div class="cvBackdrop" id="cvBackdrop"></div><div class="coachMorph" id="coachMorph">'
    + '<button class="cvClose" aria-label="Close">'+svg('<path d="M6 6l12 12M18 6L6 18"/>',' fill="none" stroke="currentColor"')+'</button>'
    + '<div class="cvCanvasWrap"><canvas id="cvCanvas"></canvas></div>'
    + '<div class="cvHead"><div class="cvTitle">Your Coach</div><div class="cvStatus" id="cvStatus"><span id="cvStatusTxt">Ready</span><span class="cvWave"><span></span><span></span><span></span><span></span></span></div></div>'
    + '<div class="cvLog" id="cvLog"><p class="cvEmpty">Tell me what you\'ve got — time, equipment, what you want to train — and I\'ll build today\'s session.</p></div>'
    + '<div id="cvResult"></div>'
    + '<div class="cvInputRow"><input id="cvIn" placeholder="e.g. 30 min, dumbbells only, explosiveness for taekwondo" autocomplete="off"/><button class="cvSend" id="cvSend" aria-label="Send">'+svg('<path d="M12 19V5M6 11l6-6 6 6"/>',' fill="none" stroke="currentColor"')+'</button></div>'
    + '</div></div>';
  const overlay=$('#coachOverlay'), morph=$('#coachMorph');
  const reduced=prefersReducedMotion();
  headerConstellation = makeConstellation($('#cvCanvas'), { count:7, startCollapsed:!reduced, force:true });
  if(reduced){
    overlay.classList.add('open');
  } else {
    morph.style.transform=fabToMorphTransform(morph);
    morph.style.opacity='.5';
    void morph.offsetWidth;
    requestAnimationFrame(()=>{
      morph.style.transition='transform .6s var(--ease-momentum), opacity .35s ease';
      morph.style.transform='translate(0,0) scale(1,1)';
      morph.style.opacity='1';
      overlay.classList.add('open');
    });
  }
  const log=$('#cvLog'), input=$('#cvIn'), sendBtn=$('#cvSend'), result=$('#cvResult'), statusTxt=$('#cvStatusTxt');
  function paint(){
    log.innerHTML = messages.map(m=>'<div class="cvMsg '+m.role+'">'+escapeHtml(m.text)+'</div>').join('');
    log.scrollTop = log.scrollHeight;
  }
  async function send(){
    const text=input.value.trim(); if(!text || coachBusy) return;
    coachBusy=true;
    messages.push({role:'user', text}); input.value=''; paint();
    setBtnState(sendBtn,'loading'); input.disabled=true;
    overlay.classList.add('thinking'); if(fabConstellation) fabConstellation.setMode('thinking'); if(headerConstellation) headerConstellation.setMode('thinking'); statusTxt.textContent='Thinking…';
    try{
      const history = messages.map(m=>({role:m.role==='user'?'user':'assistant', text:m.text}));
      const constraints = planConstraints(statedMinutes(text));
      const ask = extra => window.Vitality.generateWorkout({
        goal: fullGoalContext(),
        messages: extra ? history.concat([{role:'user', text:extra}]) : history,
        /* the model picks from this list; it does not get to invent one */
        allowed: constraints.known.map(k=>({ id:k.id, name:k.name, equipment:k.equipment, kind:k.kind })),
        equipment: constraints.equipment,
        minutes: constraints.minutes,
        avoid: constraints.painFlagged,
      });

      let res = await ask(null);
      if(res && res.kind==='question'){
        messages.push({role:'ai', text:res.text}); paint();
      } else {
        let plan = TrainEngine.planSession(res && res.exercises, constraints);
        /* One retry, telling it exactly what it got wrong. If the second
           answer is no better we stop asking and build the session from
           the athlete's own lifts — the app has to produce something
           usable offline, rate-limited, or with no key at all. */
        if(plan.source==='template' && plan.violations.length){
          const retry = await ask('That did not fit. Fix these and answer again: '+plan.violations.slice(0,5).join('; '));
          const second = TrainEngine.planSession(retry && retry.exercises, constraints);
          if(second.source==='model') { plan = second; res = retry; }
        }
        if(plan.ok){
          plan.warmup = (res && res.warmup) || [];
          plan.cooldown = (res && res.cooldown) || [];
          messages.push({role:'ai', text: plan.source==='model'
            ? ((res && res.reply) || 'Here’s your session.')
            : 'Built one from your own lifts.'});
          paint();
          showApply(plan, session, result);
        } else {
          messages.push({role:'ai', text:"Couldn't build that — log a few lifts first and I'll have something to work with."});
          paint();
        }
      }
    }catch(err){
      const reason=err&&err.message;
      messages.push({role:'ai', text: reason==='no_key' ? 'Add your own Anthropic key to use this — ask your mentor.' : "Couldn't reach the coach — try again."});
      paint();
    }
    overlay.classList.remove('thinking'); if(fabConstellation) fabConstellation.setMode('idle'); if(headerConstellation) headerConstellation.setMode('idle'); statusTxt.textContent='Ready';
    setBtnState(sendBtn,null); input.disabled=false; input.focus(); coachBusy=false;
  }
  sendBtn.onclick=send;
  input.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); send(); } });
  input.addEventListener('focus',()=>{ if(!overlay.classList.contains('thinking')) statusTxt.textContent='Listening'; });
  input.addEventListener('blur',()=>{ if(!overlay.classList.contains('thinking')) statusTxt.textContent='Ready'; });
  overlay.querySelector('.cvClose').onclick=closeCoach;
  $('#cvBackdrop').onclick=closeCoach;
  const escHandler2=ev=>{ if(ev.key==='Escape') closeCoach(); };
  document.addEventListener('keydown', escHandler2);
  overlay._escHandler=escHandler2;
  input.focus();
}
function closeCoach(){
  const overlay=$('#coachOverlay'); if(!overlay || !coachOpen) return;
  coachOpen=false;
  if(overlay._escHandler) document.removeEventListener('keydown', overlay._escHandler);
  const morph=$('#coachMorph'); const fab=$('#coachFab');
  overlay.classList.remove('open');
  const cleanup=()=>{ $('#coachRoot').innerHTML=''; fab.style.visibility=''; if(headerConstellation){ headerConstellation.destroy(); headerConstellation=null; } };
  if(prefersReducedMotion()){ cleanup(); return; }
  morph.style.transform=fabToMorphTransform(morph);
  morph.style.opacity='.4';
  setTimeout(cleanup, 340);
}
function showApply(plan, session, result){
  /* `plan` has already been through TrainEngine.planSession — every
     exercise is one the athlete has on record, within every cap, and
     normalised by the same validator a typed lift goes through. Nothing
     here reads the model's response directly. */
  const used=new Set(session.ex.map(x=>x.id));
  const defs=plan.exercises.map(p=>{
    if(used.has(p.id)) return null;
    used.add(p.id);
    installExerciseDef(p.id, p.name, {
      kind:p.kind, perSide:p.perSide, assisted:p.assisted, repRange:p.repRange,
      equipment:p.equipment, primary:p.muscles,
    });
    return sessionExerciseFrom(p);
  }).filter(Boolean);

  const warmup=(plan.warmup||[]).map(t=>({text:t, done:false}));
  const cooldown=(plan.cooldown||[]).map(t=>({text:t, done:false}));
  const note = plan.source==='template'
    ? '<p class="formGist">Built from your own lifts — the coach could not be reached, or what it suggested did not fit your equipment and time.</p>'
    : (plan.violations && plan.violations.length
        ? '<p class="formGist">Trimmed to fit: '+escapeHtml(plan.violations.slice(0,3).join('; '))+'</p>'
        : '');
  result.innerHTML = note + '<div class="popBtns" style="margin-top:14px"><button class="pbtn ghost" id="genAdd">Add alongside</button><button class="pbtn save" id="genReplace">Replace today</button></div>';
  result.querySelector('#genAdd').onclick=()=>{ session.ex.push(...defs); if(warmup.length) session.warmup=session.warmup.concat(warmup); if(cooldown.length) session.cooldown=session.cooldown.concat(cooldown); closeCoach(); render(); };
  result.querySelector('#genReplace').onclick=()=>{ session.ex.forEach(x=>stopRest(x.id)); session.ex=defs; session.warmup=warmup; session.cooldown=cooldown; closeCoach(); render(); };
}
/* The ONE place an exercise definition is written. Both creation paths go
   through it, so a generated lift cannot be shaped differently from a
   typed one. */
function installExerciseDef(id, name, fields){
  STATE.customLib=STATE.customLib||{};
  const info=STATE.customLib[id]||(STATE.customLib[id]={});
  info.equipment=fields.equipment||info.equipment||'';
  info.primary=fields.primary||info.primary||[];
  info.kind=fields.kind||'reps_weight';
  if(fields.perSide) info.perSide=true; else delete info.perSide;
  if(fields.assisted) info.assisted=true; else delete info.assisted;
  if(fields.repRange) info.repRange=fields.repRange; else delete info.repRange;
  STATE.exerciseNames=STATE.exerciseNames||{};
  STATE.exerciseNames[id]=name;
}
/* The ONE place a session exercise is built from a definition. */
function sessionExerciseFrom(p){
  const seeded = p.weight || TrainEngine.startingWeightFor(STATE, p.id) || 0;
  return { id:p.id, name:p.name, tier:2, sets:p.sets, reps:p.reps, kg:seeded,
           perHand:p.perSide, rest:p.rest, lastKg:lastKgFromHistory(p.id),
           pinned:false, collapsed:false, deload:false, note:'',
           log:Array(p.sets).fill(null) };
}

/* ---- tune popup --------------------------------------------------- */
function openTune(e){
  const existing=repRangeFor(e);
  const draft={ kg:e.kg, reps:e.reps, sets:e.sets, rest:e.rest, maxReps: existing?existing[1]:null,
                kind:kindFor(e), perSide:flagFor(e,'perSide'), assisted:flagFor(e,'assisted') };
  const startingKind=draft.kind;
  const loggedCount=e.log.filter(s=>s).length;
  const showMax=()=> draft.maxReps==null ? 'off' : String(draft.maxReps);
  openPop(popHead('Tune', e.name)
    + '<div style="margin-top:18px"></div>'
    + fieldRow('Weight','<input class="wInput" id="tw" type="number" inputmode="decimal" step="0.5" value="'+draft.kg+'"><span class="wUnit">'+STATE.unit+(e.perHand?'/ea':'')+'</span>', 'weight')
    + stepRow('Sets','tsets', draft.sets, 'sets')
    + stepRow('Reps','treps', draft.reps, 'reps')
    + stepRow('Top reps','tmax', draft.maxReps==null?'off':draft.maxReps, 'maxReps')
    + '<p class="settingsNote">Off means every clean session adds weight. Set a top rep and you chase reps first, then add weight and drop back to '+draft.reps+'.</p>'
    + stepRow('Rest','trest', mmss(draft.rest), 'rest')
    + '<div class="secLbl">How this is measured</div>'
    + '<div class="swapList" id="kindList">'+TrainEngine.SET_KINDS.map(k=>'<button class="swapItem'+(draft.kind===k?' on':'')+'" data-kind="'+k+'"><span class="nm">'+KIND_LABELS[k]+'</span><span class="mu">'+KIND_UNITS[k]+'</span></button>').join('')+'</div>'
    + '<div class="settingsRow"><span class="bouncyLabel'+(draft.perSide?' on':'')+'" id="psLbl">Logged one side at a time</span><button class="pbtn ghost" id="tps" style="padding:6px 12px">'+(draft.perSide?'Yes':'No')+'</button></div>'
    + '<div class="settingsRow"><span class="bouncyLabel'+(draft.assisted?' on':'')+'" id="asLbl">Machine takes weight off</span><button class="pbtn ghost" id="tas" style="padding:6px 12px">'+(draft.assisted?'Yes':'No')+'</button></div>'
    + '<p class="settingsNote">Assisted means the number you log is the help, not the load — so less of it is progress.</p>'
    + '<div class="popBtns"><button class="pbtn ghost" id="tcancel">Cancel</button><button class="pbtn save" id="tsave">Save</button></div>',
    scrim=>{
      /* The invariant, enforced in one place after every change rather
         than re-derived inside each branch: a top rep is either off, or
         strictly above the bottom and no higher than 50. */
      const clampRange=()=>{
        if(draft.maxReps==null) return;
        if(draft.reps>=50){ draft.maxReps=null; return; }
        draft.maxReps=Math.min(50, Math.max(draft.maxReps, draft.reps+1));
      };
      const sync=()=>{ scrim.querySelector('#tsets .stepVal').textContent=draft.sets; scrim.querySelector('#treps .stepVal').textContent=draft.reps; scrim.querySelector('#tmax .stepVal').textContent=showMax(); scrim.querySelector('#trest .stepVal').textContent=mmss(draft.rest); };
      scrim.querySelector('#tw').oninput=ev=>{ const v=parseFloat(ev.target.value); if(Number.isFinite(v)) draft.kg=v; };
      scrim.querySelectorAll('.step').forEach(b=> b.onclick=()=>{ const f=b.dataset.f, d=+b.dataset.d;
        if(f==='rest'){ draft.rest=Math.max(0,draft.rest+d*15); }
        else if(f==='sets'){ draft.sets=Math.min(8,Math.max(Math.max(1,loggedCount),draft.sets+d)); }
        else if(f==='reps'){
          draft.reps=Math.min(50,Math.max(1,draft.reps+d));
          /* the top of the range has to stay above its bottom; push it up
             rather than silently dropping a range they deliberately set */
        }
        else if(f==='maxReps'){
          if(draft.maxReps==null){ draft.maxReps = d>0 && draft.reps<50 ? draft.reps+1 : null; }
          /* stepping below the bottom of the range is how you turn it off */
          else if(d<0 && draft.maxReps<=draft.reps+1){ draft.maxReps=null; }
          else { draft.maxReps=draft.maxReps+d; }
        }
        clampRange();
        sync(); });
      scrim.querySelectorAll('.swapItem[data-kind]').forEach(b=> b.onclick=()=>{
        draft.kind=b.dataset.kind;
        scrim.querySelectorAll('.swapItem[data-kind]').forEach(x=>x.classList.toggle('on', x.dataset.kind===draft.kind));
      });
      const flagBtn=(sel,lbl,key)=>{
        const btn=scrim.querySelector(sel);
        btn.onclick=()=>{ draft[key]=!draft[key]; btn.textContent=draft[key]?'Yes':'No'; scrim.querySelector(lbl).classList.toggle('on', draft[key]); };
      };
      flagBtn('#tps','#psLbl','perSide');
      flagBtn('#tas','#asLbl','assisted');
      scrim.querySelector('#tcancel').onclick=closePop;
      const commitTune=()=>{
        if(draft.kind!==startingKind) snapshotNow('before kind change');
        setExerciseField(e,'kind', draft.kind==='reps_weight'?undefined:draft.kind);
        setExerciseField(e,'perSide', draft.perSide);
        setExerciseField(e,'assisted', draft.assisted);
        e.perHand=draft.perSide;
        doSave();
      };
      const doSave=()=>{ e.kg=Number.isFinite(draft.kg)?draft.kg:e.kg; e.reps=draft.reps; e.rest=draft.rest;
        setRepRange(e, (draft.maxReps!=null && draft.maxReps>draft.reps) ? [draft.reps, draft.maxReps] : null);
        // grow / shrink the set list, keeping logged sets
        if(draft.sets>e.log.length){ while(e.log.length<draft.sets) e.log.push(null); }
        else if(draft.sets<e.log.length){ e.log=e.log.slice(0,Math.max(loggedCount,draft.sets)); }
        e.sets=e.log.length; closePop(); render(); };
      scrim.querySelector('#tsave').onclick=()=>{
        const logged=historyKinds(e).filter(k=>k!==draft.kind);
        /* Old rows are never rewritten — they stay readable under the kind
           they were logged with. But they stop feeding progression, because
           seconds and pounds are not comparable, so this is not something to
           do silently to someone's training record. */
        if(draft.kind!==startingKind && logged.length){
          closePop();
          openPop(popHead('Change how this is measured?', e.name)
            + '<p class="formGist">'+escapeHtml(e.name)+' has '+histFor(e).filter(x=>!x.off).length+' session(s) logged as '+logged.map(k=>KIND_LABELS[k]).join(', ')+'. Those stay exactly as they are and remain visible in History.</p>'
            + '<p class="formGist">They will stop counting toward progression, plateaus and records for this lift, because '+KIND_UNITS[startingKind]+' and '+KIND_UNITS[draft.kind]+' are not the same quantity. It starts fresh in the new unit.</p>'
            + '<div class="popBtns"><button class="pbtn ghost" id="kcancel">Keep it as it is</button><button class="pbtn save" id="kgo">Change it</button></div>',
            s2=>{
              s2.querySelector('#kcancel').onclick=closePop;
              s2.querySelector('#kgo').onclick=()=>{ commitTune(); };
            });
          return;
        }
        commitTune();
      };
    });
}

/* ====================================================================
   PROGRESS PHOTOS — fanned like a hand of prints, newest on top. Upload
   + AI analysis via window.Vitality.addProgressPhoto, stored as
   {url, date, analysis} refs only; the actual bytes live in the owner's
   own Supabase Storage (supabase/photos.sql), never in tile_data itself.
   No deps (no gsap) — spring settle comes from this tile's own
   var(--spring) token; hover lifts + previews the caption, tap on
   mobile jumps a card to center, arrows/dots page past 7 photos.
   ================================================================= */
const FAN_MAX=7, FAN_HALF=3, FAN_K=3.3;
const FAN_POS=[
  {rot:-21,scale:.7756,x:-30,y:7.3,z:1},{rot:-14,scale:.8498,x:-22,y:4.0,z:2},{rot:-7,scale:.9346,x:-11,y:1.3,z:3},
  {rot:0,scale:1,x:0,y:0,z:10},
  {rot:7,scale:.9346,x:11,y:1.3,z:3},{rot:14,scale:.8498,x:22,y:4.0,z:2},{rot:21,scale:.7756,x:30,y:7.3,z:1},
];
let photoCenter=0, photoHoverI=null, photoPrevVisible=new Set();
function fanSlotConfig(n, slot){
  if(n>=FAN_MAX) return FAN_POS[slot];
  const center=(n-1)/2, dist=center>0?(slot-center)/center:0, ad=Math.abs(dist);
  return { rot:dist*21, scale:1-0.2244*ad*ad, x:dist*30, y:ad*ad*7.3, z:10-Math.round(Math.abs(slot-center)) };
}
function photosNewestFirst(){ return (STATE.photos||[]).map((p,i)=>({p,i})).reverse(); }
const FAN_CHEV_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="15 18 9 12 15 6"/></svg>';
const FAN_CHEV_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="9 18 15 12 9 6"/></svg>';

function renderPhotos(){
  const el=$('#photoGallery'); if(!el) return;
  const list=photosNewestFirst();
  photoHoverI=null;
  if(!list.length){ el.innerHTML='<p class="emptyHist">No progress photos yet.</p>'; photoPrevVisible=new Set(); return; }
  const paginated=list.length>FAN_MAX;
  photoCenter = paginated ? FAN_HALF : Math.round((list.length-1)/2);
  el.innerHTML =
      '<div class="fanWrap"><div class="fanStage" id="fanStage">'
    + list.map(({p,i})=> '<div class="photoCard" data-i="'+i+'">'
        + (p.url ? '<img src="'+p.url+'" alt="progress photo" class="photoImg" loading="lazy"/>'
                 : '<div class="photoImg photoImg--pending skeleton-shimmer"></div>')
        + '</div>').join('')
    + '</div></div>'
    + '<div class="fanCaption" id="fanCaption"></div>'
    + (paginated
        ? '<div class="fanNav"><button class="fanArrow" data-dir="left" aria-label="Previous photo">'+FAN_CHEV_L+'</button>'
          + '<div class="fanDots" id="fanDots"></div>'
          + '<button class="fanArrow" data-dir="right" aria-label="Next photo">'+FAN_CHEV_R+'</button></div>'
        : '');
  photoPrevVisible=new Set();
  layoutPhotoFan('mount');
  wirePhotoCards();
  if(paginated) el.querySelectorAll('.fanArrow').forEach(b=> b.onclick=()=> cyclePhotos(b.dataset.dir));
}

function cyclePhotos(dir){
  const n=(STATE.photos||[]).length;
  if(n<=FAN_MAX) return;
  photoCenter = dir==='right' ? (photoCenter+1)%n : (photoCenter-1+n)%n;
  photoHoverI=null;
  layoutPhotoFan(dir==='right'?'cycle-right':'cycle-left');
}

function layoutPhotoFan(mode){
  const stage=$('#fanStage'); if(!stage) return;
  const cards=Array.from(stage.children);
  const n=cards.length; if(!n) return;
  const paginated=n>FAN_MAX;
  const map=new Map();
  if(!paginated) cards.forEach((_,i)=>map.set(i,i));
  else for(let slot=0;slot<FAN_MAX;slot++) map.set(((photoCenter+slot-FAN_HALF)%n+n)%n, slot);
  const slotN=paginated?FAN_MAX:n;
  const reduced=prefersReducedMotion();
  const isMount=mode==='mount';
  const dir=mode==='cycle-left'?'left':mode==='cycle-right'?'right':null;

  cards.forEach((card,domIdx)=>{
    const slot=map.get(domIdx);
    const wasVisible=photoPrevVisible.has(domIdx);
    card.style.pointerEvents = slot!==undefined ? 'auto' : 'none';
    card.style.transitionDelay='0s';

    if(slot!==undefined){
      const c=fanSlotConfig(slotN,slot);
      const hot = photoHoverI!==null && +card.dataset.i===photoHoverI;
      const finalT='translate(-50%,-50%) translate('+(c.x*FAN_K).toFixed(1)+'px,'+(c.y*FAN_K-(hot?10:0)).toFixed(1)+'px) rotate('+c.rot.toFixed(1)+'deg) scale('+(hot?c.scale*1.06:c.scale).toFixed(3)+')';
      card.style.zIndex = hot ? 20 : c.z;
      if(reduced){ card.style.transition='none'; card.style.opacity='1'; card.style.transform=finalT; }
      else if(isMount){
        card.style.transition='none'; card.style.opacity='0';
        card.style.transform='translate(-50%,-50%) translate(0,60px) scale(.5)';
        void card.offsetWidth;
        card.style.transitionDelay=(0.12+slot*0.05)+'s';
        card.style.transition='transform var(--d5) var(--spring), opacity var(--d4) var(--ease-out)';
        requestAnimationFrame(()=>{ card.style.opacity='1'; card.style.transform=finalT; });
      } else if(!wasVisible && dir){
        const enterX = dir==='right' ? 200 : -200;
        card.style.transition='none'; card.style.opacity='0';
        card.style.transform='translate(-50%,-50%) translate('+enterX+'px,'+(c.y*FAN_K).toFixed(1)+'px) rotate('+(dir==='right'?26:-26)+'deg) scale(.5)';
        void card.offsetWidth;
        card.style.transition='transform var(--d4) var(--ease-momentum), opacity var(--d3) var(--ease-out)';
        requestAnimationFrame(()=>{ card.style.opacity='1'; card.style.transform=finalT; });
      } else {
        card.style.transition='transform var(--d3) var(--spring), opacity var(--d2) var(--ease-out)';
        card.style.opacity='1'; card.style.transform=finalT;
      }
    } else if(wasVisible && dir){
      const exitX = dir==='right' ? -200 : 200;
      card.style.transition='transform var(--d3) var(--ease-out), opacity var(--d3) var(--ease-out)';
      card.style.zIndex=0; card.style.opacity='0';
      card.style.transform='translate(-50%,-50%) translate('+exitX+'px,0) rotate('+(dir==='right'?-26:26)+'deg) scale(.5)';
    } else {
      card.style.transition = reduced ? 'none' : 'transform var(--d3) var(--ease-out), opacity var(--d3) var(--ease-out)';
      card.style.opacity='0'; card.style.zIndex=0;
      card.style.transform='translate(-50%,-50%) scale(.4)';
    }
  });
  photoPrevVisible=new Set(map.keys());

  const centerDomIdx = paginated ? photoCenter : Math.round((slotN-1)/2);
  const centerCard = cards[centerDomIdx];
  updatePhotoCaption(photoHoverI!==null ? photoHoverI : (centerCard? +centerCard.dataset.i : null));
  if(paginated) renderPhotoDots(n);
}

function handlePhotoFile(input){
  const status=$('#photoStatus');
  const file=input.files && input.files[0]; input.value='';
  if(!file) return;
  if(!file.type.startsWith('image/')){ status.textContent='That’s not an image.'; return; }
  if(file.size > 10*1024*1024){ status.textContent='Photo’s too large — try one under 10MB.'; return; }
  status.innerHTML='<span class="miniSpinner"></span>Uploading…';
  const reader=new FileReader();
  reader.onload=async()=>{
    const dataUrl=String(reader.result||'');
    const comma=dataUrl.indexOf(',');
    const mime=(dataUrl.slice(5,dataUrl.indexOf(';'))||'image/jpeg');
    const base64=dataUrl.slice(comma+1);
    const entry={ url:null, date:today, analysis:undefined };
    STATE.photos=STATE.photos||[]; STATE.photos.push(entry); saveState(); renderPhotos();

      const res=await window.Vitality.addProgressPhoto({ base64, mime, goal:fullGoalContext() });

    else { status.innerHTML='<span class="miniCheck">✓</span>Saved'; setTimeout(()=>{ status.innerHTML=''; },1400); }

   OVERVIEW CARDS — fixed at-a-glance summary above the interactive
   picker. Every number here is real arithmetic over data already
   collected; nothing invented (no heart rate / calories / VO2 — this
   app doesn't have that data, so it doesn't pretend to).

/* Same unit as the current streak, so the two can be read side by side. */
function longestStreak(){ return TrainEngine.longestWeekStreak(allTrainingDates(), weeklyTarget(), Date.now()); }
function totalPRsAllTime(){
  let count=0;
  Object.keys(STATE.history||{}).forEach(id=>{
    const h=(STATE.history[id]||[]).filter(s=>!s.off).slice().sort((a,b)=>a.date.localeCompare(b.date));
    let bestKgSoFar=0, bestRepsAtBest=0;
    h.forEach(entry=>{
      const topR=TrainEngine.topWorkingReps(entry);
      const topW=TrainEngine.topWorkingWeight(entry)||entry.kg||0;
      const isPr = topW>bestKgSoFar || (topW===bestKgSoFar && topR>bestRepsAtBest);
      if(isPr){ if(bestKgSoFar>0) count++; bestKgSoFar=Math.max(bestKgSoFar,topW); bestRepsAtBest=Math.max(bestRepsAtBest,topR); }
    });
  });
  return count;
}
function weeksSinceStart(){
  const dates=[...(STATE.finishedDates||[])].sort();
  if(!dates.length) return 1;
  const [y,m,d]=dates[0].split('-').map(Number);
  const days=Math.max(1, Math.round((new Date()-new Date(y,m-1,d))/DAY));
  return Math.max(1, days/7);
}
function weekdayCounts(){
  const counts=[0,0,0,0,0,0,0];
  (STATE.finishedDates||[]).forEach(k=>{ const [y,m,d]=k.split('-').map(Number); counts[new Date(y,m-1,d).getDay()]++; });
  return counts;
}
function muscleVolumeBreakdown(){
  /* Contribution-weighted and mapped to the closed list, so a lift that is
     mostly chest is not counted as equally chest and triceps, and so two
     spellings of one muscle are one bar rather than two short ones. */
  const map={}; let anyEstimated=false; const unmapped={};
  Object.keys(STATE.history||{}).forEach(id=>{
    const split=TrainEngine.muscleSplitFrom((STATE.customLib||{})[id]||{});
    split.unmapped.forEach(u=>{ unmapped[u]=true; });
    if(!split.primary.length && !split.secondary.length) return;
    if(split.estimated) anyEstimated=true;
    const factor=(STATE.customLib&&STATE.customLib[id]&&STATE.customLib[id].bodyweightFactor)
      || (TrainEngine.catalogExercise(id)||{}).bodyweightFactor || null;
    const vol=(STATE.history[id]||[]).filter(s=>!s.off).reduce((a,s)=>a+TrainEngine.workingVolume(s, {
      bodyweightLb: bodyweightOn(s.date), bodyweightFactor: factor }).load,0);
    const spread=TrainEngine.distribute(vol, split);
    Object.keys(spread).forEach(m=>{ map[m]=(map[m]||0)+spread[m]; });
  });
  const rows=Object.keys(map).map(m=>({ m:m.replace(/_/g,' '), vol:r1(map[m]) })).sort((a,b)=>b.vol-a.vol);
  rows.estimated=anyEstimated;
  rows.unmapped=Object.keys(unmapped);
  return rows;
}
/* weekly-bucketed real history — no invented series, just the same dated
   entries (finishedDates / volume-by-date / sessionDurations) the rest of
   this file already computes, grouped into `weeks` 7-day buckets ending
   today. Powers the mini trend chart on the stat cards that actually have
   a meaningful week-over-week shape; cards that don't (streaks, PR count)
   skip the chart rather than fake one. */
function weeklyBuckets(entries, weeks, valueFn){
  const buckets=Array.from({length:weeks},()=>0);
  entries.forEach(e=>{
    const ago=daysAgo(e.date);
    if(ago<0 || ago>=weeks*7) return;
    const w=weeks-1-Math.floor(ago/7);
    buckets[w]+=(valueFn?valueFn(e):1);
  });
  return buckets;
}
function ovChartHTML(buckets){
  const max=Math.max(...buckets,1);
  return '<div class="ovChart">'+buckets.map((v,i)=>'<div class="ovBar'+(i===buckets.length-1?' now':'')+'" data-h="'+(v>0?Math.max(6,Math.round(v/max*100)):0)+'"></div>').join('')+'</div><div class="ovCap">8-week trend</div>';
}
function renderOverviewCards(){

  const volByDate=aggregateVolumeByDate();

  const WEEKS=8;
  const sessBuckets=weeklyBuckets((STATE.finishedDates||[]).map(d=>({date:d})), WEEKS);
  const volBuckets=weeklyBuckets(volByDate, WEEKS, e=>e.kg);
  const hrBuckets=weeklyBuckets(STATE.sessionDurations||[], WEEKS, e=>(e.minutes||0)/60);
  const sessDelta=sessBuckets[WEEKS-1]-sessBuckets[WEEKS-2];
  /* Colour is gated on the SAME value the card displays, not applied per
     card-type — gold/mint are achievement colours, and a 0 is never an

  const sessCount=(STATE.finishedDates||[]).length, streak=currentStreak(), longest=longestStreak(), prCount=totalPRsAllTime();
  const cards=[

    /* Hours trained, exercises tracked and sessions-per-week-all-time are
       gone. Nobody changes what they do because of them, and every card is
       surface to maintain forever. What is left either predicts progress
       or rewards the behaviour that produces it. */
    { n:streak, l:'Week streak', c:streak>0?'gold':'', desc:'weeks at '+weeklyTarget()+'+ sessions' },
    { n:longest, l:'Longest run', c:longest>0?'gold':'', desc:'weeks at '+weeklyTarget()+'+ sessions' },
    { n:prCount, l:'Personal records', c:prCount>0?'gold':'' },
    { n:totalVol.toLocaleString(), l:'Total '+STATE.unit+' lifted', c:totalVol>0?'mint':'', chart:volBuckets },

  el.innerHTML = cards.map(c=>'<div class="ovCard"><div class="ovNum'+(c.c?' '+c.c:'')+'">'+c.n+'</div><div class="ovLbl">'+c.l+'</div>'
    +(c.desc?'<div class="ovDesc">'+c.desc+'</div>':'')
    +(c.chart?ovChartHTML(c.chart):'')
    +'</div>').join('');

/* ---- reveal, once, when the cards actually scroll into view — same
   once-only IO gate as growBars(), just driving a count-up alongside the
   bar grow so the number and the chart land together. */
function revealOverviewCards(el){
  if(!el) return;
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // stagger WITHIN each card's chart, not across the whole grid — three
  // charts should sweep in together, not queue up one bar every 45ms
  // across all of them (that dragged the last card out to ~1s late).
  const charts=[...el.querySelectorAll('.ovChart')];
  if(reduced){ charts.forEach(c=> c.querySelectorAll('.ovBar[data-h]').forEach(b=> b.style.height=b.dataset.h+'%')); return; }
  const run=()=>{
    charts.forEach(c=> c.querySelectorAll('.ovBar[data-h]').forEach((b,i)=> setTimeout(()=>{ b.style.height=b.dataset.h+'%'; }, i*45)));
    animateCounts(el);
  };
  if(!('IntersectionObserver' in window)){ requestAnimationFrame(()=>requestAnimationFrame(run)); return; }
  const io=new IntersectionObserver((entries,obs)=>{
    if(entries.some(e=>e.isIntersecting)){ run(); obs.disconnect(); }
  }, { threshold:0.3 });
  io.observe(el);
}
/* ---- count-up: reads the number a stat card/row already rendered and
   animates it up from 0. Purely cosmetic — the final text is always the
   exact string the render function produced, decimals and commas intact. */
function animateCounts(root){
  if(!root || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  root.querySelectorAll('.ovNum, .stat .v').forEach(el=>{
    const raw=el.textContent.trim();
    const m=raw.match(/^([+-]?)([\d,]+(?:\.\d+)?)/);
    if(!m) return;
    const sign=m[1]||'', digits=m[2];
    const target=parseFloat(digits.replace(/,/g,''));
    if(!Number.isFinite(target)) return;
    const suffix=raw.slice(m[0].length);
    const decimals=(digits.split('.')[1]||'').length;
    const dur=750, start=performance.now();
    (function tick(now){
      const p=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-p,3);
      const cur=target*eased;
      el.textContent=sign+(decimals?cur.toFixed(decimals):Math.round(cur).toLocaleString())+suffix;
      if(p<1) requestAnimationFrame(tick); else el.textContent=raw;
    })(start);
  });
}
/* ---- bar grow-in: bars sit at 0 until this section is actually scrolled
   into view, then sweep to their real size once — fast out of the gate,
   easing off toward the end (--ease-out) — and never re-trigger after
   that first reveal, even if you scroll past it again. Redrawing the
   view (switching stats chips) mounts fresh bars, so it gets its own
   one-time reveal too. */
function growBars(root){
  if(!root) return;
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bars=[...root.querySelectorAll('[data-w], [data-h]')];
  if(!bars.length) return;
  if(reduced){ bars.forEach(b=>{ if(b.dataset.w!=null) b.style.width=b.dataset.w+'%'; if(b.dataset.h!=null) b.style.height=b.dataset.h+'%'; }); return; }
  const reveal=()=> bars.forEach((b,i)=> setTimeout(()=>{ if(b.dataset.w!=null) b.style.width=b.dataset.w+'%'; if(b.dataset.h!=null) b.style.height=b.dataset.h+'%'; }, i*45));
  if(!('IntersectionObserver' in window)){ requestAnimationFrame(()=>requestAnimationFrame(reveal)); return; }
  const io=new IntersectionObserver((entries,obs)=>{
    if(entries.some(e=>e.isIntersecting)){ reveal(); obs.disconnect(); }
  }, { threshold:0.35 });
  io.observe(root);
}
function exportCSV(){
  /* Warm-ups are exported — they happened — but flagged, and the working
     totals beside them exclude warm-ups and misses so a spreadsheet does
     not have to re-derive the distinction. */
  const rows=[['date','exercise','weight_'+STATE.unit,'reps_per_set','warmup_flags','working_sets','working_volume']];
  Object.keys(STATE.history||{}).forEach(id=>{
    const name=(STATE.exerciseNames&&STATE.exerciseNames[id])||id;
    (STATE.history[id]||[]).forEach(e=>{
      const reps=(e.sets||[]).map(s=>s.fail?'F':s.r).join('|');
      const flags=(e.sets||[]).map(s=>s.warmup?'W':'-').join('|');
      rows.push([e.date, name, e.kg, reps, flags, TrainEngine.workingSets(e).length, Math.round(TrainEngine.workingVolume(e).load)]);
    });
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='training-history.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* THE default chart: estimated 1RM over time for one lift. */
function drawE1rmTrend(){
  const plot=$('#statsPlot'), cap=$('#statsCap');
  plot.style.aspectRatio='';
  const names=STATE.exerciseNames||{};
  const best=Object.keys(names)
    .map(id=>({ id, series:TrainEngine.e1rmSeries((STATE.history[id]||[])) }))
    .filter(x=>x.series.length>=2)
    .sort((a,b)=>b.series.length-a.series.length)[0];
  if(!best){
    plot.innerHTML='<p class="emptyHist">Two sessions on one lift and this fills in.</p>';
    cap.textContent=''; $('#statsRow').innerHTML=''; return;
  }
  const pts=best.series;
  const lo=Math.min(...pts.map(p=>p.value)), hi=Math.max(...pts.map(p=>p.value));

    const x = pts.length>1 ? (i/(pts.length-1))*100 : 50;

  }).join('')+'</div>';
  wirePoints(plot);

/**
 * The series a goal is measured against, in the goal's own unit.
 *
 * A loaded lift is judged on estimated 1RM; a plank on seconds and a
 * carry on metres, because e1RM means nothing for either. Returns null
 * when the kind has no number a goal could be about.

function goalSeriesFor(id){
  const h=(STATE.history[id]||[]).filter(s=>!s.off);
  if(!h.length) return null;
  const kind=kindFor({ id: id });
  if(kind==='time'){
    return { unit:'seconds', points:h.map(e=>({ date:e.date, value:TrainEngine.topWorkingSeconds(e) })) };
  }
  if(kind==='distance' || kind==='time_distance'){
    return { unit:'metres', points:h.map(e=>({ date:e.date, value:TrainEngine.topWorkingMetres(e) })) };
  }
  return { unit:'lb', points:TrainEngine.e1rmSeries(h) };
}
/* Where this goal actually lands, or null when there is not enough to
   say. Null renders nothing — an "unknown" row would be the app taking
   up space to announce it has no idea. */
function goalProjectionFor(goal){
  const series=goalSeriesFor(goal.id);
  if(!series) return null;
  return TrainEngine.projectGoal(series.points, goal.target, Date.now(), { unit: series.unit });
}

function aggregateVolumeByDate(){
  const map={};
  Object.keys(STATE.history||{}).forEach(id=>{
    (STATE.history[id]||[]).forEach(entry=>{
      if(entry.off) return;
      const vol=TrainEngine.workingVolume(entry, {
        bodyweightLb: bodyweightOn(entry.date),
        bodyweightFactor: (STATE.customLib&&STATE.customLib[id]&&STATE.customLib[id].bodyweightFactor)
          || (TrainEngine.catalogExercise(id)||{}).bodyweightFactor || null,
      }).load;

/* least-squares trend on the visible points, fanned into a High / Trend / Low
   projection from the last real value — the "if this keeps up" line, not a promise. */
function predictFan(list, domain){
  if(list.length<4) return null;
  const t=list.map(s=>-daysAgo(s.date)), k=list.map(s=>s.kg);
  const n=t.length, tMean=t.reduce((a,b)=>a+b,0)/n, kMean=k.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num+=(t[i]-tMean)*(k[i]-kMean); den+=(t[i]-tMean)**2; }
  if(den<1e-6) return null;
  const slope=num/den, last=list[list.length-1];
  const horizon=Math.max(5,Math.min(180,Math.round(domain*0.5)));
  const slopeHi= slope>=0? slope*1.6 : slope*0.4;
  const slopeLo= slope>=0? slope*0.4 : slope*1.6;
  const val=s=>Math.max(0,r1(last.kg+s*horizon));
  return { horizon, bands:[
    { key:'high', label:'High', val:val(slopeHi) },
    { key:'mid', label:'Trend', val:val(slope) },
    { key:'low', label:'Low', val:val(slopeLo) },
  ]};
}
function drawAggChart(list, active, unitLabel){
  const plot=$('#statsPlot'), cap=$('#statsCap');
  plot.style.aspectRatio='600/240';
  if(!list.length){ plot.innerHTML='<svg viewBox="0 0 600 240" preserveAspectRatio="none"><text class="xlab" x="300" y="120" text-anchor="middle">no data yet</text></svg>'; cap.textContent=''; return; }
  const HIST_W=600,VB_H=240,PADL=46,PADR=20,PADT=22,PADB=36;
  const ws=list.map(s=>s.kg);

  const domain= active==='ALL'? Math.max(oldestAgo,1):Math.max(RANGES[active],1);
  const fan=predictFan(list,domain);
  const FAN_W=fan?150:0, FAN_LABEL_W=44, VB_W=HIST_W+FAN_W;
  let lo=0, hi=Math.ceil(Math.max(...ws,1,...(fan?fan.bands.map(b=>b.val):[]))/5)*5+5;
  const X=k=>{ const f=Math.min(1,Math.max(0,1-daysAgo(k)/domain)); return PADL+f*(HIST_W-PADL-PADR); };
  const Y=v=>(VB_H-PADB)-(v-lo)/(hi-lo)*(VB_H-PADB-PADT);
