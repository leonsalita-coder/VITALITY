<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>Train</title>

<style>
  /* ====================================================================
     TRAIN — an instrument, not a card feed. One physics idea (momentum),
     one signal color used sparingly (mint — shared across the whole
     dashboard, kept for system coherence), a five-step elevation scale
     instead of flat panels, and numerals treated like an engraved dial.
     System fonts only — no external files, this renders in a sealed
     sandboxed iframe with no network. Every "expensive" cue here is
     built from restraint and craft, not borrowed assets.
     ================================================================= */
  :root {
    /* elevation — true-black base, five graphite steps up */
    --e0:#030304; --e1:#0a0a0d; --e2:#101013; --e3:#17171b; --e4:#1f1f24;
    --hair:rgba(255,255,255,.05); --hair-strong:rgba(255,255,255,.12);
    /* signal — scarce by design. gold flags a PR, fail flags a miss */
    --signal:#6EE7B7; --signal-ink:#04140d;
    --gold:#f5a623; --fail:#ef6f6a;
    --text:#f2f2f0; --muted:#86868f; --muted-2:#5c5c63;
    /* type — sans for UI, serif upright (never default-italic) for
       structural headings, mono for every numeral / data readout */
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;
    /* spacing ladder — 4/8/12/16/24/32/48/64/96 */
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px; --sp8:64px; --sp9:96px;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    /* motion — one momentum family. out = ui settling; spring = tactile
       taps; cinematic = anything that takes over the screen */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-momentum:cubic-bezier(.2,.85,.25,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --d1:110ms; --d2:190ms; --d3:320ms; --d4:520ms; --d5:760ms;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  ::selection { background:var(--signal); color:var(--signal-ink); }
  html { background:var(--e0); }
  body { margin:0; min-height:100dvh; padding:0 0 calc(56px + env(safe-area-inset-bottom)); background:var(--e0); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  button { font-family:inherit; cursor:pointer; }
  button:disabled { cursor:default; }
  .num,.tab { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--signal); outline-offset:2px; border-radius:6px; }

  /* ── the original Vitality backdrop — mountains / glass atmosphere /
        particles, fully self-contained (no external file). Kept as-is
        per request while the rest of the tile moved to the new system. */
  #vt-backdrop { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; background:var(--e0); }
  #vt-backdrop .wb-atmosphere { position:absolute; inset:0; pointer-events:none; background:
    radial-gradient(60% 50% at 50% 40%, rgba(110,231,183,.18) 0%, rgba(110,231,183,.06) 32%, rgba(110,231,183,0) 66%),
    radial-gradient(34% 26% at 50% 44%, rgba(255,226,181,.08) 0%, rgba(255,226,181,0) 72%),
    radial-gradient(130% 90% at 50% 120%, rgba(14,38,30,.85) 0%, rgba(0,0,0,1) 72%); }
  #vt-backdrop .wb-mountains { position:absolute; left:0; right:0; bottom:0; height:42vh; min-height:240px; pointer-events:none; }
  #vt-backdrop .wb-mountains svg { width:100%; height:100%; display:block; }
  #vt-backdrop .wb-mist { position:absolute; left:0; right:0; bottom:30vh; height:24vh; pointer-events:none; background:linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(110,231,183,.06) 40%, rgba(0,0,0,0) 100%); filter:blur(8px); }
  #vt-backdrop .wb-particles { position:absolute; inset:0; pointer-events:none; }
  #vt-backdrop .wb-particles span { position:absolute; width:1.5px; height:1.5px; background:rgba(233,239,233,.55); border-radius:50%; box-shadow:0 0 4px rgba(167,243,208,.35); animation:vtDrift linear infinite; }
  @keyframes vtDrift { 0%{transform:translate3d(0,0,0);opacity:0;} 8%{opacity:.7;} 92%{opacity:.5;} 100%{transform:translate3d(var(--dx,12px),var(--dy,-100vh),0);opacity:0;} }
  @media (prefers-reduced-motion:reduce) { #vt-backdrop .wb-particles span { animation:none; } }


  /* ── GROUND-UP REBUILD — every component's design (CSS) below this
        point has been deleted, not disabled. The HTML markup and all
        JS logic (state, calculations, event wiring) are untouched, so
        the tile still runs correctly — it just renders unstyled while
        we design each component fresh, one at a time. ============= */

  /* ==== TOP STICKER — greeting + a note bar that flips through short,
     real, day-dependent callouts (rest day, streak, a nudge, a PR),
     color-coded by what kind of note it is. First rebuilt piece. ==== */
  .topSticker { padding:calc(16px + env(safe-area-inset-top)) var(--sp5) 0; }
  .stickerGreet { font-family:var(--sans); font-weight:800; font-size:22px; letter-spacing:-0.02em; color:var(--text); margin-bottom:11px; }
  .noteBar { display:flex; align-items:stretch; gap:0; background:var(--e2); border:1px solid var(--hair); border-radius:var(--r-lg); padding:10px 2px; box-shadow:0 14px 30px -20px rgba(0,0,0,.7); }
  .noteSlot { flex:1; min-width:0; height:16px; position:relative; overflow:hidden; perspective:220px; }
  .noteDiv { width:1px; flex:none; background:var(--hair-strong); margin:1px 0; }
  .noteCard { position:absolute; inset:0 7px; display:flex; align-items:center; gap:4px; font-family:var(--sans); font-size:10.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); transform-origin:50% 0%; transform:translateY(0) rotateX(0deg); opacity:1; transition:transform .48s var(--ease-momentum), opacity .38s var(--ease-momentum); }
  .noteCard.entering { transform:translateY(65%) rotateX(75deg); opacity:0; }
  .noteCard.leaving { transform:translateY(-65%) rotateX(-75deg); opacity:0; }
  .noteDot { flex:none; width:4px; height:4px; border-radius:50%; background:currentColor; }
  .noteEmo { flex:none; font-size:10.5px; line-height:1; }
  .noteTxt { min-width:0; overflow:hidden; text-overflow:ellipsis; color:currentColor; }
  .note-mint { color:var(--signal); }
  .note-gold { color:var(--gold); }
  .note-fail { color:var(--fail); }
  .note-plain { color:var(--muted); }

  /* why a weight is being suggested — quiet by default, because it is an
     explanation and not a call to action. Only a layoff or a deload earns
     colour, since those are the two the lifter would otherwise misread as
     the app losing their progress. */
  .pillWhy { margin:5px 0 0 34px; font-size:11px; line-height:1.35; font-family:var(--sans); color:var(--muted); letter-spacing:.005em; }
  .pillWhy.why-clean { color:var(--signal); }
  .pillWhy.why-layoff, .pillWhy.why-deload { color:var(--gold); }

  /* warm-up toggle — deliberately quiet. It is a correction, not an action,
     and it should never compete with "Hit it". */
  .pillWarm { flex:none; width:22px; height:22px; border-radius:7px;
    border:1px solid var(--hair-strong); background:transparent; color:var(--muted-2);
    font-family:var(--mono); font-size:11px; font-weight:700; line-height:1;
    transition:background var(--d1) var(--ease-out), color var(--d1) var(--ease-out); }
  .pillWarm.on { background:var(--e4); color:var(--text); }
  .pill.warmup { opacity:.55; }
  /* a weight or rep record: a dot, not a takeover */
  .pillPrDot { display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--gold); margin-right:5px; vertical-align:middle; }
  /* the near-miss cue, before the set */
  .pillNear { font-size:10.5px; font-weight:600; color:var(--gold); margin-right:8px;
    white-space:nowrap; }

  /* ==== REST BAR — an instrument face, not a toast. It sits inside the
     lift card while the clock runs: a ring that drains, a mono readout,
     and two coarse nudges either side. Overtime flips the whole bar to
     gold rather than only the number, because at a glance across a bench
     the colour is the only thing that actually reads. ============== */
  .restbar { display:flex; align-items:center; gap:var(--sp3); margin-top:var(--sp3);
    padding:10px var(--sp3); border-radius:var(--r-md);
    background:var(--e2); border:1px solid var(--hair);
    box-shadow:0 10px 24px -18px rgba(0,0,0,.8);
    animation:restIn var(--d3) var(--ease-out) both; }
  @keyframes restIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .restbar .restMid { flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
  .restbar .restRing { width:34px; height:34px; flex:none; transform:rotate(-90deg); }
  .restbar .restRingTrack { fill:none; stroke:var(--hair-strong); stroke-width:3; }
  .restbar .restRingFill { fill:none; stroke:var(--signal); stroke-width:3; stroke-linecap:round;
    transition:stroke-dashoffset var(--d1) linear, stroke var(--d2) var(--ease-out); }
  .restbar .restTime { font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:17px; font-weight:600; letter-spacing:-.01em; color:var(--text); min-width:52px; }
  .restbar .restLabel { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.01em; }
  .restbar .restStep { flex:none; padding:7px 9px; border-radius:var(--r-sm);
    border:1px solid var(--hair-strong); background:transparent; color:var(--muted);
    font-family:var(--mono); font-size:11px; font-weight:600;
    transition:background var(--d1) var(--ease-out), color var(--d1) var(--ease-out); }
  .restbar .restStep:active { background:var(--e4); color:var(--text); transform:scale(.94); }
  .restbar .restX { flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--hair); background:transparent; color:var(--muted-2);
    font-size:14px; line-height:1; }
  .restbar .restX:active { color:var(--text); }
  /* overtime — the rest is over and the number is now counting up */
  .restbar.over { border-color:rgba(245,166,35,.32); background:linear-gradient(var(--e2),var(--e2)) padding-box; }
  .restbar.over .restRingFill { stroke:var(--gold); }
  .restbar.over .restTime { color:var(--gold); }
  .restbar.over .restLabel { color:var(--gold); opacity:.75; }
  @media (prefers-reduced-motion:reduce) { .restbar { animation:none; } }
</style>
</head>
<body>
<div id="vt-backdrop" aria-hidden="true">
  <div class="wb-atmosphere"></div>
  <div class="wb-mountains"><svg viewBox="0 0 1600 420" preserveAspectRatio="none"><defs><linearGradient id="vt-mt-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1a17" stop-opacity="0"/><stop offset="55%" stop-color="#0d1a17" stop-opacity=".55"/><stop offset="100%" stop-color="#0d1a17" stop-opacity=".95"/></linearGradient><linearGradient id="vt-mt-near" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050a09" stop-opacity=".4"/><stop offset="60%" stop-color="#050a09" stop-opacity=".95"/><stop offset="100%" stop-color="#050a09" stop-opacity="1"/></linearGradient></defs><path d="M0,300 L120,230 L210,260 L320,180 L430,220 L560,150 L680,210 L820,170 L960,220 L1100,180 L1240,240 L1380,200 L1500,250 L1600,220 L1600,420 L0,420 Z" fill="url(#vt-mt-far)"/><path d="M0,360 L100,320 L220,340 L340,290 L460,330 L590,300 L720,340 L860,310 L1000,350 L1140,310 L1280,355 L1420,320 L1540,360 L1600,340 L1600,420 L0,420 Z" fill="url(#vt-mt-near)"/></svg></div>
  <div class="wb-mist"></div>
  <div class="wb-particles"></div>
</div>

<header class="topSticker" id="topSticker">
  <div class="stickerGreet" id="stickerGreet">Welcome Piglet</div>
  <div class="noteBar" id="noteBar"></div>
</header>

<div class="rail" id="statusRail">
  <div class="railDate" id="railDate">—</div>
  <div class="railSpacer"></div>
  <div class="railStat"><span class="railStatVal" id="railStreak">0</span><span class="railStatLbl">streak</span></div>
  <div class="railDivider"></div>
  <div class="railStat"><span class="railStatVal" id="railVolume">0</span><span class="railStatLbl" id="railVolumeLbl">lb</span></div>
</div>

<div class="shell">
<div class="starterTag">✦ starter — the value is what you build · the videos show how</div>
  <div class="sheet" id="sheet">
    <div class="trainBar">
      <div class="wordmark">Train <span class="wmDot">·</span> Session <span id="sessionNum">1</span></div>
      <div class="chrome">
        <button class="settingsBtn" id="settingsBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <div class="bouncyRow">
          <span class="bouncyLabel" id="restLabel">Rest day</span>
          <button class="bouncyToggle" id="moonbtn" role="switch" aria-checked="false" title="Mark today a rest day">
            <span class="bouncyTrack"><span class="bouncyThumb"><span class="bouncyDot">🌙</span></span></span>
          </button>
        </div>
      </div>
    </div>
    <div class="daydots" id="daydots"></div>
    <div class="heroCap">Today's session<span id="streakPill" class="streakPill"></span></div>
    <div class="heroRow">
      <div class="progress" id="progress">
        <div class="progRing">
          <svg viewBox="0 0 88 88"><circle class="prTrack" cx="44" cy="44" r="38"/><circle class="prFill" id="prFill" cx="44" cy="44" r="38"/></svg>
          <div class="prCenter"><div class="prPct" id="prPct">0%</div><div class="plabel" id="plabel"></div></div>
        </div>
      </div>
      <div class="heroText">
        <h1 class="daytitle" id="daytitle">Today</h1>
        <div class="heroSub" id="heroSub"></div>
      </div>
    </div>
    <div class="statStrip" id="miniStats"></div>
    <div class="wcSection" id="warmupSlot"></div>
    <div class="exwrap" id="exwrap"></div>
    <div class="wcSection" id="cooldownSlot"></div>
    <div class="finishRow"><button class="finishBtn" id="finishBtn">Finish session</button></div>
    <button class="freshbtn" id="freshbtn">Start fresh</button>
    <p class="store-note">Saved to your Vitality dashboard.</p>
  </div>

  <div class="sheet" id="goalSheet">
    <div class="eyebrow">Short-term goal</div>
    <div id="goalBubble" style="margin-top:14px"></div>
  </div>

  <div class="sheet" id="photosSheet">
    <div class="eyebrow">Progress photos</div>
    <div id="photoGallery" style="margin-top:14px"></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none" />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" />
    <div class="photoBtnRow">
      <button class="addLift" id="takePhotoBtn"><span class="addLiftRing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="addLiftLabel">Take a photo</span></button>
      <button class="addLift" id="addPhotoBtn"><span class="addLiftRing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="addLiftLabel">From library</span></button>
    </div>
    <div id="photoStatus" class="photoStatus"></div>
  </div>

  <div class="sheet" id="statsSheet">
    <div class="eyebrow" style="display:flex;align-items:center;justify-content:space-between">Progress<button class="photoX" id="exportCsvBtn" title="Export CSV" style="font-size:11px;font-family:var(--vt-mono);letter-spacing:.08em;text-transform:uppercase">Export ⇩</button></div>
    <div class="ovGrid" id="overviewCards"></div>
    <div class="chipRow" id="statsPicker"></div>
    <div class="range" id="statsRange"></div>
    <div class="chart-card"><div class="plot" id="statsPlot"></div><div class="delta-cap" id="statsCap"></div></div>
    <div class="stats" id="statsRow"></div>
  </div>
</div>

<button class="coachFab" id="coachFab" title="Talk to your coach" aria-label="Talk to your coach">
  <canvas id="coachFabCanvas"></canvas>
</button>

<div id="popRoot"></div>
<div id="coachRoot"></div>
<div class="celebrate" id="celebrate">
  <div class="burst">
    <div class="bstar"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.1 6.6 .9-4.8 4.6 1.2 6.6L12 18.5 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z"/></svg></div>
    <div class="ch1">New best</div>
    <div class="ch2" id="ch2"></div>
    <div class="tap">tap to close</div>
  </div>
</div>

/* Average RPE across the working sets logged today, or null when the

function sessionRpe(e){

   (whoopRecovery wins; else 0.6·feel + 0.4·sleep-scaled). Averaged over
   the last week so one bad night doesn't skew it. */
function vitalsRecoverySignal(v){
  if(!v || typeof v!=='object') return null;
  const dates=Object.keys(v).sort().slice(-7);
  if(!dates.length) return null;
  const scores=dates.map(k=>{
    const d=v[k]||{};
    if(typeof d.whoopRecovery==='number') return Math.max(1,Math.min(99,Math.round(d.whoopRecovery)));
    const parts=[], w=[];
    if(typeof d.feel==='number'){ parts.push(Math.max(0,Math.min(100,d.feel))); w.push(0.6); }
    if(typeof d.sleepHours==='number'){ parts.push(Math.max(0,Math.min(1,d.sleepHours/8))*100); w.push(0.4); }
    if(!parts.length) return null;
    const tw=w.reduce((a,b)=>a+b,0);
    return Math.round(parts.reduce((a,p,i)=>a+p*w[i],0)/tw);

      lines.push('- '+e.name+': '+h.length+' sessions on record, '+(delta>=0?'+':'')+delta+' '+STATE.unit+' over that span, '+misses+' missed set(s) today'+pr+(plateau?' — PLATEAU: weight and reps flat for the last '+plateau.sessions+' sessions at '+plateau.weight+' '+STATE.unit+'.':'.'));
    } else {
      lines.push('- '+e.name+': first time logging this, '+misses+' missed set(s) today'+pr+'.');
    }
  });
  let recoveryAvg=null;
  try{
    const vitals=await window.Vitality.read('vitals');
    const rec=vitalsRecoverySignal(vitals);
    if(rec){ recoveryAvg=rec.avg; lines.push('Recovery (Vitals, '+rec.days+'-day avg): '+rec.avg+'/100.'); }
  }catch(e){ /* Vitals not available — the note still works without it */ }
  return { lines, plateaus, recoveryAvg };
}
/* ---- fully automatic deload: no button, no confirmation. When a lift is
   BOTH plateaued and recovery is genuinely low, this is fatigue, not a
   programming problem — so the system drops that lift's suggested weight
   ~12% right now, the same way the progression suggestion already
   auto-adjusts without asking. The note then REPORTS the action (never
   silent), and it's a one-time nudge: the very next real session on that
   lift clears the override and normal progression resumes from there. */
/* Advancing the state machine, once per finished session. The engine owns
   every decision here: which lifts are stalled, what kind of deload each
   needs, and — through limitDeloads — which of them actually drop today.
   A session where four lifts came down reads as failure however defensible
   each one was, so at most two move. */
function advanceDeloads(session, recoveryAvg){
  STATE.deloadStates = STATE.deloadStates || {};
  const ctx = e => ({
    history: histFor(e).filter(x=>!x.off),
    today,
    recovery: recoveryAvg,
    rpe: sessionRpe(e),
    excluded: STATE.deloadExclusions||[],
    sessionLogged: true,
  });

  /* Lifts not already mid-deload compete for the two available slots. */
  const candidates=[];
  session.ex.forEach(e=>{
    const cur=STATE.deloadStates[e.id]||null;
    if(cur && cur.state!=='normal') return;
    const p=plateauFor(e);
    if(p && p.weight>0) candidates.push({ id:e.id, weight:p.weight, plateauLength:p.sessions });
  });
  const allowed=new Set(TrainEngine.limitDeloads(candidates));

  const applied=[];
  session.ex.forEach(e=>{
    const cur=STATE.deloadStates[e.id]||null;
    const mid = cur && cur.state!=='normal';
    if(!mid && !allowed.has(e.id)) return;
    const next=TrainEngine.nextDeloadState(cur, ctx(e));
    STATE.deloadStates[e.id]=next;
    if(cur && cur.state!==next.state && next.state==='deloading'){
      const plan=TrainEngine.deloadPlan(next);
      if(plan.weight!=null) applied.push({ name:e.name, from:next.priorWeight, to:plan.weight, kind:next.kind });
    }
  });
  return applied;
}
async function fetchInsight(session){
  try{
    const ctx=await buildInsightContext(session);
    const applied=advanceDeloads(session, ctx.recoveryAvg);
    const lines=ctx.lines.slice();
    applied.forEach(a=> lines.push('AUTO-DELOAD APPLIED: '+a.name+' entered a '+(a.kind==='volume'?'volume':'intensity')+' deload, '+a.from+' → '+a.to+' '+STATE.unit+' — report this as a fact that already happened, not a suggestion.'));
    const digest=lines.join('\n');
    const note=await window.Vitality.getInsight({ goal:fullGoalContext(), digest });
    session.insight={ date:today, text:(typeof note==='string'&&note.trim())?note.trim():null };
  }catch(err){ session.insight={ date:today, text:null }; }
  render(); // covers saveState + insight display + any auto-deload reflected in the UI
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPillGroup(e, rx, idx){

  frag.appendChild(renderPill(e, rx, idx));

/* ---- progression suggestion ----------------------------------------
   The engine decides BOTH the number and the sentence. The tile renders
   `reason` verbatim and never composes progression copy — the wording is
   covered by tests in lib/train/progression.ts, not by DOM code here.
   `now` is passed in because lib/train never reads the clock. */
function suggestionFor(e, rx){
  const deload = (STATE.deloadStates && STATE.deloadStates[e.id]) || null;
  return TrainEngine.suggestWeight(histFor(e), {
    kg: rx.kg,
    lastKg: e.lastKg,
    reps: rx.reps,
    repRange: repRangeFor(e) || undefined,
    sets: rx.sets,
    loading: loadingFor(e),
    incrementLb: e.incrementLb,
    deload,
  }, Date.now());
}
/* The rep range is a property of the LIFT, not of today's session, so it
   lives beside the exercise definition and survives the session rolling
   over at midnight. Absent means linear — the engine treats a missing
   range as [reps, reps], which is exactly the old behaviour. */
function repRangeFor(e){
  const info = STATE.customLib && STATE.customLib[e.id];
  const r = info && info.repRange;
  if(Array.isArray(r) && r.length===2 && r[1]>r[0]) return [r[0], r[1]];
  return null;
}
function setRepRange(e, range){
  STATE.customLib = STATE.customLib || {};
  const info = STATE.customLib[e.id] || (STATE.customLib[e.id] = {});
  if(range) info.repRange = range; else delete info.repRange;
}
/* What this lift can actually be loaded with, read off the equipment the
   classifier already recorded. Anything unrecognised stays 'free', which
   keeps the old weight-scaled step — so a lift with no equipment on file
   behaves exactly as it did before. */
function loadingFor(e){
  const info = STATE.customLib && STATE.customLib[e.id];
  const eq = String((info && info.equipment) || '').toLowerCase();
  if(eq.indexOf('barbell')>=0 || eq.indexOf('smith')>=0) return 'barbell';
  if(eq.indexOf('dumbbell')>=0 || eq.indexOf('kettlebell')>=0) return 'dumbbell';
  if(eq.indexOf('machine')>=0 || eq.indexOf('cable')>=0) return 'stack';
  return 'free';
}
function renderPill(e, rx, idx){

  const bumped = !logged && !!suggestion && suggestion.basis==='clean' && suggestion.weight>0;
  const prefillR = s?s.reps:(suggestion?suggestion.reps:rx.reps);
  /* Anticipation beats confetti: if the prefill lands just under the best
     estimated 1RM, say so before the set rather than celebrating after. */
  const nearMiss = logged ? null : TrainEngine.nearMissCue(
    histFor(e).filter(x=>!x.off), { weight:prefillKg, reps:prefillR },
    (STATE.customLib&&STATE.customLib[e.id]&&STATE.customLib[e.id].incrementLb)||5, Date.now());

    + '<span class="pillValue">'
    +   '<input class="pillInput w'+(bumped?' bump':'')+'" type="number" inputmode="decimal" value="'+prefillKg+'" aria-label="Weight" />'
    +   '<span class="pillUnit">'+STATE.unit+(e.perHand?'<span class="pillPerHand">/ea</span>':'')+'</span>'
    +   '<span class="pillTimes">×</span>'
    +   '<input class="pillInput r" type="number" inputmode="numeric" value="'+prefillR+'" aria-label="Reps" />'
    + '</span>'
    + '<span class="pillSpacer"></span>'

    /* one tap, on the row, mid-session — a warm-up flag buried in a popup

    +   '<button class="pillWarm'+(s&&s.warmup?' on':'')+'" data-act="warmup" aria-pressed="'+(s&&s.warmup?'true':'false')+'" title="Warm-up — kept in history, excluded from volume, PRs and progression">W</button>'

  const stop=ev=>ev.stopPropagation();
  [wIn,rIn].forEach(inp=>{ inp.addEventListener('click',stop); inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); commit(); inp.blur(); } }); });

    else e.log[idx] = { kg:parseFloat(wIn.value)||0, reps:Math.round(parseFloat(rIn.value))||0, warmup:true };
    rollupToday(e); render();

}
function addDrop(e, idx){
  const s=e.log[idx]; if(!s) return; s.drops=s.drops||[];
  const lastKg = s.drops.length? s.drops[s.drops.length-1].kg : s.kg;

function renderDropRow(e, idx, di){
  const s=e.log[idx]; const dr=s.drops[di];

function IC_reset(){ return '<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor"><path d="M3.5 6.5 A6 6 0 1 0 6 3.2"/><polyline points="2.4 2.4 3.7 6.6 8 5.2"/></svg>'; }

function doLog(e, idx, kg, reps, fail){
  const _sess=curSession(); if(!_sess.startedAt) _sess.startedAt=Date.now();
  const wasComplete = exComplete(e);
  e.log[idx] = fail ? {kg, reps:0, fail:true} : {kg, reps};
  rollupToday(e);
  render();
  // re-find the live card + pill for the shimmer / celebration
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(!fail && card){ const pills=card.querySelectorAll('.pill'); const rowEl=pills[idx]; if(rowEl){ rowEl.classList.add('shimmer'); setTimeout(()=>rowEl.classList.remove('shimmer'),820); } }
  // progressive-overload celebration: a logged set that beats your prior best, completing the lift
  /* Only an estimated-1RM record earns the takeover. Weight and rep PRs
     get the quiet dot on the row — they fire too often early on for a
     celebration to keep meaning anything. */
  if(isBigPR(e, idx) && !wasComplete && exComplete(e) && card){
    card.classList.add('celebrate'); setTimeout(()=>card.classList.remove('celebrate'),1650);
    celebrate(e, kg, reps);
  }
  if(logIsWorking(e.log[idx]) && (!e.group || isLastInGroup(e, curSession()))) startRest(e);
}
/* ---- supersets / circuits: exercises sharing e.group rest together - */
function isLastInGroup(e, session){
  if(!e.group) return true;
  const mem=session.ex.filter(x=>x.group===e.group);
  return mem.length ? mem[mem.length-1].id===e.id : true;
}
function nextGroupLetter(session){
  const used=new Set(session.ex.map(x=>x.group).filter(Boolean));
  for(const l of 'ABCDEFGH') if(!used.has(l)) return l;
  return 'X';
}
function linkWithNext(e, session){
  const idx=session.ex.findIndex(x=>x.id===e.id); const next=session.ex[idx+1]; if(!next) return;
  const gid=e.group||next.group||nextGroupLetter(session);
  e.group=gid; next.group=gid; render();
}
function ungroup(e){ delete e.group; render(); }
function rollupToday(e){
  const done = e.log.filter(s=>s&&!s.fail);
  let h = histFor(e).filter(x=>x.date!==today);
  if(done.length){
    /* Per-set weight and the warm-up flag are written from here on, so
       volume and e1RM can tell a ramp-up from the work. Older rows have
       neither and are read with the entry weight and warmup:false. */
    const sets=e.log.filter(s=>s).map(s=>({ w:s.kg, r:s.reps, fail:s.fail||undefined, warmup:s.warmup||undefined }));
    const working=logWorking(e);
    const top=(working.length?working:done).reduce((a,b)=>b.kg>a.kg?b:a);
    h.push({date:today, kg:top.kg, sets});
    h.sort((a,b)=>a.date.localeCompare(b.date));

/* ---- header actions router --------------------------------------- */
function handleAct(act, e, session, btn){

  else if(act==='pin'){ e.pinned=!e.pinned; render(); }
  else if(act==='form'){ openForm(e); }
  else if(act==='history'){ openHistory(e); }
  else if(act==='swap'){ openSwap(e); }
  else if(act==='tune'){ openTune(e); }
  else if(act==='menu'){ openMenu(e, session, btn); }

/* ====================================================================
   REST TIMER
   ================================================================= */
const restTimers={};
const REST_RING_C = Math.round(2*Math.PI*15*1000)/1000;
let restTicker=null;
let restAudio=null;

/* ── WHAT THIS ENVIRONMENT CANNOT DO ──────────────────────────────────
   A tile is a sandboxed srcDoc iframe on an opaque origin with no
   network. That rules out, permanently and by design:

     • Notification API — needs a permission prompt on a real origin;
       an opaque-origin frame can never be granted it.
     • Wake Lock API — gated by Permissions Policy, unavailable here, so
       the screen will sleep mid-rest and there is nothing to do about it.
     • Live Activity / Dynamic Island / Android ongoing notification —
       no web API exists for any of them at all.
     • Guaranteed execution while backgrounded — a hidden tab has its
       timers throttled to >=1s and a locked phone suspends them
       entirely. Audio is suspended with it.

   So the timer is CORRECT when you come back (time is derived from a
   timestamp, never accumulated) but it cannot reliably make a sound at
   the exact instant zero passes while the phone is face-down and locked.
   That is a native-app capability, and it is deliberately not faked
   here. See docs/train-platform-limits.md.
   ──────────────────────────────────────────────────────────────────── */

function startRest(e){
  stopRest(e.id);
  const rx=prescription(e);
  /* per-exercise rest, which the data already carries */
  const total=Math.max(1, rx.rest);
  restTimers[e.id]={ startedAt:Date.now(), total, adjust:0, chimed:false };
  ensureRestAudio();
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(card) mountRestBar(card, e);
  startRestTicker();
}
/* Derived on every read, never decremented. A countdown that subtracts one
   per tick comes back wrong by exactly however long the phone was asleep —
   which is most of the rest period. */
function restRemaining(t){
  return t.total + t.adjust - Math.round((Date.now()-t.startedAt)/1000);
}
function stopRest(id){
  delete restTimers[id];
  if(!Object.keys(restTimers).length) stopRestTicker();
}
function startRestTicker(){ if(!restTicker) restTicker=setInterval(sweepRest, 250); }
function stopRestTicker(){ if(restTicker){ clearInterval(restTicker); restTicker=null; } }
/* One ticker drives every running bar. Its only job is repainting — the
   numbers come from the clock, so a throttled or skipped tick costs
   smoothness and never accuracy. */
function sweepRest(){
  Object.keys(restTimers).forEach(id=>{
    const t=restTimers[id];
    const remaining=restRemaining(t);
    if(!t.chimed && remaining<=0){
      t.chimed=true;
      /* Only chime if zero passed just now — a brief glance away should
         not eat it, but returning to a tab that elapsed ten minutes ago and
         beeping then is worse than silence. */
      if(remaining>-5) restChime();
    }
    updateRest(id);
  });
}
/* Returning to the tab is the one moment we know the clock jumped, so
   recompute and repaint immediately rather than waiting for a tick. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') sweepRest();
});

/* The AudioContext has to be created inside a user gesture. Logging a set
   is that gesture, and it is the only one that reliably precedes a rest. */
function ensureRestAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!restAudio) restAudio=new AC();
    if(restAudio.state==='suspended') restAudio.resume();
  }catch(err){ restAudio=null; }
}
function restChime(){
  try{
    if(restAudio && restAudio.state==='running'){
      const t0=restAudio.currentTime;
      [0, 0.18].forEach((offset,i)=>{
        const osc=restAudio.createOscillator(), gain=restAudio.createGain();
        osc.type='sine'; osc.frequency.value = i ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, t0+offset);
        gain.gain.exponentialRampToValueAtTime(0.22, t0+offset+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+offset+0.16);

/* Overtime counts UP rather than stopping: how long you actually rested is
   information, and a timer frozen at 0:00 throws it away. */

function paintRest(bar, t){

  bar.querySelector('.restTime').textContent = restLabelFor(remaining);
  const ring=bar.querySelector('.restRingFill');

}
function mountRestBar(card, e){ const slot=card.querySelector('.restSlot'); const t=restTimers[e.id]; if(!t||!slot){ if(slot)slot.innerHTML=''; return; }
  const remaining=restRemaining(t);
  const over=remaining<=0;
  slot.innerHTML='<div class="restbar'+(over?' over':'')+'"><button class="restStep" data-d="-15">−15</button><div class="restMid"><svg class="restRing" viewBox="0 0 36 36" aria-hidden="true"><circle class="restRingTrack" cx="18" cy="18" r="15"/><circle class="restRingFill" cx="18" cy="18" r="15" style="stroke-dasharray:'+REST_RING_C+'"/></svg><div class="restTime">'+restLabelFor(remaining)+'</div><div class="restLabel">'+(e.group?('Superset '+e.group):e.name)+'</div></div><button class="restStep" data-d="15">+15</button><button class="restX" aria-label="Dismiss">×</button></div>';

}

   ================================================================= */
function wireDrag(card, e, session){
  const grip=card.querySelector('.grip'); if(!grip) return;
  grip.addEventListener('pointerdown', ev=>{
    if(e.pinned){ return; } // pinned lifts hold the top
    ev.preventDefault(); grip.classList.add('dragging'); card.classList.add('drag-ghost');
    const wrap=$('#exwrap'); const cards=[...wrap.querySelectorAll('.ex')];
    const move=mev=>{ const y=mev.clientY; let target=null; cards.forEach(c=>{ if(c===card) return; const r=c.getBoundingClientRect(); if(y>r.top && y<r.bottom) target=c; }); if(target){ const r=target.getBoundingClientRect(); const after = y > r.top + r.height/2; wrap.insertBefore(card, after?target.nextSibling:target); } };
    const up=()=>{ grip.classList.remove('dragging'); card.classList.remove('drag-ghost'); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      // commit new order to the session array (respecting pins at top)
      const ids=[...wrap.querySelectorAll('.ex')].map(c=>c.dataset.id);
      session.ex.sort((a,b)=> ids.indexOf(a.id)-ids.indexOf(b.id));
      render(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}

/* ---- segmented control — one shared pill slides under the active
   segment instead of each button flashing its own background. The
   buttons still get fully rebuilt on every call (same as everything
   else in this file), so the indicator uses a FLIP: read its OLD
   screen position from the outgoing DOM before wiping it, then restart
   the fresh one there and transition to its natural spot. Double rAF —
   a single rAF here gets coalesced with the reflow and the browser just
   skips straight to the end state (same bug as the checklist scribble). */
function renderRangeControl(rangeEl, activeKey, onSelect){
  if(!rangeEl) return;
  const reduced=prefersReducedMotion();
  const prevInd=rangeEl.querySelector('.rangeInd');
  const prevRect = prevInd ? prevInd.getBoundingClientRect() : null;
  const containerRectBefore = prevInd ? rangeEl.getBoundingClientRect() : null;
  rangeEl.innerHTML='<div class="rangeInd"></div>'+Object.keys(RANGES).map(k=>'<button class="'+(k===activeKey?'on':'')+'" data-r="'+k+'">'+k+'</button>').join('');
  const ind=rangeEl.querySelector('.rangeInd');
  rangeEl.querySelectorAll('button').forEach(b=> b.onclick=()=> onSelect(b.dataset.r));
  const activeBtn=rangeEl.querySelector('button.on');
  if(!activeBtn || !ind) return;
  const place=()=>{
    const r=activeBtn.getBoundingClientRect(), cr=rangeEl.getBoundingClientRect();
    ind.style.width=r.width+'px';
    ind.style.transform='translateX('+(r.left-cr.left)+'px)';
  };
  if(prevRect && containerRectBefore && prevRect.width>0 && !reduced){
    ind.style.transition='none';
    ind.style.width=prevRect.width+'px';
    ind.style.transform='translateX('+(prevRect.left-containerRectBefore.left)+'px)';
    void ind.offsetWidth;
    requestAnimationFrame(()=>{
      ind.style.transition='transform .32s var(--spring), width .32s var(--spring)';
      requestAnimationFrame(place);
    });
  } else {
    ind.style.transition='none';
    place();
  }
}

function topReps(s){ const d=(s.sets||[]).filter(x=>!x.fail).map(x=>x.r); return d.length?Math.max(...d):0; }

function drawChart(e, list, active){
  const plot=$('#hplot'), cap=$('#hcap');
  if(!list.length){ plot.innerHTML='<svg viewBox="0 0 600 240" preserveAspectRatio="none"><text class="xlab" x="300" y="120" text-anchor="middle">log your first session to start the chart</text></svg>'; cap.textContent=''; return; }
  const VB_W=600,VB_H=240,PADL=46,PADR=20,PADT=22,PADB=36;
  const real=list.filter(s=>!s.off), off=list.filter(s=>s.off);
  const ws=list.map(s=>s.kg);
  let lo=Math.max(0,Math.floor(Math.min(...ws)/5)*5-5), hi=Math.ceil(Math.max(...ws)/5)*5+5;
  if(hi-lo<10) hi=lo+10; if((hi-lo)%10!==0) hi+=5;
  const oldestAgo=Math.max(...list.map(s=>daysAgo(s.date)));
  const domain= active==='ALL'? Math.max(oldestAgo,1):Math.max(RANGES[active],1);
  const X=k=>{ const f=Math.min(1,Math.max(0,1-daysAgo(k)/domain)); return PADL+f*(VB_W-PADL-PADR); };
  const Y=kg=>(VB_H-PADB)-(kg-lo)/(hi-lo)*(VB_H-PADB-PADT);
  const step=(hi-lo)<=30?5:10;
  const best = real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b) : null;
  let svgs='<svg viewBox="0 0 '+VB_W+' '+VB_H+'" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mint);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--mint);stop-opacity:0"/></linearGradient></defs>';
  for(let kg=lo;kg<=hi;kg+=step){ svgs+='<line class="grid" x1="'+PADL+'" y1="'+Y(kg)+'" x2="'+(VB_W-PADR)+'" y2="'+Y(kg)+'"/><text class="axis-label" x="'+(PADL-10)+'" y="'+(Y(kg)+4)+'" text-anchor="end">'+kg+'</text>'; }
  if(real.length){ const pts=real.map(s=>X(s.date)+','+Y(s.kg)); const last=real[real.length-1], first=real[0];
    if(real.length>1){ svgs+='<path class="area" d="M'+X(first.date)+','+(VB_H-PADB)+' L'+pts.join(' L')+' L'+X(last.date)+','+(VB_H-PADB)+' Z"/><polyline class="line" points="'+pts.join(' ')+'"/>'; } }
  let dotI=0;
  off.forEach(s=>{ svgs+='<circle class="dot off" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  real.forEach(s=>{ svgs+='<circle class="dot'+(best&&s.date===best.date?' best':'')+'" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  svgs+='<text class="xlab" x="'+PADL+'" y="'+(VB_H-6)+'" text-anchor="start">'+fmtDate(list[0].date)+'</text><text class="xlab" x="'+(VB_W-PADR)+'" y="'+(VB_H-6)+'" text-anchor="end">today</text></svg>';
  plot.innerHTML=svgs;
  if(real.length>=2){ const d=r1(real[real.length-1].kg-real[0].kg); cap.innerHTML=(d>=0?'+':'')+d+' '+STATE.unit+' <span class="mu">· '+(active==='ALL'?'all time':'in '+active)+'</span>'; }
  else cap.textContent= real.length?'one session here':'';
}
function drawStats(e){

  const w30=real.filter(s=>daysAgo(s.date)<=30); const d30=w30.length>=2?r1(w30[w30.length-1].kg-w30[0].kg):0;

function drawTable(e, all){

/* ---- generate: a real conversation with the coach ------------------ */
/* ====================================================================
   THE COACH ORB — the FAB doesn't open a modal, it morphs into one. A
   hand-rolled FLIP: the overlay's panel is laid out at its real full-size
   position by CSS, we read that rect, then paint an inline transform that
   makes it START at the FAB's rect (translate+scale down to a circle),
   then clear the transform on the next frame so it animates there. Closing
   reverses the exact same transform. No modal snap, no library. ------- */
let coachOpen=false, coachBusy=false;
let fabConstellation=null, headerConstellation=null;
function initFabConstellation(){
  const canvas=$('#coachFabCanvas'); if(!canvas) return;
  fabConstellation = makeConstellation(canvas, { count:5 });
}
function fabToMorphTransform(morph){
  const fab=$('#coachFab'), fr=fab.getBoundingClientRect(), tr=morph.getBoundingClientRect();
  const sx=fr.width/tr.width, sy=fr.height/tr.height;
  const dx=(fr.left+fr.width/2)-(tr.left+tr.width/2);
  const dy=(fr.top+fr.height/2)-(tr.top+tr.height/2);
  return 'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';
}
function prefersReducedMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function openCoach(){
  if(coachOpen) return; coachOpen=true;
  const session=curSession();
  const messages=[]; // {role:'user'|'ai', text}
  const fab=$('#coachFab'); fab.style.visibility='hidden';
  const root=$('#coachRoot');
  root.innerHTML = '<div class="coachOverlay" id="coachOverlay"><div class="cvBackdrop" id="cvBackdrop"></div><div class="coachMorph" id="coachMorph">'
    + '<button class="cvClose" aria-label="Close">'+svg('<path d="M6 6l12 12M18 6L6 18"/>',' fill="none" stroke="currentColor"')+'</button>'
    + '<div class="cvCanvasWrap"><canvas id="cvCanvas"></canvas></div>'
    + '<div class="cvHead"><div class="cvTitle">Your Coach</div><div class="cvStatus" id="cvStatus"><span id="cvStatusTxt">Ready</span><span class="cvWave"><span></span><span></span><span></span><span></span></span></div></div>'
    + '<div class="cvLog" id="cvLog"><p class="cvEmpty">Tell me what you\'ve got — time, equipment, what you want to train — and I\'ll build today\'s session.</p></div>'
    + '<div id="cvResult"></div>'
    + '<div class="cvInputRow"><input id="cvIn" placeholder="e.g. 30 min, dumbbells only, explosiveness for taekwondo" autocomplete="off"/><button class="cvSend" id="cvSend" aria-label="Send">'+svg('<path d="M12 19V5M6 11l6-6 6 6"/>',' fill="none" stroke="currentColor"')+'</button></div>'
    + '</div></div>';
  const overlay=$('#coachOverlay'), morph=$('#coachMorph');
  const reduced=prefersReducedMotion();
  headerConstellation = makeConstellation($('#cvCanvas'), { count:7, startCollapsed:!reduced, force:true });
  if(reduced){
    overlay.classList.add('open');
  } else {
    morph.style.transform=fabToMorphTransform(morph);
    morph.style.opacity='.5';
    void morph.offsetWidth;
    requestAnimationFrame(()=>{
      morph.style.transition='transform .6s var(--ease-momentum), opacity .35s ease';
      morph.style.transform='translate(0,0) scale(1,1)';
      morph.style.opacity='1';
      overlay.classList.add('open');
    });
  }
  const log=$('#cvLog'), input=$('#cvIn'), sendBtn=$('#cvSend'), result=$('#cvResult'), statusTxt=$('#cvStatusTxt');
  function paint(){
    log.innerHTML = messages.map(m=>'<div class="cvMsg '+m.role+'">'+escapeHtml(m.text)+'</div>').join('');
    log.scrollTop = log.scrollHeight;
  }
  async function send(){
    const text=input.value.trim(); if(!text || coachBusy) return;
    coachBusy=true;
    messages.push({role:'user', text}); input.value=''; paint();
    setBtnState(sendBtn,'loading'); input.disabled=true;
    overlay.classList.add('thinking'); if(fabConstellation) fabConstellation.setMode('thinking'); if(headerConstellation) headerConstellation.setMode('thinking'); statusTxt.textContent='Thinking…';
    try{
      const history = messages.map(m=>({role:m.role==='user'?'user':'assistant', text:m.text}));
      const res = await window.Vitality.generateWorkout({ goal:fullGoalContext(), messages:history });
      if(res && res.kind==='question'){
        messages.push({role:'ai', text:res.text}); paint();
      } else if(res && res.kind==='workout'){
        messages.push({role:'ai', text:res.reply||'Here’s your session.'}); paint();
        showApply(res, session, result);
      } else {
        messages.push({role:'ai', text:"Couldn't build that — try again."}); paint();
      }
    }catch(err){
      const reason=err&&err.message;
      messages.push({role:'ai', text: reason==='no_key' ? 'Add your own Anthropic key to use this — ask your mentor.' : "Couldn't reach the coach — try again."});
      paint();
    }
    overlay.classList.remove('thinking'); if(fabConstellation) fabConstellation.setMode('idle'); if(headerConstellation) headerConstellation.setMode('idle'); statusTxt.textContent='Ready';
    setBtnState(sendBtn,null); input.disabled=false; input.focus(); coachBusy=false;
  }
  sendBtn.onclick=send;
  input.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); send(); } });
  input.addEventListener('focus',()=>{ if(!overlay.classList.contains('thinking')) statusTxt.textContent='Listening'; });
  input.addEventListener('blur',()=>{ if(!overlay.classList.contains('thinking')) statusTxt.textContent='Ready'; });
  overlay.querySelector('.cvClose').onclick=closeCoach;
  $('#cvBackdrop').onclick=closeCoach;
  const escHandler2=ev=>{ if(ev.key==='Escape') closeCoach(); };
  document.addEventListener('keydown', escHandler2);
  overlay._escHandler=escHandler2;
  input.focus();
}
function closeCoach(){
  const overlay=$('#coachOverlay'); if(!overlay || !coachOpen) return;
  coachOpen=false;
  if(overlay._escHandler) document.removeEventListener('keydown', overlay._escHandler);
  const morph=$('#coachMorph'); const fab=$('#coachFab');
  overlay.classList.remove('open');
  const cleanup=()=>{ $('#coachRoot').innerHTML=''; fab.style.visibility=''; if(headerConstellation){ headerConstellation.destroy(); headerConstellation=null; } };
  if(prefersReducedMotion()){ cleanup(); return; }
  morph.style.transform=fabToMorphTransform(morph);
  morph.style.opacity='.4';
  setTimeout(cleanup, 340);
}
function showApply(res, session, result){
  const used=new Set(session.ex.map(x=>x.id));
  const defs=(res.exercises||[]).map(info=>{
    const id=slugifyAvoiding(info.name||'exercise', used); used.add(id);
    STATE.customLib=STATE.customLib||{};
    STATE.customLib[id]={ equipment:info.equipment||'', primary:info.primary||[], secondary:info.secondary||[], gist:info.gist||'', steps:info.steps||[], cues:info.cues||[] };
    const sets=Math.max(1,Math.min(8,Math.round(info.startingSets)||3));
    return { id, name:info.name||'Exercise', tier:info.tier||2, sets, reps:Math.max(1,Math.round(info.startingReps)||10), kg:Number.isFinite(info.startingKg)?info.startingKg:0, perHand:false, rest:Math.max(30,Math.round(info.restSeconds)||90), lastKg:lastKgFromHistory(id), pinned:false, collapsed:false, deload:false, note:'', log:Array(sets).fill(null) };
  });
  const warmup=(res.warmup||[]).map(t=>({text:t, done:false}));
  const cooldown=(res.cooldown||[]).map(t=>({text:t, done:false}));
  result.innerHTML = '<div class="popBtns" style="margin-top:14px"><button class="pbtn ghost" id="genAdd">Add alongside</button><button class="pbtn save" id="genReplace">Replace today</button></div>';
  result.querySelector('#genAdd').onclick=()=>{ session.ex.push(...defs); if(warmup.length) session.warmup=session.warmup.concat(warmup); if(cooldown.length) session.cooldown=session.cooldown.concat(cooldown); closeCoach(); render(); };
  result.querySelector('#genReplace').onclick=()=>{ session.ex.forEach(x=>stopRest(x.id)); session.ex=defs; session.warmup=warmup; session.cooldown=cooldown; closeCoach(); render(); };

/* ---- tune popup --------------------------------------------------- */
function openTune(e){
  const existing=repRangeFor(e);
  const draft={ kg:e.kg, reps:e.reps, sets:e.sets, rest:e.rest, maxReps: existing?existing[1]:null };
  const loggedCount=e.log.filter(s=>s).length;
  const showMax=()=> draft.maxReps==null ? 'off' : String(draft.maxReps);
  openPop(popHead('Tune', e.name)
    + '<div style="margin-top:18px"></div>'
    + fieldRow('Weight','<input class="wInput" id="tw" type="number" inputmode="decimal" step="0.5" value="'+draft.kg+'"><span class="wUnit">'+STATE.unit+(e.perHand?'/ea':'')+'</span>', 'weight')
    + stepRow('Sets','tsets', draft.sets, 'sets')
    + stepRow('Reps','treps', draft.reps, 'reps')
    + stepRow('Top reps','tmax', draft.maxReps==null?'off':draft.maxReps, 'maxReps')
    + '<p class="settingsNote">Off means every clean session adds weight. Set a top rep and you chase reps first, then add weight and drop back to '+draft.reps+'.</p>'
    + stepRow('Rest','trest', mmss(draft.rest), 'rest')
    + '<div class="popBtns"><button class="pbtn ghost" id="tcancel">Cancel</button><button class="pbtn save" id="tsave">Save</button></div>',
    scrim=>{
      /* The invariant, enforced in one place after every change rather
         than re-derived inside each branch: a top rep is either off, or
         strictly above the bottom and no higher than 50. */
      const clampRange=()=>{
        if(draft.maxReps==null) return;
        if(draft.reps>=50){ draft.maxReps=null; return; }
        draft.maxReps=Math.min(50, Math.max(draft.maxReps, draft.reps+1));
      };
      const sync=()=>{ scrim.querySelector('#tsets .stepVal').textContent=draft.sets; scrim.querySelector('#treps .stepVal').textContent=draft.reps; scrim.querySelector('#tmax .stepVal').textContent=showMax(); scrim.querySelector('#trest .stepVal').textContent=mmss(draft.rest); };
      scrim.querySelector('#tw').oninput=ev=>{ const v=parseFloat(ev.target.value); if(Number.isFinite(v)) draft.kg=v; };
      scrim.querySelectorAll('.step').forEach(b=> b.onclick=()=>{ const f=b.dataset.f, d=+b.dataset.d;
        if(f==='rest'){ draft.rest=Math.max(0,draft.rest+d*15); }
        else if(f==='sets'){ draft.sets=Math.min(8,Math.max(Math.max(1,loggedCount),draft.sets+d)); }
        else if(f==='reps'){
          draft.reps=Math.min(50,Math.max(1,draft.reps+d));
          /* the top of the range has to stay above its bottom; push it up
             rather than silently dropping a range they deliberately set */
        }
        else if(f==='maxReps'){
          if(draft.maxReps==null){ draft.maxReps = d>0 && draft.reps<50 ? draft.reps+1 : null; }
          /* stepping below the bottom of the range is how you turn it off */
          else if(d<0 && draft.maxReps<=draft.reps+1){ draft.maxReps=null; }
          else { draft.maxReps=draft.maxReps+d; }
        }
        clampRange();
        sync(); });
      scrim.querySelector('#tcancel').onclick=closePop;
      scrim.querySelector('#tsave').onclick=()=>{ e.kg=Number.isFinite(draft.kg)?draft.kg:e.kg; e.reps=draft.reps; e.rest=draft.rest;
        setRepRange(e, (draft.maxReps!=null && draft.maxReps>draft.reps) ? [draft.reps, draft.maxReps] : null);
        // grow / shrink the set list, keeping logged sets
        if(draft.sets>e.log.length){ while(e.log.length<draft.sets) e.log.push(null); }
        else if(draft.sets<e.log.length){ e.log=e.log.slice(0,Math.max(loggedCount,draft.sets)); }
        e.sets=e.log.length; closePop(); render(); };
    });
}

/* ====================================================================
   PROGRESS PHOTOS — fanned like a hand of prints, newest on top. Upload
   + AI analysis via window.Vitality.addProgressPhoto, stored as
   {url, date, analysis} refs only; the actual bytes live in the owner's
   own Supabase Storage (supabase/photos.sql), never in tile_data itself.
   No deps (no gsap) — spring settle comes from this tile's own

   ================================================================= */
const FAN_MAX=7, FAN_HALF=3, FAN_K=3.3;
const FAN_POS=[
  {rot:-21,scale:.7756,x:-30,y:7.3,z:1},{rot:-14,scale:.8498,x:-22,y:4.0,z:2},{rot:-7,scale:.9346,x:-11,y:1.3,z:3},
  {rot:0,scale:1,x:0,y:0,z:10},
  {rot:7,scale:.9346,x:11,y:1.3,z:3},{rot:14,scale:.8498,x:22,y:4.0,z:2},{rot:21,scale:.7756,x:30,y:7.3,z:1},
];
let photoCenter=0, photoHoverI=null, photoPrevVisible=new Set();
function fanSlotConfig(n, slot){
  if(n>=FAN_MAX) return FAN_POS[slot];
  const center=(n-1)/2, dist=center>0?(slot-center)/center:0, ad=Math.abs(dist);
  return { rot:dist*21, scale:1-0.2244*ad*ad, x:dist*30, y:ad*ad*7.3, z:10-Math.round(Math.abs(slot-center)) };

function photosNewestFirst(){ return (STATE.photos||[]).map((p,i)=>({p,i})).reverse(); }
const FAN_CHEV_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="15 18 9 12 15 6"/></svg>';

        + '</div>').join('')
    + '</div></div>'
    + '<div class="fanCaption" id="fanCaption"></div>'
    + (paginated
        ? '<div class="fanNav"><button class="fanArrow" data-dir="left" aria-label="Previous photo">'+FAN_CHEV_L+'</button>'
          + '<div class="fanDots" id="fanDots"></div>'
          + '<button class="fanArrow" data-dir="right" aria-label="Next photo">'+FAN_CHEV_R+'</button></div>'
        : '');
  photoPrevVisible=new Set();
  layoutPhotoFan('mount');
  wirePhotoCards();
  if(paginated) el.querySelectorAll('.fanArrow').forEach(b=> b.onclick=()=> cyclePhotos(b.dataset.dir));
}

function cyclePhotos(dir){
  const n=(STATE.photos||[]).length;
  if(n<=FAN_MAX) return;
  photoCenter = dir==='right' ? (photoCenter+1)%n : (photoCenter-1+n)%n;
  photoHoverI=null;
  layoutPhotoFan(dir==='right'?'cycle-right':'cycle-left');
}

function layoutPhotoFan(mode){
  const stage=$('#fanStage'); if(!stage) return;
  const cards=Array.from(stage.children);
  const n=cards.length; if(!n) return;
  const paginated=n>FAN_MAX;
  const map=new Map();
  if(!paginated) cards.forEach((_,i)=>map.set(i,i));
  else for(let slot=0;slot<FAN_MAX;slot++) map.set(((photoCenter+slot-FAN_HALF)%n+n)%n, slot);
  const slotN=paginated?FAN_MAX:n;
  const reduced=prefersReducedMotion();
  const isMount=mode==='mount';
  const dir=mode==='cycle-left'?'left':mode==='cycle-right'?'right':null;

  cards.forEach((card,domIdx)=>{
    const slot=map.get(domIdx);
    const wasVisible=photoPrevVisible.has(domIdx);
    card.style.pointerEvents = slot!==undefined ? 'auto' : 'none';
    card.style.transitionDelay='0s';

    if(slot!==undefined){
      const c=fanSlotConfig(slotN,slot);
      const hot = photoHoverI!==null && +card.dataset.i===photoHoverI;
      const finalT='translate(-50%,-50%) translate('+(c.x*FAN_K).toFixed(1)+'px,'+(c.y*FAN_K-(hot?10:0)).toFixed(1)+'px) rotate('+c.rot.toFixed(1)+'deg) scale('+(hot?c.scale*1.06:c.scale).toFixed(3)+')';
      card.style.zIndex = hot ? 20 : c.z;
      if(reduced){ card.style.transition='none'; card.style.opacity='1'; card.style.transform=finalT; }
      else if(isMount){
        card.style.transition='none'; card.style.opacity='0';
        card.style.transform='translate(-50%,-50%) translate(0,60px) scale(.5)';
        void card.offsetWidth;
        card.style.transitionDelay=(0.12+slot*0.05)+'s';
        card.style.transition='transform var(--d5) var(--spring), opacity var(--d4) var(--ease-out)';
        requestAnimationFrame(()=>{ card.style.opacity='1'; card.style.transform=finalT; });
      } else if(!wasVisible && dir){
        const enterX = dir==='right' ? 200 : -200;
        card.style.transition='none'; card.style.opacity='0';
        card.style.transform='translate(-50%,-50%) translate('+enterX+'px,'+(c.y*FAN_K).toFixed(1)+'px) rotate('+(dir==='right'?26:-26)+'deg) scale(.5)';
        void card.offsetWidth;
        card.style.transition='transform var(--d4) var(--ease-momentum), opacity var(--d3) var(--ease-out)';
        requestAnimationFrame(()=>{ card.style.opacity='1'; card.style.transform=finalT; });
      } else {
        card.style.transition='transform var(--d3) var(--spring), opacity var(--d2) var(--ease-out)';
        card.style.opacity='1'; card.style.transform=finalT;
      }
    } else if(wasVisible && dir){
      const exitX = dir==='right' ? -200 : 200;
      card.style.transition='transform var(--d3) var(--ease-out), opacity var(--d3) var(--ease-out)';
      card.style.zIndex=0; card.style.opacity='0';
      card.style.transform='translate(-50%,-50%) translate('+exitX+'px,0) rotate('+(dir==='right'?-26:26)+'deg) scale(.5)';
    } else {
      card.style.transition = reduced ? 'none' : 'transform var(--d3) var(--ease-out), opacity var(--d3) var(--ease-out)';
      card.style.opacity='0'; card.style.zIndex=0;
      card.style.transform='translate(-50%,-50%) scale(.4)';
    }
  });
  photoPrevVisible=new Set(map.keys());

  const centerDomIdx = paginated ? photoCenter : Math.round((slotN-1)/2);
  const centerCard = cards[centerDomIdx];
  updatePhotoCaption(photoHoverI!==null ? photoHoverI : (centerCard? +centerCard.dataset.i : null));
  if(paginated) renderPhotoDots(n);
}

function renderPhotoDots(n){
  const dots=$('#fanDots'); if(!dots) return;
  if(n<=12){ let h=''; for(let i=0;i<n;i++) h+='<span class="'+(i===photoCenter?'on':'')+'"></span>'; dots.innerHTML=h; }
  else dots.innerHTML='<span class="fanCount">'+(photoCenter+1)+' / '+n+'</span>';
}

function updatePhotoCaption(idx){
  const cap=$('#fanCaption'); if(!cap) return;
  const p = idx!==null && STATE.photos ? STATE.photos[idx] : null;
  if(!p){ cap.innerHTML=''; return; }
  const noteHtml = p.analysis===undefined ? '<p class="photoNote muted skeleton-shimmer">Analyzing…</p>'
    : p.failed ? '<p class="photoNote muted">Couldn’t save this photo — ask your mentor to check Supabase storage, or add your Anthropic key.</p>'
    : p.analysis ? '<p class="photoNote">'+escapeHtml(p.analysis)+'</p>'
    : '<p class="photoNote muted">No analysis available for this one.</p>';
  cap.innerHTML='<div class="capRow"><span class="photoDate">'+fmtDate(p.date)+'</span><button class="photoX" data-i="'+idx+'" aria-label="Remove photo">×</button></div>'+noteHtml;
  const delBtn=cap.querySelector('.photoX');
  if(delBtn) delBtn.onclick=()=>{ STATE.photos.splice(+delBtn.dataset.i,1); saveState(); renderPhotos(); };
}

function wirePhotoCards(){
  const stage=$('#fanStage'); if(!stage) return;
  const cards=Array.from(stage.children);
  let leaveTimer=null;
  cards.forEach((card,domIdx)=>{
    card.addEventListener('pointerenter', ()=>{
      if(leaveTimer){ clearTimeout(leaveTimer); leaveTimer=null; }
      photoHoverI=+card.dataset.i;
      layoutPhotoFan('update');
    });
    card.addEventListener('click', ()=>{
      if(cards.length>FAN_MAX) photoCenter=domIdx;
      photoHoverI=null;
      layoutPhotoFan('update');
    });
  });
  stage.addEventListener('pointerleave', ()=>{
    if(leaveTimer) clearTimeout(leaveTimer);
    leaveTimer=setTimeout(()=>{ photoHoverI=null; layoutPhotoFan('update'); },70);
  });
}
function wirePhotoUpload(){
  const galleryBtn=$('#addPhotoBtn'), cameraBtn=$('#takePhotoBtn'), galleryInput=$('#photoInput'), cameraInput=$('#cameraInput');
  if(!galleryBtn||!cameraBtn) return;
  galleryBtn.onclick=()=> galleryInput.click();
  cameraBtn.onclick=()=> cameraInput.click();
  [galleryInput, cameraInput].forEach(input=>{ input.onchange=()=> handlePhotoFile(input); });
}
function handlePhotoFile(input){
  const status=$('#photoStatus');
  const file=input.files && input.files[0]; input.value='';
  if(!file) return;
  if(!file.type.startsWith('image/')){ status.textContent='That’s not an image.'; return; }
  if(file.size > 10*1024*1024){ status.textContent='Photo’s too large — try one under 10MB.'; return; }
  status.innerHTML='<span class="miniSpinner"></span>Uploading…';
  const reader=new FileReader();
  reader.onload=async()=>{
    const dataUrl=String(reader.result||'');
    const comma=dataUrl.indexOf(',');
    const mime=(dataUrl.slice(5,dataUrl.indexOf(';'))||'image/jpeg');
    const base64=dataUrl.slice(comma+1);
    const entry={ url:null, date:today, analysis:undefined };
    STATE.photos=STATE.photos||[]; STATE.photos.push(entry); saveState(); renderPhotos();
    try{
      const res=await window.Vitality.addProgressPhoto({ base64, mime, goal:fullGoalContext() });
      entry.url=(res&&res.url)||null; entry.analysis=(res&&res.analysis)||null;
      if(!entry.url) entry.failed=true;
    }catch(err){ entry.analysis=null; entry.failed=true; }
    if(entry.failed){ status.textContent=''; }
    else { status.innerHTML='<span class="miniCheck">✓</span>Saved'; setTimeout(()=>{ status.innerHTML=''; },1400); }
    saveState(); renderPhotos();
  };
  reader.readAsDataURL(file);
}

/* ====================================================================
   OVERVIEW CARDS — fixed at-a-glance summary above the interactive
   picker. Every number here is real arithmetic over data already
   collected; nothing invented (no heart rate / calories / VO2 — this
   app doesn't have that data, so it doesn't pretend to).
   ================================================================= */
function longestStreak(){
  const dates=[...(STATE.finishedDates||[])].sort();
  let longest=0, run=0, prev=null;
  dates.forEach(d=>{
    if(prev){ const [y,m,dd]=prev.split('-').map(Number); const pd=new Date(y,m-1,dd); pd.setDate(pd.getDate()+1); run = ymd(pd)===d ? run+1 : 1; }
    else run=1;
    longest=Math.max(longest,run); prev=d;
  });
  return longest;
}
function totalPRsAllTime(){
  let count=0;
  Object.keys(STATE.history||{}).forEach(id=>{
    const h=(STATE.history[id]||[]).filter(s=>!s.off).slice().sort((a,b)=>a.date.localeCompare(b.date));
    let bestKgSoFar=0, bestRepsAtBest=0;
    h.forEach(entry=>{
      const topR=TrainEngine.topWorkingReps(entry);
      const topW=TrainEngine.topWorkingWeight(entry)||entry.kg||0;
      const isPr = topW>bestKgSoFar || (topW===bestKgSoFar && topR>bestRepsAtBest);
      if(isPr){ if(bestKgSoFar>0) count++; bestKgSoFar=Math.max(bestKgSoFar,topW); bestRepsAtBest=Math.max(bestRepsAtBest,topR); }
    });
  });
  return count;
}
function weeksSinceStart(){
  const dates=[...(STATE.finishedDates||[])].sort();
  if(!dates.length) return 1;
  const [y,m,d]=dates[0].split('-').map(Number);
  const days=Math.max(1, Math.round((new Date()-new Date(y,m-1,d))/DAY));
  return Math.max(1, days/7);
}
function weekdayCounts(){
  const counts=[0,0,0,0,0,0,0];
  (STATE.finishedDates||[]).forEach(k=>{ const [y,m,d]=k.split('-').map(Number); counts[new Date(y,m-1,d).getDay()]++; });
  return counts;
}
function muscleVolumeBreakdown(){
  const map={};
  Object.keys(STATE.history||{}).forEach(id=>{
    const info=STATE.customLib && STATE.customLib[id];
    const muscles=(info && info.primary && info.primary.length) ? info.primary : ['Other'];
    const vol=(STATE.history[id]||[]).filter(s=>!s.off).reduce((a,s)=>a+TrainEngine.workingVolume(s),0);
    muscles.forEach(m=>{ map[m]=(map[m]||0)+vol/muscles.length; });
  });
  return Object.keys(map).map(m=>({m,vol:r1(map[m])})).sort((a,b)=>b.vol-a.vol);
}
/* weekly-bucketed real history — no invented series, just the same dated
   entries (finishedDates / volume-by-date / sessionDurations) the rest of
   this file already computes, grouped into `weeks` 7-day buckets ending
   today. Powers the mini trend chart on the stat cards that actually have
   a meaningful week-over-week shape; cards that don't (streaks, PR count)
   skip the chart rather than fake one. */
function weeklyBuckets(entries, weeks, valueFn){
  const buckets=Array.from({length:weeks},()=>0);
  entries.forEach(e=>{
    const ago=daysAgo(e.date);
    if(ago<0 || ago>=weeks*7) return;
    const w=weeks-1-Math.floor(ago/7);
    buckets[w]+=(valueFn?valueFn(e):1);
  });
  return buckets;
}
function ovChartHTML(buckets){
  const max=Math.max(...buckets,1);
  return '<div class="ovChart">'+buckets.map((v,i)=>'<div class="ovBar'+(i===buckets.length-1?' now':'')+'" data-h="'+(v>0?Math.max(6,Math.round(v/max*100)):0)+'"></div>').join('')+'</div><div class="ovCap">8-week trend</div>';
}
function renderOverviewCards(){
  const el=$('#overviewCards'); if(!el) return;
  const totalMin=(STATE.sessionDurations||[]).reduce((a,s)=>a+(s.minutes||0),0);
  const volByDate=aggregateVolumeByDate();
  const totalVol=Math.round(volByDate.reduce((a,s)=>a+s.kg,0));
  const WEEKS=8;
  const sessBuckets=weeklyBuckets((STATE.finishedDates||[]).map(d=>({date:d})), WEEKS);
  const volBuckets=weeklyBuckets(volByDate, WEEKS, e=>e.kg);
  const hrBuckets=weeklyBuckets(STATE.sessionDurations||[], WEEKS, e=>(e.minutes||0)/60);
  const sessDelta=sessBuckets[WEEKS-1]-sessBuckets[WEEKS-2];
  const cards=[
    { n:(STATE.finishedDates||[]).length, l:'Sessions', c:'mint', chart:sessBuckets,
      desc: sessDelta!==0 ? '<b>'+(sessDelta>0?'+':'')+sessDelta+'</b> vs last week' : 'same as last week' },
    { n:r1(totalMin/60), l:'Hours trained', c:'mint', chart:hrBuckets },
    { n:currentStreak(), l:'Day streak', c:'gold' },
    { n:longestStreak(), l:'Longest streak', c:'gold' },
    { n:totalPRsAllTime(), l:'Personal records', c:'gold' },
    { n:totalVol.toLocaleString(), l:'Total '+STATE.unit+' lifted', c:'mint', chart:volBuckets },
    { n:r1((STATE.finishedDates||[]).length/weeksSinceStart()), l:'Sessions / week', c:'mint' },
    { n:Object.keys(STATE.exerciseNames||{}).length, l:'Exercises tracked', c:'mint' },
  ];
  el.innerHTML = cards.map(c=>'<div class="ovCard"><div class="ovNum '+c.c+'">'+c.n+'</div><div class="ovLbl">'+c.l+'</div>'
    +(c.desc?'<div class="ovDesc">'+c.desc+'</div>':'')
    +(c.chart?ovChartHTML(c.chart):'')
    +'</div>').join('');
  revealOverviewCards(el);
}
/* ---- reveal, once, when the cards actually scroll into view — same
   once-only IO gate as growBars(), just driving a count-up alongside the
   bar grow so the number and the chart land together. */
function revealOverviewCards(el){
  if(!el) return;
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // stagger WITHIN each card's chart, not across the whole grid — three
  // charts should sweep in together, not queue up one bar every 45ms
  // across all of them (that dragged the last card out to ~1s late).
  const charts=[...el.querySelectorAll('.ovChart')];
  if(reduced){ charts.forEach(c=> c.querySelectorAll('.ovBar[data-h]').forEach(b=> b.style.height=b.dataset.h+'%')); return; }
  const run=()=>{
    charts.forEach(c=> c.querySelectorAll('.ovBar[data-h]').forEach((b,i)=> setTimeout(()=>{ b.style.height=b.dataset.h+'%'; }, i*45)));
    animateCounts(el);
  };
  if(!('IntersectionObserver' in window)){ requestAnimationFrame(()=>requestAnimationFrame(run)); return; }
  const io=new IntersectionObserver((entries,obs)=>{
    if(entries.some(e=>e.isIntersecting)){ run(); obs.disconnect(); }
  }, { threshold:0.3 });
  io.observe(el);
}
/* ---- count-up: reads the number a stat card/row already rendered and
   animates it up from 0. Purely cosmetic — the final text is always the
   exact string the render function produced, decimals and commas intact. */
function animateCounts(root){
  if(!root || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  root.querySelectorAll('.ovNum, .stat .v').forEach(el=>{
    const raw=el.textContent.trim();
    const m=raw.match(/^([+-]?)([\d,]+(?:\.\d+)?)/);
    if(!m) return;
    const sign=m[1]||'', digits=m[2];
    const target=parseFloat(digits.replace(/,/g,''));
    if(!Number.isFinite(target)) return;
    const suffix=raw.slice(m[0].length);
    const decimals=(digits.split('.')[1]||'').length;
    const dur=750, start=performance.now();
    (function tick(now){
      const p=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-p,3);
      const cur=target*eased;
      el.textContent=sign+(decimals?cur.toFixed(decimals):Math.round(cur).toLocaleString())+suffix;
      if(p<1) requestAnimationFrame(tick); else el.textContent=raw;
    })(start);
  });
}
/* ---- bar grow-in: bars sit at 0 until this section is actually scrolled
   into view, then sweep to their real size once — fast out of the gate,
   easing off toward the end (--ease-out) — and never re-trigger after
   that first reveal, even if you scroll past it again. Redrawing the
   view (switching stats chips) mounts fresh bars, so it gets its own
   one-time reveal too. */
function growBars(root){
  if(!root) return;
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bars=[...root.querySelectorAll('[data-w], [data-h]')];
  if(!bars.length) return;
  if(reduced){ bars.forEach(b=>{ if(b.dataset.w!=null) b.style.width=b.dataset.w+'%'; if(b.dataset.h!=null) b.style.height=b.dataset.h+'%'; }); return; }
  const reveal=()=> bars.forEach((b,i)=> setTimeout(()=>{ if(b.dataset.w!=null) b.style.width=b.dataset.w+'%'; if(b.dataset.h!=null) b.style.height=b.dataset.h+'%'; }, i*45));
  if(!('IntersectionObserver' in window)){ requestAnimationFrame(()=>requestAnimationFrame(reveal)); return; }
  const io=new IntersectionObserver((entries,obs)=>{
    if(entries.some(e=>e.isIntersecting)){ reveal(); obs.disconnect(); }
  }, { threshold:0.35 });
  io.observe(root);
}
function exportCSV(){
  /* Warm-ups are exported — they happened — but flagged, and the working
     totals beside them exclude warm-ups and misses so a spreadsheet does
     not have to re-derive the distinction. */
  const rows=[['date','exercise','weight_'+STATE.unit,'reps_per_set','warmup_flags','working_sets','working_volume']];
  Object.keys(STATE.history||{}).forEach(id=>{
    const name=(STATE.exerciseNames&&STATE.exerciseNames[id])||id;
    (STATE.history[id]||[]).forEach(e=>{
      const reps=(e.sets||[]).map(s=>s.fail?'F':s.r).join('|');
      const flags=(e.sets||[]).map(s=>s.warmup?'W':'-').join('|');
      rows.push([e.date, name, e.kg, reps, flags, TrainEngine.workingSets(e).length, Math.round(TrainEngine.workingVolume(e))]);
    });
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='training-history.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ====================================================================
   PROGRESS STATS — pick a metric (aggregate volume, session calendar,
   records, muscle breakdown, lift goals, or a specific exercise) and a
   range, reusing the same range-picker pattern as the per-exercise
   history popup but drawing straight from the global STATE.history so
   it survives any single exercise being removed today.
   ================================================================= */
let statsView={ id:'__volume' }, statsRangeKey='M';
function renderStatsPicker(){
  const el=$('#statsPicker'); if(!el) return;
  const names=STATE.exerciseNames||{};
  const items=[
    {id:'__volume',label:'Volume'},{id:'__sessions',label:'Sessions'},
    {id:'__records',label:'Records'},{id:'__muscles',label:'Muscles'},{id:'__goals',label:'Goals'}
  ].concat(Object.keys(names).map(id=>({id,label:names[id]})));
  el.innerHTML = items.map(it=>'<button class="chip'+(statsView.id===it.id?' on':'')+'" data-id="'+it.id+'">'+escapeHtml(it.label)+'</button>').join('');
  el.querySelectorAll('.chip').forEach(b=> b.onclick=()=>{
    statsView={id:b.dataset.id}; renderStatsPicker(); drawStatsSection();
    b.scrollIntoView({ behavior: (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
  });
}
function drawStatsSection(){
  const rangeEl=$('#statsRange');
  const showRange = statsView.id==='__volume' || (!statsView.id.startsWith('__'));
  rangeEl.style.display = showRange ? '' : 'none';

    renderRangeControl(rangeEl, statsRangeKey, r=>{ statsRangeKey=r; drawStatsSection(); });
  }

  else if(statsView.id==='__volume') drawVolumeChart();
  else if(statsView.id==='__records') drawRecords();
  else if(statsView.id==='__muscles') drawMuscles();

}
function drawRecords(){
  const plot=$('#statsPlot'), cap=$('#statsCap');
  plot.style.aspectRatio='auto';
  const names=STATE.exerciseNames||{};
  const rows=Object.keys(names).map(id=>{
    const h=(STATE.history[id]||[]).filter(s=>!s.off); if(!h.length) return null;
    const best=h.reduce((b,s)=>s.kg>b.kg?s:b);
    return { name:names[id], kg:best.kg, date:best.date };
  }).filter(Boolean).sort((a,b)=>b.kg-a.kg);
  plot.innerHTML = rows.length
    ? '<table class="hist"><thead><tr><th>Exercise</th><th>Best</th><th>Date</th></tr></thead><tbody>'
      + rows.map(r=>'<tr><td>'+escapeHtml(r.name)+'</td><td><span class="num">'+r.kg+'</span> <span class="u">'+STATE.unit+'</span></td><td>'+fmtDate(r.date)+'</td></tr>').join('')
      + '</tbody></table>'
    : '<p class="emptyHist">No records yet — log a lift to start.</p>';

function drawMuscles(){

function drawGoals(){
  const plot=$('#statsPlot'), cap=$('#statsCap');
  plot.style.aspectRatio='auto';
  const goals=STATE.liftGoals||[], names=STATE.exerciseNames||{};
  const rows=goals.map((g,i)=>{

  }).join('');

  const addBtn=plot.querySelector('#addGoalBtn'); if(addBtn) addBtn.onclick=openAddGoal;

}
function openAddGoal(){
  const names=STATE.exerciseNames||{};
  const ids=Object.keys(names).filter(id=>(STATE.history[id]||[]).some(s=>!s.off));
  if(!ids.length) return;
