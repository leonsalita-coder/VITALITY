<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>Train</title>

<style>
  /* ====================================================================
     TRAIN — an instrument, not a card feed. One physics idea (momentum),
     one signal color used sparingly (mint — shared across the whole
     dashboard, kept for system coherence), a five-step elevation scale
     instead of flat panels, and numerals treated like an engraved dial.
     System fonts only — no external files, this renders in a sealed
     sandboxed iframe with no network. Every "expensive" cue here is
     built from restraint and craft, not borrowed assets.
     ================================================================= */
  :root {
    /* elevation — true-black base, five graphite steps up */
    --e0:#030304; --e1:#0a0a0d; --e2:#101013; --e3:#17171b; --e4:#1f1f24;
    --hair:rgba(255,255,255,.05); --hair-strong:rgba(255,255,255,.12);
    /* signal — scarce by design. gold flags a PR, fail flags a miss */
    --signal:#6EE7B7; --signal-ink:#04140d;
    --gold:#f5a623; --fail:#ef6f6a;
    --text:#f2f2f0; --muted:#86868f; --muted-2:#5c5c63;
    /* type — sans for UI, serif upright (never default-italic) for
       structural headings, mono for every numeral / data readout */
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;
    /* spacing ladder — 4/8/12/16/24/32/48/64/96 */
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px; --sp8:64px; --sp9:96px;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    /* motion — one momentum family. out = ui settling; spring = tactile
       taps; cinematic = anything that takes over the screen */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-momentum:cubic-bezier(.2,.85,.25,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --d1:110ms; --d2:190ms; --d3:320ms; --d4:520ms; --d5:760ms;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  ::selection { background:var(--signal); color:var(--signal-ink); }
  html { background:var(--e0); }
  body { margin:0; min-height:100dvh; padding:0 0 calc(56px + env(safe-area-inset-bottom)); background:var(--e0); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  button { font-family:inherit; cursor:pointer; }
  button:disabled { cursor:default; }
  .num,.tab { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--signal); outline-offset:2px; border-radius:6px; }

  /* ── the original Vitality backdrop — mountains / glass atmosphere /
        particles, fully self-contained (no external file). Kept as-is
        per request while the rest of the tile moved to the new system. */
  #vt-backdrop { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; background:var(--e0); }
  #vt-backdrop .wb-atmosphere { position:absolute; inset:0; pointer-events:none; background:
    radial-gradient(60% 50% at 50% 40%, rgba(110,231,183,.18) 0%, rgba(110,231,183,.06) 32%, rgba(110,231,183,0) 66%),
    radial-gradient(34% 26% at 50% 44%, rgba(255,226,181,.08) 0%, rgba(255,226,181,0) 72%),
    radial-gradient(130% 90% at 50% 120%, rgba(14,38,30,.85) 0%, rgba(0,0,0,1) 72%); }
  #vt-backdrop .wb-mountains { position:absolute; left:0; right:0; bottom:0; height:42vh; min-height:240px; pointer-events:none; }
  #vt-backdrop .wb-mountains svg { width:100%; height:100%; display:block; }
  #vt-backdrop .wb-mist { position:absolute; left:0; right:0; bottom:30vh; height:24vh; pointer-events:none; background:linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(110,231,183,.06) 40%, rgba(0,0,0,0) 100%); filter:blur(8px); }
  #vt-backdrop .wb-particles { position:absolute; inset:0; pointer-events:none; }
  #vt-backdrop .wb-particles span { position:absolute; width:1.5px; height:1.5px; background:rgba(233,239,233,.55); border-radius:50%; box-shadow:0 0 4px rgba(167,243,208,.35); animation:vtDrift linear infinite; }
  @keyframes vtDrift { 0%{transform:translate3d(0,0,0);opacity:0;} 8%{opacity:.7;} 92%{opacity:.5;} 100%{transform:translate3d(var(--dx,12px),var(--dy,-100vh),0);opacity:0;} }
  @media (prefers-reduced-motion:reduce) { #vt-backdrop .wb-particles span { animation:none; } }


  /* ── GROUND-UP REBUILD — every component's design (CSS) below this
        point has been deleted, not disabled. The HTML markup and all
        JS logic (state, calculations, event wiring) are untouched, so
        the tile still runs correctly — it just renders unstyled while
        we design each component fresh, one at a time. ============= */

  /* ==== TOP STICKER — greeting + a note bar that flips through short,
     real, day-dependent callouts (rest day, streak, a nudge, a PR),
     color-coded by what kind of note it is. First rebuilt piece. ==== */
  .topSticker { padding:calc(16px + env(safe-area-inset-top)) var(--sp5) 0; }
  .stickerGreet { font-family:var(--sans); font-weight:800; font-size:22px; letter-spacing:-0.02em; color:var(--text); margin-bottom:11px; }
  .noteBar { display:flex; align-items:stretch; gap:0; background:var(--e2); border:1px solid var(--hair); border-radius:var(--r-lg); padding:10px 2px; box-shadow:0 14px 30px -20px rgba(0,0,0,.7); }
  .noteSlot { flex:1; min-width:0; height:16px; position:relative; overflow:hidden; perspective:220px; }
  .noteDiv { width:1px; flex:none; background:var(--hair-strong); margin:1px 0; }
  .noteCard { position:absolute; inset:0 7px; display:flex; align-items:center; gap:4px; font-family:var(--sans); font-size:10.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); transform-origin:50% 0%; transform:translateY(0) rotateX(0deg); opacity:1; transition:transform .48s var(--ease-momentum), opacity .38s var(--ease-momentum); }
  .noteCard.entering { transform:translateY(65%) rotateX(75deg); opacity:0; }
  .noteCard.leaving { transform:translateY(-65%) rotateX(-75deg); opacity:0; }
  .noteDot { flex:none; width:4px; height:4px; border-radius:50%; background:currentColor; }
  .noteEmo { flex:none; font-size:10.5px; line-height:1; }
  .noteTxt { min-width:0; overflow:hidden; text-overflow:ellipsis; color:currentColor; }
  .note-mint { color:var(--signal); }
  .note-gold { color:var(--gold); }
  .note-fail { color:var(--fail); }
  .note-plain { color:var(--muted); }

  /* why a weight is being suggested — quiet by default, because it is an
     explanation and not a call to action. Only a layoff or a deload earns
     colour, since those are the two the lifter would otherwise misread as
     the app losing their progress. */
  .pillWhy { margin:5px 0 0 34px; font-size:11px; line-height:1.35; font-family:var(--sans); color:var(--muted); letter-spacing:.005em; }
  .pillWhy.why-clean { color:var(--signal); }
  .pillWhy.why-layoff, .pillWhy.why-deload { color:var(--gold); }

  /* readiness — stated as fact before the session, not offered as a choice */
  .readinessNote { margin:var(--sp3) var(--sp5) 0; padding:10px var(--sp4);
    border-radius:var(--r-md); background:var(--e2); border:1px solid var(--hair);
    font-size:12px; font-weight:600; line-height:1.4; color:var(--muted); }
  .readinessNote.verdict-rest_advised { color:var(--fail); border-color:rgba(239,111,106,.3); }
  .weeklyReview { margin:var(--sp3) var(--sp5) 0; padding:12px var(--sp4);
    border-radius:var(--r-md); background:var(--e1); border:1px solid var(--hair); }
  .weeklyReview .wrHead { font-size:10px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted-2); margin-bottom:6px; }
  .weeklyReview .wrLine { font-size:12px; font-weight:600; line-height:1.45; color:var(--text); }
  .weeklyReview .wrLine.mu { color:var(--muted); font-weight:500; }

  /* progress charts — minimal, reusing the existing bar and plot surfaces */
  .sChart { position:relative; width:100%; aspect-ratio:16/9; }
  .sPoint { position:absolute; width:9px; height:9px; margin:-4px 0 0 -4px; padding:0;
    border-radius:50%; border:none; background:var(--signal); }
  .sPoint:active { transform:scale(1.5); }
  .mbFill.ok, .mbFill.band-in { background:var(--signal); }
  .mbFill.band-over, .mbFill.band-under { background:var(--gold); }
  .readinessNote.verdict-reduced_volume,
  .readinessNote.verdict-reduced_intensity { color:var(--gold); border-color:rgba(245,166,35,.28); }

  /* warm-up toggle — deliberately quiet. It is a correction, not an action,
     and it should never compete with "Hit it". */
  .pillWarm { flex:none; width:22px; height:22px; border-radius:7px;
    border:1px solid var(--hair-strong); background:transparent; color:var(--muted-2);
    font-family:var(--mono); font-size:11px; font-weight:700; line-height:1;
    transition:background var(--d1) var(--ease-out), color var(--d1) var(--ease-out); }
  .pillWarm.on { background:var(--e4); color:var(--text); }
  .pill.warmup { opacity:.55; }
  /* a weight or rep record: a dot, not a takeover */
  .pillPrDot { display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--gold); margin-right:5px; vertical-align:middle; }
  /* the near-miss cue, before the set */
  .pillNear { font-size:10.5px; font-weight:600; color:var(--gold); margin-right:8px;
    white-space:nowrap; }

  /* ==== REST BAR — an instrument face, not a toast. It sits inside the
     lift card while the clock runs: a ring that drains, a mono readout,
     and two coarse nudges either side. Overtime flips the whole bar to
     gold rather than only the number, because at a glance across a bench
     the colour is the only thing that actually reads. ============== */
  .restbar { display:flex; align-items:center; gap:var(--sp3); margin-top:var(--sp3);
    padding:10px var(--sp3); border-radius:var(--r-md);
    background:var(--e2); border:1px solid var(--hair);
    box-shadow:0 10px 24px -18px rgba(0,0,0,.8);
    animation:restIn var(--d3) var(--ease-out) both; }
  @keyframes restIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .restbar .restMid { flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
  .restbar .restRing { width:34px; height:34px; flex:none; transform:rotate(-90deg); }
  .restbar .restRingTrack { fill:none; stroke:var(--hair-strong); stroke-width:3; }
  .restbar .restRingFill { fill:none; stroke:var(--signal); stroke-width:3; stroke-linecap:round;
    transition:stroke-dashoffset var(--d1) linear, stroke var(--d2) var(--ease-out); }
  .restbar .restTime { font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:17px; font-weight:600; letter-spacing:-.01em; color:var(--text); min-width:52px; }
  .restbar .restLabel { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.01em; }
  .restbar .restStep { flex:none; padding:7px 9px; border-radius:var(--r-sm);
    border:1px solid var(--hair-strong); background:transparent; color:var(--muted);
    font-family:var(--mono); font-size:11px; font-weight:600;
    transition:background var(--d1) var(--ease-out), color var(--d1) var(--ease-out); }
  .restbar .restStep:active { background:var(--e4); color:var(--text); transform:scale(.94); }
  .restbar .restX { flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--hair); background:transparent; color:var(--muted-2);
    font-size:14px; line-height:1; }
  .restbar .restX:active { color:var(--text); }
  /* overtime — the rest is over and the number is now counting up */
  .restbar.over { border-color:rgba(245,166,35,.32); background:linear-gradient(var(--e2),var(--e2)) padding-box; }
  .restbar.over .restRingFill { stroke:var(--gold); }
  .restbar.over .restTime { color:var(--gold); }
  .restbar.over .restLabel { color:var(--gold); opacity:.75; }
  @media (prefers-reduced-motion:reduce) { .restbar { animation:none; } }
</style>
</head>

<div id="vt-backdrop" aria-hidden="true">
  <div class="wb-atmosphere"></div>
  <div class="wb-mountains"><svg viewBox="0 0 1600 420" preserveAspectRatio="none"><defs><linearGradient id="vt-mt-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1a17" stop-opacity="0"/><stop offset="55%" stop-color="#0d1a17" stop-opacity=".55"/><stop offset="100%" stop-color="#0d1a17" stop-opacity=".95"/></linearGradient><linearGradient id="vt-mt-near" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050a09" stop-opacity=".4"/><stop offset="60%" stop-color="#050a09" stop-opacity=".95"/><stop offset="100%" stop-color="#050a09" stop-opacity="1"/></linearGradient></defs><path d="M0,300 L120,230 L210,260 L320,180 L430,220 L560,150 L680,210 L820,170 L960,220 L1100,180 L1240,240 L1380,200 L1500,250 L1600,220 L1600,420 L0,420 Z" fill="url(#vt-mt-far)"/><path d="M0,360 L100,320 L220,340 L340,290 L460,330 L590,300 L720,340 L860,310 L1000,350 L1140,310 L1280,355 L1420,320 L1540,360 L1600,340 L1600,420 L0,420 Z" fill="url(#vt-mt-near)"/></svg></div>
  <div class="wb-mist"></div>
  <div class="wb-particles"></div>
</div>

<header class="topSticker" id="topSticker">
  <div class="stickerGreet" id="stickerGreet">Welcome Piglet</div>
  <div class="noteBar" id="noteBar"></div>
</header>

<div class="rail" id="statusRail">
  <div class="railDate" id="railDate">—</div>
  <div class="railSpacer"></div>
  <div class="railStat"><span class="railStatVal" id="railStreak">0</span><span class="railStatLbl">wk streak</span></div>
  <div class="railDivider"></div>
  <div class="railStat"><span class="railStatVal" id="railVolume">0</span><span class="railStatLbl" id="railVolumeLbl">lb</span></div>
</div>

<div class="shell">
<div class="starterTag">✦ starter — the value is what you build · the videos show how</div>
  <div class="sheet" id="sheet">
    <div class="trainBar">
      <div class="wordmark">Train <span class="wmDot">·</span> Session <span id="sessionNum">1</span></div>
      <div class="chrome">
        <button class="settingsBtn" id="settingsBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <div class="bouncyRow">
          <span class="bouncyLabel" id="restLabel">Rest day</span>
          <button class="bouncyToggle" id="moonbtn" role="switch" aria-checked="false" title="Mark today a rest day">
            <span class="bouncyTrack"><span class="bouncyThumb"><span class="bouncyDot">🌙</span></span></span>
          </button>
        </div>
      </div>
    </div>
    <div class="daydots" id="daydots"></div>
    <div class="heroCap">Today's session<span id="streakPill" class="streakPill"></span></div>
    <div class="heroRow">
      <div class="progress" id="progress">
        <div class="progRing">
          <svg viewBox="0 0 88 88"><circle class="prTrack" cx="44" cy="44" r="38"/><circle class="prFill" id="prFill" cx="44" cy="44" r="38"/></svg>
          <div class="prCenter"><div class="prPct" id="prPct">0%</div><div class="plabel" id="plabel"></div></div>
        </div>
      </div>
      <div class="heroText">
        <h1 class="daytitle" id="daytitle">Today</h1>
        <div class="heroSub" id="heroSub"></div>
      </div>
    </div>
    <div class="readinessNote" id="readinessNote"></div>
    <div class="weeklyReview" id="weeklyReview"></div>
    <div class="statStrip" id="miniStats"></div>
    <div class="wcSection" id="warmupSlot"></div>
    <div class="exwrap" id="exwrap"></div>
    <div class="wcSection" id="cooldownSlot"></div>
    <div class="finishRow"><button class="finishBtn" id="finishBtn">Finish session</button></div>
    <button class="freshbtn" id="modeBtn">Edit session</button>
    <button class="freshbtn" id="freshbtn">Start fresh</button>
    <p class="store-note">Saved to your Vitality dashboard.</p>
  </div>

  <div class="sheet" id="goalSheet">
    <div class="eyebrow">Short-term goal</div>
    <div id="goalBubble" style="margin-top:14px"></div>
  </div>

  <div class="sheet" id="photosSheet">
    <div class="eyebrow">Progress photos</div>
    <div id="photoGallery" style="margin-top:14px"></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none" />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" />
    <div class="photoBtnRow">
      <button class="addLift" id="takePhotoBtn"><span class="addLiftRing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="addLiftLabel">Take a photo</span></button>
      <button class="addLift" id="addPhotoBtn"><span class="addLiftRing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="addLiftLabel">From library</span></button>
    </div>
    <div id="photoStatus" class="photoStatus"></div>
  </div>

  <div class="sheet" id="statsSheet">
    <div class="eyebrow" style="display:flex;align-items:center;justify-content:space-between">Progress<button class="photoX" id="exportCsvBtn" title="Export CSV" style="font-size:11px;font-family:var(--vt-mono);letter-spacing:.08em;text-transform:uppercase">Export ⇩</button></div>
    <div class="ovGrid" id="overviewCards"></div>
    <div class="chipRow" id="statsPicker"></div>
    <div class="range" id="statsRange"></div>
    <div class="chart-card"><div class="plot" id="statsPlot"></div><div class="delta-cap" id="statsCap"></div></div>
    <div class="stats" id="statsRow"></div>
  </div>
</div>

<button class="coachFab" id="coachFab" title="Talk to your coach" aria-label="Talk to your coach">
  <canvas id="coachFabCanvas"></canvas>
</button>

<div id="popRoot"></div>
<div id="coachRoot"></div>
<div class="celebrate" id="celebrate">
  <div class="burst">
    <div class="bstar"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.1 6.6 .9-4.8 4.6 1.2 6.6L12 18.5 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z"/></svg></div>
    <div class="ch1">New best</div>
    <div class="ch2" id="ch2"></div>
    <div class="tap">tap to close</div>
  </div>
</div>

function renderChecklist(sel, list, key, title){

        + '<button class="wcX" data-i="'+i+'" data-act="wcRm">×</button></div>').join('')
      + '<div class="wcAdd"><input class="wcIn" placeholder="Add item"/><button class="wcAddBtn" data-act="wcAdd">+</button></div>'
    + '</div></div>';

    const i=+b.dataset.i;

  el.querySelectorAll('[data-act="wcRm"]').forEach(b=> b.onclick=()=>{ list.splice(+b.dataset.i,1); saveState(); renderBody(); });

  // clicked; every other row (including a fresh mount, add, or remove)
  // snaps straight to its correct state with no transition.
  const reduced=prefersReducedMotion();
  el.querySelectorAll('.wcItem').forEach((row,i)=>{
    const done=list[i].done;

/* ---- recovery cross-reference: Vitals is a whitelisted cross-tile read

   the last week so one bad night doesn't skew it. */
function vitalsRecoverySignal(v){
  if(!v || typeof v!=='object') return null;
  const dates=Object.keys(v).sort().slice(-7);
  if(!dates.length) return null;
  const scores=dates.map(k=>{
    const d=v[k]||{};
    if(typeof d.whoopRecovery==='number') return Math.max(1,Math.min(99,Math.round(d.whoopRecovery)));
    const parts=[], w=[];
    if(typeof d.feel==='number'){ parts.push(Math.max(0,Math.min(100,d.feel))); w.push(0.6); }
    if(typeof d.sleepHours==='number'){ parts.push(Math.max(0,Math.min(1,d.sleepHours/8))*100); w.push(0.4); }

    vitals = await window.Vitality.read('vitals');
  }catch(err){
    return { status:RECOVERY_STATUS.NONE, avg:null, days:0, detail:(err&&err.message)||'read failed' };
  }
  const rec = vitalsRecoverySignal(vitals);
  if(!rec) return { status:RECOVERY_STATUS.EMPTY, avg:null, days:0, detail:'no usable recovery in the last 7 days' };
  return { status:RECOVERY_STATUS.OK, avg:rec.avg, days:rec.days, detail:null };
}
/* Diagnosable rather than silent: a measured deload that never fires is
   indistinguishable from one that cannot fire, unless something says which. */
function noteRecovery(rec){
  const msg = '[train] recovery ' + rec.status
    + (rec.detail ? ' (' + rec.detail + ')' : '')
    + (rec.avg != null ? ' — avg ' + rec.avg + '/100 over ' + rec.days + 'd' : '');
  if(rec.status === RECOVERY_STATUS.OK) console.info(msg); else console.warn(msg);
  STATE.recoveryStatus = { status:rec.status, avg:rec.avg, days:rec.days, detail:rec.detail, at:Date.now() };
  return rec;
}

/* ---- post-session note: one honest observation, computed once per
   finished session and cached — this is the mentor's "noticer" role,
   automated for Train. Silent on failure; it's a bonus, not core flow. */
const RECOVERY_FLOOR=55; // below this, a plateau is treated as fatigue-driven, not a programming problem
async function buildInsightContext(session){
  const lines=[];
  lines.push('Streak: '+currentStreak()+' consecutive week(s) hitting '+weeklyTarget()+'+ sessions. Rest days do not break this.');
  const t=sessionTotals(session);
  lines.push('Today: '+t.logged+'/'+t.total+' sets logged across '+session.ex.length+' exercise(s).');
  const plateaus=[];
  session.ex.forEach(e=>{
    const h=histFor(e).filter(s=>!s.off);
    const misses=e.log.filter(s=>s&&s.fail).length;
    const pr=exHasPR(e)?' (PR today)':'';
    const plateau=plateauFor(e);
    if(plateau) plateaus.push({ e, plateau });
    if(h.length>=2){
      const delta=r1(h[h.length-1].kg-h[0].kg);
      lines.push('- '+e.name+': '+h.length+' sessions on record, '+(delta>=0?'+':'')+delta+' '+STATE.unit+' over that span, '+misses+' missed set(s) today'+pr+(plateau?' — PLATEAU: weight and reps flat for the last '+plateau.sessions+' sessions at '+plateau.weight+' '+STATE.unit+'.':'.'));
    } else {
      lines.push('- '+e.name+': first time logging this, '+misses+' missed set(s) today'+pr+'.');
    }
  });
  /* The deterministic reads: frequency gaps, weekly set counts, push:pull
     and quad:hamstring balance, and week-over-week ramps. Every one is
     gated on enough data to mean something and says nothing otherwise, so
     an empty list here is the normal case rather than a failure. */
  const findings = TrainEngine.analyse(
    STATE.history || {},
    TrainEngine.indexFrom(STATE.customLib || {}),
    Date.now(),
    analysisOptsFor(),
  );
  findings.forEach(f=> lines.push('PATTERN: '+f.text+(f.estimated?' (muscle split is estimated)':'')));
  TrainEngine.otherTrainingLines(otherLoadNow()).forEach(l=> lines.push(l));

  const rec = noteRecovery(await readRecovery());
  /* Only a connected read with data feeds the deload diagnosis. The other
     two both mean "we do not know", and the engine treats an unknown
     recovery as a reason to be gentler, not a reason to guess. */
  const recoveryAvg = rec.status===RECOVERY_STATUS.OK ? rec.avg : null;
  if(rec.status===RECOVERY_STATUS.OK){
    lines.push('Recovery (Vitals, '+rec.days+'-day avg): '+rec.avg+'/100.');
  } else {
    lines.push('Recovery: unavailable ('+rec.status+') — deload decisions fall back to RPE and the shape of the plateau.');
  }
  return { lines, plateaus, recoveryAvg };
}
/* ---- fully automatic deload: no button, no confirmation. When a lift is
   BOTH plateaued and recovery is genuinely low, this is fatigue, not a
   programming problem — so the system drops that lift's suggested weight
   ~12% right now, the same way the progression suggestion already
   auto-adjusts without asking. The note then REPORTS the action (never
   silent), and it's a one-time nudge: the very next real session on that
   lift clears the override and normal progression resumes from there. */
/* Advancing the state machine, once per finished session. The engine owns
   every decision here: which lifts are stalled, what kind of deload each
   needs, and — through limitDeloads — which of them actually drop today.
   A session where four lifts came down reads as failure however defensible
   each one was, so at most two move. */
function advanceDeloads(session, recoveryAvg){
  STATE.deloadStates = STATE.deloadStates || {};
  const ctx = e => ({
    history: histFor(e).filter(x=>!x.off),
    today,
    recovery: recoveryAvg,
    rpe: sessionRpe(e),
    excluded: STATE.deloadExclusions||[],
    sessionLogged: true,
  });

  /* Lifts not already mid-deload compete for the two available slots. */
  const candidates=[];
  session.ex.forEach(e=>{
    const cur=STATE.deloadStates[e.id]||null;
    if(cur && cur.state!=='normal') return;
    const p=plateauFor(e);
    if(p && p.weight>0) candidates.push({ id:e.id, weight:p.weight, plateauLength:p.sessions });
  });
  const allowed=new Set(TrainEngine.limitDeloads(candidates));

  const applied=[];
  session.ex.forEach(e=>{
    const cur=STATE.deloadStates[e.id]||null;
    const mid = cur && cur.state!=='normal';
    if(!mid && !allowed.has(e.id)) return;
    const next=TrainEngine.nextDeloadState(cur, ctx(e));
    STATE.deloadStates[e.id]=next;
    if(cur && cur.state!==next.state && next.state==='deloading'){
      const plan=TrainEngine.deloadPlan(next, trainingAge());
      if(plan.weight!=null) applied.push({ name:e.name, from:next.priorWeight, to:plan.weight, kind:next.kind });
    }
  });
  return applied;
}
/** Records set today, plateaus found, and lifts logged for the first time. */
function sessionSignalInputs(session){
  const records=[], plateaus=[], firsts=[];
  session.ex.forEach(e=>{
    e.log.forEach((s,i)=>{
      if(!s) return;
      const pr=prFor(e,i);
      if(pr.kind){
        const value = pr.kind==='time' ? s.s : pr.kind==='distance' ? s.m
                    : pr.kind==='reps' ? s.reps : (pr.e1rm!=null ? pr.e1rm : s.kg);
        if(value!=null) records.push({ name:e.name, kind:pr.kind, value, unit:pr.unit?(' '+pr.unit):'' });
      }
    });
    const p=plateauFor(e);
    if(p) plateaus.push({ name:e.name, sessions:p.sessions, weight:p.weight });
    const rows=histFor(e).filter(x=>!x.off);
    if(rows.length===1 && rows[0].date===today) firsts.push(e.name);
  });
  return { records, plateaus, firsts };
}
/**
 * One observation per finished session, and ONLY when the maths found
 * something.
 *
 * The gate is briefFor returning null: no signal, no API call, no note. A
 * note that speaks every time will often say something generic, and a
 * reader who gets three of those stops reading the fourth — including the
 * one that mattered.
 */
async function fetchInsight(session){
  try{
    const ctx=await buildInsightContext(session);
    const applied=advanceDeloads(session, ctx.recoveryAvg);
    const inputs=sessionSignalInputs(session);
    const brief=TrainEngine.briefFor({
      history: STATE.history||{},
      index: TrainEngine.indexFrom(STATE.customLib||{}),
      now: Date.now(),
      today,
      records: inputs.records,
      deloadsApplied: applied.map(a=>({ name:a.name, from:a.from, to:a.to, kind:a.kind })),
      plateaus: inputs.plateaus,
      streak: currentStreak(),
      ...athleteContext(),
      firsts: inputs.firsts,
    }, fullGoalContext());

    if(!brief){
      /* Nothing worth saying. Silence is the feature. */
      session.insight={ date:today, text:null };
      render();
      return;
    }
    /* The deterministic sentence is the answer; the model only rephrases
       it. If no model answers, the fact stands on its own. */
    let text=brief.fact;
    try{
      const note=await window.Vitality.getInsight({ goal:fullGoalContext(), digest:brief.prompt });
      if(typeof note==='string' && note.trim()) text=note.trim();
    }catch(err){ /* keep the fact */ }
    session.insight={ date:today, text, signal:brief.signal.kind };
  }catch(err){ session.insight={ date:today, text:null }; }
  render();
}
/** The rolling week, as data — displayable, loggable, pushable later. */

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- progression suggestion ----------------------------------------
   The engine decides BOTH the number and the sentence. The tile renders
   `reason` verbatim and never composes progression copy — the wording is
   covered by tests in lib/train/progression.ts, not by DOM code here.
   `now` is passed in because lib/train never reads the clock. */
/**
 * What the tile hands the engine for progression.
 *
 * Built as its own named value rather than inline at the call site, so the
 * boundary can be inspected and asserted directly. Every wiring gap this
 * project has hit was a field that was undefined here while the tile knew
 * perfectly well what it should be, and an inline object literal gives a
 * test nothing to hold on to.
 */
/* ── what the coach is allowed to build from ─────────────────────────

   handed the list and the limits; it does not get to widen either. */
function knownExercises(){
  const lib=STATE.customLib||{}, names=STATE.exerciseNames||{};
  return Object.keys(names).map(id=>{
    const info=lib[id]||{};
    const hist=(STATE.history&&STATE.history[id])||[];
    const last=hist.filter(x=>!x.off).slice(-1)[0];
    return {
      id, name:names[id]||id,
      equipment:String(info.equipment||'').toLowerCase(),
      muscles:TrainEngine.muscleSplitFrom(info).primary.map(c=>c.muscle),
      kind: TrainEngine.SET_KINDS.indexOf(info.kind)>=0 ? info.kind : 'reps_weight',
      sessions: hist.filter(x=>!x.off).length,
      sets: last ? (last.sets||[]).length || 3 : 3,
      reps: 8,
      weight: last ? (TrainEngine.topWorkingWeight(last)||0) : 0,
      rest: 90,
      perSide: info.perSide===true,
      assisted: info.assisted===true,
      repRange: info.repRange||null,

}
/* Equipment on record IS the equipment list — asking for a barbell session

/* Stated kit beats what history implies, and what is in the room TODAY

function equipmentAvailable(){
  return TrainEngine.availableEquipment({

      ? STATE.equipmentToday.list : null,
    stated: STATE.equipment || null,

}
function equipmentOnRecord(){
  const seen={};
  Object.values(STATE.customLib||{}).forEach(info=>{
    const eq=String((info&&info.equipment)||'').toLowerCase();
    if(eq) seen[eq]=true;
  });

}
/* Hard sets per muscle over the last couple of days, so a muscle worked
   yesterday is not programmed hard again today. */
function recentMuscleSets(days){
  /* Mapped onto the closed muscle list before anything is counted. While
     this read raw strings, "Pecs" and "Chest" accumulated separately and
     neither ever reached a threshold — the constraint looked like it was
     working and had never once fired. */
  const out={}, cutoff=new Date(); cutoff.setDate(cutoff.getDate()-(days||2));
  const key=ymd(cutoff);
  Object.keys(STATE.history||{}).forEach(id=>{
    const split=TrainEngine.muscleSplitFrom((STATE.customLib||{})[id]||{});
    if(!split.primary.length && !split.secondary.length) return;
    (STATE.history[id]||[]).forEach(entry=>{
      if(entry.off || entry.date < key) return;
      const spread=TrainEngine.distribute(TrainEngine.workingSets(entry).length, split);
      Object.keys(spread).forEach(m=>{ out[m]=(out[m]||0)+spread[m]; });
    });
  });

}

function setExerciseField(e, name, value){
  STATE.customLib = STATE.customLib || {};

  if(eq.indexOf('dumbbell')>=0 || eq.indexOf('kettlebell')>=0) return 'dumbbell';

/* The logged number follows the kind: seconds for a plank, metres for a

function pillInputsFor(e, kind, pre, bumped){
  const num=(cls,val,label,mode)=>'<input class="pillInput '+cls+'" type="number" inputmode="'+(mode||'numeric')+'" value="'+val+'" aria-label="'+label+'" />';

function IC_reset(){ return '<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor"><path d="M3.5 6.5 A6 6 0 1 0 6 3.2"/><polyline points="2.4 2.4 3.7 6.6 8 5.2"/></svg>'; }

/* Rows armed as AMRAP but not yet logged. Session-scoped and deliberately
   not persisted: an armed-but-unlogged flag is an intention, not a record,
   and reloading into "you said this set was to failure" about a set that
   never happened would be the app remembering something that did not. */
const amrapArmed = {};

function doLog(e, idx, values, fail){
  const _sess=curSession(); if(!_sess.startedAt) _sess.startedAt=Date.now();
  const wasComplete = exComplete(e);
  const entry={};
  ['kind','kg','reps','s','m','perSide','assisted','amrap'].forEach(k=>{ if(values[k]!==undefined) entry[k]=values[k]; });
  if(fail){ entry.reps=0; entry.fail=true; }
  e.log[idx]=entry;
  rollupToday(e);
  render();
  // re-find the live card + pill for the shimmer / celebration
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(!fail && card){ const pills=card.querySelectorAll('.pill'); const rowEl=pills[idx]; if(rowEl){ rowEl.classList.add('shimmer'); setTimeout(()=>rowEl.classList.remove('shimmer'),820); } }
  // progressive-overload celebration: a logged set that beats your prior best, completing the lift
  /* Only an estimated-1RM record earns the takeover. Weight and rep PRs
     get the quiet dot on the row — they fire too often early on for a
     celebration to keep meaning anything. */
  if(isBigPR(e, idx) && !wasComplete && exComplete(e) && card){
    card.classList.add('celebrate'); setTimeout(()=>card.classList.remove('celebrate'),1650);
    celebrate(e, kg, reps);
  }

/* ---- supersets / circuits: exercises sharing e.group rest together - */
function isLastInGroup(e, session){
  if(!e.group) return true;
  const mem=session.ex.filter(x=>x.group===e.group);
  return mem.length ? mem[mem.length-1].id===e.id : true;
}
function nextGroupLetter(session){
  const used=new Set(session.ex.map(x=>x.group).filter(Boolean));
  for(const l of 'ABCDEFGH') if(!used.has(l)) return l;
  return 'X';
}
function linkWithNext(e, session){
  const idx=session.ex.findIndex(x=>x.id===e.id); const next=session.ex[idx+1]; if(!next) return;

function ungroup(e){ delete e.group; render(); }
/* Flags every history row for a date as abandoned. Never removes them. */
function markAbandoned(date){
  Object.keys(STATE.history||{}).forEach(id=>{
    (STATE.history[id]||[]).forEach(entry=>{ if(entry.date===date) entry.abandoned=true; });
  });
  saveState();
}
/**
 * Recomputes everything cached from history.
 *
 * Backdating or editing a past session invalidates finishedDates and each
 * lift's carried-over weight, and a stale aggregate is worse than none —
 * it looks authoritative. Anything derived is derived again from the rows.
 */
function rederiveFromHistory(){
  invalidateReview();
  const finished = new Set(STATE.finishedDates||[]);
  Object.keys(STATE.history||{}).forEach(id=>{
    const rows=(STATE.history[id]||[]).filter(x=>!x.off);
    rows.sort((a,b)=>a.date.localeCompare(b.date));
    STATE.history[id]=rows;
    const last=rows[rows.length-1];
    const ex=curSession().ex.find(x=>x.id===id);
    if(ex && last){ const w=TrainEngine.topWorkingWeight(last); if(w>0) ex.lastKg=w; }
  });
  STATE.finishedDates=[...finished].sort();
  saveState();

/* One tap to repeat the last session — the fastest path for anyone not
   chasing progression today. */
function repeatLastSession(e){
  const target=TrainEngine.sameAsLastTime(histFor(e).filter(x=>!x.off), { excludeDate: today });
  if(!target || !target.length) return;
  while(e.log.length < target.length) e.log.push(null);
  target.forEach((t,i)=>{
    e.log[i]={ kind:t.kind||kindFor(e) };
    if(t.weight!=null) e.log[i].kg=t.weight;
    if(t.reps!=null) e.log[i].reps=t.reps;
    if(t.seconds!=null) e.log[i].s=t.seconds;
    if(t.metres!=null) e.log[i].m=t.metres;
    if(t.perSide) e.log[i].perSide=true;
    if(t.assisted) e.log[i].assisted=true;
  });
  e.sets=e.log.length;
  rollupToday(e); render();
}
/**
 * The ONE write path from a session exercise into history, for any date.
 *
 * Backdating reuses this rather than adding a second writer: the same field
 * mapping, the same working-set rules, the same top-weight derivation. A
 * parallel path for past days is how the two drift and disagree.
 */
function rollupFor(e, date){
  const done = e.log.filter(s=>s&&!s.fail);
  let h = histFor(e).filter(x=>x.date!==date);
  if(done.length){
    /* Per-set weight and the warm-up flag are written from here on, so
       volume and e1RM can tell a ramp-up from the work. Older rows have
       neither and are read with the entry weight and warmup:false. */
    /* Every field the kind uses travels into history, including the kind
       itself — that is what lets an old row stay readable after the lift's
       kind is changed, instead of being reinterpreted in a new unit. */
    const sets=e.log.filter(s=>s).map(s=>{
      const row={ fail:s.fail||undefined, warmup:s.warmup||undefined };
      if(s.kind && s.kind!=='reps_weight') row.kind=s.kind;
      if(s.kg!=null) row.w=s.kg;
      if(s.reps!=null) row.r=s.reps;
      if(s.s!=null) row.s=s.s;
      if(s.m!=null) row.m=s.m;
      if(s.perSide) row.perSide=true;
      if(s.assisted) row.assisted=true;
      if(s.amrap) row.amrap=true;
      if(s.rpe!=null) row.rpe=s.rpe;
      return row;
    });
    const working=logWorking(e);
    const top=(working.length?working:done).reduce((a,b)=>((b.kg||0)>(a.kg||0)?b:a));
    h.push({date, kg:top.kg, sets});
    h.sort((a,b)=>a.date.localeCompare(b.date));
    /* Only a session for TODAY may move the carried-over weight. Editing
       last month must not rewrite what the next session starts from. */
    if(top.kg!=null && date===today) e.lastKg=top.kg;
  }
  STATE.history[e.id]=h;
  STATE.exerciseNames=STATE.exerciseNames||{}; STATE.exerciseNames[e.id]=e.name;
  invalidateReview();
}
function rollupToday(e){ return rollupFor(e, today); }

/* ---- header actions router --------------------------------------- */
function handleAct(act, e, session, btn){
  if(act==='eye'){ e.collapsed=!e.collapsed; render(); }
  else if(act==='pin'){ e.pinned=!e.pinned; render(); }
  else if(act==='form'){ openForm(e); }
  else if(act==='history'){ openHistory(e); }
  else if(act==='swap'){ openSwap(e); }
  else if(act==='repeat'){ repeatLastSession(e); }
  else if(act==='tune'){ openTune(e); }
  else if(act==='menu'){ openMenu(e, session, btn); }
}

/* ====================================================================
   REST TIMER
   ================================================================= */
const restTimers={};
const REST_RING_C = Math.round(2*Math.PI*15*1000)/1000;
let restTicker=null;
let restAudio=null;

/* ── WHAT THIS ENVIRONMENT CANNOT DO ──────────────────────────────────
   A tile is a sandboxed srcDoc iframe on an opaque origin with no
   network. That rules out, permanently and by design:

     • Notification API — needs a permission prompt on a real origin;
       an opaque-origin frame can never be granted it.
     • Wake Lock API — gated by Permissions Policy, unavailable here, so
       the screen will sleep mid-rest and there is nothing to do about it.
     • Live Activity / Dynamic Island / Android ongoing notification —
       no web API exists for any of them at all.
     • Guaranteed execution while backgrounded — a hidden tab has its
       timers throttled to >=1s and a locked phone suspends them
       entirely. Audio is suspended with it.

   So the timer is CORRECT when you come back (time is derived from a
   timestamp, never accumulated) but it cannot reliably make a sound at
   the exact instant zero passes while the phone is face-down and locked.
   That is a native-app capability, and it is deliberately not faked
   here. See docs/train-platform-limits.md.
   ──────────────────────────────────────────────────────────────────── */

function startRest(e){
  stopRest(e.id);
  const rx=prescription(e);
  /* per-exercise rest, which the data already carries */
  const total=Math.max(1, rx.rest);
  restTimers[e.id]={ startedAt:Date.now(), total, adjust:0, chimed:false };
  ensureRestAudio();
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(card) mountRestBar(card, e);
  startRestTicker();
}
/* Derived on every read, never decremented. A countdown that subtracts one
   per tick comes back wrong by exactly however long the phone was asleep —
   which is most of the rest period. */
function restRemaining(t){
  return t.total + t.adjust - Math.round((Date.now()-t.startedAt)/1000);
}
function stopRest(id){
  delete restTimers[id];
  if(!Object.keys(restTimers).length) stopRestTicker();
}
function startRestTicker(){ if(!restTicker) restTicker=setInterval(sweepRest, 250); }
function stopRestTicker(){ if(restTicker){ clearInterval(restTicker); restTicker=null; } }
/* One ticker drives every running bar. Its only job is repainting — the
   numbers come from the clock, so a throttled or skipped tick costs
   smoothness and never accuracy. */
function sweepRest(){
  Object.keys(restTimers).forEach(id=>{
    const t=restTimers[id];
    const remaining=restRemaining(t);
    if(!t.chimed && remaining<=0){
      t.chimed=true;
      /* Only chime if zero passed just now — a brief glance away should
         not eat it, but returning to a tab that elapsed ten minutes ago and
         beeping then is worse than silence. */
      if(remaining>-5) restChime();
    }
    updateRest(id);
  });
}
/* Returning to the tab is the one moment we know the clock jumped, so
   recompute and repaint immediately rather than waiting for a tick. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') sweepRest();
});

/* The AudioContext has to be created inside a user gesture. Logging a set
   is that gesture, and it is the only one that reliably precedes a rest. */
function ensureRestAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!restAudio) restAudio=new AC();
    if(restAudio.state==='suspended') restAudio.resume();
  }catch(err){ restAudio=null; }
}
function restChime(){
  try{
    if(restAudio && restAudio.state==='running'){
      const t0=restAudio.currentTime;
      [0, 0.18].forEach((offset,i)=>{
        const osc=restAudio.createOscillator(), gain=restAudio.createGain();
        osc.type='sine'; osc.frequency.value = i ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, t0+offset);
        gain.gain.exponentialRampToValueAtTime(0.22, t0+offset+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+offset+0.16);
        osc.connect(gain); gain.connect(restAudio.destination);
        osc.start(t0+offset); osc.stop(t0+offset+0.2);
      });
    }
  }catch(err){ /* audio blocked — the vibration below is the fallback */ }
  /* the phone is usually face-down on a bench; vibration is unavailable in
     a sandboxed frame on some browsers, hence the guard */
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(err){}
}
/* Overtime counts UP rather than stopping: how long you actually rested is
   information, and a timer frozen at 0:00 throws it away. */
function restLabelFor(remaining){
  return remaining<=0 ? '+'+mmss(Math.abs(remaining)) : mmss(remaining);
}
function paintRest(bar, t){
  const remaining=restRemaining(t);
  const over=remaining<=0;
  bar.classList.toggle('over',over);
  bar.querySelector('.restTime').textContent = restLabelFor(remaining);
  const ring=bar.querySelector('.restRingFill');
  if(ring){ const pct=Math.max(0,Math.min(1, remaining/(t.total+t.adjust||1))); ring.style.strokeDashoffset=String(REST_RING_C*(1-pct)); }
}
function mountRestBar(card, e){ const slot=card.querySelector('.restSlot'); const t=restTimers[e.id]; if(!t||!slot){ if(slot)slot.innerHTML=''; return; }
  const remaining=restRemaining(t);
  const over=remaining<=0;
  slot.innerHTML='<div class="restbar'+(over?' over':'')+'"><button class="restStep" data-d="-15">−15</button><div class="restMid"><svg class="restRing" viewBox="0 0 36 36" aria-hidden="true"><circle class="restRingTrack" cx="18" cy="18" r="15"/><circle class="restRingFill" cx="18" cy="18" r="15" style="stroke-dasharray:'+REST_RING_C+'"/></svg><div class="restTime">'+restLabelFor(remaining)+'</div><div class="restLabel">'+(e.group?('Superset '+e.group):e.name)+'</div></div><button class="restStep" data-d="15">+15</button><button class="restX" aria-label="Dismiss">×</button></div>';
  paintRest(slot.querySelector('.restbar'), t);
  const nudge=d=>{
    t.adjust+=d;
    /* pushing the finish back past now re-arms the chime */
    if(restRemaining(t)>0) t.chimed=false;
    updateRest(e.id);
  };
  slot.querySelector('[data-d="-15"]').onclick=()=>nudge(-15);
  slot.querySelector('[data-d="15"]').onclick=()=>nudge(15);
  slot.querySelector('.restX').onclick=()=>{ stopRest(e.id); slot.innerHTML=''; };
}
function updateRest(id){ const card=document.querySelector('.ex[data-id="'+id+'"]'); const t=restTimers[id]; if(!card||!t) return; const bar=card.querySelector('.restbar'); if(!bar) return; paintRest(bar, t); }

/* ====================================================================
   DRAG TO REORDER
   ================================================================= */
function wireDrag(card, e, session){
  const grip=card.querySelector('.grip'); if(!grip) return;
  grip.addEventListener('pointerdown', ev=>{
    if(e.pinned){ return; } // pinned lifts hold the top
    ev.preventDefault(); grip.classList.add('dragging'); card.classList.add('drag-ghost');
    const wrap=$('#exwrap'); const cards=[...wrap.querySelectorAll('.ex')];
    const move=mev=>{ const y=mev.clientY; let target=null; cards.forEach(c=>{ if(c===card) return; const r=c.getBoundingClientRect(); if(y>r.top && y<r.bottom) target=c; }); if(target){ const r=target.getBoundingClientRect(); const after = y > r.top + r.height/2; wrap.insertBefore(card, after?target.nextSibling:target); } };
    const up=()=>{ grip.classList.remove('dragging'); card.classList.remove('drag-ghost'); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      // commit new order to the session array (respecting pins at top)
      const ids=[...wrap.querySelectorAll('.ex')].map(c=>c.dataset.id);
      session.ex.sort((a,b)=> ids.indexOf(a.id)-ids.indexOf(b.id));
      render(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}

let escHandler=null;
function openPop(html, onMount){
  const root=$('#popRoot');
  root.innerHTML='<div class="scrim" id="scrim"><div class="pop" role="dialog" aria-modal="true">'+html+'</div></div>';
  const scrim=$('#scrim');
  scrim.addEventListener('click', ev=>{ if(ev.target===scrim) closePop(); });
  const x=scrim.querySelector('.popX'); if(x) x.onclick=closePop;
  escHandler=ev=>{ if(ev.key==='Escape') closePop(); }; document.addEventListener('keydown',escHandler);
  if(onMount) onMount(scrim);
}
function closePop(){ $('#popRoot').innerHTML=''; if(escHandler){ document.removeEventListener('keydown',escHandler); escHandler=null; } }

/* Merging is offered rather than done. It rewrites a training record, so
   it is confirmed explicitly and it is never destructive — the losing id's
   sessions move onto the winner, they do not vanish. */
/**
 * Log or edit a session for a past day.
 *
 * Every hole in the history degrades plateau detection and the frequency
 * reads, and people forget. This seeds a temporary exercise from whatever
 * is already recorded for that date, edits it with the same controls, and
 * writes through rollupFor — the same validation and the same
 * invalidation as a live session.
 */
const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* Named days, and which weekday each falls on. Deliberately small: this
   answers "today is probably push day" and nothing more. */
/**
 * Asked once, at setup. Every question is skippable and every answer is
 * editable later; a fully skipped run leaves behaviour exactly as it is.

const SETUP_LIFTS=['back_squat','bench_press','deadlift','overhead_press','barbell_row'];

    + '<p class="formGist">Skip anything you would rather not answer — the app works without all of it, it just has less to go on. Everything here is editable later in Settings.</p>'

    + '</div>'

    scrim=>{
      const toggle=(sel,attr,list)=>scrim.querySelectorAll(sel+' [data-'+attr+']').forEach(b=> b.onclick=()=>{
        const v=b.dataset[attr]; const i=list.indexOf(v);
        if(i>=0) list.splice(i,1); else list.push(v);
        b.classList.toggle('on', list.indexOf(v)>=0);
        b.querySelector('.mu').textContent = list.indexOf(v)>=0 ? 'yes' : '—';
      });
      toggle('#obEquip','eq',answers.equipment);
      toggle('#obAvoid','av',answers.avoid);
      scrim.querySelectorAll('#obAge [data-age]').forEach(b=> b.onclick=()=>{
        answers.trainingAge=b.dataset.age;
        scrim.querySelectorAll('#obAge [data-age]').forEach(x=>{
          x.classList.toggle('on', x.dataset.age===answers.trainingAge);
          x.querySelector('.mu').textContent = x.dataset.age===answers.trainingAge ? 'yes' : '—';
        });
      });
      const finish=()=>{
        const out=TrainEngine.applyOnboarding(STATE, answers, today);
        Object.assign(STATE, out.state);
        saveState(); closePop(); render();
        if(TrainEngine.anythingAnswered(out.seeded)) snapshotNow('onboarding');
      };
      scrim.querySelector('#obSave').onclick=()=>{
        answers.startingLifts=[...scrim.querySelectorAll('.bwLift')]
          .map(el=>({ exerciseId:el.dataset.id, weightLb:parseFloat(el.value) }))
          .filter(x=>Number.isFinite(x.weightLb) && x.weightLb>0);
        const bw=parseFloat(scrim.querySelector('#obBw').value);
        if(Number.isFinite(bw) && bw>0) answers.bodyweightLb=bw;
        const freq=parseInt(scrim.querySelector('#obFreq').value,10);
        if(Number.isFinite(freq)) answers.sessionsPerWeek=freq;
        /* Any lift they named needs to exist before a starting weight can
           attach to it. */
        (answers.startingLifts||[]).forEach(l=>{
          const def=TrainEngine.catalogExercise(l.exerciseId);
          if(def) installExerciseDef(def.id, def.name, {
            kind:def.defaultSetKind, perSide:def.unilateral, assisted:false,
            repRange:null, equipment:def.equipment, primary:def.primary,
          });
        });
        finish();
      };
      scrim.querySelector('#obSkip').onclick=finish;
    });
}

  openPop(popHead('What do you have today?','Just for today')

      scrim.querySelectorAll('#teList [data-eq]').forEach(b=> b.onclick=()=>{
        const v=b.dataset.eq, i=chosen.indexOf(v);

        b.querySelector('.mu').textContent = chosen.indexOf(v)>=0 ? 'yes' : '—';
      });
      scrim.querySelector('#teSave').onclick=()=>{
        STATE.equipmentToday = chosen.length ? { date:today, list:chosen } : null;

      scrim.querySelector('#teClear').onclick=()=>{
        STATE.equipmentToday=null; saveState(); closePop(); render();

    });

/**
 * Logging something that isn't lifting.
 *
 * Three fields, because three is what someone will actually fill in after
 * a run. What it was, how long, how hard it felt — and that last one is a
 * self-report with nothing to check it against, which is why everything
 * downstream of it is marked estimated and why it may only ever ease a
 * session, never change a specific lift.
 */
function openOtherTraining(){
  const list=(STATE.otherTraining||[]).slice().sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  const draft={ date:today, activity:'conditioning', minutes:30, intensity:5 };
  const acts=TrainEngine.OTHER_ACTIVITIES;
  const label=k=>k.replace(/_/g,' ');
  openPop(popHead('Other training','Runs, sport, anything else')
    + '<p class="formGist">Logged so the app stops pretending it did not happen. It can ease a session back, and it never touches a lift\u2019s weight \u2014 how hard something felt is your estimate, not a measurement.</p>'
    + '<div class="swapList" id="otActs">'+acts.map(k=>'<button class="swapItem'+(k===draft.activity?' on':'')+'" data-a="'+k+'"><span class="nm">'+label(k)+'</span><span class="mu">'+(k===draft.activity?'yes':'\u2014')+'</span></button>').join('')+'</div>'
    + '<div class="settingsRow"><span class="bouncyLabel on">Minutes</span><div class="stepper"><button class="step minus" data-m="-15">\u2212</button><span class="stepVal" id="otMin">30</span><button class="step" data-m="15">+</button></div></div>'
    + '<div class="settingsRow"><span class="bouncyLabel on">How hard</span><div class="stepper"><button class="step minus" data-i="-1">\u2212</button><span class="stepVal" id="otInt">5/10</span><button class="step" data-i="1">+</button></div></div>'
    + (list.length ? '<div class="swapList" id="otList">'+list.slice(0,8).map((e,i)=>'<button class="swapItem" data-del="'+i+'"><span class="nm">'+escapeHtml(label(String(e.activity||'other')))+'</span><span class="mu">'+e.date+' \u00b7 '+e.minutes+'m \u00b7 '+e.intensity+'/10</span></button>').join('')+'</div>' : '')
    + '<div class="popBtns"><button class="pbtn ghost" id="otClose">Close</button><button class="pbtn save" id="otSave">Log it</button></div>',
    scrim=>{
      const sync=()=>{
        scrim.querySelector('#otMin').textContent=draft.minutes;
        scrim.querySelector('#otInt').textContent=draft.intensity+'/10';
      };
      scrim.querySelectorAll('#otActs [data-a]').forEach(b=> b.onclick=()=>{
        draft.activity=b.dataset.a;
        scrim.querySelectorAll('#otActs [data-a]').forEach(x=>{
          x.classList.toggle('on', x.dataset.a===draft.activity);
          x.querySelector('.mu').textContent = x.dataset.a===draft.activity ? 'yes' : '\u2014';
        });
      });
      scrim.querySelectorAll('[data-m]').forEach(b=> b.onclick=()=>{
        draft.minutes=Math.min(600, Math.max(5, draft.minutes+(+b.dataset.m))); sync();
      });
      scrim.querySelectorAll('[data-i]').forEach(b=> b.onclick=()=>{
        draft.intensity=Math.min(10, Math.max(1, draft.intensity+(+b.dataset.i))); sync();
      });
      scrim.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{
        const e=list[+b.dataset.del];
        STATE.otherTraining=(STATE.otherTraining||[]).filter(x=>x!==e);
        saveState(); closePop(); render();
      });
      scrim.querySelector('#otSave').onclick=()=>{
        const e=TrainEngine.normalizeOtherEntry(draft);
        if(e){ STATE.otherTraining=(STATE.otherTraining||[]).concat([e]); saveState(); }
        closePop(); recomputeReadinessAndRender();
      };
      scrim.querySelector('#otClose').onclick=()=>closePop();
    });
}
/* A logged run changes today's readiness, so the verdict is recomputed
   rather than left showing what it said before the run existed. */
function recomputeReadinessAndRender(){
  computeReadiness().then(render).catch(()=>render());
}
function openRoutines(){
  const routines=STATE.routines||[];
  const days=STATE.routineDays||{};
  const assignedTo=id=>WEEKDAYS.map((d,i)=>days[i]===id?d:null).filter(Boolean).join(' ');
  openPop(popHead('Routines','Named days')
    + (routines.length
        ? '<div class="swapList">'+routines.map(r=>'<button class="swapItem" data-r="'+r.id+'"><span class="nm">'+escapeHtml(r.name)+'</span><span class="mu">'+(assignedTo(r.id)||r.exercises.length+' lifts')+'</span></button>').join('')+'</div>'
        : '<p class="emptyHist">No routines yet.</p>')
    + '<div class="searchRow" style="margin-top:10px"><input id="rtName" placeholder="Name today\'s lifts, e.g. Push" autocomplete="off"/></div>'
    + '<button class="pbtn save" id="rtSave" style="width:100%;margin-top:8px">Save today as a routine</button>',
    scrim=>{
      const saveBtn=scrim.querySelector('#rtSave');
      saveBtn.disabled=!curSession().ex.length;
      saveBtn.onclick=()=>{
        const name=(scrim.querySelector('#rtName').value||'').trim();
        if(!name || !curSession().ex.length) return;
        STATE.routines=STATE.routines||[];
        STATE.routines.push({
          id:'r'+Date.now(), name,
          exercises: curSession().ex.map(e=>({
            exerciseId:e.id, sets:e.log.length||e.sets, reps:e.reps,
            repRange:repRangeFor(e)||null, rest:e.rest,

        saveState(); closePop(); openRoutines();
      };
      scrim.querySelectorAll('.swapItem[data-r]').forEach(b=> b.onclick=()=>{ closePop(); assignRoutine(b.dataset.r); });

/**
 * Import a Hevy or Strong export.
 *
 * Imported rows go through the same resolution as a typed name, so they
 * land on canonical ids and merge with anything already there. Names that
 * do not resolve are listed rather than turned into new lifts.
 */
function openImport(){
  openPop(popHead('Import your history','Hevy or Strong')
    + '<p class="formGist">Everything here gets better with history. Export a CSV from your old app and drop it in — it merges with what you already have, and importing the same file twice changes nothing.</p>'
    + '<div class="searchRow"><input id="impFile" type="file" accept=".csv,text/csv" aria-label="CSV file" /></div>'
    + '<div class="settingsRow"><span class="bouncyLabel">Strong exported in</span><button class="pbtn ghost" id="impUnit" style="padding:6px 12px">lb</button></div>'
    + '<div id="impStatus" style="margin-top:10px;font-size:13px;min-height:18px"></div>',
    scrim=>{
      let unit='lb';
      const unitBtn=scrim.querySelector('#impUnit');
      unitBtn.onclick=()=>{ unit = unit==='lb' ? 'kg' : 'lb'; unitBtn.textContent=unit; };
      const status=scrim.querySelector('#impStatus');
      scrim.querySelector('#impFile').onchange=ev=>{
        const file=ev.target.files && ev.target.files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>{
          try{ runImport(String(reader.result||''), unit, status); }
          catch(err){ status.style.color='var(--fail)'; status.textContent='Could not read that file.'; }
        };
        reader.readAsText(file);
      };
    });
}
function runImport(text, unit, status){
  snapshotNow('before import');
  const existing={};
  Object.keys(STATE.history||{}).forEach(id=>{ existing[id]=(STATE.history[id]||[]).map(e=>({date:e.date})); });
  const out=TrainEngine.importCsv(text, {
    userExercises: STATE.exerciseNames||{},
    aliases: STATE.aliases||{},
    strongUnit: unit,
    existing,
  });
  const r=out.report;
  if(r.source==='unknown'){
    status.style.color='var(--fail)';
    status.textContent="That doesn't look like a Hevy or Strong export.";
    return;
  }
  out.entries.forEach(entry=>{
    const def=TrainEngine.catalogExercise(entry.exerciseId);
    if(def) installExerciseDef(def.id, def.name, {
      kind:def.defaultSetKind, perSide:def.unilateral, assisted:false,
      repRange:null, equipment:def.equipment, primary:def.primary,
    });
    else if(!(STATE.exerciseNames||{})[entry.exerciseId]){
      installExerciseDef(entry.exerciseId, entry.displayName, { kind:'reps_weight', equipment:'', primary:[] });
    }
    STATE.history=STATE.history||{};
    const rows=(STATE.history[entry.exerciseId]||[]).filter(x=>x.date!==entry.date);
    /* Imported rows carry atEstimated so the timing reads skip them: no
       timestamp was observed and none is claimed. */
    rows.push({ date:entry.date, kg:entry.kg, imported:r.source,
                sets:entry.sets.map(st=>Object.assign({}, st, { atEstimated:true })) });
    rows.sort((a,b)=>a.date.localeCompare(b.date));
    STATE.history[entry.exerciseId]=rows;
    if((STATE.finishedDates||[]).indexOf(entry.date)<0){ STATE.finishedDates=STATE.finishedDates||[]; STATE.finishedDates.push(entry.date); }
  });
  rederiveFromHistory();
  status.style.color='var(--signal)';
  status.innerHTML='Imported <b>'+r.sets+'</b> sets across <b>'+r.sessions+'</b> sessions and <b>'+r.lifts+'</b> lifts'
    + (r.from?', '+fmtDate(r.from)+' to '+fmtDate(r.to):'') + '.'
    + (r.duplicates?'<br/>Skipped '+r.duplicates+' already on record.':'')
    + (r.unresolved.length?'<br/>Not recognised: '+r.unresolved.slice(0,5).map(u=>escapeHtml(u.name)+' ('+u.rows+')').join(', ')+'. Add those by name and re-import.':'');
  render();
}

function editPastSession(id, date){
  const existing=(STATE.history[id]||[]).find(x=>x.date===date);
  const kind=kindFor({id});
  /* A temporary session exercise, seeded from whatever that day already
     holds, so editing and creating are the same operation. */
  const draft={
    id, name:STATE.exerciseNames[id]||id, kind,
    log:(existing? (existing.sets||[]) : []).map(row=>({
      kind:row.kind||kind, kg:row.w, reps:row.r, s:row.s, m:row.m,
      warmup:row.warmup, fail:row.fail, rpe:row.rpe,
      perSide:row.perSide, assisted:row.assisted,
    })),
  };
  const rowsHtml=()=> draft.log.map((row,i)=>
    '<div class="wcItem"><span class="wcTxt">'+(i+1)+'.</span>'
    + (kind==='time' ? '<input class="pillInput bdS" data-i="'+i+'" type="number" value="'+(row.s||0)+'" aria-label="Seconds" /><span class="pillUnit">s</span>'
      : kind==='distance' ? '<input class="pillInput bdM" data-i="'+i+'" type="number" value="'+(row.m||0)+'" aria-label="Metres" /><span class="pillUnit">m</span>'
      : kind==='reps_only' ? '<input class="pillInput bdR" data-i="'+i+'" type="number" value="'+(row.reps||0)+'" aria-label="Reps" /><span class="pillUnit">reps</span>'
      : '<input class="pillInput bdW" data-i="'+i+'" type="number" value="'+(row.kg||0)+'" aria-label="Weight" /><span class="pillUnit">'+STATE.unit+'</span><span class="pillTimes">×</span><input class="pillInput bdR" data-i="'+i+'" type="number" value="'+(row.reps||0)+'" aria-label="Reps" />')
    + '<button class="wcX" data-rm="'+i+'">×</button></div>').join('');

  const render2=scrim=>{
    scrim.querySelector('#bdRows').innerHTML=rowsHtml() || '<p class="emptyHist">No sets on this day yet.</p>';
    scrim.querySelectorAll('[data-rm]').forEach(b=> b.onclick=()=>{ draft.log.splice(+b.dataset.rm,1); render2(scrim); });
    const read=(sel,i)=>{ const el=scrim.querySelector(sel+'[data-i="'+i+'"]'); return el?parseFloat(el.value):NaN; };
    scrim.querySelectorAll('.pillInput').forEach(el=> el.onchange=()=>{
      draft.log.forEach((row,i)=>{
        if(kind==='time') row.s=read('.bdS',i)||0;
        else if(kind==='distance') row.m=read('.bdM',i)||0;
        else if(kind==='reps_only') row.reps=Math.round(read('.bdR',i))||0;
        else { row.kg=read('.bdW',i)||0; row.reps=Math.round(read('.bdR',i))||0; }
      });
    });
  };
  openPop(popHead(fmtDate(date), draft.name)
    + '<div id="bdRows"></div>'
    + '<button class="pbtn ghost" id="bdAdd" style="width:100%;margin-top:10px">Add a set</button>'
    + '<div class="popBtns"><button class="pbtn ghost" id="bdCancel">Cancel</button><button class="pbtn save" id="bdSave">Save</button></div>',
    scrim=>{
      render2(scrim);
      scrim.querySelector('#bdAdd').onclick=()=>{
        const last=draft.log[draft.log.length-1];
        draft.log.push(last? {...last} : { kind, kg:0, reps:kind==='reps_weight'?5:undefined, s:kind==='time'?30:undefined, m:kind==='distance'?20:undefined });
        render2(scrim);
      };
      scrim.querySelector('#bdCancel').onclick=closePop;
      scrim.querySelector('#bdSave').onclick=()=>{
        /* Same write path as a live session, then the same invalidation —
           a backdated edit can change a plateau verdict, so nothing cached
           may survive it. */
        rollupFor(draft, date);
        rederiveFromHistory();
        closePop(); render();
        renderStatsPicker && renderStatsPicker(); drawStatsSection && drawStatsSection();
      };
    });
}

/* ---- segmented control — one shared pill slides under the active
   segment instead of each button flashing its own background. The
   buttons still get fully rebuilt on every call (same as everything
   else in this file), so the indicator uses a FLIP: read its OLD
   screen position from the outgoing DOM before wiping it, then restart
   the fresh one there and transition to its natural spot. Double rAF —
   a single rAF here gets coalesced with the reflow and the browser just
   skips straight to the end state (same bug as the checklist scribble). */
function renderRangeControl(rangeEl, activeKey, onSelect){
  if(!rangeEl) return;
  const reduced=prefersReducedMotion();
  const prevInd=rangeEl.querySelector('.rangeInd');
  const prevRect = prevInd ? prevInd.getBoundingClientRect() : null;
  const containerRectBefore = prevInd ? rangeEl.getBoundingClientRect() : null;
  rangeEl.innerHTML='<div class="rangeInd"></div>'+Object.keys(RANGES).map(k=>'<button class="'+(k===activeKey?'on':'')+'" data-r="'+k+'">'+k+'</button>').join('');

function drawHistory(e, active, setActive){

  const all=histFor(e).slice().sort((a,b)=>a.date.localeCompare(b.date));

function topReps(s){ const d=(s.sets||[]).filter(x=>!x.fail).map(x=>x.r); return d.length?Math.max(...d):0; }
function setCount(s){ return (s.sets||[]).length; }
function drawChart(e, list, active){
  const plot=$('#hplot'), cap=$('#hcap');
  if(!list.length){ plot.innerHTML='<svg viewBox="0 0 600 240" preserveAspectRatio="none"><text class="xlab" x="300" y="120" text-anchor="middle">log your first session to start the chart</text></svg>'; cap.textContent=''; return; }
  const VB_W=600,VB_H=240,PADL=46,PADR=20,PADT=22,PADB=36;
  const real=list.filter(s=>!s.off), off=list.filter(s=>s.off);
  const ws=list.map(s=>s.kg);
  let lo=Math.max(0,Math.floor(Math.min(...ws)/5)*5-5), hi=Math.ceil(Math.max(...ws)/5)*5+5;
  if(hi-lo<10) hi=lo+10; if((hi-lo)%10!==0) hi+=5;
  const oldestAgo=Math.max(...list.map(s=>daysAgo(s.date)));
  const domain= active==='ALL'? Math.max(oldestAgo,1):Math.max(RANGES[active],1);
  const X=k=>{ const f=Math.min(1,Math.max(0,1-daysAgo(k)/domain)); return PADL+f*(VB_W-PADL-PADR); };
  const Y=kg=>(VB_H-PADB)-(kg-lo)/(hi-lo)*(VB_H-PADB-PADT);
  const step=(hi-lo)<=30?5:10;
  const best = real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b) : null;
  let svgs='<svg viewBox="0 0 '+VB_W+' '+VB_H+'" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mint);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--mint);stop-opacity:0"/></linearGradient></defs>';
  for(let kg=lo;kg<=hi;kg+=step){ svgs+='<line class="grid" x1="'+PADL+'" y1="'+Y(kg)+'" x2="'+(VB_W-PADR)+'" y2="'+Y(kg)+'"/><text class="axis-label" x="'+(PADL-10)+'" y="'+(Y(kg)+4)+'" text-anchor="end">'+kg+'</text>'; }
  if(real.length){ const pts=real.map(s=>X(s.date)+','+Y(s.kg)); const last=real[real.length-1], first=real[0];
    if(real.length>1){ svgs+='<path class="area" d="M'+X(first.date)+','+(VB_H-PADB)+' L'+pts.join(' L')+' L'+X(last.date)+','+(VB_H-PADB)+' Z"/><polyline class="line" points="'+pts.join(' ')+'"/>'; } }
  let dotI=0;
  off.forEach(s=>{ svgs+='<circle class="dot off" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  real.forEach(s=>{ svgs+='<circle class="dot'+(best&&s.date===best.date?' best':'')+'" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  svgs+='<text class="xlab" x="'+PADL+'" y="'+(VB_H-6)+'" text-anchor="start">'+fmtDate(list[0].date)+'</text><text class="xlab" x="'+(VB_W-PADR)+'" y="'+(VB_H-6)+'" text-anchor="end">today</text></svg>';
  plot.innerHTML=svgs;
  if(real.length>=2){ const d=r1(real[real.length-1].kg-real[0].kg); cap.innerHTML=(d>=0?'+':'')+d+' '+STATE.unit+' <span class="mu">· '+(active==='ALL'?'all time':'in '+active)+'</span>'; }
  else cap.textContent= real.length?'one session here':'';
}
function drawStats(e){
  const real=histFor(e).filter(s=>!s.off);
  const best=real.length?Math.max(...real.map(s=>s.kg)):0;
  const w30=real.filter(s=>daysAgo(s.date)<=30); const d30=w30.length>=2?r1(w30[w30.length-1].kg-w30[0].kg):0;
  const hstats=$('#hstats');
  hstats.innerHTML='<div class="stat"><div class="k">Sessions</div><div class="v">'+real.length+'</div></div><div class="stat"><div class="k">Last 30 days</div><div class="v up">'+(d30>=0?'+':'')+d30+' '+STATE.unit+'</div></div><div class="stat"><div class="k">Best</div><div class="v gold">'+best+' '+STATE.unit+'</div></div>';
  animateCounts(hstats);
}
function drawTable(e, all){
  const body=$('#hbody');
  if(!all.length){ body.innerHTML='<tr><td colspan="5"><div class="emptyHist">No sessions yet. Log a set and it lands here.</div></td></tr>'; return; }
  const real=all.filter(s=>!s.off);
  const best= real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b):null;
  body.innerHTML=all.slice().reverse().slice(0,10).map(s=>{
    const prevReal=real.filter(x=>x.date<s.date); const prev=prevReal.length?prevReal[prevReal.length-1]:null;
    const d=prev?r1(s.kg-prev.kg):null; const isBest=best&&s.date===best.date && !s.off;
    const prog = s.off? '<td class="prog first">rest</td>' : (d==null?'<td class="prog first">first</td>':'<td class="prog">'+(d>=0?'+':'')+d+'</td>');
    const w = isBest? '<td><span class="best-w">'+svg('<path d="M12 3.5l2.5 5.1 5.6.8-4 3.9 1 5.6L12 16.9 6.9 18.9l1-5.6-4-3.9 5.6-.8z"/>')+'<span class="num">'+s.kg+'</span> <span class="u">'+STATE.unit+'</span></span></td>' : '<td><span class="num">'+s.kg+'</span> <span class="u">'+STATE.unit+'</span></td>';
    return '<tr><td>'+fmtDate(s.date)+'</td><td>'+setCount(s)+'</td><td>'+topReps(s)+'</td>'+w+prog+'</tr>';
  }).join('');
}
