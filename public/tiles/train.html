function aggregateVolumeByDate(){
  const map={};
  Object.keys(STATE.history||{}).forEach(id=>{
    (STATE.history[id]||[]).forEach(entry=>{
      if(entry.off) return;
      const vol=TrainEngine.workingVolume(entry);
      map[entry.date]=(map[entry.date]||0)+vol;
    });
  });
  return Object.keys(map).sort().map(date=>({date, kg:r1(map[date])}));
}
/* least-squares trend on the visible points, fanned into a High / Trend / Low
   projection from the last real value — the "if this keeps up" line, not a promise. */
function predictFan(list, domain){
  if(list.length<4) return null;
  const t=list.map(s=>-daysAgo(s.date)), k=list.map(s=>s.kg);
  const n=t.length, tMean=t.reduce((a,b)=>a+b,0)/n, kMean=k.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num+=(t[i]-tMean)*(k[i]-kMean); den+=(t[i]-tMean)**2; }
  if(den<1e-6) return null;
  const slope=num/den, last=list[list.length-1];
  const horizon=Math.max(5,Math.min(180,Math.round(domain*0.5)));
  const slopeHi= slope>=0? slope*1.6 : slope*0.4;
  const slopeLo= slope>=0? slope*0.4 : slope*1.6;
  const val=s=>Math.max(0,r1(last.kg+s*horizon));
  return { horizon, bands:[
    { key:'high', label:'High', val:val(slopeHi) },
    { key:'mid', label:'Trend', val:val(slope) },
    { key:'low', label:'Low', val:val(slopeLo) },
  ]};
}
function drawAggChart(list, active, unitLabel){
  const plot=$('#statsPlot'), cap=$('#statsCap');
  plot.style.aspectRatio='600/240';
  if(!list.length){ plot.innerHTML='<svg viewBox="0 0 600 240" preserveAspectRatio="none"><text class="xlab" x="300" y="120" text-anchor="middle">no data yet</text></svg>'; cap.textContent=''; return; }
  const HIST_W=600,VB_H=240,PADL=46,PADR=20,PADT=22,PADB=36;
  const ws=list.map(s=>s.kg);
  const oldestAgo=Math.max(...list.map(s=>daysAgo(s.date)));
  const domain= active==='ALL'? Math.max(oldestAgo,1):Math.max(RANGES[active],1);
  const fan=predictFan(list,domain);
  const FAN_W=fan?150:0, FAN_LABEL_W=44, VB_W=HIST_W+FAN_W;
  let lo=0, hi=Math.ceil(Math.max(...ws,1,...(fan?fan.bands.map(b=>b.val):[]))/5)*5+5;
  const X=k=>{ const f=Math.min(1,Math.max(0,1-daysAgo(k)/domain)); return PADL+f*(HIST_W-PADL-PADR); };
  const Y=v=>(VB_H-PADB)-(v-lo)/(hi-lo)*(VB_H-PADB-PADT);
  const step=Math.max(5,Math.ceil((hi-lo)/6/5)*5);
  const gridEndX= fan? VB_W-8 : HIST_W-PADR;
  let svgs='<svg viewBox="0 0 '+VB_W+' '+VB_H+'" preserveAspectRatio="none"><defs><linearGradient id="fillAgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--signal);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--signal);stop-opacity:0"/></linearGradient></defs>';
  for(let v=lo;v<=hi;v+=step){ svgs+='<line class="grid" x1="'+PADL+'" y1="'+Y(v)+'" x2="'+gridEndX+'" y2="'+Y(v)+'"/><text class="axis-label" x="'+(PADL-10)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'; }
  const pts=list.map(s=>X(s.date)+','+Y(s.kg));
  if(list.length>1){ svgs+='<path fill="url(#fillAgg)" d="M'+X(list[0].date)+','+(VB_H-PADB)+' L'+pts.join(' L')+' L'+X(list[list.length-1].date)+','+(VB_H-PADB)+' Z"/><polyline class="line" points="'+pts.join(' ')+'"/>'; }
  list.forEach((s,i)=> svgs+='<circle class="dot" style="--i:'+i+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="4.5"/>');
  svgs+='<text class="xlab" x="'+PADL+'" y="'+(VB_H-6)+'" text-anchor="start">'+fmtDate(list[0].date)+'</text><text class="xlab" x="'+(HIST_W-PADR)+'" y="'+(VB_H-6)+'" text-anchor="end">today</text>';
  if(fan){
    const anchorX=X(list[list.length-1].date), anchorY=Y(list[list.length-1].kg), fanEndX=VB_W-FAN_LABEL_W;
    svgs+='<g class="fanGroup">';
    fan.bands.forEach(b=>{
      const ty=Y(b.val), cx=anchorX+(fanEndX-anchorX)*0.5, cy=anchorY+(ty-anchorY)*0.2;
      const d='M'+anchorX+','+anchorY+' Q'+cx+','+cy+' '+fanEndX+','+ty;
      svgs+='<path class="fanHit" d="'+d+'" data-val="'+b.val+'" data-label="'+b.label+'" data-cls="'+b.key+'"/>';
      svgs+='<path class="fan '+b.key+'" d="'+d+'"/>';
    });
    /* labels can crowd when the trend is shallow — decouple label Y from dot Y
       and declutter top-to-bottom, since bands are already high→low sorted */
    const MIN_GAP=10;
    const labelYs=fan.bands.map(b=>Y(b.val));
    for(let i=1;i<labelYs.length;i++){ if(labelYs[i]-labelYs[i-1]<MIN_GAP) labelYs[i]=labelYs[i-1]+MIN_GAP; }
    const maxLabelY=VB_H-PADB-2;
    if(labelYs[labelYs.length-1]>maxLabelY){ const over=labelYs[labelYs.length-1]-maxLabelY; for(let i=0;i<labelYs.length;i++) labelYs[i]-=over; }
    fan.bands.forEach((b,i)=>{
      const ty=Y(b.val);
      svgs+='<circle class="fanDot '+b.key+'" cx="'+fanEndX+'" cy="'+ty+'" r="3.4" data-val="'+b.val+'" data-label="'+b.label+'" data-cls="'+b.key+'"/>';
      svgs+='<text class="fanLabel '+b.key+'" x="'+(fanEndX+7)+'" y="'+(labelYs[i]+3)+'">'+Math.round(b.val)+'</text>';
    });
    svgs+='<text class="xlab" x="'+fanEndX+'" y="'+(VB_H-6)+'" text-anchor="end">≈'+fan.horizon+'d</text></g>';
  }
  svgs+='</svg>';
  plot.innerHTML=svgs+(fan?'<div class="fanCard" id="fanCard"><div class="v" id="fanCardV"></div><div class="c" id="fanCardC"></div></div>':'');
  if(fan){
    const card=plot.querySelector('#fanCard'), cv=plot.querySelector('#fanCardV'), cc=plot.querySelector('#fanCardC');
    plot.querySelectorAll('[data-cls]').forEach(t=>{
      const show=()=>{
        cv.textContent=t.dataset.val+' '+STATE.unit;
        cv.style.color=t.dataset.cls==='high'?'var(--gold)':t.dataset.cls==='low'?'var(--muted-2)':'var(--signal)';
        cc.textContent=t.dataset.label+' · in ~'+fan.horizon+'d';
        const rect=plot.getBoundingClientRect();
        const px=(parseFloat(t.getAttribute('cx')||(VB_W-FAN_LABEL_W))/VB_W)*rect.width;
        const py=(parseFloat(t.getAttribute('cy')||Y(+t.dataset.val))/VB_H)*rect.height;
        card.style.left=Math.max(4,px-124)+'px';
        card.style.top=Math.max(4,Math.min(rect.height-46,py-20))+'px';
        card.classList.add('on');
      };
      t.addEventListener('pointerenter',show);
      t.addEventListener('pointerleave',()=>card.classList.remove('on'));
    });
  }
  const d= list.length>=2? r1(list[list.length-1].kg-list[0].kg):0;
  cap.innerHTML= list.length>=2? (d>=0?'+':'')+d+' '+unitLabel+' <span class="mu">· '+(active==='ALL'?'all time':'in '+active)+'</span>' : 'one data point here';
}

const CAL_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CAL_WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let calPage=null; // {year, q} — the quarter currently on screen
function calQuarterOf(d){ return { year:d.getFullYear(), q:Math.floor(d.getMonth()/3) }; }
function calAddQuarters(p, delta){ let q=p.q+delta, year=p.year; while(q<0){ q+=4; year--; } while(q>3){ q-=4; year++; } return {year,q}; }
function calKey(p){ return p.year*4+p.q; }
function calBounds(){
  const latest=calQuarterOf(new Date());
  const dates=STATE.finishedDates||[];
  let earliest=latest;
  if(dates.length){ const [y,m]=dates.slice().sort()[0].split('-').map(Number); earliest=calQuarterOf(new Date(y,m-1,1)); }
  return {earliest, latest};
}
function calCanGo(delta){ const {earliest,latest}=calBounds(); const t=calAddQuarters(calPage,delta); return calKey(t)>=calKey(earliest) && calKey(t)<=calKey(latest); }
/* one quarter's week-columns, Sunday-aligned, padded outside the quarter's
   own date range so the grid always starts/ends on a full week. */
function calQuarterCells(page, volByDate){
  const first=new Date(page.year, page.q*3, 1);
  const last=new Date(page.year, page.q*3+3, 0);
  const start=new Date(first); start.setDate(start.getDate()-start.getDay());
  const end=new Date(last); end.setDate(end.getDate()+(6-end.getDay()));
  const weeks=[]; const monthMarks=[]; let lastMonth=-1; let w=0;
  const cursor=new Date(start);
  while(cursor<=end){
    const col=[];
    for(let d=0; d<7; d++){
      const key=ymd(cursor);
      const inRange = cursor>=first && cursor<=last;
      if(inRange && cursor.getMonth()!==lastMonth){ lastMonth=cursor.getMonth(); monthMarks[w]=CAL_MONTHS[lastMonth]; }
      col.push({key, inRange, vol:volByDate[key]||0, date:new Date(cursor)});
      cursor.setDate(cursor.getDate()+1);
    }
    weeks.push(col); w++;
  }
  return {weeks, monthMarks, first, last};
}
/* weekly-summed, then cumulative — the quarter's own "growth of volume"
   curve, drawn from the same weeks sitting in the grid next to it. */
function calQuarterStats(page, volByDate){
  const {weeks}=calQuarterCells(page, volByDate);
  const weekSums=weeks.map(col=> col.reduce((a,c)=> a+(c.inRange?c.vol:0), 0));
  let acc=0; const curve=weekSums.map(v=>{ acc+=v; return acc; });
  return { total:acc, curve };
}
function calSparkPath(curve, W, H){
  const lo=Math.min(0,...curve), hi=Math.max(1,...curve), span=(hi-lo)||1;
  const px=i=> 3+(i/Math.max(1,curve.length-1))*(W-6);
  const py=v=> 4+(1-(v-lo)/span)*(H-8);
  return curve.map((v,i)=>(i===0?'M':'L')+px(i).toFixed(1)+','+py(v).toFixed(1)).join(' ');
}

  const maxC=Math.max(...counts,1);
  $('#calWdBars').innerHTML=counts.map((c,i)=>'<div class="wdBar"><div class="wdTrack"><div class="wdFill" data-h="'+Math.max(3,Math.round(c/maxC*100))+'" style="height:0%"></div></div><span class="wdLbl">'+CAL_WD[i]+'</span></div>').join('');

/* ---- reveal: the lower sheets (goal / photos / stats) fade up as they
   scroll into view. The tile's own iframe IS the real scrolling viewport
   here (the host sizes it to a fixed box, .openStage{overflow:hidden} +
   .openFrame{position:absolute;inset:0} — the dashboard never auto-grows
   it to content), so IntersectionObserver's default root is exactly right.
   Each fires once and stays revealed — re-hiding on scroll-back-up reads
   as flicker, not polish. */
function wireReveal(){
  const els=[...document.querySelectorAll('.reveal')];
  if(!els.length) return;
  const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced || !('IntersectionObserver' in window)){ els.forEach(el=>el.classList.add('in')); return; }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold:0.1, rootMargin:'0px 0px -30px 0px' });
  els.forEach(el=>io.observe(el));
}

/* ---- cursor-reactive card light: one delegated listener per container,
   so it survives re-renders without needing to be rewired each time ---- */
function wireCardGlow(container, selector){
  if(!container) return;
  container.addEventListener('pointermove', ev=>{
    const card = ev.target.closest(selector);
    if(!card || !container.contains(card)) return;
    const r=card.getBoundingClientRect();
    card.style.setProperty('--mx', ((ev.clientX-r.left)/r.width*100)+'%');
    card.style.setProperty('--my', ((ev.clientY-r.top)/r.height*100)+'%');
  });
}

/* ====================================================================
   CONSTELLATION — a small living node-graph, rendered on <canvas>. This
   is the one visual idea behind both the ambient backdrop and the AI:
   a handful of points connected by light, breathing at rest, routing a
   traveling pulse when "thinking." No external assets — hand-rolled,
   ~80 lines, runs in the sealed sandboxed tile with no network. ------ */
function makeConstellation(canvas, opts){
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0, h=0, dpr=Math.min(2, window.devicePixelRatio||1);
  function resize(){
    const r=canvas.getBoundingClientRect(); w=Math.max(1,r.width); h=Math.max(1,r.height);
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const N = opts.count || 6;
  /* each node has a fixed "home" angle+radius (fraction of the canvas) —
     spread (0→1) scales that radius, so opening the coach visibly moves
     nodes from a tight cluster out to their resting positions, rather
     than hoping slow random drift gets there. A small orbiting jitter on
     top keeps it from looking mechanical once settled. */
  const nodes = Array.from({length:N},()=>({
    x:w/2, y:h/2, angle:Math.random()*Math.PI*2, radiusFrac:0.42+Math.random()*0.58,
    jx:0, jy:0, jvx:(Math.random()-0.5)*0.5, jvy:(Math.random()-0.5)*0.5,
    r: 1.5+Math.random()*1.3, phase: Math.random()*Math.PI*2
  }));
  let mode='idle', pulse=null, raf=null;
  let spread = opts.startCollapsed ? 0 : 1;
  function schedulePulse(){
    if(pulse || nodes.length<2) return;
    const from=Math.floor(Math.random()*nodes.length); let to=Math.floor(Math.random()*nodes.length);
    if(to===from) to=(to+1)%nodes.length;
    pulse={from,to,t:0};
  }
  function frame(t){
    ctx.clearRect(0,0,w,h);
    const cx=w/2, cy=h/2;
    if(spread<1) spread=Math.min(1, spread+0.028);
    const maxX=w*0.42, maxY=h*0.38;
    const jitterMax = mode==='thinking' ? 20 : 12;
    nodes.forEach(n=>{
      n.jx+=n.jvx; n.jy+=n.jvy;
      if(Math.abs(n.jx)>jitterMax) n.jvx*=-1;
      if(Math.abs(n.jy)>jitterMax) n.jvy*=-1;
      const tx=cx+Math.cos(n.angle)*maxX*n.radiusFrac*spread+n.jx;
      const ty=cy+Math.sin(n.angle)*maxY*n.radiusFrac*spread+n.jy;
      n.x+=(tx-n.x)*0.08; n.y+=(ty-n.y)*0.08;
    });
    const maxD=Math.max(maxX,maxY)*1.15;
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<maxD){ ctx.strokeStyle='rgba(110,231,183,'+((1-d/maxD)*0.5)+')'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    if(mode==='thinking' && !pulse) schedulePulse();
    if(pulse){
      pulse.t+=0.03;
      if(pulse.t>=1) pulse=null;
      else {
        const a=nodes[pulse.from], b=nodes[pulse.to];
        const px=a.x+(b.x-a.x)*pulse.t, py=a.y+(b.y-a.y)*pulse.t;
        ctx.shadowColor='rgba(110,231,183,.95)'; ctx.shadowBlur=9;
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,2.1,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    nodes.forEach(n=>{
      const breathe=1+Math.sin(t*0.0016+n.phase)*(mode==='thinking'?0.5:0.22);
      ctx.fillStyle='rgba(110,231,183,'+(mode==='thinking'?0.32:0.18)+')';
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*breathe*3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#eafff4';
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*breathe,0,Math.PI*2); ctx.fill();
    });
    raf=requestAnimationFrame(frame);
  }
  if(!reduced || opts.force){ raf=requestAnimationFrame(frame); }
  else { frame(0); }
  const onResize=()=>resize();
  window.addEventListener('resize', onResize);
  return {
    setMode:(m)=>{ mode=m; },
    burst:()=>{ schedulePulse(); },
    destroy:()=>{ if(raf) cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); }
  };
}

/* ---- inlined backdrop particles (self-contained) ------------------ */
function spawnParticles(root){
  if(!root) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const N = window.innerWidth<640?10:18;
  for(let i=0;i<N;i++){ const s=document.createElement('span'); const dur=18+Math.random()*22, size=1+Math.random()*1.2;
    s.style.left=(Math.random()*100)+'%'; s.style.top=(60+Math.random()*40)+'vh'; s.style.width=s.style.height=size+'px';
    s.style.animationDuration=dur+'s'; s.style.animationDelay=(-Math.random()*dur)+'s';
    s.style.setProperty('--dx',(Math.random()*30-15)+'px'); s.style.setProperty('--dy',(-(60+Math.random()*50))+'vh'); root.appendChild(s); }
}

/* ---- boot: load state from the dashboard bridge, THEN render -------
   window.Vitality is injected by the dashboard — we never define it. load()
   returns [] when empty, or the saved STATE object; render only after it
   resolves. Old (pre-rewrite) saves used a `days` shape — those are
   structurally incompatible with the single-session model, so they start
   fresh rather than risk a broken migration. */
(async()=>{
  let d=null;
  try{ d = await window.Vitality.load(); }catch(e){ d=null; }
  const usable = d && typeof d==='object' && !Array.isArray(d) && d.session && !d.days;
  STATE = usable ? d : buildState();
  STATE.customLib = STATE.customLib || {};
  STATE.finishedDates = STATE.finishedDates || [];
  STATE.templates = STATE.templates || [];
  STATE.history = STATE.history || {};
  STATE.deloadStates = STATE.deloadStates || {};
  STATE.deloadExclusions = STATE.deloadExclusions || [];
  migrateDeloadOverrides();
  STATE.exerciseNames = STATE.exerciseNames || {};
  STATE.shortTermGoal = STATE.shortTermGoal || '';
  STATE.photos = STATE.photos || [];
  STATE.sessionDurations = STATE.sessionDurations || [];
  STATE.liftGoals = STATE.liftGoals || [];
  render(); wireFresh();
  renderGoalBubble(); renderPhotos(); wirePhotoUpload(); renderOverviewCards(); renderStatsPicker(); drawStatsSection();
  const exportBtn=$('#exportCsvBtn'); if(exportBtn) exportBtn.onclick=exportCSV;
  const fab=$('#coachFab'); if(fab) fab.onclick=()=> openCoach();
  const settingsBtn=$('#settingsBtn'); if(settingsBtn) settingsBtn.onclick=openSettings;
  wireCardGlow($('#exwrap'), '.ex');
  wireCardGlow($('#overviewCards'), '.ovCard');
  wireCardGlow($('#photoGallery'), '.photoCard');
  spawnParticles(document.querySelector('#vt-backdrop .wb-particles'));
  initFabConstellation();
})();
</script>
